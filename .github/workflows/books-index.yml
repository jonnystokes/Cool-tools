# Books index: GitHub Pages cannot list folders, so on every push that touches books/ this runs
# books/make_index.py and commits the generated books/index.json (nothing when it is unchanged).
# The Select-a-book page and the Book reader's Online library read only that file.
name: Books index
on:
  push:
    branches: [main]
    paths: ["books/**", ".github/workflows/books-index.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: books-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # "updated" is each folder's last commit date
      - name: Make books/index.json
        run: python3 books/make_index.py
      - name: Commit it when it changed
        run: |
          if git diff --quiet -- books/index.json && [ -z "$(git ls-files --others --exclude-standard books/index.json)" ]; then
            echo "books/index.json is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/index.json
          git commit -m "books/index.json: rebuilt by the Books index workflow"
          git push
