  }

  // Where a book with no stored place starts (Jon, 2026-10-22): the first chapter, in reading order, whose
  // name starts with a chapter-one marker ("1", "1.", "Chapter 1", "Chapter One", "Ch. 1", "Part 1"), so
  // the Information / Preface / Copyright pages are skipped (they stay in the book and the Index); none:
  // the first chapter. A light check, on purpose. Gives { i, why } for the log.
  const ONE = /^\s*(?:(?:chapter|ch\.?|part)\s*(?:1|one)\b|1(?![\d,]|\.\d))/i;
  function startAt() {
    for (let i = 0; i < index.length; i++) {
      const e = index[i];
      if (ONE.test(e.short || "") || ONE.test(e.title || "")) return { i, why: `the first chapter named like Chapter 1 ("${e.short || e.title}")` };
    }
    return { i: 0, why: "the first chapter (no chapter is named like Chapter 1)" };
  }

  g.BOOK = {
    get count() { return index.length; },
    get title() { return current ? current.title : ""; },
    get name() { return current ? current.title : ""; },
    get current() { return current ? current.id : null; },
    get row() { return current; },
    get kind() { return current ? current.kind : ""; },
    get numbered() { return numbered(); },
    get books() { return books.slice(); },
    get unfinished() { return unfinished; },
    get migrated() { return migrated; },
    get grid() { return current ? current.grid || null : null; },     // { eras: [{ id, label }] } for a grid book
    get across() { return !!(current && current.across); },
    info: (i) => index[i] || null,                 // { c, n, title, paras, g, sec?, short?, era?, heads? } from the index, nothing loaded
    index: () => index,
    indexOf: (c) => (byC.has(c) ? byC.get(c) : -1),
    label, chapter, warm, load, open: openBook, rename, remove, setAcross, plan, importBook, stopImport, pos, setPos, posOf, readKey, hooks, kept, startAt, chapterOne: (t) => ONE.test(t),
    // Settings → Storage deletes everything: let go of the database (so it can be deleted), the books
    // and every per-book key, and the mark (deleted on purpose, so the start says nothing about it).
    forget: () => {
      if (db) { try { db.close(); } catch (e) {} db = null; }
      for (const k of ls.keys()) if (k.startsWith(KEY + "-pos-") || k.startsWith(KEY + "-reading-")) ls.set(k, null);
      books = []; use(null, []); ls.set(CUR_KEY, null); ls.set(MARK_KEY, null);
    },
  };
})();
</script>
<script>
// float.js: a small floating window, used by the chapter list, Settings, the Open window and the rest.
// FLOAT.open(name, { title, width, height, onClose }) makes (or fronts) the window and returns
// { el, body, title(text), close() }; the caller fills body. Movable by its title bar, resizable by its
// corner, a scroll bar when the content needs one, a close button, Escape closes the front one. It
// stays on screen whatever the UI size, and remembers its size and position per name in localStorage.
(function () {
  const KEY = (globalThis.APP_KEY || "br1") + "-win-";
  const MARGIN = 8, MIN_W = 220, MIN_H = 160;
  const open = new Map();     // name -> win, in opening order
  let z = 100;

  function saved(name) {
    try { const g = JSON.parse(localStorage.getItem(KEY + name)); return g && typeof g.w === "number" ? g : null; }
    catch (e) { return null; }
  }
  function remember(name, g) { try { localStorage.setItem(KEY + name, JSON.stringify(g)); } catch (e) {} }

  // A size and place that fits the screen.
  function fit(g) {
    const W = innerWidth, H = innerHeight;
    const w = Math.min(Math.max(g.w, MIN_W), W - 2 * MARGIN), h = Math.min(Math.max(g.h, MIN_H), H - 2 * MARGIN);
    return { x: Math.max(MARGIN, Math.min(g.x, W - w - MARGIN)), y: Math.max(MARGIN, Math.min(g.y, H - h - MARGIN)), w, h };
  }

  function front(win) {
    if (win.el.style.zIndex !== String(z)) win.el.style.zIndex = String(++z);
    open.delete(win.name); open.set(win.name, win);
  }

  function create(name, opts) {
    const el = document.createElement("div");
    el.className = "float";
    el.setAttribute("role", "dialog");
    el.dataset.name = name;
    el.innerHTML = '<div class="float-head"><span class="float-title"></span><button class="float-close" type="button" aria-label="Close" title="Close">✕</button></div>'
      + '<div class="float-body"></div><div class="float-size" aria-hidden="true"></div>';
    const head = el.firstChild, body = el.children[1], corner = el.children[2];
    let g = { x: 0, y: 0, w: opts.width || 360, h: opts.height || 420 };
    const place = (next) => {
      g = fit(next);
      el.style.left = g.x + "px"; el.style.top = g.y + "px"; el.style.width = g.w + "px"; el.style.height = g.h + "px";
    };
    const win = {
      name, el, body,
      title: (t) => { head.firstChild.textContent = t; },
      geometry: () => g,
      place,
      close() {
        if (!open.has(name)) return;
        open.delete(name);
        el.remove();
        if (opts.onClose) { try { opts.onClose(); } catch (e) { log("error", `closing window "${name}"`, e); } }
      },
    };
    win.title(opts.title || name);
    head.lastChild.addEventListener("click", win.close);
    el.addEventListener("pointerdown", () => front(win), true);

    // Drag by the title bar, resize by the corner: pointer capture keeps the moves coming off the element.
    const grab = (handle, apply) => {
      handle.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 || e.target === head.lastChild) return;
        e.preventDefault();
        const start = { x: e.clientX, y: e.clientY, g: Object.assign({}, g) };
        const move = (ev) => apply(start, ev.clientX - start.x, ev.clientY - start.y);
        const end = () => {
          handle.removeEventListener("pointermove", move);
          handle.removeEventListener("pointerup", end);
          handle.removeEventListener("pointercancel", end);
          remember(name, g);
        };
        handle.setPointerCapture(e.pointerId);
        handle.addEventListener("pointermove", move);
        handle.addEventListener("pointerup", end);
        handle.addEventListener("pointercancel", end);
      });
    };
    grab(head, (s, dx, dy) => place({ x: s.g.x + dx, y: s.g.y + dy, w: s.g.w, h: s.g.h }));
    grab(corner, (s, dx, dy) => place({ x: s.g.x, y: s.g.y, w: s.g.w + dx, h: s.g.h + dy }));
    return win;
  }

  function openWindow(name, opts = {}) {
    if (open.has(name)) { const w = open.get(name); front(w); return w; }
    const win = create(name, opts);
    const w = opts.width || 360, h = opts.height || 420;
    win.place(saved(name) || { x: (innerWidth - w) / 2, y: Math.max(MARGIN, (innerHeight - h) / 3), w, h });
    document.body.appendChild(win.el);
    open.set(name, win);
    front(win);
    return win;
  }

  const frontWindow = () => (open.size ? Array.from(open.values()).pop() : null);
  window.addEventListener("resize", () => { for (const w of open.values()) w.place(w.geometry()); });
  document.addEventListener("keydown", (e) => {
    const w = frontWindow();
    if (e.key === "Escape" && w && !e.defaultPrevented) { e.preventDefault(); w.close(); }
  });

  globalThis.FLOAT = {
    open: openWindow,
    close: (name) => { const w = open.get(name); if (w) w.close(); },
    get: (name) => open.get(name) || null,
    front: frontWindow,
  };
})();
</script>
<script>
// reader.js: the reader page. Shows the current chapter (title, one <p> per paragraph with its index),
// the top bar's chapter navigation (previous, number box with the chapter list, Go, next; left and
// right arrow keys), the empty state when no book is open (the Open window, library.js, brings books
// in and switches between them), the reading position (the paragraph read, marked and kept per book;
// the screen place too), and the look from the settings (data-theme on <html>; --text from Text size,
// the book text only; --ui from UI size: bars, buttons, menus and the windows' content, the windows
// themselves keeping their size and place; both are percentages of normal). Chapters are addressed by
// index position; their id `c` (the chapter number in a numbered book, else the place) is what the
// number box takes and what the positions store. The player (player.js) uses READER.paragraphs(),
// READER.para / setPara(), READER.go(i, where) and READER.onChange(fn); the Settings window
// (settingswin.js) calls READER.applyLook() and READER.rebuildPieces(); library.js calls
// READER.openBook(id), closeBook() and noteAdded().
(function () {
  const $ = (id) => document.getElementById(id);
  const book = $("book"), title = $("ctitle"), text = $("text"), chno = $("chno"), msg = $("msg"), chname = $("chname"), chfull = $("chfull");
  const num = $("num"), prev = $("prev"), next = $("next"), goBtn = $("go"), empty = $("empty");
  let cur = -1;               // index position of the chapter shown
  let para = 0;               // the paragraph read (tapped, or moved by the player)
  let showing = 0;            // guards against an older chapter arriving after a newer one
  let switching = false;      // between books: no position is saved for the one going away
  const listeners = [];       // fn(what, value): "chapter" (index), "para" (index), "book" (another book opened, or the open one replaced), "added" (books added), "order" (read across time switched)
  const emit = (what, v) => { for (const fn of listeners) { try { fn(what, v); } catch (e) { log("error", `reader listener (${what})`, e); } } };
  const fmt = (n) => n.toLocaleString("en-US");

  // ---- The look: theme and sizes from the settings -------------------------------------------------
  const TEXT_PX = 20, UI_PX = 16;        // the sizes at 100 %
  const pct = (name) => Math.max(50, Math.min(250, Number(SETTINGS.get(name)) || 100)) / 100;
  function applyLook() {
    const root = document.documentElement;
    root.dataset.theme = SETTINGS.get("theme") === "dark" ? "dark" : "light";
    root.style.setProperty("--text", Math.round(TEXT_PX * pct("textSize") * 10) / 10 + "px");
    root.style.setProperty("--ui", Math.round(UI_PX * pct("uiSize") * 10) / 10 + "px");
    if (typeof fitName === "function") fitName();
    // The play bar grows with the UI size (and wraps on a narrow screen): the body keeps its height clear.
    requestAnimationFrame(() => { const play = $("play"); if (play) root.style.setProperty("--play-h", play.offsetHeight + "px"); });
  }

  // ---- Messages: a short line under the top bar ----------------------------------------------------
  let msgTimer = 0;
  function say(s, ms = 6000) {
    clearTimeout(msgTimer);
    msg.textContent = s;
    msg.hidden = !s;
    if (s) msgTimer = setTimeout(() => { msg.hidden = true; }, ms);
  }

  // ---- The chapter on screen ---------------------------------------------------------------------
  // Labels: a numbered book "3103 · Title" in the bar and "Chapter 3103 · 5 of 2,406" over the text;
  // another book "3 · Title" and "3 of 12". The tab title adds the book.
  const numbered = () => BOOK.numbered;
  const shortName = (i) => { const e = BOOK.info(i); return e ? `${numbered() ? e.c : i + 1} · ${e.title}` : ""; };
  // The name in the top bar is hidden when the bar leaves it under about 4 characters of room (a phone at
  // 100 %: an ellipsis alone reads as "1."); the heading under the bar carries the name. Measured whenever
  // the name, the UI size or the window width changes.
  function fitName() {
    chname.classList.remove("noroom");
    if (!chname.textContent) return;
    const ui = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--ui")) || 16;
    if (chname.clientWidth < 4 * ui) chname.classList.add("noroom");
  }
  addEventListener("resize", fitName);
  function render(rec) {
    chno.textContent = numbered() ? `Chapter ${rec.c} · ${fmt(cur + 1)} of ${fmt(BOOK.count)}` : `${fmt(cur + 1)} of ${fmt(BOOK.count)}`;
    chname.textContent = shortName(cur);
    chfull.hidden = true;
    fitName();
    title.textContent = rec.title;
    const frag = document.createDocumentFragment();
    rec.text.forEach((t, i) => {
      const p = document.createElement("p");
      p.dataset.i = i;
      p.textContent = t;
      frag.appendChild(p);
    });
    if (!rec.text.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = "(this chapter has no text)"; frag.appendChild(p); }
    text.replaceChildren(frag);
    document.title = `${shortName(cur)} — ${BOOK.title || "Book reader"}`;
  }

  function updateNav() {
    num.value = cur >= 0 ? (numbered() ? BOOK.info(cur).c : cur + 1) : "";
    prev.disabled = cur <= 0;
    next.disabled = cur < 0 || cur >= BOOK.count - 1;
    prev.title = cur > 0 ? `Previous: ${shortName(cur - 1)} (←)` : "This is the first chapter";
    next.title = cur < BOOK.count - 1 ? `Next: ${shortName(cur + 1)} (→)` : "This is the last chapter";
  }

  // Show chapter i. where: { p, top } restores the paragraph read and the screen place.
  async function show(i, where) {
    if (!BOOK.count) return;
    i = Math.max(0, Math.min(BOOK.count - 1, i));
    const token = ++showing;
    let rec = null;
    try { rec = await BOOK.chapter(i); } catch (e) { log("error", `${BOOK.label(i)} would not load`, e); say(`${BOOK.label(i)} could not be read from storage: ${e.message}`); return; }
    if (token !== showing) return;
    if (!rec) { say(`${BOOK.label(i)} of "${BOOK.title}" is missing from storage. Add the book again (it replaces the stored copy and keeps your place).`, 15000); log("error", `${BOOK.label(i)} of "${BOOK.title}" is missing from storage`); return; }
    cur = i;
    curRec = rec;
    render(rec);
    updateNav();
    buildPieces(rec);
    para = Math.max(0, Math.min(rec.text.length - 1, (where && where.p) || 0));
    markPara();
    scrollToPara(where && typeof where.top === "number" ? where.top : 0, true);
    savePos();
    BOOK.warm(i);
    log("book", `${BOOK.label(i)} (${i + 1} of ${BOOK.count}) shown: ${rec.text.length} paragraphs`);
    emit("chapter", i);
  }

  // Go to chapter i (the player passes where = { p, top } to land on the paragraph being read).
  function go(i, where) {
    if (i < 0 || i >= BOOK.count) return;
    if (i === cur) { if (where) { setPara(where.p, true); } else scrollToPara(0, true); return; }
    say("");
    show(i, where);
  }

  // A chapter picked by hand (‹ ›, ← →, the number box + Go, the Index): with the lock on, a reading in
  // progress goes along (PLAYER.chapterPicked; Jon, 2026-10-23); with the lock off only the view moves.
  function pick(i, where) {
    if (i < 0 || i >= BOOK.count) return;
    go(i, where);
    if (globalThis.PLAYER && globalThis.PLAYBAR && PLAYBAR.locked && PLAYER.state !== "stopped") PLAYER.chapterPicked(i, where);
  }

  // ---- The pieces to read (pieces.js), for the player ----------------------------------------------
  let curRec = null;          // the chapter record shown
  let pieces = [];            // its pieces, with the current settings
  const skippedSeen = new Set();
  function buildPieces(rec) {
    const r = PIECES.build(rec, PIECES.options(SETTINGS));
    pieces = r.pieces;
    for (const w of r.skipped) if (!skippedSeen.has(w)) { skippedSeen.add(w); log("text", "skipping watermark text: " + w); }
    log("pieces", `${BOOK.label(cur)}: ${r.pieces.length} pieces${r.before !== r.pieces.length ? ` (${r.before} before joining)` : ""}`);
    return pieces;
  }

  // ---- The reading position ------------------------------------------------------------------------
  // para -1 = the chapter title: only while the title is read (the title piece, "Read the chapter title
  // first"); a tap on the title moves there, or to paragraph 0 when the title is not read.
  const paragraphs = () => text.querySelectorAll("p[data-i]");
  const titleRead = () => !!(pieces[0] && pieces[0].title);
  const barHeight = () => $("top").getBoundingClientRect().bottom;
  function markPara() {
    for (const p of paragraphs()) p.classList.toggle("current", Number(p.dataset.i) === para);
    title.classList.toggle("current", para === -1);
  }
  function setPara(i, scroll) {
    const ps = paragraphs();
    if (!ps.length) return;
    para = i < 0 && titleRead() ? -1 : Math.max(0, Math.min(ps.length - 1, i | 0));
    markPara();
    if (scroll) scrollToPara(para);
    savePos();
    emit("para", para);
  }
  function scrollToPara(i, top) {
    const p = paragraphs()[i];
    if (!p || i < 0 || (i === 0 && top)) { scrollTo(0, 0); return; }
    scrollTo(0, scrollY + p.getBoundingClientRect().top - barHeight() - 8);
  }
  // The paragraph at the top of the screen (0 while at the top).
  function topPara() {
    const bar = barHeight();
    for (const p of paragraphs()) if (p.getBoundingClientRect().bottom > bar + 4) return Number(p.dataset.i);
    return 0;
  }
  let saveTimer = 0;
  function savePos() {
    clearTimeout(saveTimer);
    if (cur < 0 || switching || !BOOK.info(cur)) return;
    BOOK.setPos({ c: BOOK.info(cur).c, p: Math.max(0, para), top: topPara() });
  }
  text.addEventListener("click", (e) => {
    const p = e.target.closest("p[data-i]");
    if (p && !getSelection().toString()) setPara(Number(p.dataset.i));
  });
  // The chapter title taps like a paragraph: the reading moves to the start of the chapter.
  title.addEventListener("click", () => { if (!getSelection().toString()) setPara(-1); });
  addEventListener("scroll", () => { clearTimeout(saveTimer); saveTimer = setTimeout(savePos, 250); }, { passive: true });
  addEventListener("pagehide", savePos);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") savePos(); });
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";

  // The chapter name in the top bar is shortened when there is no room: a tap shows the whole name
  // (with the book) under the bar, a tap again (or anywhere else) hides it.
  function toggleName(show) {
    const on = show === undefined ? chfull.hidden : show;
    if (on && !chname.textContent) return;
    chfull.textContent = cur >= 0 ? `${BOOK.title} · ${BOOK.label(cur)} · ${BOOK.info(cur).title}` : chname.textContent;
    chfull.style.top = barHeight() + 6 + "px";
    chfull.hidden = !on;
  }
  chname.addEventListener("click", (e) => { e.stopPropagation(); toggleName(); });
  chname.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleName(); } });
  document.addEventListener("click", () => { if (!chfull.hidden) toggleName(false); });

  // ---- Navigation: buttons, the number box, keys ---------------------------------------------------
  prev.addEventListener("click", () => pick(cur - 1));
  next.addEventListener("click", () => pick(cur + 1));
  function jump() {
    const raw = num.value.trim();
    const n = /^\d+(?:\.\d+)?$/.test(raw) ? Number(raw) : NaN;     // 12.5 is a chapter number too (an interlude)
    const i = numbered() ? BOOK.indexOf(n) : n >= 1 && n <= BOOK.count ? n - 1 : -1;
    if (i >= 0) { pick(i); num.blur(); return; }
    const first = BOOK.info(0), last = BOOK.info(BOOK.count - 1);
    say(first ? `${raw ? `There is no ${numbered() ? "chapter" : "part"} ${raw}. ` : ""}${numbered() ? `Chapters run ${first.c} to ${last.c}.` : `Parts run 1 to ${BOOK.count}.`}` : "No book is open. Tap Open to pick one.");
    num.select();
  }
  goBtn.addEventListener("click", jump);
  num.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); jump(); } });
  num.addEventListener("focus", () => num.select());
  // Leaving the box puts the chapter's number back, unless the box was left for the Go button (the
  // press takes the focus first and the typed number must still be there when the click arrives).
  let goPressed = 0;
  goBtn.addEventListener("pointerdown", () => { goPressed = Date.now(); });
  num.addEventListener("blur", (e) => { if (e.relatedTarget !== goBtn && Date.now() - goPressed > 1000) updateNav(); });
  document.addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || e.defaultPrevented) return;
    const t = e.target;
    if (t instanceof Element && (t.matches("input, textarea, select") || t.isContentEditable || t.closest(".float, .contents"))) return;
    if (globalThis.CONTENTS && CONTENTS.isOpen) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); pick(cur - 1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); pick(cur + 1); }
  });

  // ---- The contents panel (contents.js) is the chapter list now (the ▾ button and the list window are gone) ----
  function openList() {
    if (!BOOK.count) { say("No book is open. Tap Open to pick one."); return; }
    CONTENTS.open();
  }
  // Read across time switched for the open book (library.js → BOOK.setAcross): the index is in its new
  // order, so the chapter shown is found again by its id and shown at the same paragraph; a reading in
  // progress stops (the player keeps chapters by place), said on screen.
  async function setAcross(id, on) {
    const here = BOOK.current === id && cur >= 0 ? { c: BOOK.info(cur).c, p: para, top: topPara() } : null;
    const row = await BOOK.setAcross(id, on);
    if (!here) return row;
    if (globalThis.PLAYER && PLAYER.state !== "stopped") { PLAYER.stop(); say("The reading stopped: the chapter order changed. Tap Play to go on."); }
    switching = true;
    cur = -1;
    try { await show(Math.max(0, BOOK.indexOf(here.c)), here); } finally { switching = false; }
    savePos();
    emit("order", on);
    return row;
  }

  // ---- Books: the open one, switching, the empty state --------------------------------------------
  function showEmpty(note) {
    cur = -1; curRec = null; pieces = [];
    book.hidden = true;
    empty.hidden = false;
    empty.querySelector(".note").textContent = note || "";
    chname.textContent = "";
    chfull.hidden = true;
    for (const b of [prev, next, goBtn, num]) b.disabled = true;
    num.value = "";
    document.title = globalThis.APP_VERSION || "Book reader";
    if (globalThis.CONTENTS) CONTENTS.close();
  }
  function showBook() {
    empty.hidden = true;
    book.hidden = false;
    for (const b of [prev, next, goBtn, num]) b.disabled = false;
    updateNav();
  }
  // Open a stored book (a switch, or the open book after it was replaced): a reading in progress stops
  // (the "book" event, player.js), the place of the book going away is already saved, the new book's
  // saved place is shown. opts.quiet: the open book's chapters changed (replaced): no switch logged.
  // A book with no usable stored place (its first open) starts at Chapter 1 (BOOK.startAt), said in the log.
  function firstChapter(saved) {
    const s = BOOK.startAt();
    log("book", `"${BOOK.title}" starts at ${BOOK.label(s.i)}: ${s.why}${saved ? ` (the stored place, chapter ${saved.c}, is not in the book)` : ""}`);
    return s.i;
  }
  async function openBook(id, opts) {
    const o = opts || {};
    const from = BOOK.row;
    switching = true;
    try { if (from && !o.quiet) savePos(); } catch (e) {}
    try { await BOOK.open(id); }
    finally { switching = false; }
    const row = BOOK.row;
    cur = -1;                 // before showBook: its updateNav must not read the old book's place in the new book's index
    showBook();
    emit("book", id);
    const saved = BOOK.pos();
    const i = saved ? BOOK.indexOf(saved.c) : -1;
    await show(i >= 0 ? i : firstChapter(saved), i >= 0 ? saved : null);
    if (!o.quiet) log("book", `opened "${row.title}" (${fmt(row.chapters)} chapters)${from && from.id !== id ? ` from "${from.title}"` : ""}${saved && i >= 0 ? ` at ${BOOK.label(i)} ¶ ${(saved.p || 0) + 1}` : ""}`);
  }
  // The open book is being deleted: the reading stops, the page shows its empty state.
  function closeBook() {
    if (BOOK.row) log("book", `"${BOOK.title}" closed`);
    showEmpty("");
    emit("book", null);
  }
  function refreshTitle() { if (cur >= 0) { document.title = `${shortName(cur)} — ${BOOK.title || "Book reader"}`; } }

  // ---- Start ---------------------------------------------------------------------------------------
  async function start() {
    applyLook();
    let has = false, failed = false;
    try { has = await BOOK.load(); }
    catch (e) {
      failed = true;
      log("error", "the book store would not open", e);
      say(/SecurityError|denied|IndexedDB|IDBFactory/i.test(String(e)) ? "This browser will not let this page store anything, so a book cannot be kept here. Open the file itself (from your file manager, not a preview) and try again." : `The book store would not open: ${e.message}`, 20000);
    }
    const cut = BOOK.unfinished ? `The last import did not finish (the page was closed or stopped while it ran; ${fmt(BOOK.unfinished)} chapters it had read were cleared).` : "";
    if (!has) {
      // Books were here (the mark the library leaves) and are gone without a Delete: the browser
      // cleared this page's storage (D18). Said, not left looking like a fresh start.
      const k = BOOK.kept() || [];
      const missing = failed ? [] : k.filter((m) => !BOOK.books.some((b) => b.id === m.id));
      const gone = missing.length ? `The browser cleared this page's stored data: ${missing.map((m) => `"${m.title}" (${fmt(m.chapters)} chapter${m.chapters === 1 ? "" : "s"})`).join(", ")} ${missing.length === 1 ? "is" : "are"} gone, as it may when the device runs very short of space (voice files may be gone too). Add ${missing.length === 1 ? "it" : "them"} again.` : "";
      if (gone) log("book", `no book at the start, but books were here before (${missing.map((m) => `"${m.title}"`).join(", ")}): the browser cleared the stored data`);
      showEmpty([cut, gone].filter(Boolean).join(" ") || (BOOK.books.length ? "No book is open." : "No book here yet."));
      if (!failed) { LIBRARY.open(); if (gone || cut) LIBRARY.say([cut, gone].filter(Boolean).join(" "), true); }
      return;
    }
    showBook();
    const saved = BOOK.pos();
    const i = saved ? BOOK.indexOf(saved.c) : -1;
    await show(i >= 0 ? i : firstChapter(saved), i >= 0 ? saved : null);
    const m = BOOK.migrated;
    if (m) say(`Your book is now "${m.title}" in the Open window (${fmt(m.chapters)} chapters moved to the new storage in ${m.seconds.toFixed(1)} s).`, 12000);
    if (cut) say(`${cut} The books you had are still here.`, 15000);
  }

  globalThis.READER = {
    start, applyLook, say, go, pick, scrollToPara, openBook, closeBook, refreshTitle, setAcross,
    topPara,
    showImport: () => LIBRARY.open(),                              // the old name (Settings → Book, Storage)
    noteAdded: (list) => emit("added", list),
    get chapter() { return cur; },
    get para() { return para; },
    setPara,
    paragraphs, toggleName,
    get pieces() { return pieces; },
    rebuildPieces: () => (curRec ? buildPieces(curRec) : []),     // after the Text settings change (step 6)
    openList,
    onChange: (fn) => { listeners.push(fn); },
    get state() { return cur >= 0 ? "book" : !empty.hidden ? "empty" : "starting"; },
  };
})();
</script>
<script>
// contents.js: the contents panel (Jon, 2026-10-21). A drawer that slides out from the left edge from
// the ☰ button (and the ▾ beside the chapter number): a search box, then the book's tree: sections
// (the sub-folders, named from inside their files), their chapters, and the headings inside a chapter
// (the "#" / "##" / "###" lines of a Markdown file, each at its paragraph). A book without sections is
// its chapter list alone (Jon's 2,406 chapters: one row each, built once per book; a chapter's
// headings are built when it is opened). A grid book read across time shows eras, then topics. The
// tree opens to the place being read, highlighted; a tap on a chapter or a heading goes there (the
// heading's paragraph, not only its chapter) and the panel STAYS open with the new place highlighted
// (Jon, 2026-10-21); a tap on a section or a ▸ only opens or closes that fold. The ☰ Index button is
// one toggle (pressed while open; 2026-10-22): under 700 px the panel covers it, so the panel's top row
// has a same-looking ☰ Index in the same place. Escape closes too. On a screen at least 700 px wide the panel is DOCKED (html.cdock, contents.css): the page
// moves right and narrows to make room, so it can be left open; open / closed is remembered
// (br1-contents) and restored at load without a slide. Under 700 px it slides over the page with a
// dimmed backdrop (a tap on it closes too) and is never restored open. Read marks: ✓ on every chapter
// before the place being read (in the current order), a part-mark (how far along) on the current one,
// from the stored place; nothing on the rest. Search filters by section, chapter and heading names as
// you type (a flat list of hits; headings under their chapter).
(function () {
  const $ = (id) => document.getElementById(id);
  const panel = $("contents"), back = $("cback"), box = $("csearch"), tree = $("ctree"), head = $("chead"), tocBtn = $("toc"), panelToc = $("ctoc");
  const root = document.documentElement;
  const fmt = (n) => Number(n || 0).toLocaleString("en-US");
  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const MAX_HITS = 400;
  const KEY = (globalThis.APP_KEY || "br1") + "-contents";
  const DOCK = matchMedia("(min-width: 700px)");     // docked beside the text from here up; an overlay below
  const docked = () => DOCK.matches;
  let builtFor = null;        // the index the tree was built from
  let model = null;           // { groups: [{ name, items: [i] }] | null, flat: [i] }
  let open = false;
  let query = "";
  let searchTimer = 0;
  let hideTimer = 0;

  // ---- The model: how the index groups --------------------------------------------------------------
  const across = () => BOOK.across;
  const groupOf = (e) => (across() ? (e.era ? e.era.label : e.sec || e.short || e.title) : e.sec || "");
  const rowName = (e, i) => (across() && e.era ? e.sec || e.short || e.title : e.short || e.title || `Part ${i + 1}`);   // across time: the topic under its era; an era-less chapter its own name
  function build() {
    const list = BOOK.index();
    builtFor = list;
    const grouped = list.some((e) => e.sec) || across();
    if (!grouped) { model = { groups: null, flat: list.map((_, i) => i) }; return; }
    const groups = [], by = new Map();
    list.forEach((e, i) => {
      const k = groupOf(e);
      if (!by.has(k)) { by.set(k, { name: k || "Chapters", items: [] }); groups.push(by.get(k)); }
      by.get(k).items.push(i);
    });
    model = { groups, flat: null };
  }

  // ---- Marks: ✓ before the place being read, a part-mark on it ----------------------------------------
  function place() {
    const p = BOOK.pos();
    const i = p ? BOOK.indexOf(p.c) : READER.chapter;
    const e = i >= 0 ? BOOK.info(i) : null;
    const frac = e && e.paras ? Math.min(1, Math.max(0, ((p ? p.p : READER.para) + 1) / e.paras)) : 0;
    return { i, frac };
  }
  function mark(i, at) {
    const m = h("span", "cmark");
    if (i < at.i) { m.classList.add("done"); m.textContent = "✓"; m.title = "Read"; }
    else if (i === at.i) { m.classList.add("part"); const f = h("i"); f.style.width = Math.round(at.frac * 100) + "%"; m.appendChild(f); m.title = `${Math.round(at.frac * 100)} % read`; }
    return m;
  }
  function groupMark(items, at) {
    const m = h("span", "cmark");
    const last = items[items.length - 1];
    if (last < at.i) { m.classList.add("done"); m.textContent = "✓"; m.title = "Read"; }
    else if (items.includes(at.i)) { m.classList.add("part"); const k = items.indexOf(at.i); const f = h("i"); f.style.width = Math.round(100 * (k + at.frac) / items.length) + "%"; m.appendChild(f); m.title = "Being read"; }
    return m;
  }

  // ---- Rows --------------------------------------------------------------------------------------------
  // A chapter row: [mark] [number] name [▸ when it has headings]; its headings in a box under it, built
  // when opened (the current chapter's opened at once, the heading reached highlighted).
  function chapterRow(i, at, cur) {
    const e = BOOK.info(i);
    const wrap = h("div", "citem" + (i === cur ? " current" : ""));
    wrap.dataset.i = i;
    const b = h("button", "crow cchap"); b.type = "button"; b.dataset.i = i;
    b.append(mark(i, at));
    if (BOOK.numbered) b.append(h("span", "cn", e.c));
    b.append(h("span", "ct", rowName(e, i)));
    wrap.appendChild(b);
    const heads = e.heads || [];
    if (heads.length) {
      const t = h("button", "cfold", "▸"); t.type = "button"; t.title = `${heads.length} heading${heads.length === 1 ? "" : "s"}`; t.setAttribute("aria-label", t.title); t.setAttribute("aria-expanded", "false");
      t.dataset.i = i;
      b.appendChild(t);
    }
    return wrap;
  }
  function headRows(i) {
    const e = BOOK.info(i), para = i === READER.chapter ? READER.para : -1;
    const box = h("div", "cheads");
    const heads = e.heads || [];
    let reached = -1;
    heads.forEach((hd, k) => { if (hd.p <= para) reached = k; });
    heads.forEach((hd, k) => {
      const b = h("button", "crow chead" + (k === reached ? " current" : "")); b.type = "button";
      b.dataset.i = i; b.dataset.p = hd.p;
      b.style.setProperty("--lvl", Math.max(0, hd.l - 1));
      b.append(h("span", "ct", hd.t));
      box.appendChild(b);
    });
    return box;
  }
  function toggleHeads(item, on) {
    const fold = item.querySelector(".cfold"), has = item.querySelector(".cheads");
    const want = on === undefined ? !has : on;
    if (want && !has) item.appendChild(headRows(Number(item.dataset.i)));
    else if (!want && has) has.remove();
    if (fold) { fold.textContent = want ? "▾" : "▸"; fold.setAttribute("aria-expanded", String(want)); }
  }
  function groupRow(g, at, cur) {
    const sec = h("div", "csec" + (g.items.includes(cur) ? " here" : ""));
    const b = h("button", "crow csech"); b.type = "button"; b.setAttribute("aria-expanded", "false");
    b.append(groupMark(g.items, at), h("span", "cfold", "▸"), h("span", "ct", g.name), h("span", "ccount", fmt(g.items.length)));
    sec.appendChild(b);
    sec._items = g.items;
    return sec;
  }
  function toggleGroup(sec, on) {
    const has = sec.querySelector(".cbody"), b = sec.firstChild;
    const want = on === undefined ? !has : on;
    if (want && !has) {
      const at = place(), cur = READER.chapter;
      const body = h("div", "cbody");
      for (const i of sec._items) body.appendChild(chapterRow(i, at, cur));
      sec.appendChild(body);
    } else if (!want && has) has.remove();
    b.querySelector(".cfold").textContent = want ? "▾" : "▸";
    b.setAttribute("aria-expanded", String(want));
  }

  // ---- The tree, and the search list -------------------------------------------------------------------
  // The folds the user opened stay open across a rebuild (the panel stays open while reading: a tap on
  // a chapter must not fold everything else away).
  function renderTree() {
    const at = place(), cur = READER.chapter;
    const openGroups = new Set(Array.from(tree.querySelectorAll(".csec")).filter((s) => s.querySelector(".cbody")).map((s) => s.querySelector(".ct").textContent));
    const openHeads = new Set(Array.from(tree.querySelectorAll(".citem")).filter((it) => it.querySelector(".cheads")).map((it) => it.dataset.i));
    const frag = document.createDocumentFragment();
    if (!model.groups) {
      for (const i of model.flat) frag.appendChild(chapterRow(i, at, cur));
    } else {
      for (const g of model.groups) frag.appendChild(groupRow(g, at, cur));
    }
    tree.replaceChildren(frag);
    tree.classList.remove("none");
    for (const sec of tree.children) if (sec._items && openGroups.has(sec.querySelector(".ct").textContent)) toggleGroup(sec, true);
    for (const i of openHeads) { const it = tree.querySelector(`.citem[data-i="${i}"]`); if (it) toggleHeads(it, true); }
  }
  // A paragraph change while open: the part-marks and the heading reached move; nothing is rebuilt or
  // scrolled (the user may be browsing the tree while the reading goes on).
  function refreshPlace() {
    const at = place(), cur = READER.chapter;
    const item = tree.querySelector(`.citem[data-i="${cur}"]`);
    if (!item) return;
    const old = item.querySelector(".cchap .cmark");
    if (old) old.replaceWith(mark(cur, at));
    const sec = item.closest(".csec");
    if (sec) sec.querySelector(".csech .cmark").replaceWith(groupMark(sec._items, at));
    const heads = item.querySelector(".cheads");
    if (heads) heads.replaceWith(headRows(cur));
  }
  // Every chapter whose section, name or headings hold the words (each word must appear somewhere in the
  // row's text): a flat list, the matching headings under their chapter.
  function renderSearch(q) {
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    const at = place(), cur = READER.chapter, list = BOOK.index();
    const frag = document.createDocumentFragment();
    let hits = 0, more = 0;
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      const name = `${e.sec || ""} ${e.short || e.title || ""} ${BOOK.numbered ? e.c : ""}`.toLowerCase();
      const heads = (e.heads || []).filter((hd) => words.every((w) => hd.t.toLowerCase().includes(w)));
      const own = words.every((w) => name.includes(w));
      if (!own && !heads.length) continue;
      if (++hits > MAX_HITS) { more++; continue; }
      const item = chapterRow(i, at, cur);
      if (e.sec && !across()) item.firstChild.insertBefore(h("span", "csecname", e.sec + " › "), item.firstChild.querySelector(".ct"));
      if (heads.length && !own) {
        const box = h("div", "cheads");
        for (const hd of heads) { const b = h("button", "crow chead"); b.type = "button"; b.dataset.i = i; b.dataset.p = hd.p; b.style.setProperty("--lvl", Math.max(0, hd.l - 1)); b.append(h("span", "ct", hd.t)); box.appendChild(b); }
        item.appendChild(box);
        const fold = item.querySelector(".cfold"); if (fold) { fold.textContent = "▾"; fold.setAttribute("aria-expanded", "true"); }
      }
      frag.appendChild(item);
    }
    if (more) frag.appendChild(h("div", "cmore", `${fmt(more)} more; type more of the name`));
    tree.replaceChildren(frag);
    tree.classList.toggle("none", !hits);
  }
  function render() {
    if (!BOOK.count) { tree.replaceChildren(h("div", "cmore", "No book is open. Tap Open to pick one.")); head.textContent = "Contents"; return; }
    if (builtFor !== BOOK.index() || !model) build();
    head.textContent = `${BOOK.title} · ${fmt(BOOK.count)} chapters${across() ? " · across time" : ""}`;
    if (query) { renderSearch(query); return; }
    renderTree();
    revealCurrent();
  }
  // The tree opened to the chapter being read: its section opened, its headings shown, scrolled into view.
  function revealCurrent() {
    const cur = READER.chapter;
    if (cur < 0) return;
    if (model.groups) { for (const sec of tree.children) if (sec._items && sec._items.includes(cur)) toggleGroup(sec, true); }
    const item = tree.querySelector(`.citem[data-i="${cur}"]`);
    if (!item) return;
    toggleHeads(item, true);
    const row = item.querySelector(".chead.current") || item.firstChild;
    requestAnimationFrame(() => {      // scrolled to the middle only when it is out of view (a tapped row stays where it was)
      const r = row.getBoundingClientRect(), t = tree.getBoundingClientRect();
      if (r.top < t.top || r.bottom > t.bottom) { try { row.scrollIntoView({ block: "center" }); } catch (e) {} }
    });
  }

  // ---- Open, close ---------------------------------------------------------------------------------------
  // Docked (wide): html.cdock pushes the page over, no backdrop. Overlay (narrow): the backdrop dims the
  // page. Applied on open and again when the window crosses the 700 px line while open. The slide ends
  // with a resize event, so the top bar's name fit (reader.js) and the windows (float.js) re-measure.
  function layout() {
    const dock = open && docked();
    root.classList.toggle("cdock", dock);
    back.hidden = !(open && !dock);
    back.classList.toggle("open", open && !dock);
    tocBtn.setAttribute("aria-pressed", String(open));
  }
  function remember() { try { localStorage.setItem(KEY, JSON.stringify({ open })); } catch (e) {} }
  function saved() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  const settled = () => dispatchEvent(new Event("resize"));
  function show({ instant = false } = {}) {
    clearTimeout(hideTimer);
    open = true;
    panel.hidden = false;
    if (instant) root.classList.add("cinstant");
    layout();
    if (instant) { panel.classList.add("open"); requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove("cinstant"))); }
    else { requestAnimationFrame(() => panel.classList.add("open")); setTimeout(settled, 250); }
    panel.setAttribute("aria-hidden", "false");
    render();
    if (!instant && matchMedia("(pointer: fine)").matches) box.focus();
    remember();
    log("page", `the contents panel ${docked() ? "beside" : "over"} the text (${BOOK.count ? `${fmt(BOOK.count)} chapters${model && model.groups ? `, ${model.groups.length} ${across() ? "eras" : "sections"}` : ""}` : "no book"})`);
  }
  function close() {
    if (!open) return;
    open = false;
    panel.classList.remove("open");
    layout();
    panel.setAttribute("aria-hidden", "true");
    hideTimer = setTimeout(() => { if (!open) { panel.hidden = true; settled(); } }, 250);
    remember();
  }
  const toggle = () => (open ? close() : show());
  DOCK.addEventListener("change", () => { if (open) layout(); });

  tree.addEventListener("click", (e) => {
    const fold = e.target.closest(".cfold");
    if (fold && fold.closest(".cchap")) { e.stopPropagation(); toggleHeads(fold.closest(".citem")); return; }
    const sech = e.target.closest(".csech");
    if (sech) { toggleGroup(sech.parentElement); return; }
    const row = e.target.closest(".crow");
    if (!row) return;
    const i = Number(row.dataset.i);
    const heading = row.classList.contains("chead") ? row.querySelector(".ct").textContent : "";
    if (heading) { const p = Number(row.dataset.p); READER.pick(i, { p, top: p }); }
    else READER.pick(i);
    confirmJump(row, i, heading);
  });
  // The sign that a tap moved the place (the panel covers the page on a phone): a short buzz where the
  // device has one (none elsewhere: the two other signs still show), the row flashes once (it stays marked
  // as current: the render / refresh moved the highlight), "Now at: …" at the bottom for a few seconds.
  const now = $("cnow");
  let nowTimer = 0, flashSel = "";
  // The tapped row, or its rebuilt twin once a chapter change has redrawn the tree (the render comes after
  // the chapter has loaded, so the flash is started again on the new row).
  function flash(fallback) {
    const live = (flashSel && tree.querySelector(flashSel)) || fallback;
    if (!live) return;
    live.classList.remove("flash"); void live.offsetWidth; live.classList.add("flash");
    live.addEventListener("animationend", () => live.classList.remove("flash"), { once: true });
  }
  function confirmJump(row, i, heading) {
    try { if (typeof navigator.vibrate === "function") navigator.vibrate(15); } catch (e) {}
    flashSel = heading ? `.chead[data-i="${i}"][data-p="${row.dataset.p}"]` : `.cchap[data-i="${i}"]`;
    flash(row);
    if (i === READER.chapter) flashSel = "";       // the same chapter: no redraw is coming
    const e = BOOK.info(i);
    now.textContent = `Now at: ${e ? (BOOK.numbered ? `${e.c} · ` : "") + (e.title || "") : ""}${heading ? ` · ${heading}` : ""}`;
    now.classList.add("show");
    clearTimeout(nowTimer);
    nowTimer = setTimeout(() => now.classList.remove("show"), 4000);
  }
  box.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { query = box.value.trim(); if (open) render(); }, 80);
  });
  box.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { const b = tree.querySelector(".crow.cchap, .crow.chead"); if (b) b.click(); }
  });
  panelToc.addEventListener("click", close);     // the panel's stand-in for the top bar's ☰ (narrow screens)
  back.addEventListener("click", close);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && open && !e.defaultPrevented) { e.preventDefault(); close(); } }, true);
  tocBtn.addEventListener("click", toggle);
  READER.onChange((what) => {
    if (what === "book" || what === "order") { builtFor = null; model = null; if (open) render(); }
    else if (what === "chapter" && open && !query) { render(); if (flashSel) { flash(); flashSel = ""; } }
    else if (what === "para" && open && !query) refreshPlace();
  });
  if (saved().open && docked()) show({ instant: true });     // left open last time on a wide screen: open again, no slide

  globalThis.CONTENTS = {
    open: show, close, toggle, render,
    get isOpen() { return open; },
    get query() { return query; },
    set query(q) { query = String(q || ""); box.value = query; if (open) render(); },
  };
})();
</script>
<script>
// library.js: the Open window (the Open button at the top left; TODO item 5, 2026-10-20). A floating
// window (FLOAT) listing the books stored: a row per book (title, chapters and size, where you are,
// progress, when last read; the open one marked), a tap on the row opens it (the window closes),
// Rename (the title becomes a box in place), Delete (two taps, no pop-up). Two buttons bring books in:
// Add files or a zip (one picker: .txt, .text, .md, .zip, .gz, several at once) and Add a folder (the
// folder picker, on every device). After a pick, a PREVIEW replaces the list until Add or Cancel:
// what the files would become (BOOK.plan: one book per top folder, one per zip, loose files one book
// or, with the switch, a document each), each with its title in a box, its kind, what it replaces,
// "Join wrapped lines" (on when the file looks hard-wrapped; plain documents only) and "Split into parts
// of about 5,000 words" (a long single file with no heading lines), the files ignored, and the fit
// against the browser's storage. Add runs one import per book in turn (book.js stages each; one
// failure never undoes another) with a bar and a Stop button; the done line names what came in and the
// notes (duplicates, files not UTF-8, unreadable files, how a file was split). The book just added opens
// (the first when several), stopping a reading in progress; the others are marked "new". Test pages (BR1_TEST.askName === false) skip the preview and add
// at once with the planned titles. The import lives only here; reader.js shows the open book.
(function () {
  const $ = (id) => document.getElementById(id);
  const inputs = { files: $("file-files"), folder: $("file-folder") };
  const st = { win: null, mode: "list", plan: null, prog: null, busy: false, armed: "", armedAt: 0, status: "", renaming: "", options: "", news: new Set(), need: 0, free: null };
  const fmt = (n) => Number(n || 0).toLocaleString("en-US");
  const MB = (n) => (n < 1e6 ? `${Math.max(1, Math.round(n / 1e3))} KB` : MODELS.MB(n));
  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const btn = (cls, text, fn, title) => { const b = h("button", cls, text); b.type = "button"; if (title) b.title = title; b.addEventListener("click", fn); return b; };
  const test = () => !!(globalThis.BR1_TEST && BR1_TEST.askName === false);

  function say(text, bad) {
    st.status = text || "";
    const m = st.win && st.win.body.querySelector(".libmsg");
    if (m) { m.textContent = st.status; m.classList.toggle("bad", !!bad); m.hidden = !st.status; }
  }
  // When a book was last read: "2:51 PM today", "yesterday 9:10 AM", else the date and time.
  function when(t) {
    if (!t) return "";
    const d = new Date(t), now = new Date();
    const day = (x) => `${x.getFullYear()}-${x.getMonth()}-${x.getDate()}`;
    const time = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
    if (day(d) === day(now)) return `${time} today`;
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (day(d) === day(y)) return `yesterday ${time}`;
    return LOG.when(t);
  }

  // ---- The list ---------------------------------------------------------------------------------
  function renderList(body) {
    const box = h("div", "lib");
    const bar = h("div", "libbtns");
    const addFiles = btn("libbtn", "Add files, a zip or an EPUB", () => inputs.files.click(), "Text files (.txt, .text, .md), a .gz, a zip of them, or an .epub");
    const addFolder = btn("libbtn", "Add a folder", () => inputs.folder.click(), "A folder of text files, or a folder holding several books");
    const fromPC = btn("libbtn", "From my PC", () => { st.mode = "pc"; render(); }, "Browse Relay Files on your PC (PC Relay) and add a file or a whole folder");
    bar.append(addFiles, addFolder, fromPC);
    box.appendChild(bar);
    const msg = h("div", "libmsg", st.status); msg.setAttribute("aria-live", "polite"); msg.hidden = !st.status;
    box.appendChild(msg);
    const books = BOOK.books;
    if (!books.length) {
      box.appendChild(h("div", "libempty", "No books yet. Add files, a zip or a folder of .txt files. A book can be one file or many; chapter numbers are optional."));
    } else {
      const list = h("div", "liblist");
      for (const b of books) list.appendChild(row(b));
      box.appendChild(list);
    }
    const foot = h("div", "libfoot", "");
    box.appendChild(foot);
    if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then((e) => { foot.textContent = `Browser storage: ${MB(e.usage || 0)} used of ${MB(e.quota || 0)}.`; }, () => {});
    box.appendChild(online());
    body.replaceChildren(box);
  }
  // The Online library (2026-10-22): the site's shelf (shelf.js: ../books/index.json, read once per page), a
  // row per book with its standing here and ONE button: Add (not stored), Open (stored at the shelf's
  // version), Update (the shelf has another version: replaces the copy, the place kept). Cannot be listed
  // (offline, a local file:// page, a 404): one plain line with the reason and the fix. The list arrives after
  // the window is drawn, so the section fills itself in (no re-render of the rows above).
  function online() {
    const sec = h("div", "libonline");
    sec.appendChild(h("div", "libh", "Online library"));
    const body = h("div", "libsub", "Looking at the shelf…");
    sec.appendChild(body);
    if (!globalThis.SHELF) { body.textContent = "No shelf in this build."; return sec; }
    SHELF.list().then((l) => {
      if (!sec.isConnected) return;
      const rows = h("div", "liblist");
      for (const { entry: en, stored, status } of l.books) {
        const r = h("div", "librow libonrow" + (status === "update" ? " update" : ""));
        r.dataset.id = en.id; r.dataset.status = status;
        const inner = h("div", "libon");
        const head = h("div", "libhead");
        head.append(h("span", "libtitle", en.title), h("span", "libnow", status === "stored" ? "stored" : status === "update" ? "update available" : ""));
        inner.appendChild(head);
        if (en.description) inner.appendChild(h("div", "libsub", en.description));
        inner.appendChild(h("div", "libsub", `${en.author ? en.author + " · " : ""}${MB(en.size)}${en.files ? ` · ${fmt(en.files)} files` : ""}${status === "update" ? ` · stored: version ${stored.shelf.version || "?"}, online: ${en.version || "?"}` : ""}`));
        r.appendChild(inner);
        const acts = h("div", "libacts");
        const text = status === "stored" ? "Open" : status === "update" ? "Update" : "Add";
        const tip = status === "stored" ? `Open the stored "${en.title}"` : status === "update" ? `Download the new version and replace the stored "${en.title}" (your place is kept)` : `Download "${en.title}" (${MB(en.size)}) and add it`;
        acts.appendChild(btn("libact" + (status === "stored" ? "" : " libget"), text, () => SHELF.load(en).then(() => { if (st.win && st.mode === "list") render(); }), tip));
        r.appendChild(acts);
        rows.appendChild(r);
      }
      for (const p of l.problems) rows.appendChild(h("div", "libmsg bad", `The shelf's folder "${p.id}" could not be listed: ${p.problem}`));
      body.replaceWith(l.books.length || l.problems.length ? rows : h("div", "libsub", "The shelf lists no books yet."));
    }, (e) => {
      if (!sec.isConnected) return;
      body.replaceWith(h("div", "libmsg bad", `The online library cannot be listed: ${e.message}.`));
      log("book", `book shelf: the online library could not be listed: ${e.message}`);
    });
    return sec;
  }
  function row(b) {
    const cur = BOOK.current === b.id;
    const r = h("div", "librow" + (cur ? " current" : "") + (st.news.has(b.id) ? " new" : ""));
    r.dataset.id = b.id;
    const open = btn("libopen", "", () => openBook(b.id), cur ? "This book is open" : `Open "${b.title}"`);
    const head = h("div", "libhead");
    if (st.renaming === b.id) {
      const inp = h("input", "libname"); inp.type = "text"; inp.value = b.title; inp.maxLength = 120; inp.setAttribute("aria-label", "Book title");
      const finish = async (save) => { st.renaming = ""; if (save && inp.value.trim() && inp.value.trim() !== b.title) { try { await BOOK.rename(b.id, inp.value); if (BOOK.current === b.id) READER.refreshTitle(); } catch (e) { say(`Renaming failed: ${e.message}`, true); log("error", "rename", e); } } render(); };
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); finish(true); } else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finish(false); } });
      inp.addEventListener("click", (e) => e.stopPropagation());
      head.appendChild(inp);
      r.appendChild(head);
      const acts = h("div", "libacts");
      acts.append(btn("libact", "Save", () => finish(true)), btn("libact", "Cancel", () => finish(false)));
      r.appendChild(acts);
      setTimeout(() => { try { inp.focus(); inp.select(); } catch (e) {} }, 0);
      return r;
    }
    head.append(h("span", "libtitle", b.title), cur ? h("span", "libnow", "open now") : st.news.has(b.id) ? h("span", "libnow", "new") : "");
    const kind = b.kind === "numbered" ? "numbered" : b.kind === "one" ? "one file" : b.kind === "split" ? "one file, split" : b.kind === "epub" ? `EPUB${b.author ? ` by ${b.author}` : ""}` : b.grid ? `a chapter per era (${b.grid.eras.length} eras${b.across ? ", across time" : ""})` : "a chapter per file";
    const sub1 = h("div", "libsub", `${fmt(b.chapters)} chapter${b.chapters === 1 ? "" : "s"} · ${MB(b.bytes)} · ${kind}`);
    const p = BOOK.posOf(b.id);
    // The place: the chapter's name when this book is open (its index is loaded), else its number / place.
    const here = p && cur ? BOOK.info(BOOK.indexOf(p.c)) : null;
    const place = p ? `${b.kind === "numbered" ? `Chapter ${p.c}` : `${b.kind === "epub" ? "Chapter" : "Part"} ${here ? BOOK.indexOf(p.c) + 1 : p.c}`}${here ? ` · ${here.title}` : ""} ¶ ${(p.p || 0) + 1} · ${p.pct || 0} %${p.at ? ` · ${when(p.at)}` : ""}` : "not started";
    open.append(head, sub1, h("div", "libsub", place));
    r.appendChild(open);
    const acts = h("div", "libacts");
    const armed = st.armed === b.id && Date.now() - st.armedAt < 8000;
    acts.append(btn("libact", "Rename", () => { st.renaming = b.id; st.armed = ""; render(); }),
      btn("libact libdel" + (armed ? " armed" : ""), armed ? "Delete now?" : "Delete", () => del(b)));
    // Per-book options, changeable any time (Jon: never locked): a grid book's Read across time. Join /
    // Split are import-time transforms; they have no row here (add the book again to change them).
    if (b.grid) {
      const o = btn("libact", "Options", () => { st.options = st.options === b.id ? "" : b.id; render(); }, "This book's options");
      o.setAttribute("aria-expanded", String(st.options === b.id));
      acts.appendChild(o);
    }
    r.appendChild(acts);
    if (b.grid && st.options === b.id) {
      const opts = h("div", "libopts");
      const l = h("label", "libopt");
      const c = h("input"); c.type = "checkbox"; c.checked = !!b.across;
      c.addEventListener("change", async () => {
        c.disabled = true;
        try { await READER.setAcross(b.id, c.checked); say(`"${b.title}": read across time ${c.checked ? "on: every topic's first era, then every topic's next, …" : "off: topic by topic"}.`); }
        catch (e) { say(`Could not change the option: ${e.message}`, true); log("error", "read across time", e); }
        render();
      });
      l.append(c, h("span", null, `Read across time (experimental): every topic's "${b.grid.eras[0].label}", then every topic's "${b.grid.eras[1].label}", … (${b.grid.eras.length} eras)`));
      opts.appendChild(l);
      r.appendChild(opts);
    }
    return r;
  }
  async function openBook(id) {
    if (BOOK.current === id) { st.win.close(); return; }
    try { await READER.openBook(id); st.win.close(); }
    catch (e) { say(`"${(BOOK.books.find((b) => b.id === id) || {}).title}" could not be opened: ${e.message}`, true); log("error", "opening a book", e); }
  }
  // Two taps: the first says what goes, a second within 8 s deletes (like Settings → Storage).
  async function del(b) {
    if (st.armed !== b.id || Date.now() - st.armedAt > 8000) {
      st.armed = b.id; st.armedAt = Date.now();
      say(`Delete "${b.title}": ${fmt(b.chapters)} chapter${b.chapters === 1 ? "" : "s"}, ${MB(b.bytes)}, and your place in it. Tap Delete again to delete it.`);
      render();
      setTimeout(() => { if (st.armed === b.id && Date.now() - st.armedAt >= 8000) { st.armed = ""; if (st.mode === "list") render(); } }, 8100);
      return;
    }
    st.armed = "";
    try {
      const wasOpen = BOOK.current === b.id;
      if (wasOpen) READER.closeBook();           // stops the reading; the page shows its empty state
      await BOOK.remove(b.id);
      say(`Deleted "${b.title}" (${fmt(b.chapters)} chapter${b.chapters === 1 ? "" : "s"}, ${MB(b.bytes)}).${wasOpen ? " Open another book, or add one." : ""}`);
    } catch (e) { say(`Deleting "${b.title}" failed: ${e.message}`, true); log("error", "deleting a book", e); }
    render();
    if (globalThis.STORED) STORED.stale();
  }

  // ---- The preview ------------------------------------------------------------------------------
  // opts.shelf (shelf.js, a book from the public shelf: { id, version, title, existing }): no preview; the one
  // planned book takes the catalog's title, carries the shelf mark, replaces the stored copy of the same shelf
  // book, and is added at once; Read across time stays off. Resolves to add()'s result then.
  async function pick(files, opts) {
    files = Array.from(files || []);
    if (!files.length || st.busy) return null;
    open();
    say("Looking at the files…");
    let plan;
    try { plan = await BOOK.plan(files, opts); }
    catch (e) { say(e.message, true); log("book", `nothing to add: ${e.message}`); st.mode = "list"; render(); if (opts && opts.shelf) throw e; return null; }
    plan.files = files;
    st.plan = plan;
    st.mode = "preview";
    say("");
    const shelf = opts && opts.shelf;
    if (shelf) {
      const s = plan.books[0];
      s.title = shelf.title || s.title; s.shelf = { id: shelf.id, version: shelf.version }; s.across = false;
      s.existing = shelf.existing || null;             // the stored copy of the SAME shelf book, else a new book (never a same-named one)
      s.existingTitle = s.existing ? (BOOK.books.find((b) => b.id === s.existing) || {}).title || "" : "";
      for (const other of plan.books.slice(1)) other.skip = true;
      return add();
    }
    if (test()) { add(); return null; }
    render();
    return null;
  }
  async function replan(opts) {
    try { const p = await BOOK.plan(st.plan.files, opts); p.files = st.plan.files; p.separate = !!opts.separate; st.plan = p; }
    catch (e) { say(e.message, true); }
    render();
  }
  function renderPreview(body) {
    const p = st.plan;
    const box = h("div", "lib libprev");
    const from = p.files.length === 1 ? `"${p.files[0].name}"` : p.inFolder ? `the folder "${(p.files[0].webkitRelativePath || "").split("/")[0]}"` : `${fmt(p.files.length)} files`;
    box.appendChild(h("div", "libh", `Adding from ${from}`));
    if (p.loose) {
      const l = h("label", "libopt");
      const c = h("input"); c.type = "checkbox"; c.checked = !!p.separate;
      c.addEventListener("change", () => replan({ separate: c.checked }));
      l.append(c, h("span", null, "A separate document per file (else one book, a chapter per file)"));
      box.appendChild(l);
    }
    // A folder of folders (Jon, 2026-10-20): asked once, here; one book with sections by default.
    if (p.folders) {
      for (const [on, text] of [[true, "One book: each sub-folder is a section, its files are chapters"], [false, "One book per sub-folder"]]) {
        const l = h("label", "libopt libfolders");
        const r = h("input"); r.type = "radio"; r.name = "libsections"; r.checked = p.sections === on;
        r.addEventListener("change", () => { if (r.checked) replan({ sections: on }); });
        l.append(r, h("span", null, text));
        box.appendChild(l);
      }
    }
    const list = h("div", "libplan");
    p.books.forEach((s, k) => {
      const r = h("div", "libspec");
      const top = h("div", "libspechead");
      const tick = h("input"); tick.type = "checkbox"; tick.checked = s.skip !== true; tick.setAttribute("aria-label", "Add this book");
      tick.addEventListener("change", () => { s.skip = !tick.checked; fit(); });
      const name = h("input", "libname"); name.type = "text"; name.value = s.title; name.maxLength = 120; name.setAttribute("aria-label", "Book title");
      name.addEventListener("input", () => { s.title = name.value; });
      top.append(tick, name);
      r.appendChild(top);
      const what = s.numbered ? `${fmt(s.files)} chapter files numbered ${CHAPTER.number(s.paths[0])}-${CHAPTER.number(s.paths[s.paths.length - 1])}`
        : s.epub ? `An EPUB${s.author ? ` by ${s.author}` : ""}: ${fmt(s.spine)} files; chapters from its table of contents`
        : s.kind === "split" ? (s.headings ? `1 file: split at its ${fmt(s.headings)} heading lines` : `1 file: one chapter (${fmt(s.words)} words)`)
        : s.grid ? `${fmt(s.files)} files in ${fmt(s.sections)} sections (topics × eras: a chapter per era), in folder order`
        : s.sections ? `${fmt(s.files)} files in ${fmt(s.sections)} sections, a chapter each, in folder order` : `${fmt(s.files)} files, a chapter each, in name order`;
      r.appendChild(h("div", "libsub", what));
      if (s.existing) r.appendChild(h("div", "libsub librepl", `Replaces the stored "${s.existingTitle}" (your place in it is kept).`));
      // Advanced (Jon, 2026-10-21): the extra switches for this book behind one button, the preview
      // itself staying plain. Join wrapped lines (plain documents), Split into parts (a long single file
      // with no headings), Read across time (a grid book). A numbered book has none, so no button.
      // An EPUB (2026-10-22): "Skip copyright and contents pages" (on) and "Read footnotes at the end of their
      // chapter" (off: the notes are skipped; the note marks go from the text either way).
      const advanced = [];
      if (s.epub) advanced.push(["skipFront", "Skip copyright and contents pages"], ["notesEnd", "Read footnotes at the end of their chapter (else skipped)"]);
      if (!s.numbered && !s.epub) advanced.push(["join", `Join wrapped lines${s.wrapped ? " (the file looks hard-wrapped)" : ""}`]);
      if (s.kind === "split" && !s.headings && s.words > CHAPTER.PARTS_FROM) advanced.push(["parts", `Split into parts of about ${fmt(CHAPTER.PART_WORDS)} words (${fmt(Math.ceil(s.words / CHAPTER.PART_WORDS))} parts)`]);
      if (s.grid) advanced.push(["across", "Read across time (experimental): every topic's first era, then every topic's next, … (can be changed later from this book's Options)"]);
      if (advanced.length) {
        const a = btn("libadv", s.adv ? "Advanced ▾" : "Advanced ▸", () => { s.adv = !s.adv; render(); }, "More choices for this book");
        a.setAttribute("aria-expanded", String(!!s.adv));
        r.appendChild(a);
        if (s.adv) {
          const box = h("div", "libopts");
          for (const [key, text] of advanced) {
            const l = h("label", "libopt");
            const c = h("input"); c.type = "checkbox"; c.checked = key === "notesEnd" ? s.footnotes === "end" : !!s[key];
            c.addEventListener("change", () => { if (key === "notesEnd") s.footnotes = c.checked ? "end" : "skip"; else s[key] = c.checked; });
            l.append(c, h("span", null, text));
            box.appendChild(l);
          }
          r.appendChild(box);
        }
      }
      list.appendChild(r);
    });
    box.appendChild(list);
    if (p.ignored.length) box.appendChild(h("div", "libsub", `${fmt(p.ignored.length)} other file${p.ignored.length === 1 ? "" : "s"} ignored: ${p.ignored.slice(0, 4).join(", ")}${p.ignored.length > 4 ? ", …" : ""}`));
    const fitLine = h("div", "libsub libfit", "");
    box.appendChild(fitLine);
    const msg = h("div", "libmsg", st.status); msg.hidden = !st.status; msg.setAttribute("aria-live", "polite");
    box.appendChild(msg);
    const btns = h("div", "libbtns");
    const addBtn = btn("libbtn libadd", "Add", () => add());
    btns.append(addBtn, btn("libbtn", "Cancel", () => { st.plan = null; st.mode = "list"; say("Nothing added."); render(); }));
    box.appendChild(btns);
    body.replaceChildren(box);
    // The fit: picked text × 2 (stored as strings) against the browser's free storage; not enough →
    // Add is greyed with the reason (never a half-added book).
    const fit = async () => {
      const chosen = p.books.filter((s) => !s.skip);
      const need = chosen.reduce((n, s) => n + s.bytes, 0) * 2;
      const est = chosen.filter((s) => s.measured < s.files);   // sizes estimated from a sample (BUGS 40)
      const from = est.length ? ` (estimated from the sizes of ${est.map((s) => `${fmt(s.measured)} of ${fmt(s.files)}`).join(", ")} files)` : "";
      let free = null;
      try { const e = await navigator.storage.estimate(); free = (e.quota || 0) - (e.usage || 0); } catch (e) {}
      st.need = need; st.free = free;
      const short = free !== null && need > free;
      fitLine.textContent = `${chosen.length ? `Needs about ${MB(need)}${from}` : "Nothing ticked"}${free !== null ? `; ${MB(free)} free in the browser` : ""}.${short ? " Not enough room: delete a book here, or voice files in Settings → Storage." : ""}`;
      fitLine.classList.toggle("bad", short);
      addBtn.disabled = !chosen.length || short;
      addBtn.title = short ? "Not enough room in the browser's storage" : !chosen.length ? "Tick a book to add" : "";
    };
    fit();
  }

  // ---- Adding --------------------------------------------------------------------------------------
  // Resolves to { added: [summaries], failed: [messages] } (shelf.js reads it).
  async function add() {
    const p = st.plan;
    if (!p || st.busy) return null;
    const chosen = p.books.filter((s) => !s.skip);
    if (!chosen.length) { say("Nothing ticked.", true); return null; }
    st.busy = true;
    st.mode = "progress";
    st.prog = { book: 0, of: chosen.length, text: "Starting…", frac: 0 };
    render();
    const added = [], failed = [], notes = [];
    const t0 = Date.now();
    for (let k = 0; k < chosen.length; k++) {
      const s = chosen[k];
      st.prog.book = k + 1;
      // Replacing the OPEN book: the reading stops first (D9), as its chapters are about to change.
      if (s.existing && s.existing === BOOK.current && globalThis.PLAYER && PLAYER.state !== "stopped") { PLAYER.stop(); log("page", "the reading was stopped: the open book is being replaced"); }
      try {
        const r = await BOOK.importBook(s, (text, frac) => { st.prog.text = text; st.prog.frac = frac; progress(); }, p.zips);
        added.push(r);
        const more = (list, n) => list.slice(0, n).join("; ") + (list.length > n ? `; ${list.length - n} more in the log` : "");
        if (r.duplicates) notes.push(`${r.duplicates} chapter number${r.duplicates > 1 ? "s" : ""} appeared twice: ${more(r.dupNames || [], 2)}`);
        if (r.unreadable) notes.push(`${r.unreadable} file${r.unreadable > 1 ? "s" : ""} could not be read and ${r.unreadable > 1 ? "were" : "was"} skipped${r.unreadNames && r.unreadNames.length ? ": " + more(r.unreadNames, 2) : ""}`);
        if (r.recoded && r.recoded.length) notes.push(`${r.recoded.length} file${r.recoded.length > 1 ? "s were" : " was"} not UTF-8: ${more(r.recoded, 2)}`);
        if (s.kind === "split" || s.kind === "epub") notes.push(`"${r.title}": ${r.how}`);
        if (s.kind === "epub" && r.info && r.info.length) notes.push(more(r.info, 3));
        if (r.join) notes.push(`"${r.title}": wrapped lines joined`);
        if (r.replaced) notes.push(`"${r.title}" replaced the stored book; your place in it is kept`);
        if (r.gridNote) notes.push(r.gridNote);
        if (BOOK.current && BOOK.current === r.id) await READER.openBook(r.id, { quiet: true });   // the open book's chapters changed: show them again
      } catch (e) {
        failed.push(e.message);
        if (/was stopped/.test(e.message)) { for (const rest of chosen.slice(k + 1)) failed.push(`"${rest.title}" was not added (stopped).`); break; }
      }
    }
    if (p.ignored.length) notes.push(`${p.ignored.length} other file${p.ignored.length === 1 ? "" : "s"} ignored`);
    st.busy = false; st.plan = null; st.mode = "list";
    for (const inp of Object.values(inputs)) inp.value = "";
    const secs = ((Date.now() - t0) / 1000).toFixed(1);
    const line = [];
    if (added.length) line.push(`Added ${added.map((r) => `${r.title}: ${fmt(r.chapters)} chapter${r.chapters === 1 ? "" : "s"}`).join("; ")} in ${Number(secs) < 0.1 ? "under a second" : secs + " s"}.`);
    if (failed.length) line.push(failed.join(" "));
    if (notes.length) line.push(notes.join("; ") + ".");
    say(line.join(" "), !!failed.length && !added.length);
    st.news = new Set(added.map((r) => r.id));
    if (added.length) READER.noteAdded(added);
    // Jon, 2026-10-20: the book just added opens (the first, when several came in), even over an open
    // one (its reading stops); the window closes when there is nothing to say.
    if (added.length && BOOK.current !== added[0].id) {
      try { await READER.openBook(added[0].id); if (st.win && !failed.length && !notes.length) st.win.close(); } catch (e) { say(`${line.join(" ")} It could not be opened: ${e.message}`, true); }
    }
    render();
    if (globalThis.STORED) STORED.stale();
    return { added, failed };
  }
  // The shelf's download (shelf.js): the window shows the progress view with this text and fraction;
  // text null puts the list back. Only while nothing else is being added.
  function download(text, frac) {
    if (st.busy) return;
    if (text === null) { if (st.mode === "progress") { st.mode = "list"; render(); } return; }
    open();
    st.mode = "progress";
    st.prog = { book: 1, of: 1, text, frac: frac || 0 };
    render();
  }
  function progress() {
    const el = st.win && st.win.body.querySelector(".libprog");
    if (!el) return;
    el.querySelector(".libptext").textContent = `Book ${st.prog.book} of ${st.prog.of} · ${st.prog.text}`;
    el.querySelector(".bar > div").style.width = `${Math.round((st.prog.frac || 0) * 100)}%`;
  }
  function renderProgress(body) {
    const box = h("div", "lib libprog");
    box.appendChild(h("div", "libh", "Adding…"));
    box.appendChild(h("div", "libptext", ""));
    const bar = h("div", "bar"); bar.appendChild(h("div"));
    box.appendChild(bar);
    box.appendChild(btn("libbtn", "Stop", () => { BOOK.stopImport(); }, "Stops the import; nothing half-added stays"));
    body.replaceChildren(box);
    progress();
  }

  function render() {
    if (!st.win) return;
    const body = st.win.body;
    if (st.mode === "preview" && st.plan) renderPreview(body);
    else if (st.mode === "progress") renderProgress(body);
    else if (st.mode === "pc" && globalThis.PCFILES) PCFILES.render(body);    // Open → From my PC (pcfiles.js)
    else renderList(body);
  }
  function showList() { if (globalThis.PCFILES) PCFILES.stop(); st.mode = "list"; render(); }
  function open() {
    if (st.win) { FLOAT.open("library"); return st.win; }
    st.win = FLOAT.open("library", { title: "Open", width: 440, height: 560, onClose: () => { st.win = null; st.renaming = ""; st.armed = ""; if (st.mode === "pc" && globalThis.PCFILES) { PCFILES.stop(); st.mode = "list"; } if (st.mode === "preview") { st.plan = null; st.mode = "list"; } } });
    render();
    log("page", `the Open window (${BOOK.books.length} book${BOOK.books.length === 1 ? "" : "s"})`);
    return st.win;
  }

  for (const inp of Object.values(inputs)) inp.addEventListener("change", () => { if (inp.files.length) { const list = Array.from(inp.files); inp.value = ""; pick(list); } });
  $("open").addEventListener("click", () => { if (st.win && st.mode === "list") st.win.close(); else open(); });
  READER.onChange((what) => { if ((what === "book" || what === "chapter" || what === "order") && st.win && st.mode === "list") render(); });

  globalThis.LIBRARY = {
    open, pick, add, render, download, showList,
    get isOpen() { return !!st.win; },
    get mode() { return st.mode; },
    get status() { return st.status; },
    get plan() { return st.plan; },
    say,
  };
})();
</script>
<script>
// shelf.js: the public book shelf (2026-10-21; drop-in folders 2026-10-22). The site's shelf is
// cool-tools/books/: a folder per book holding one zip and a book.json, listed by the generated
// ../books/index.json (made by the Books index workflow on every push, since GitHub Pages cannot list
// folders; a book's version is a hash of its zip's entries, so it changes only with the text). This file
// reads that index ONCE per page (catalog(); a failure is not kept, so the next look asks again) and:
//   - reader/?book=<id> (autoload): finds the book and load()s it;
//   - the Open window's "Online library" section (library.js) lists every book with its standing here
//     (list(): new / stored / update available) and load()s the one tapped.
// load(en): already stored at the index's version → opens it; stored at another version → downloads the
// zip with progress in the Open window and REPLACES it through the library's import (the reading place is
// kept, book.js); not stored → downloads and adds it, with the index's title and import options (only
// `sections` is honoured; Read across time is never set from the shelf). No preview; the first-run window
// still comes after the first book. reader/?zip=<path> takes a zip by its address relative to the page
// instead (title from its name, no options). A failed fetch (offline, a 404, no such id, a bad index, the
// local file:// page) is said in plain words on the page, in the Open window and in the log, and nothing
// else happens: no fallback. Without ?book= / ?zip= the page is as before. SHELF.state / SHELF.message for
// the tests: "idle", "catalog", "downloading", "adding", "opened", "added", "failed".
(function () {
  const st = { state: "idle", message: "", entry: null, bytes: 0, catalog: null };
  const MB = (n) => (n < 1e6 ? `${Math.max(1, Math.round(n / 1e3))} KB` : `${(n / 1e6).toFixed(1)} MB`);
  const q = new URLSearchParams(location.search);
  const wanted = q.get("book") || "", zipPath = q.get("zip") || "";
  const SITE = "https://jonnystokes.github.io/Cool-tools/reader/";

  function fail(text, e) {
    st.state = "failed"; st.message = text;
    log("error", `book shelf: ${text}`, e);
    LIBRARY.download(null);
    if (LIBRARY.isOpen) LIBRARY.say(text, true);      // the Open window when it is up (no book yet, or the download had begun)
    READER.say(text, 30000);
  }
  function note(text) { st.message = text; log("book", `book shelf: ${text}`); }
  const offline = () => (navigator.onLine ? "" : " (this device is offline)");

  // The index, fetched once per page: { url, books: [entries], problems: [{ id, problem }] }. Throws with the
  // plain reason (and the fix when there is one); a failed fetch is not kept.
  function catalog() {
    if (st.catalog) return st.catalog;
    const p = (async () => {
      if (location.protocol === "file:") throw new Error(`this page is a local file, so there is no shelf beside it; open the reader from the web site (${SITE}) to see the online library`);
      const url = new URL("../books/index.json", location.href);
      let r;
      try { r = await fetch(url, { cache: "no-cache" }); }
      catch (e) { throw new Error(`the shelf's list ${url.href} could not be fetched: ${e.message}${offline() || "; check the connection and open this window again"}`); }
      if (!r.ok) throw new Error(`the shelf's list ${url.href} answered ${r.status} ${r.statusText}${r.status === 404 ? " (the site's Books index workflow has not made it yet)" : ""}`);
      let cat;
      try { cat = await r.json(); } catch (e) { throw new Error(`the shelf's list ${url.href} is not valid JSON: ${e.message}`); }
      const books = (Array.isArray(cat.books) ? cat.books : []).filter((b) => b && b.id && b.zip && b.title)
        .map((b) => ({ id: String(b.id), title: String(b.title), description: String(b.description || ""), author: String(b.author || ""), zip: String(b.zip), url: new URL(b.zip, url).href,
          version: String(b.version || ""), size: Number(b.size) || 0, files: Number(b.files) || 0, options: b.options && typeof b.options === "object" ? b.options : {} }));
      const problems = (Array.isArray(cat.problems) ? cat.problems : []).filter((p) => p && p.id).map((p) => ({ id: String(p.id), problem: String(p.problem || "") }));
      log("book", `book shelf: the list has ${books.length} book${books.length === 1 ? "" : "s"}${problems.length ? `, ${problems.length} folder${problems.length === 1 ? "" : "s"} not listed (${problems.map((p) => p.id).join(", ")})` : ""}`);
      return { url: url.href, books, problems };
    })();

    p.catch(() => { if (st.catalog === p) st.catalog = null; });
