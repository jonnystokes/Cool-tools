<script>
// engines/cloud.js: the `cloud` engine (2026-10-25): the voice chosen in Settings → Voice, made on Jon's PC
// by PC Relay's voice service (Projects\pc-relay\services\voice: the same kokoro-js and the same word timing
// code as engines/kokoro.js, on the PC's graphics card or processor). The same interface as every engine
// (engine.js): init loads it on the PC (the relay starts the service; its progress shows on the status
// line), synth(piece) sends the piece's speech and settings and gets its sound (PCM16 at 24 kHz) and word
// times back, stop() cancels the PC's work at once. Used instead of the voice's own engine while "Use my PC
// for the voice" is on (player.js pickEngine). The PC is contacted only when this is on: one light check when
// a book opens (the status bar says "Using cloud: …"), the real work from Play. No fallbacks: if the PC cannot
// be reached at Play, the reading stops with the reason and a "Use this device's voice" button appears.
// Marks: each chunk's place (queued on the PC, generating there, on the way) goes to the player
// (PLAYER.cloudMark), which highlight.js colours. CLOUDVOICE: the status for the bar and the Cloud tab.
(function () {
  const st = { ws: null, hello: null, opening: null, waiters: new Map(), states: new Map(), key: "", loading: "", error: "", check: "", checkAt: 0, checking: null, failed: false, bytes: 0, pieces: 0, x: 0, lastMs: 0, seq: 0, opts: null };
  const R = () => PCRELAY.client();
  const plain = (e) => String((e && e.message) || e || "").replace(/^Error: /, "");
  const err = (msg, extra) => Object.assign(new Error(msg), extra || {});
  const parseVoice = (v) => { const p = ENGINE.parse(String(v || "kokoro:af_heart")); return { engine: p.engine, voice: p.voice }; };
  function redraw() { if (globalThis.PLAYBAR) PLAYBAR.refresh(); }

  // ---- the light check (book open, the Cloud tab): one /relay/ping ------------------------------------------
  async function check(why) {
    if (st.checking) return st.checking;
    st.check = "checking…"; redraw();
    st.checking = R().ping(8000).then((r) => {
      const v = r.info && r.info.services ? r.info.services.find((s) => s.id === "voice") : null;
      st.check = r.ok ? (v ? `connected (${R().latency} ms; the PC voice is ${v.state === "running" ? "running" : v.unavailable ? v.unavailable.replace(/\.$/, "") : "ready to start"})` : "connected, but the PC has no voice service") : `the PC can't be reached: ${r.why}`;
      st.checkAt = Date.now();
      log("voice", `Use my PC: ${why || "check"}: ${st.check}`);
      redraw();
      return r;
    }).finally(() => { st.checking = null; });
    return st.checking;
  }

  // ---- the connection ----------------------------------------------------------------------------------------
  function onMessage(ev) {
    if (typeof ev.data !== "string") return audio(ev.data);
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type === "hello") { st.hello = m; return; }
    if (m.type === "loading") { st.loading = m.text; E.status = m.text; redraw(); return; }
    if (m.type === "loaded" || m.type === "prepared") { if (m.key === st.key && (m.type === "loaded" || m.ready)) { st.loading = ""; E.status = ""; const w = st.waiters.get("__prepare"); if (w) { st.waiters.delete("__prepare"); w.resolve(); } } if (m.error && m.key === st.key) failPrepare(m.error); redraw(); return; }
    if (m.type === "state") { mark(m.id, m.state, m); return; }
    if (m.type === "error") {
      if (!m.id) return;
      const w = st.waiters.get(m.id);
      if (w) { st.waiters.delete(m.id); mark(m.id, null); w.reject(err(`The PC voice: ${m.error}`, { fatal: !!m.fatal, cannot: !!m.cannot })); }
      else if (m.cannot && st.waiters.has("__prepare")) failPrepare(m.error);
    }
  }
  function failPrepare(msg) { const w = st.waiters.get("__prepare"); if (w) { st.waiters.delete("__prepare"); w.reject(err(`The PC voice could not load: ${msg}`, { cannot: true })); } }
  function audio(buf) {
    st.bytes += buf.byteLength;
    const n = new DataView(buf).getUint32(0, true);
    let h; try { h = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, n))); } catch (e) { return; }
    const w = st.waiters.get(h.id);
    if (!w) return;
    st.waiters.delete(h.id);
    const pcm = new Int16Array(buf.slice(4 + n));
    const out = new Float32Array(pcm.length);
    for (let i = 0; i < pcm.length; i++) out[i] = pcm[i] / 32768;
    st.pieces++; st.x = h.x || st.x; st.lastMs = h.ms;
    mark(h.id, null);
    const r = { audio: out, sampleRate: h.sampleRate || 24000, peak: h.peak };
    if (h.words) r.words = h.words;
    w.resolve(r);
  }
  function mark(partId, state) {
    if (state) st.states.set(partId, state); else st.states.delete(partId);
    if (globalThis.PLAYER && PLAYER.cloudMark) PLAYER.cloudMark(partId);
  }
  function dropAll(why, extra) {
    for (const [id, w] of st.waiters) { w.reject(err(why, extra)); if (id !== "__prepare") mark(id, null); }
    st.waiters.clear();
  }
  async function connect() {
    if (st.ws && st.ws.readyState === 1 && st.hello) return st.ws;
    if (st.opening) return st.opening;
    st.opening = (async () => {
      const r = await check("Play");
      if (!r.ok) { st.failed = true; throw err(`Use my PC: the PC can't be reached (${r.why}). Press "Use this device's voice", or try again.`, { cannot: true, cloud: true }); }
      const o = await R().open("voice", (p) => { if (p.state === "starting") { E.status = p.text || "starting the voice on the PC…"; redraw(); } });
      if (!o.ok) { st.failed = true; throw err(`Use my PC: ${o.signin ? "the PC wants its password (Settings → Cloud → Sign in)" : o.why}.`, { cannot: true, cloud: true }); }
      const ws = R().ws("voice", "ws");
      ws.binaryType = "arraybuffer";
      await new Promise((resolve, reject) => {
        const t = setTimeout(() => { reject(err("Use my PC: the PC voice did not answer within 15 s.", { cannot: true, cloud: true })); try { ws.close(); } catch (e) {} }, 15000);
        ws.onmessage = (ev) => { onMessage(ev); if (st.hello) { clearTimeout(t); resolve(); } };
        ws.onclose = (ev) => { clearTimeout(t); reject(err(`Use my PC: the PC voice closed the connection (${ev.reason || ev.code}).`, { cannot: true, cloud: true })); };
      });
      ws.onmessage = onMessage;
      ws.onclose = (ev) => {
        if (st.ws !== ws) return;
        st.ws = null; st.hello = null;
        log("voice", `Use my PC: the connection to the PC voice closed (${ev.reason || "code " + ev.code})`);
        dropAll(`the connection to the PC voice dropped (${ev.reason || "code " + ev.code})`);
        redraw();
      };
      st.ws = ws; st.failed = false;
      log("voice", `Use my PC: connected to the PC voice (${R().base})`);
      return ws;
    })().finally(() => { st.opening = null; });
    return st.opening;
  }

  const E = {
    id: "cloud", name: "PC voice", hidden: true,
    voices: [{ id: "cloud", name: "PC voice" }],
    can: { timing: true, reroll: false, copies: true },
    copies: 2,                                   // two pieces asked at once: the next is queued on the PC while one travels
    sampleRate: 24000, maxChars: 300, status: "",
    async init(opts) {
      const v = parseVoice(opts.voice);
      if (v.engine !== "kokoro" && v.engine !== "piper") throw err(`Use my PC: the PC runs Kokoro and Piper voices; ${(ENGINE.get(v.engine) || { name: v.engine }).name} runs on this device. Choose a Kokoro or Piper voice in Settings → Voice, or press "Use this device's voice".`, { cannot: true, cloud: true });
      const piper = v.engine === "piper";
      st.opts = { engine: v.engine, voice: v.voice, runOn: piper || opts.runOn === "cpu" ? "cpu" : "gpu", precision: opts.precision || "fp32", pace: opts.pace, speaker: opts.speaker };
      E.sampleRate = piper ? (/-x?_?low$/.test(v.voice) ? 16000 : 22050) : 24000;
      E.maxChars = piper ? 400 : 300;
      const key = piper ? `piper cpu ${v.voice}` : `kokoro ${st.opts.runOn} ${st.opts.precision}`;
      const ws = await connect();
      if (st.key === key && st.hello && (st.hello.models || []).includes(key) && !st.loading) return;
      st.key = key;
      E.status = piper ? `loading Piper ${v.voice} on the PC's processor…` : st.opts.runOn === "gpu" ? "loading Kokoro on the PC's graphics card…" : "loading Kokoro on the PC's processor…";
      redraw();
      await new Promise((resolve, reject) => {
        st.waiters.set("__prepare", { resolve, reject });
        ws.send(JSON.stringify({ type: "prepare", engine: v.engine, voice: v.voice, runOn: st.opts.runOn, precision: st.opts.precision }));
        setTimeout(() => { if (st.waiters.get("__prepare")) { st.waiters.delete("__prepare"); reject(err("Use my PC: the PC voice did not load within 90 s.", { cannot: true, cloud: true })); } }, 90000);
      });
      if (st.hello) st.hello.models = Array.from(new Set([...(st.hello.models || []), key]));
      E.status = "";
    },
    async synth(piece, opts) {
      const ws = await connect();
      const o = st.opts || {};
      const id = piece.id || `p${++st.seq}`;
      const ahead = globalThis.STREAM && STREAM.ahead ? Number(STREAM.ahead()) || 0 : null;
      return new Promise((resolve, reject) => {
        st.waiters.set(id, { resolve, reject });
        mark(id, "queued");
        ws.send(JSON.stringify({ type: "synth", id, text: piece.speech, engine: o.engine || "kokoro", voice: o.voice, runOn: o.runOn, precision: o.precision, pace: (opts && opts.pace) || o.pace, speaker: o.speaker, speed: SETTINGS.get("speed"), ahead_s: ahead }));
      });
    },
    stop() {
      if (st.ws && st.ws.readyState === 1) { try { st.ws.send(JSON.stringify({ type: "cancel" })); } catch (e) {} }
      const prep = st.waiters.get("__prepare");
      for (const [id, w] of st.waiters) if (id !== "__prepare") { w.reject(err("stopped", { stopped: true })); mark(id, null); }
      st.waiters.clear();
      if (prep) st.waiters.set("__prepare", prep);
      st.states.clear();
    },
    describe() { return { runOn: [], precisions: [], pace: true, steps: false, copies: false, speaker: 0 }; },
  };
  ENGINE.register(E);

  globalThis.CLOUDVOICE = {
    check,
    stateOf: (partId) => st.states.get(partId) || null,
    // The play bar's voice part while the PC voice reads: "Kokoro fp32 on your PC (card)".
    short() { const o = st.opts || {}; return `${o.engine === "piper" ? "Piper " + o.voice : "Kokoro " + (o.precision || "fp32")} on your PC (${o.runOn === "cpu" ? "processor" : "card"})${st.loading ? " · " + st.loading : ""}`; },
    // The stopped line: "Using cloud: connected (45 ms; ...)" while Use my PC is on.
    using() { return SETTINGS.get("useMyPC") ? (st.check ? `Using cloud: ${st.check}` : "Using cloud (checked when a book opens)") : ""; },
    get failed() { return st.failed && !!SETTINGS.get("useMyPC"); },
    get info() { return { connected: !!(st.ws && st.ws.readyState === 1), check: st.check, checkAt: st.checkAt, bytes: st.bytes, pieces: st.pieces, x: st.x, lastMs: st.lastMs, loading: st.loading, key: st.key, queued: st.waiters.size }; },
    close() { if (st.ws) { try { st.ws.close(); } catch (e) {} st.ws = null; st.hello = null; } },
  };

  // The light check when a book opens, only while Use my PC is on.
  if (globalThis.READER && READER.onChange) READER.onChange((what) => { if (what === "book" && SETTINGS.get("useMyPC")) check("book open"); });
  // ... and the book the page opens with (it opens before any change is announced).
  const startCheck = () => { if (!(globalThis.APP && APP.ready)) { setTimeout(startCheck, 200); return; } if (SETTINGS.get("useMyPC") && READER.state === "book" && !st.checkAt && !st.checking) check("book open"); };
  setTimeout(startCheck, 200);
})();
</script>
<script>
// mp3.js: pieces to MP3 for the stream, in a worker so the page stays fluid. The encoder (lamejs, an
// exact pinned version) is a library like the voices' (models.js): got on the first Play, never
// before, through MODELS.ensure (the store, else the web, else Voice_data.zip when offline: a file
// neither can give fails `cannot` with its name, and the player stops with it), then imported from the
// store by a classic blob worker (importLib: dynamic import() of a blob, since a module worker made
// from a blob fails silently on file:// pages). MP3.FILE is its { url, size } for Voice_data.zip.
// MP3.load() starts the worker and resolves when the library is in; MP3.encode(audio, sampleRate) gives
// a Uint8Array of MP3 frames (mono, 64 kbps; the samples are soft-limited above 0.8 so a rare peak
// cannot clip); MP3.stop() ends the worker (the next load starts a fresh one).
(function () {
  const LIB = "https://cdn.jsdelivr.net/npm/@breezystack/lamejs@1.2.7/+esm";
  const FILE = { url: LIB, size: 169304 };
  const KBPS = 64;
  const WORKER = () => `${globalThis.MODELS ? MODELS.WORKER : "const importLib = (u) => import(u);"}
    let lame = null, loading = null;
    const load = () => loading || (loading = importLib(${JSON.stringify(LIB)}).then((m) => { lame = m.default || m; }));
    onmessage = async (e) => {
      const { id, audio, rate, kbps } = e.data;
      try {
        await load();
        if (id === "load") { postMessage({ id, ok: true }); return; }
        const pcm = new Int16Array(audio.length);
        for (let i = 0; i < audio.length; i++) {
          let s = audio[i] || 0;
          const m = s < 0 ? -s : s;
          if (m > 0.8) s = (s < 0 ? -1 : 1) * (0.8 + 0.2 * Math.tanh((m - 0.8) / 0.2));
          pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
        }
        const enc = new lame.Mp3Encoder(1, rate, kbps);
        const parts = [];
        let total = 0;
        for (let o = 0; o < pcm.length; o += 1152) {
          const b = enc.encodeBuffer(pcm.subarray(o, Math.min(pcm.length, o + 1152)));
          if (b.length) { parts.push(b); total += b.length; }
        }
        const tail = enc.flush();
        if (tail.length) { parts.push(tail); total += tail.length; }
        const out = new Uint8Array(total);
        let off = 0;
        for (const p of parts) { out.set(p, off); off += p.length; }
        postMessage({ id, mp3: out }, [out.buffer]);
      } catch (err) { postMessage({ id, error: String((err && err.message) || err) }); }
    };`;

  let worker = null, loaded = null, ready = false, next = 0;
  const waiting = new Map();      // id -> { res, rej }

  function start() {
    if (worker) return;
    const url = URL.createObjectURL(new Blob([WORKER()], { type: "text/javascript" }));
    worker = new Worker(url, { name: "mp3" });
    URL.revokeObjectURL(url);
    if (globalThis.MODELS && MODELS.track) MODELS.track(worker);
    worker.onmessage = (e) => {
      const w = waiting.get(e.data.id);
      if (!w) return;
      waiting.delete(e.data.id);
      if (e.data.error) w.rej(new Error("MP3 encoding failed: " + e.data.error)); else w.res(e.data.mp3 || e.data.ok);
    };
    worker.onerror = (e) => { const err = new Error("the MP3 worker failed: " + (e.message || "unknown error")); for (const w of waiting.values()) w.rej(err); waiting.clear(); stop(); };
  }

  function ask(id, msg, transfer) {
    return new Promise((res, rej) => { waiting.set(id, { res, rej }); worker.postMessage(msg, transfer || []); });
  }

  // Resolves once the library is in (the fetch is logged with its time); rejects when it cannot be
  // got (offline without it, or the address gone: `cannot` when the store rule says why), and a later
  // load tries again.
  function load() {
    if (loaded) return loaded;
    const t0 = performance.now();
    if (globalThis.MODELS) MODELS.need("MP3 encoder", [FILE]);
    loaded = (globalThis.MODELS ? MODELS.ensure([FILE]) : Promise.resolve())
      .then(() => { start(); return ask("load", { id: "load" }); })
      .then(() => { ready = true; log("worker", `MP3 encoder ready in ${((performance.now() - t0) / 1000).toFixed(1)} s (${LIB})`); },
        (e) => { loaded = null; stop(); throw Object.assign(new Error(e.cannot ? `The MP3 encoder (for background playback): ${e.message}` : `The MP3 encoder could not be loaded from ${LIB}: ${e.message}`), { cannot: !!e.cannot }); });
    return loaded;
  }

  function encode(audio, sampleRate) {
    if (!worker) start();
    const copy = audio.slice();          // the caller keeps its samples; the worker gets its own
    return ask(++next, { id: next, audio: copy, rate: sampleRate, kbps: KBPS }, [copy.buffer]);
  }

  function stop() {
    if (worker) { worker.terminate(); worker = null; }
    loaded = null; ready = false;
    const err = new Error("the MP3 encoder was stopped");
    for (const w of waiting.values()) w.rej(err);
    waiting.clear();
  }

  globalThis.MP3 = { LIB, FILE, KBPS, load, encode, stop, get ready() { return ready; } };
})();
</script>
<script>
// voicedata.js: what a Save needs from the store, the stored list by owner, and reading an old
// Voice_data.zip (SETTINGS.md "Voice data"; the offline package, package.js, imports them through this).
//
// THE FORMAT (tools/VOICE_DATA.md has it in full): a zip, its entries stored (deflated entries are read
// too; zip64 for one over 4 GB), with manifest.json at its root:
//   { "format": "br1-voice-data", "version": 1, "made": "2026-10-17 9:00 PM",
//     "files": [ { "url": "https://huggingface.co/.../onnx/model.onnx",   (the web address: the store's key)
//                  "path": "kokoro/model.onnx",                           (its entry in the zip, a short path)
//                  "size": 325532171, "sha256": "64 hex digits", "owner": "Kokoro fp32 model" (optional) } ] }
// Reading it: the zip's index at its end, then manifest.json, then ONE entry at a time, never the whole
// zip: each file is read into one buffer of its own size, its size and SHA-256 (crypto.subtle.digest)
// checked against the manifest; the buffer is then let go and the file put in br1-models under its web
// address exactly as a download is (MODELS.put), so a later load cannot tell it from one. What is put
// is the zip's own slice of the entry (a stored entry: read from disk as it is stored) or, for a
// deflated entry, the entry decompressed again as a stream: never the buffer (BUGS 37: Chrome's
// Cache.put refused Parakeet's 643 MB file as one body in memory). The peak is about the biggest file
// (the buffer and the digest's copy while it is checked), freed before it is stored.
//
// open(file) reads a Voice_data.zip's index and manifest (package.js reads old zips through it);
// lacking(zip, files) names the files a zip cannot give; take(zip, files, progress) takes them, each
// checked (package.js imports every file through it, with its own one-file zip record); everything(zip)
// lists what a zip holds that is not stored. needed(values) is the files a set of settings needs (the
// voice's files(), its libraries included, plus the MP3 encoder that every model voice's stream uses,
// plus the listener's files when it is on: step 8a); plan(before, after) is what a Save would need: the
// files, the missing ones, the old voice's files Slim mode deletes, the fit check (storage with what Slim
// frees, and memory: MODELS.fitMemory of the voice's peak, times its copies on the processor) and whether
// it is offline. ownerOf(url) names what a stored file belongs to (the engines' catalog(), the shared
// runtime's one owner, the retired files' "no longer used" owner (MODELS.RUNTIME / RETIRED, EFF-15), else
// what loaded it this visit, else "other files"); stored() is the store's list with owners;
// removeOwner(owner) is Delete per voice (Jon's button only). mySettings() (the changed settings, never
// the per-device broken precisions), validSettings() / droppedSettings(), DEVICE_TUNED, contentsOf() and
// describe() serve the offline package's settings.json and manifest. 2026-10-23: Export voice data, the
// picker, and the zip as a source of MODELS.get went; the offline package (package.js) replaced them.
// busy / setBusy / stop(): an import under way (package.js sets it, so storeBusy() and Stop see it).
(function () {
  const g = globalThis;
  const FORMAT = "br1-voice-data";
  const MB = (n) => MODELS.MB(n);
  let current = null;                 // { file, name, byUrl: Map(url -> { url, path, size, sha256, owner, entry }), count }
  let busy = null;                    // { what, stop } while files are being taken
  let index = null;                   // url -> owner, from the engines' catalogs
  const fail = (msg, extra) => Object.assign(new Error(msg), { cannot: true }, extra || {});

  // ---- Owners and what the settings need ----------------------------------------------------------
  function catalog() {
    if (index) return index;
    index = new Map();
    for (const e of ENGINE.list()) if (typeof e.catalog === "function") for (const o of e.catalog()) for (const f of o.files) index.set(MODELS.href(f.url), o.owner);
    if (g.MP3 && MP3.FILE) index.set(MODELS.href(MP3.FILE.url), "MP3 encoder");
    if (g.LISTENER) for (const o of LISTENER.catalog()) for (const f of o.files) if (!index.has(MODELS.href(f.url))) index.set(MODELS.href(f.url), o.owner);
    // The shared runtime (Kokoro newer, Supertonic, the listeners: EFF-15) has ONE owner whatever an
    // engine's catalog says, so Delete of one of them never takes what the others use; the files the
    // reader no longer loads (stored by an older build) get their "no longer used" owner, for a Delete.
    for (const o of [{ owner: MODELS.RUNTIME.owner, files: MODELS.RUNTIME.files }].concat(MODELS.RETIRED)) for (const f of o.files) index.set(MODELS.href(f.url), o.owner);
    return index;
  }
  const ownerOf = (url) => catalog().get(MODELS.href(url)) || MODELS.owners().get(MODELS.href(url))
    || (current && current.byUrl.has(MODELS.href(url)) && current.byUrl.get(MODELS.href(url)).owner) || "other files";
  const engineOf = (v) => { const p = ENGINE.parse(v.voice); return { E: ENGINE.get(p.engine), voice: p.voice }; };
  const isModel = (E) => !!(E && typeof E.files === "function");

  function needed(v) {
    const { E, voice } = engineOf(v);
    if (!isModel(E)) return [];
    const out = new Map();
    for (const f of E.files({ voice, runOn: v.runOn, precision: v.precision, engine: v.kokoroEngine })) out.set(MODELS.href(f.url), { url: MODELS.href(f.url), size: Number(f.size) || 0, owner: ownerOf(f.url) });
    if (g.MP3 && MP3.FILE) out.set(MODELS.href(MP3.FILE.url), { url: MODELS.href(MP3.FILE.url), size: MP3.FILE.size, owner: "MP3 encoder" });
    if (listens(v)) for (const f of LISTENER.files(LISTENER.choice(v).id)) if (!out.has(MODELS.href(f.url))) out.set(MODELS.href(f.url), { url: MODELS.href(f.url), size: Number(f.size) || 0, owner: ownerOf(f.url) });
    return Array.from(out.values());
  }
  // The listener is on and can hear this voice (step 8a): its files join the voice's.
  const listens = (v) => !!(g.LISTENER && LISTENER.enabled(v) && !LISTENER.cannot(v));
  // "Kokoro Heart (US female), fp32, on the card" for the fit check's line.
  function label(v) {
    const { E, voice } = engineOf(v);
    if (!E) return v.voice;
    const vo = (E.voices || []).find((x) => x.id === voice);
    const name = vo ? vo.name.replace(/, grade .*$/, "") : voice;
    const cpu = E.id === "piper" || v.runOn === "cpu";
    return `${E.name} ${name}${E.id === "kokoro" ? `, ${v.precision}${v.kokoroEngine === "newer" ? ", newer engine" : ""}` : ""}${isModel(E) ? (cpu ? ", on the processor" : ", on the graphics card") : ""}${isModel(E) && listens(v) ? ` + ${LISTENER.choice(v).name} listener` : ""}`;
  }
  // The voice's peak working memory (per copy, times the copies on the processor) against the ceiling.
  function memory(v) {
    const { E } = engineOf(v);
    if (!isModel(E)) return null;
    const runOn = E.id === "piper" || v.runOn === "cpu" ? "cpu" : "gpu";
    const each = MODELS.peak(E.id, runOn, v.precision);
    const copies = runOn === "cpu" && E.can && E.can.copies && g.VOICEWORK ? VOICEWORK.copies(v.copies) : 1;
    const ear = listens(v) ? LISTENER.choice(v).peak || 0 : 0;   // the listener's worker beside the voice's (estimated)
    const m = MODELS.fitMemory(each * copies + ear);
    if ((copies > 1 || ear) && m.text) m.text = `${copies > 1 ? `${copies} copies of ${each} MB` : `the voice ${each} MB`}${ear ? ` + the listener about ${ear} MB` : ""}: ${m.text}`;
    return Object.assign(m, { each, copies, ear });
  }
  const offline = (v) => !!v.offline || navigator.onLine === false;
  const offlineWhy = (v) => (v.offline ? "Offline mode is on" : "there is no internet");

  // What saving `after` over `before` needs. Model switched = a file of the old voice is not in the new
  // one's list; then, with Slim mode on (after the Save), the old voice's stored files that the new one
  // does not use go first.
  async function plan(before, after) {
    const have = new Map((await MODELS.stored()).map((f) => [f.url, f.size]));
    const files = needed(after), keep = new Set(files.map((f) => f.url));
    const missing = files.filter((f) => !have.has(f.url));
    const old = needed(before);
    const switched = old.some((f) => !keep.has(f.url)) || engineOf(before).E !== engineOf(after).E;
    const drop = after.slim && switched ? old.filter((f) => !keep.has(f.url) && have.has(f.url)).map((f) => Object.assign({}, f, { size: have.get(f.url) })) : [];
    const dropBytes = drop.reduce((n, f) => n + f.size, 0);
    const fit = await MODELS.fit(missing, { freed: dropBytes });
    const mem = memory(after);
    return { files, missing, missingBytes: missing.reduce((n, f) => n + f.size, 0), stored: files.length - missing.length,
      drop, dropBytes, switched, fit, mem, ok: fit.ok && (!mem || mem.ok), offline: offline(after), why: offlineWhy(after), label: label(after), model: isModel(engineOf(after).E) };
  }

  // ---- The zip ------------------------------------------------------------------------------------
  async function open(file) {
    const name = file && file.name ? file.name : "the zip";
    let list;
    try { list = await ZIP.entries(file); } catch (e) { throw fail(`"${name}" could not be read as a zip: ${e.message}`); }
    const byName = new Map(list.map((e) => [e.name, e]));
    const m = byName.get("manifest.json");
    if (!m) throw fail(`"${name}" is not a Voice_data.zip: it has no manifest.json at its root.`);
    let man;
    try { man = JSON.parse(await ZIP.read(file, m)); } catch (e) { throw fail(`"${name}": its manifest.json could not be read (${e.message}).`); }
    if (!man || man.format !== FORMAT || !Array.isArray(man.files)) throw fail(`"${name}": its manifest.json is not a Voice_data.zip manifest (it needs "format": "${FORMAT}" and a "files" list).`);
    const byUrl = new Map();
    for (const f of man.files) {
      if (!f || !f.url || !f.path || !(Number(f.size) >= 0) || !/^[0-9a-f]{64}$/i.test(String(f.sha256 || ""))) throw fail(`"${name}": its manifest.json has a bad line (${JSON.stringify(f).slice(0, 120)}): each file needs url, path, size and sha256.`);
      const url = MODELS.href(f.url);
      byUrl.set(url, { url, path: f.path, size: Number(f.size), sha256: String(f.sha256).toLowerCase(), owner: f.owner || "", entry: byName.get(f.path) || null });
    }
    // settings.json (Export's "Include my settings"): the exporter's changed settings, brought in only
    // when the person ticks it (datatab.js puts them in as pending changes).
    let settings = null;
    if (byName.has("settings.json")) {
      try { const j = JSON.parse(await ZIP.read(file, byName.get("settings.json"))); settings = j && j.values && typeof j.values === "object" ? j.values : null; }
      catch (e) { log("error", `${name}: its settings.json could not be read (${e.message}); its files can still be taken`); }
    }
    current = { file, name, byUrl, count: byUrl.size, made: man.made || "", contents: man.contents || null, settings };
    log("storage", `${name}: ${byUrl.size} files in its manifest (${MB(Array.from(byUrl.values()).reduce((n, f) => n + f.size, 0))})${man.made ? `, made ${man.made}` : ""}`);
    return current;
  }
  // The files the zip cannot give, each with the reason (named exactly).
  function lacking(zip, files) {
    const out = [];
    for (const f of files) {
      const rec = zip.byUrl.get(MODELS.href(f.url)), name = MODELS.nameOf(f.url), owner = f.owner || ownerOf(f.url);
      if (!rec) out.push({ file: f, why: `${zip.name} has no ${name}${owner ? ` (${owner})` : ""}: its manifest does not list ${f.url}` });
      else if (!rec.entry) out.push({ file: f, why: `${zip.name} lists ${name} as "${rec.path}", but holds no such entry` });
    }
    return out;
  }
  const everything = async (zip) => { const out = []; for (const r of zip.byUrl.values()) if (!(await MODELS.has(r.url))) out.push({ url: r.url, size: r.size, owner: r.owner || ownerOf(r.url) }); return out; };
  const hex = (buf) => Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("");

  // Take files from the zip, one entry at a time, each checked before it is stored. progress(name,
  // loaded, total, k, n). Throws on the first file it cannot take, naming it (`cannot`); the files
  // before it stay stored (each was checked). Gives { files, bytes }.
  async function take(zip, files, progress) {
    if (!(g.crypto && crypto.subtle)) throw fail("This browser cannot verify files here (no crypto.subtle), so nothing was copied from the zip.");
    const bad = lacking(zip, files);
    if (bad.length) throw fail(bad[0].why + ".", { missing: bad.map((b) => b.file.url) });
    const mine = !busy;
    if (mine) busy = { what: "taking", stop: false };
    let bytes = 0;
    try {
      for (let k = 0; k < files.length; k++) {
        const rec = zip.byUrl.get(MODELS.href(files[k].url)), name = MODELS.nameOf(rec.url);
        const damaged = (why) => fail(`${name} in ${zip.name} is damaged (${why}); nothing of it was stored.`);
        if (rec.entry.size !== rec.size) throw damaged(`the zip holds ${rec.entry.size} bytes, the manifest says ${rec.size}`);
        const t0 = performance.now();
        let body = new Uint8Array(rec.size);
        const reader = (await ZIP.stream(zip.file, rec.entry)).getReader();
        let at = 0, last = 0;
        for (;;) {
          if (busy && busy.stop) { reader.cancel().catch(() => {}); throw Object.assign(new Error("stopped"), { stopped: true }); }
          const { done, value } = await reader.read();
          if (done) break;
          if (at + value.length > rec.size) { reader.cancel().catch(() => {}); throw damaged("it is longer than the manifest says"); }
          body.set(value, at);
          at += value.length;
          const now = performance.now();
          if (progress && now - last > 120) { last = now; progress(name, at, rec.size, k, files.length); }
        }
        if (at !== rec.size) throw damaged(`${at} bytes where the manifest says ${rec.size}`);
        if (hex(await crypto.subtle.digest("SHA-256", body)) !== rec.sha256) throw damaged("its SHA-256 does not match the manifest");
        body = null;                    // checked: let it go; the store gets the zip's own bytes (BUGS 37)
        const entry = rec.entry;
        try {
          await MODELS.put(rec.url, entry.method === 0 ? await ZIP.raw(zip.file, entry) : () => ZIP.stream(zip.file, entry), rec.size);
        } catch (e) {
          if (e && e.storeFailed) throw fail(`${name} (${MB(rec.size)}) from ${zip.name} could not be stored: ${e.reason}.`, { storeFailed: true });
          throw e;
        }
        bytes += rec.size;
        if (progress) progress(name, rec.size, rec.size, k, files.length);
        const listed = Number(files[k].size) || 0;
        log("storage", `took ${name} (${MB(rec.size)}) from ${zip.name}, size and SHA-256 checked, in ${((performance.now() - t0) / 1000).toFixed(1)} s${listed && listed !== rec.size ? ` (the reader's list says ${listed} bytes: the zip may hold another version of it)` : ""}`);
      }
    } finally { if (mine) busy = null; }
    return { files: files.length, bytes };
  }
  // ---- The stored list and Delete per voice ----------------------------------------------------------
  const stored = async () => (await MODELS.stored()).map((f) => Object.assign(f, { owner: ownerOf(f.url) }));
  async function removeOwner(owner) {
    const urls = (await stored()).filter((f) => f.owner === owner).map((f) => f.url);
    return MODELS.remove(urls, `(Delete ${owner}, Settings → Voice data)`);
  }
  const persisted = () => (navigator.storage && navigator.storage.persisted ? navigator.storage.persisted().catch(() => null) : Promise.resolve(null));

  // ---- Export voice data: the stored files as a Voice_data.zip in the format above ------------------
  // urls: the stored files to put in. write(part): the sink (zipwrite.js): a file being written through
  // the save picker, or Blob parts. One file in memory at a time (read once for its SHA-256 and
  // checksum; the zip gets the store's own Blob, which stays on disk); manifest.json goes in last,
  // when every hash is known (the reader goes by the directory, so the order does not matter).
  // progress(name, loaded, total, k, n). Gives { files, bytes, skipped }.
  // The settings worth carrying to another device: the changed ones, never the per-device memory of
  // broken precisions (or the window's own place).
  function mySettings() {
    const out = {};
    for (const k of Object.keys(SETTINGS.DEFAULTS)) if (k !== "brokenPrecisions" && !SETTINGS.isDefault(k)) out[k] = SETTINGS.get(k);
    return out;
  }
  // A zip's settings that this reader knows, of the right kind (null and the list kinds checked too).
  function validSettings(values) {
    const out = {};
    for (const [k, v] of Object.entries(values || {})) if (k !== "brokenPrecisions" && SETTINGS.valid(k, v)) out[k] = v;   // null only where the default is null (D7)
    return out;
  }
  // The names a zip's settings.json holds that this reader cannot take (unknown here, or of the wrong
  // kind), to be named on import (D21); brokenPrecisions is never carried, so never named.
  const droppedSettings = (values) => Object.keys(values || {}).filter((k) => k !== "brokenPrecisions" && !SETTINGS.valid(k, values[k]));
  // Settings tuned to the device they were chosen on (D21): marked in settings.json, and brought in
  // only when asked for separately.
  const DEVICE_TUNED = ["runOn", "precision", "copies", "steps", "wordTiming", "uiSize", "textSize"];
  // "Windows, Chrome 141, 16 threads, 8 GB" for the manifest's contents.
  function deviceName() {
    const ua = navigator.userAgent || "";
    const os = /Android ([\d.]+)/.test(ua) ? `Android ${RegExp.$1}` : /Windows/.test(ua) ? "Windows" : /CrOS/.test(ua) ? "ChromeOS" : /Mac OS X/.test(ua) ? "macOS" : /Linux/.test(ua) ? "Linux" : "a device";
    const b = /Edg\/(\d+)/.exec(ua) ? ["Edge", RegExp.$1] : /Chrome\/(\d+)/.exec(ua) ? ["Chrome", RegExp.$1] : /Firefox\/(\d+)/.exec(ua) ? ["Firefox", RegExp.$1] : ["a browser", ""];
    return `${os}, ${b[0]}${b[1] ? " " + b[1] : ""}${navigator.hardwareConcurrency ? `, ${navigator.hardwareConcurrency} threads` : ""}${navigator.deviceMemory ? `, ${navigator.deviceMemory} GB` : ""}`;
  }
  // What a zip holds, in words, for the manifest (and shown before anything is taken).
  function contentsOf(files, hasSettings, about) {
    const owners = new Map(), voices = [], precisions = [];
    for (const f of files) {
      const o = owners.get(f.owner) || { owner: f.owner, files: 0, bytes: 0 };
      o.files++; o.bytes += f.size; owners.set(f.owner, o);
      let m;
      if ((m = /Kokoro-82M[^/]*\/resolve\/main\/voices\/([a-z0-9_]+)\.bin$/.exec(f.url))) voices.push(`Kokoro ${m[1]}`);
      else if ((m = /\/(en_[A-Z]{2}-[^/]+)\.onnx$/.exec(f.url))) voices.push(`Piper ${m[1]}`);
      else if ((m = /Supertonic[^/]*\/resolve\/main\/voices\/(\w+)\.bin$/.exec(f.url))) voices.push(`Supertonic ${m[1]}`);
      if ((m = /^Kokoro (\S+) model$/.exec(f.owner))) precisions.push(m[1]);
    }
    return Object.assign({ files: files.length, bytes: files.reduce((n, f) => n + f.size, 0), voices, precisions: Array.from(new Set(precisions)),
      owners: Array.from(owners.values()), settings: !!hasSettings, made: g.LOG ? LOG.when(new Date()) : new Date().toISOString(), device: deviceName(), by: g.APP_VERSION || "" }, about || {});
  }
  // One line about a zip's contents (Import everything shows it before taking anything).
  function describe(zip) {
    const c = zip.contents, all = Array.from(zip.byUrl.values());
    const bytes = c && c.bytes ? c.bytes : all.reduce((n, f) => n + f.size, 0);
    const parts = [`${zip.name}: ${all.length} file${all.length === 1 ? "" : "s"}, ${MB(bytes)}`];
    if (c && c.for) parts.push(`what these settings needed: ${c.for}`);
    if (c && c.voices && c.voices.length) parts.push(`voices: ${c.voices.join(", ")}`);
    if (c && c.precisions && c.precisions.length) parts.push(`Kokoro precisions: ${c.precisions.join(", ")}`);
    parts.push(`settings: ${zip.settings ? "yes" : "no"}`);
    if (c && (c.device || c.made)) parts.push(`made${c.device ? ` on ${c.device}` : ""}${c.made ? ` at ${c.made}` : ""}${c.by ? ` (${c.by})` : ""}`);
    return parts.join(" · ");
  }
  g.VOICEDATA = {
    FORMAT, open, lacking, take, everything, needed, plan, memory, label, ownerOf, stored, removeOwner, persisted,
    mySettings, validSettings, droppedSettings, DEVICE_TUNED, contentsOf, describe, deviceName,
    download: (files, progress, signal) => MODELS.ensure(files, progress, signal),
    get current() { return current; },
    forget: () => { current = null; },
    get busy() { return busy; },
    setBusy: (b) => { busy = b; },
    stop: () => { if (busy) busy.stop = true; },
    // Why the store must not be cleared now (D20): an import, a package being made or a download in flight would
    // land in it afterwards. "" when nothing is under way.
    storeBusy: () => {
      if (busy) return "files are being imported from an offline package";
      if (g.PACKAGE && PACKAGE.busy) return "an offline package is being made";
      const d = MODELS.downloading();
      return d.length ? `${d.length} file${d.length === 1 ? " is" : "s are"} downloading (${d.slice(0, 2).map((u) => MODELS.nameOf(u)).join(", ")}${d.length > 2 ? ", …" : ""})` : "";
    },
  };
})();
</script>
<script>
// package.js: the offline package (Settings → Offline package; packtab.js is its page). One way to carry
// everything the reader can download to a device without internet, and back: it replaced Export voice
// data, Import everything and "Apply and upload data" (2026-10-23; BUILD.md "Offline package").
//
// WHAT CAN GO IN (tree()): every file of every voice engine (each engine's catalog(): voices, precisions,
// model files, its own libraries), the listeners, the runtimes and libraries (the shared Transformers.js
// runtime, the MP3 encoder) and the online library's books (the shelf's index, when it can be read). A
// file is a leaf keyed by its web address (a book: "book:<id>"); a file in two groups is one key, so it
// is ticked, counted and packed once.
//
// MAKING IT (build()): every file not stored here is first downloaded into a temporary cache of its own
// (br1-package, deleted at the end, whatever happens), so every zip body is a Blob the browser keeps on
// disk: research/offline-package/LIMITS.md measured that Blobs built from downloaded bytes held in memory
// fail to read back past about 400 MB in all, while stored Blobs put together reach 5 GB and more. Each
// file is read once (one file in memory at a time) for its SHA-256 and the zip checksum. Where the
// browser has showSaveFilePicker (Chrome on a computer) the package is ONE file streamed straight to disk
// (zip64 past 4 GB / 65,535 entries); elsewhere it is split into numbered parts ("Reader offline package
// part 2 of 5.zip") of at most PART_BYTES (1 GB; a file bigger than that gets a part of its own). One
// part is offered as a download at once; several are HELD (build() gives them back) and the page offers
// each on its own tap: a browser with its normal UI holds back a page's second download that no tap
// started ("download multiple files"), which would lose parts silently (LIMITS.md). The temporary cache
// stays until release() (the parts' bodies live there). Stop (stop()) ends it between pieces; nothing
// half-made is offered.
//
// THE FORMAT: a zip of stored entries; each part holds manifest.json:
//   { format: "br1-offline-package", version: 1, id, part, parts, made, by, contents,
//     files: [{ key, kind: "file" | "book", url, path, size, sha256, owner, book? }],   (this part's files)
//     all:   [{ key, name, part, size }] }                                             (every part's files)
// and part 1 holds settings.json when "Include my settings" was ticked (the Voice_data.zip settings
// format: { format: "br1-settings", values, deviceTuned }). A Voice_data.zip (format br1-voice-data,
// voicedata.js) still imports: it is read as a package of one part.
//
// IMPORT (open(files) then take(pkg)): the parts in any order, several packages at once; each file's
// size and SHA-256 are checked and the file stored straight from the zip's own slice (voicedata.js
// take(): the BUGS 37 path); a book goes to the library as the shelf's own download would. What came
// in, what was already here, which parts were not given (with what they hold) and every failure are
// said plainly; nothing is skipped silently.
(function () {
  const g = globalThis;
  const FORMAT = "br1-offline-package";
  const TMP = (g.APP_KEY || "br1") + "-package";
  const PART_BYTES = 1e9;
  const MB = (n) => MODELS.MB(n);
  const fail = (msg, extra) => Object.assign(new Error(msg), { cannot: true }, extra || {});
  const stopped = () => Object.assign(new Error("stopped"), { stopped: true });
  let busy = null;                      // { what, stop } while a package is made or imported
  const hex = (buf) => Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("");
  const plural = (n, w) => `${n.toLocaleString("en-US")} ${w}${n === 1 ? "" : "s"}`;

  // ---- The tree ---------------------------------------------------------------------------------------
  // A node: { id, label, kids } (a group) or { id, label, key, url, size, kind, owner, book? } (a leaf).
  function leaf(parent, f, owner, label) {
    const url = MODELS.href(f.url);
    return { id: parent + "|" + url, key: url, url, size: Number(f.size) || 0, kind: "file", owner, label: label || MODELS.nameOf(url) };
  }
  const group = (id, label, kids) => ({ id, label, kids: kids.filter((k) => !k.kids || k.kids.length) });
  // The files part: synchronous, from the catalogs.
  function fileTree() {
    const RUN = MODELS.RUNTIME.owner;
    const out = [];
    for (const E of ENGINE.list()) {
      if (typeof E.catalog !== "function") continue;
      const id = "e:" + E.id;
      const kids = E.catalog().filter((o) => o.owner !== RUN).map((o) => group(id + "/" + o.owner, o.owner.replace(/^Piper en_/, "Piper en_"), o.files.map((f) => leaf(id + "/" + o.owner, f, o.owner))));
      out.push(group(id, E.name, kids));
    }
    if (g.LISTENER) {
      const kids = LISTENER.catalog().filter((o) => o.owner !== RUN).map((o) => group("l/" + o.owner, o.owner, o.files.map((f) => leaf("l/" + o.owner, f, o.owner))));
      out.push(group("l", "Listeners", kids));
    }
    const libs = [group("r/" + RUN, RUN, MODELS.RUNTIME.files.map((f) => leaf("r/" + RUN, f, RUN)))];
    if (g.MP3 && MP3.FILE) libs.push(leaf("r", MP3.FILE, "MP3 encoder", "MP3 encoder (" + MODELS.nameOf(MP3.FILE.url) + ")"));
    out.push(group("r", "Runtimes and libraries", libs));
    return out;
  }
  // The books part: the shelf's index when it can be read, else a group that says why (never hidden).
  async function bookTree() {
    if (!g.SHELF) return null;
    try {
      const l = await SHELF.list();
      return Object.assign(group("b", "Online library", l.books.map((b) => ({ id: "b|" + b.entry.id, key: "book:" + b.entry.id, url: b.entry.url, size: b.entry.size, kind: "book", owner: "Online library",
        label: b.entry.title, book: { id: b.entry.id, title: b.entry.title, version: b.entry.version, zip: b.entry.zip, options: b.entry.options }, status: b.status }))), { all: true });
    } catch (e) { return { id: "b", label: "Online library", kids: [], why: e.message }; }
  }
  // Gives { nodes, leaves: Map(key -> leaf) }; books when asked (they need the network).
  async function tree(opts = {}) {
    const nodes = fileTree();
    if (opts.books !== false) { const b = await bookTree(); if (b) nodes.push(b); }
    const leaves = new Map();
    const walk = (n) => { if (n.kids) n.kids.forEach(walk); else if (!leaves.has(n.key)) leaves.set(n.key, n); };
    nodes.forEach(walk);
    return { nodes, leaves };
  }
  // What is here: Set of stored file addresses, and the books' standing (from the leaves).
  async function storedSet() { return new Set((await MODELS.stored()).map((f) => f.url)); }
  const isStored = (lf, have) => (lf.kind === "book" ? lf.status === "stored" : have.has(lf.key));
  // "What my current settings need": the voice's files, its libraries, the MP3 encoder, the listener's.
  const needs = (values) => (g.VOICEDATA ? VOICEDATA.needed(values || SETTINGS.all()).map((f) => MODELS.href(f.url)) : []);

  // ---- Making a package ---------------------------------------------------------------------------------
  const slug = (s) => String(s || "other").toLowerCase().replace(/[^a-z0-9@._-]+/g, "-").replace(/^-+|-+$/g, "") || "other";
  // A file into the temporary cache as it streams (never whole in memory), its length checked.
  async function fetchInto(cache, lf, progress) {
    const name = lf.kind === "book" ? lf.label : MODELS.nameOf(lf.url);
    if (MODELS.offline()) throw fail(`${name} is not stored here and ${MODELS.offlineWhy()}, so it cannot go in the package. Switch Offline mode off (Settings → Voice data) with the internet on, or untick it.`);
    let res;
    try { res = await fetch(lf.url, { cache: lf.kind === "book" ? "no-cache" : "default" }); } catch (e) { throw fail(`${name} could not be downloaded: ${e.message}.`); }
    if (!res.ok || !res.body) throw fail(`${name} could not be downloaded (HTTP ${res.status}).`);
    const packed = !!res.headers.get("content-encoding"), said = packed ? 0 : Number(res.headers.get("content-length")) || 0;
    const [a, b] = res.body.tee();
    const put = cache.put(lf.url, new Response(a, { status: 200, headers: { "content-type": res.headers.get("content-type") || MODELS.typeOf(lf.url) } }));
    put.catch(() => {});
    const reader = b.getReader();
    let got = 0, last = 0;
    for (;;) {
      if (busy && busy.stop) { reader.cancel().catch(() => {}); try { await put; } catch (e) {} throw stopped(); }
      const { done, value } = await reader.read();
      if (done) break;
      got += value.length;
      if (progress && performance.now() - last > 150) { last = performance.now(); progress(name, got, said || lf.size); }
    }
    try { await put; } catch (e) { throw fail(`${name} downloaded but could not be kept for the package: ${e.name}: ${e.message}.`); }
    if (said && got !== said) { await cache.delete(lf.url); throw fail(`${name} came down incomplete (${got} bytes where the server said ${said}); nothing was written.`); }
    log("download", `package: downloaded ${name} (${MB(got)})`);
  }
  // Split into parts: in the given order, a new part when the next file would pass `limit` (a file over
  // the limit gets a part of its own). Gives [[item, …], …].
  function split(items, limit) {
    const parts = [];
    let cur = [], size = 0;
    for (const it of items) {
      if (cur.length && size + it.size > limit) { parts.push(cur); cur = []; size = 0; }
      cur.push(it); size += it.size;

  const partName = (n, m) => (m === 1 ? "Reader offline package.zip" : `Reader offline package part ${n} of ${m}.zip`);
  // The save picker where there is one (a computer's Chrome): call it straight from the click.
  // Not on a phone or tablet (Jon, 2026-10-23: Make did nothing on the Red Magic): there a save picker, if the
  // browser lists one at all, is not trusted; the parts as downloads are the known path.
  const mobile = () => !!((g.navigator && navigator.userAgentData && navigator.userAgentData.mobile) || /Android|iPhone|iPad|Mobile/i.test((g.navigator && navigator.userAgent) || ""));
  const canPick = () => typeof g.showSaveFilePicker === "function" && !mobile();
  const savePicker = () => (canPick()
    ? g.showSaveFilePicker({ suggestedName: partName(1, 1), types: [{ description: "Reader offline package", accept: { "application/zip": [".zip"] } }] })
    : null);
  function offer(name, blob) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; a.hidden = true;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 600000);
  }

  // keys: the ticked leaves' keys; leaves: tree().leaves. opts: target (the save picker's promise, or
  // null: parts as downloads), partBytes (the tests: a tiny size), settings (values for settings.json),
  // save(name, blob) (the tests: instead of a download), progress(text, frac).
  async function build(keys, leaves, opts = {}) {
    if (busy) throw fail("An offline package is already being made or imported.");
    if (!(g.crypto && crypto.subtle)) throw fail("This browser cannot hash files here (no crypto.subtle), so no package can be made.");
    const items = keys.map((k) => leaves.get(k)).filter(Boolean);
    if (!items.length) throw fail("Nothing is ticked.");
    busy = { what: "making", stop: false };
    const say = opts.progress || (() => {});
    let handle = null, cache = null, keep = false;
    await release();                          // a package made before and never let go
    const t0 = performance.now();
    try {
      handle = opts.target ? await opts.target : null;
      const have = await storedSet();
      const store = await caches.open(MODELS.CACHE);
      const get = items.filter((it) => it.kind === "book" || !have.has(it.key));
      if (get.length) {
        const need = get.reduce((n, it) => n + it.size, 0);
        // The fit check counts every one (a stored file's twin in the temporary cache is new space too).
        const f = await MODELS.fit(get.map((it, i) => ({ url: `https://package.invalid/${i}`, size: it.size })));
        if (!f.ok) throw fail(`The ${plural(get.length, "file")} not stored here are downloaded into the browser's storage first (${MB(need)}): ${f.text}. Nothing was written.`);
        cache = await caches.open(TMP);
        let done = 0;
        for (const it of get) {
          if (busy.stop) throw stopped();
          if (!(await cache.match(it.url))) await fetchInto(cache, it, (name, got, total) => say(`Downloading ${done + 1} of ${get.length}: ${name} · ${MB(got)}${total ? ` of ${MB(total)}` : ""}`, (done + (total ? got / total : 0)) / get.length));
          done++;
        }
      }
      // Every body as a Blob on disk, with its exact size.
      const bodies = [];
      for (const it of items) {
        const r = (it.kind !== "book" && have.has(it.key) ? await store.match(it.url) : null) || (cache && (await cache.match(it.url)));
        if (!r) throw fail(`${it.label} is no longer stored (it was deleted while the package was being made). Nothing was written.`);
        const blob = await r.blob();
        bodies.push({ it, blob, size: blob.size });
      }
      const limit = handle ? Infinity : Number(opts.partBytes) || PART_BYTES;
      const parts = split(bodies, limit), M = parts.length;
      const id = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
      const made = g.LOG ? LOG.when(new Date()) : new Date().toISOString();
      const paths = new Map(), used = new Set();
      for (const b of bodies) {
        const base = b.it.kind === "book" ? `books/${slug(b.it.book.id)}.zip` : `${slug(b.it.owner)}/${MODELS.nameOf(b.it.url).replace(/[\\/]+/g, "_")}`;
        let p = base;
        for (let i = 2; used.has(p); i++) p = base.replace(/(\.[^./]*)?$/, (ext) => `-${i}${ext || ""}`);
        used.add(p); paths.set(b, p);
      }
      const all = [];
      parts.forEach((list, k) => list.forEach((b) => all.push({ key: b.it.key, name: b.it.kind === "book" ? b.it.label : MODELS.nameOf(b.it.url), part: k + 1, size: b.size })));
      const contents = VOICEDATA.contentsOf(bodies.filter((b) => b.it.kind === "file").map((b) => ({ url: b.it.url, owner: b.it.owner, size: b.size })), !!opts.settings,
        { books: bodies.filter((b) => b.it.kind === "book").map((b) => b.it.label), parts: M });
      const total = bodies.reduce((n, b) => n + b.size, 0);
      let written = 0;
      const enc = new TextEncoder();
      const w = handle ? await handle.createWritable() : null;
      const held = [];
      try {
        for (let k = 0; k < M; k++) {
          const chunks = [];
          const zw = ZIPWRITE.writer(w ? (p) => w.write(p) : (p) => { chunks.push(p); });
          const files = [];
          for (const b of parts[k]) {
            if (busy.stop) throw stopped();
            const name = b.it.kind === "book" ? b.it.label : MODELS.nameOf(b.it.url);
            say(`Writing ${M > 1 ? `part ${k + 1} of ${M}: ` : ""}${name} · ${MB(b.size)}`, written / total);
            const buf = new Uint8Array(await b.blob.arrayBuffer());
            const sha256 = hex(await crypto.subtle.digest("SHA-256", buf)), crc = ZIPWRITE.crc32(buf);
            await zw.add(paths.get(b), b.blob, b.size, crc);
            files.push(Object.assign({ key: b.it.key, kind: b.it.kind, url: b.it.url, path: paths.get(b), size: b.size, sha256, owner: b.it.owner }, b.it.book ? { book: b.it.book } : {}));
            written += b.size;
          }
          if (k === 0 && opts.settings) {
            const js = enc.encode(JSON.stringify({ format: "br1-settings", version: 1, values: opts.settings, deviceTuned: VOICEDATA.DEVICE_TUNED.filter((x) => x in opts.settings) }, null, 1));
            await zw.add("settings.json", js, js.length, ZIPWRITE.crc32(js));
          }
          const man = enc.encode(JSON.stringify({ format: FORMAT, version: 1, id, part: k + 1, parts: M, made, by: g.APP_VERSION || "", contents, files, all }, null, 1));
          await zw.add("manifest.json", man, man.length, ZIPWRITE.crc32(man));
          await zw.finish();
          if (!w) {
            const blob = new Blob(chunks, { type: "application/zip" });
            if (opts.save) await opts.save(partName(k + 1, M), blob);
            else if (M === 1) offer(partName(1, 1), blob);
            else held.push({ name: partName(k + 1, M), blob, size: blob.size });
          }
        }
        if (w) await w.close();
      } catch (e) { if (w) { try { await w.abort(); } catch (x) {} } throw e; }
      const how = w ? `saved as ${handle.name || partName(1, 1)}` : opts.save ? `handed over as ${M} part${M === 1 ? "" : "s"}` : M === 1 ? `offered as a download (${partName(1, 1)})` : `ready as ${M} parts to save one by one (${partName(1, M)} … ${partName(M, M)})`;
      log("storage", `offline package made: ${plural(bodies.length, "file")}, ${MB(total)}${opts.settings ? " and the settings" : ""}, ${M} part${M === 1 ? "" : "s"}${get.length ? ` (${get.length} downloaded for it)` : ""}, ${how}, in ${((performance.now() - t0) / 1000).toFixed(1)} s`);
      if (held.length) keep = true;             // the parts' bodies are the temporary cache's own: kept until release()
      return { files: bodies.length, bytes: total, parts: M, how, downloaded: get.length, held };
    } finally {
      busy = null;
      if (cache && !keep) { try { await caches.delete(TMP); } catch (e) {} }
    }
  }

  // ---- Import ----------------------------------------------------------------------------------------
  let inp = null;
  // The picker for one or more parts; resolves with the Files (empty when closed without any).
  function pick() {
    if (!inp) {
      inp = document.createElement("input");
      inp.type = "file"; inp.id = "package-file"; inp.accept = ".zip,application/zip"; inp.multiple = true; inp.hidden = true;
      document.body.appendChild(inp);
    }
    const el = inp;
    el.value = "";
    const p = new Promise((res) => {
      const done = (f) => { el.removeEventListener("change", on); el.removeEventListener("cancel", off); res(f); };
      const on = () => done(Array.from(el.files || []));
      const off = () => done([]);
      el.addEventListener("change", on);
      el.addEventListener("cancel", off);
    });
    el.click();
    return p;
  }
  // The given zips, read (index, manifest, settings): { packages: [pkg], errors: [{ name, why }] }.
  // pkg: { id, name, made, by, parts, given: Map(part -> { file, name, byPath }), all, files: Map(key -> rec), settings, old }.
  async function open(files) {
    const byId = new Map(), errors = [];
    for (const file of files) {
      const name = file.name || "a zip";
      let list;
      try { list = await ZIP.entries(file); } catch (e) { errors.push({ name, why: `could not be read as a zip: ${e.message}` }); continue; }
      const byPath = new Map(list.map((e) => [e.name, e]));
      const m = byPath.get("manifest.json");
      if (!m) { errors.push({ name, why: "is not an offline package: it has no manifest.json" }); continue; }
      let man;
      try { man = JSON.parse(await ZIP.read(file, m)); } catch (e) { errors.push({ name, why: `its manifest.json could not be read (${e.message})` }); continue; }
      if (man && man.format === VOICEDATA.FORMAT) {               // an old Voice_data.zip: a package of one part
        let z;
        try { z = await VOICEDATA.open(file); } catch (e) { errors.push({ name, why: e.message.replace(/^"[^"]*":? ?/, "") }); continue; }
        const recs = Array.from(z.byUrl.values()).map((r) => ({ key: r.url, kind: "file", url: r.url, path: r.path, size: r.size, sha256: r.sha256, owner: r.owner, entry: r.entry, part: 1 }));
        byId.set("old:" + name + ":" + byId.size, { id: "old:" + name, name, old: true, made: z.made, by: (z.contents && z.contents.by) || "", parts: 1, contents: z.contents,
          given: new Map([[1, { file, name }]]), all: recs.map((r) => ({ key: r.key, name: MODELS.nameOf(r.url), part: 1, size: r.size })), files: new Map(recs.map((r) => [r.key, r])), settings: z.settings });
        continue;
      }
      if (!man || man.format !== FORMAT || !Array.isArray(man.files) || !Array.isArray(man.all) || !(man.part >= 1) || !(man.parts >= man.part)) {
        errors.push({ name, why: `is not an offline package (its manifest.json needs "format": "${FORMAT}", part, parts, files and all)` }); continue;
      }
      const pkg = byId.get(man.id) || { id: man.id, name, made: man.made || "", by: man.by || "", parts: man.parts, contents: man.contents || null, given: new Map(), all: man.all, files: new Map(), settings: null };
      if (pkg.given.has(man.part)) { errors.push({ name, why: `is part ${man.part} of ${man.parts} again (already given as "${pkg.given.get(man.part).name}"); used once` }); continue; }
      pkg.given.set(man.part, { file, name });
      for (const f of man.files) {
        if (!f || !f.key || !f.path || !(Number(f.size) >= 0) || !/^[0-9a-f]{64}$/i.test(String(f.sha256 || ""))) { errors.push({ name, why: `its manifest.json has a bad line (${JSON.stringify(f).slice(0, 100)})` }); continue; }
        pkg.files.set(f.key, Object.assign({}, f, { size: Number(f.size), sha256: String(f.sha256).toLowerCase(), url: f.kind === "book" ? f.url : MODELS.href(f.url), entry: byPath.get(f.path) || null, file, part: man.part }));
      }
      if (byPath.has("settings.json")) {
        try { const j = JSON.parse(await ZIP.read(file, byPath.get("settings.json"))); pkg.settings = j && j.values && typeof j.values === "object" ? j.values : null; }
        catch (e) { errors.push({ name, why: `its settings.json could not be read (${e.message}); its files can still be taken` }); }
      }
      byId.set(man.id, pkg);
    }
    const packages = Array.from(byId.values());
    for (const p of packages) {
      p.missing = [];
      for (let n = 1; n <= p.parts; n++) {
        if (p.given.has(n)) continue;
        const holds = p.all.filter((a) => a.part === n);
        p.missing.push({ part: n, files: holds.length, bytes: holds.reduce((s, a) => s + a.size, 0), names: holds.map((a) => a.name) });
      }
    }
    log("storage", `offline package: ${files.length} zip${files.length === 1 ? "" : "s"} given: ${packages.map((p) => `${p.old ? `${p.name} (an old Voice_data.zip)` : `package ${p.id}, parts ${Array.from(p.given.keys()).sort((a, b) => a - b).join(", ")} of ${p.parts}`}`).join("; ") || "no package"}${errors.length ? `; not used: ${errors.map((e) => `${e.name} ${e.why}`).join("; ")}` : ""}`);
    return { packages, errors };
  }
  // What a package holds and what of it is here: { take: [rec], here: [rec], bytes }.
  async function plan(pkg) {
    const have = await storedSet(), books = g.BOOK ? BOOK.books : [];
    const take = [], here = [];
    for (const r of pkg.files.values()) {
      const stored = r.kind === "book" ? books.some((b) => b.shelf && b.shelf.id === r.book.id && b.shelf.version === r.book.version) : have.has(r.url);
      (stored ? here : take).push(r);
    }
    return { take, here, bytes: take.reduce((n, r) => n + r.size, 0) };
  }
  // In words: what the package is, which parts are here and which are not (named).
  function describe(pkg) {
    const total = pkg.all.reduce((n, a) => n + a.size, 0);
    const lines = [`${pkg.old ? `${pkg.name} (an old Voice_data.zip)` : `Offline package made ${pkg.made}${pkg.by ? ` (${pkg.by})` : ""}`}: ${plural(pkg.all.length, "file")}, ${MB(total)}${pkg.parts > 1 ? ` in ${pkg.parts} parts` : ""}; settings: ${pkg.settings ? "yes" : "no"}.`];
    if (pkg.parts > 1) lines.push(`Given: part${pkg.given.size === 1 ? "" : "s"} ${Array.from(pkg.given.keys()).sort((a, b) => a - b).join(", ")} of ${pkg.parts}.`);
    for (const m of pkg.missing) lines.push(`Part ${m.part} of ${pkg.parts} not given: it holds ${plural(m.files, "file")} (${MB(m.bytes)}: ${m.names.slice(0, 4).join(", ")}${m.names.length > 4 ? ", …" : ""}).`);
    return lines;
  }
  // Take what is not here yet, each file checked; gives { took, bytes, here, failed: [{ name, why }], missing }.
  async function take(pkg, progress) {
    if (busy || (g.VOICEDATA && VOICEDATA.busy)) throw fail("Files are already being imported, exported or packed.");
    const p = await plan(pkg);
    const models = p.take.filter((r) => r.kind === "file");
    const f = await MODELS.fit(models.map((r) => ({ url: r.url, size: r.size })));
    if (!f.ok) throw fail(`${f.text}. Nothing was imported.`);
    busy = { what: "taking", stop: false };
    VOICEDATA.setBusy(busy);                 // VOICEDATA.take's own stop check and storeBusy() see it
    const out = { took: 0, bytes: 0, here: p.here.length, failed: [], missing: pkg.missing };
    const total = p.bytes || 1;
    let done = 0;
    try {
      for (let k = 0; k < p.take.length; k++) {
        if (busy.stop) throw stopped();
        const r = p.take[k], name = r.kind === "book" ? r.book.title : MODELS.nameOf(r.url);
        const zip = { file: pkg.given.get(r.part).file, name: pkg.given.get(r.part).name, byUrl: new Map([[r.url, r]]) };
        try {
          if (r.kind === "book") await takeBook(zip, r);
          else await VOICEDATA.take(zip, [{ url: r.url, size: r.size, owner: r.owner }], progress ? (n, loaded, size) => progress(`Importing ${k + 1} of ${p.take.length}: ${n} · ${MB(loaded)} of ${MB(size)}`, (done + loaded) / total) : null);
          out.took++; out.bytes += r.size;
        } catch (e) {
          if (e && e.stopped) throw e;
          out.failed.push({ name, why: String(e.message || e).replace(/\.$/, "") });
          log("error", `offline package: ${name} not imported: ${e.message}`);
        }
        done += r.size;
      }
    } finally { busy = null; VOICEDATA.setBusy(null); }
    log("storage", `offline package imported: ${out.took} file${out.took === 1 ? "" : "s"} (${MB(out.bytes)}), ${out.here} already here${out.failed.length ? `, ${out.failed.length} failed` : ""}${out.missing.length ? `, part${out.missing.length === 1 ? "" : "s"} ${out.missing.map((m) => m.part).join(", ")} of ${pkg.parts} not given` : ""}`);
    return out;
  }
  // A book: its bytes checked, then added (or its older copy replaced) as the shelf's download would be.
  async function takeBook(zip, r) {

<script>
// queue.js: the reading order inside a chapter's piece list (pieces.js), as pure functions on the
// list, for the player (Node runs them in the tests). QUEUE.indexOf(list, id); QUEUE.locate(list,
// para) gives { k, part } for the piece and part holding paragraph para (or the next piece after it);
// QUEUE.splitAt(list, k) puts a joined piece's parts in its place (the list changes; gives how many);
// QUEUE.start(list, para) is where Play from stopped begins: paragraph 0 starts at the title piece,
// any other paragraph at that paragraph alone (split out of its joined piece); QUEUE.step(list, k,
// part, d) moves one piece up or down from part `part` of piece k, splitting the piece left and the
// piece landed on so that each step is one paragraph, skipping pause pieces: gives the new k, or -1
// (before the start) or list.length (past the end) for the caller to cross into the next chapter;
// QUEUE.edge(list, d) is the first (d > 0) or last (d < 0) spoken piece, split to a single part.
// QUEUE.watchdogLimit(stats, chars): how long to wait for a piece before calling the voice stuck.
(function () {
  const indexOf = (list, id) => list.findIndex((p) => p.id === id);

  function locate(list, para) {
    for (let k = 0; k < list.length; k++) {
      const i = list[k].parts.findIndex((x) => x.para === para);
      if (i >= 0) return { k, part: i };
    }
    const after = list.findIndex((p) => p.parts[0].para > para);
    return after >= 0 ? { k: after, part: 0 } : list.length ? { k: list.length - 1, part: 0 } : null;
  }

  function splitAt(list, k) {
    const p = list[k];
    if (!p || p.parts.length < 2) return 1;
    const parts = globalThis.PIECES.split(p);
    list.splice(k, 1, ...parts);
    return parts.length;
  }

  function start(list, para) {
    if (!list.length) return -1;
    if (para <= 0 && list[0].title) return 0;
    const at = locate(list, para);
    if (!at) return -1;
    if (at.part > 0) { splitAt(list, at.k); return at.k + at.part; }
    return at.k;
  }

  // The piece at k as a single part (split when joined), then k adjusted to the part wanted.
  function single(list, k, part) {
    const n = splitAt(list, k);
    return k + Math.max(0, Math.min(n - 1, part));
  }

  function step(list, k, part, d) {
    if (!list.length) return d > 0 ? list.length : -1;
    k = single(list, k, part);
    let to = k + d;
    while (to >= 0 && to < list.length && list[to].pause) to += d;
    if (to < 0 || to >= list.length) return to < 0 ? -1 : list.length;
    return single(list, to, d < 0 ? Infinity : 0);
  }

  function edge(list, d) {
    let k = d > 0 ? 0 : list.length - 1;
    while (k >= 0 && k < list.length && list[k].pause) k += d;
    if (k < 0 || k >= list.length) return -1;
    return single(list, k, d < 0 ? Infinity : 0);
  }

  // Generous until three pieces have shown how fast the voice is; then ten times its usual time for
  // this many characters, never under 12 s. stats: { pieces, chars, synthMs }.
  function watchdogLimit(stats, chars) {
    if (!stats || stats.pieces < 3 || !stats.chars) return 45000 + chars * 300;
    return Math.max(12000, Math.round((stats.synthMs / stats.chars) * chars * 10) + 6000);
  }

  globalThis.QUEUE = { indexOf, locate, splitAt, start, step, edge, watchdogLimit };
})();

<script>
// highlight.js: the marks on the reader page while reading. HIGHLIGHT.speak(piece, part) gives the
// paragraph being spoken a bright highlight and the other parts of the same joined piece a slight one
// (null clears); HIGHLIGHT.word(piece, part, i) tints word i of that part (the CSS Custom Highlight
// API, else a span; -1 clears); HIGHLIGHT.made(piece, flags, spans) draws the "sound made" line by its
// paragraphs, one segment per chunk (flags: which chunks are made; spans: the chunks' character spans
// as the player cut them, else PIECES.chunks' default); HIGHLIGHT.refresh(list, state) puts the marks
// back after a chapter is drawn again (state(id) = { flags, spans }, or null for nothing made). The marks apply
// only when the piece's chapter is the one on screen. The timing: HIGHLIGHT.timing(entry, source)
// works out, once per stream entry, when each part and each shown word is spoken, from the "Word
// timing from" setting: "voice" uses the engine's word times (aligned to the shown words, which can
// differ: numbers written out, watermarks left out), "estimate" spreads the time by character count,
// "off" times the parts only; HIGHLIGHT.at(timing, sec) gives { part, word }. HIGHLIGHT.source() reads
// the setting ("listener", step 8a: the listener's heard words, listener.js). The left-edge marks
// have two modes (UX-16, step 8b): simple, one short dash per paragraph (green = every chunk made,
// .ready; blue = being read), or detailed (the "Detailed marks" setting: the chunk segments, the
// Play-start line, the listener's issue marks), switched by html[data-marks] in play.css. The Key
// button (?) on the main screen opens a small window listing exactly the marks the current settings
// show (the listener's only while it is on), redrawn when a setting changes (settingsChanged). align /
// estimate are pure (Node).
(function () {
  const g = globalThis;
  const norm = (w) => String(w).toLowerCase().replace(/[‘’]/g, "'").replace(/[^\p{L}\p{N}']/gu, "");
  const wordsOf = (text) => { const out = [], re = /\S+/g; let m; while ((m = re.exec(text))) out.push({ text: m[0], from: m.index, to: m.index + m[0].length }); return out; };

  // The shown words' times from the spoken words' times ([[word, from, to], ...]): equal words pair up
  // in order (looking up to eight spoken words ahead); the unmatched take an even share of the gap.
  function align(shown, spoken, dur) {
    const out = new Array(shown.length).fill(null);
    let j = 0;
    for (let i = 0; i < shown.length; i++) {
      const s = norm(shown[i]);
      if (!s) continue;
      for (let k = j; k < Math.min(spoken.length, j + 8); k++) {

      }
    }
    let prevEnd = 0, i = 0;
    while (i < shown.length) {
      if (out[i]) { prevEnd = out[i][1]; i++; continue; }
      let e = i;
      while (e < shown.length && !out[e]) e++;
      const nextStart = e < shown.length ? out[e][0] : (dur > prevEnd ? dur : prevEnd);
      const n = e - i, span = Math.max(0, nextStart - prevEnd);
      for (let q = 0; q < n; q++) out[i + q] = [prevEnd + span * q / n, prevEnd + span * (q + 1) / n];
      prevEnd = nextStart;
      i = e;
    }
    return out;
  }

  // Words spread over [from, to] by their length: [[from, to], ...].
  function estimate(words, from, to) {
    const total = words.reduce((n, w) => n + String(w).length + 1, 0) || 1;
    const out = [];
    let at = from;
    for (const w of words) { const end = at + (to - from) * (String(w).length + 1) / total; out.push([at, end]); at = end; }
    return out;
  }

  function source() {
    const s = g.SETTINGS ? g.SETTINGS.get("wordTiming") : "estimate";
    return s === "off" ? "off" : s === "model" || s === "voice" ? "voice" : s === "listener" ? "listener" : "estimate";
  }

  // "listener": the listener's heard words (listener.js timedFor: each chunk's words shifted to where the
  // chunk starts in the entry), worked out again whenever a check lands (its version).
  const listenV = () => (g.LISTENER ? g.LISTENER.version() : 0);
  function timing(entry, src) {
    if (entry.timing && entry.timing.source === src && (src !== "listener" || entry.timing.v === listenV())) return entry.timing;
    // A piece only partly in the stream (cover < 1: its first chunks): its words are spread over the
    // duration the whole piece is expected to have, so the tint waits at the last word in (P6).
    const piece = entry.piece, cover = entry.cover > 0 && entry.cover < 1 ? entry.cover : 1, dur = (entry.dur || (entry.end - entry.start) || 0) / cover;
    const shown = piece.parts.map((x) => wordsOf(x.text));

        shown.forEach((ws, i) => { if (ws.length) t.parts[i] = { from: times[n][0], to: times[n + ws.length - 1][1] }; n += ws.length; });

        ws.forEach((w, q) => t.words.push({ part: i, i: q, from: span[q][0], to: span[q][1] }));

  // { part, word, from }: from is when that word (or, with no word, the part) was due, in entry seconds.
  function at(t, sec) {

    for (let i = 1; i < t.parts.length; i++) if (sec >= t.parts[i].from) part = i;
    let word = -1, from = t.parts[part] ? t.parts[part].from : 0;
    for (const w of t.words) { if (w.part > part) break; if (w.part === part && sec >= w.from) { word = w.i; from = w.from; } }
    return { part, word, from };

  const pure = { align, estimate, timing, at, wordsOf, source };
  if (typeof document === "undefined") { g.HIGHLIGHT = pure; return; }

  // ---- The page --------------------------------------------------------------------------------
  const canHL = typeof CSS !== "undefined" && CSS.highlights && typeof Highlight !== "undefined";
  const paraEl = (para) => (para < 0 ? document.getElementById("ctitle") : document.querySelector(`#text p[data-i="${para}"]`));
  const shown = (piece) => { const info = g.BOOK && g.READER ? BOOK.info(READER.chapter) : null; return !!info && info.c === piece.chapter; };
  let speaking = null;          // { piece, part }
  let tinted = null;            // { piece, part, i }
  let span = null;              // the fallback span

  function speak(piece, part) {
    for (const el of document.querySelectorAll("#book .speaking, #book .piece")) el.classList.remove("speaking", "piece");
    speaking = piece ? { piece, part } : null;
    if (!piece || !shown(piece)) return;
    piece.parts.forEach((x, i) => { const el = paraEl(x.para); if (el) el.classList.add(i === part ? "speaking" : "piece"); });
  }

  function clearWord() {
    tinted = null;
    if (canHL) CSS.highlights.delete("word");
    if (span) { const p = span.parentNode; if (p) { p.replaceChild(document.createTextNode(span.textContent), span); p.normalize(); } span = null; }
  }

    if (!piece || i < 0 || !shown(piece)) { if (tinted) clearWord(); return; }
    if (tinted && tinted.piece === piece && tinted.part === part && tinted.i === i) return;
    clearWord();

    if (!w || !node || node.nodeType !== 3 || node.length < x.from + w.to) return;
    const r = document.createRange();
    r.setStart(node, x.from + w.from);
    r.setEnd(node, x.from + w.to);

  // The "made" line by the piece's paragraphs, divided into one segment per chunk (PIECES.chunks):
  // a segment full once its chunk's sound is made, faint while it waits (Jon's spec, 2026-10-17);
  // flags = one boolean per chunk (none = all made). A paragraph cut into several pieces shows them
  // all; the segments are a gradient in --madeseg on the paragraph (play.css), 2 px apart.
  const segs = new Map();            // piece id -> { piece, flags, spans }, for the chapter on screen
  let segsChapter = null;
  const PENDING = "color-mix(in srgb, var(--made) 30%, transparent)";
  const CLOUD_COLOURS = { queued: "var(--pc-queued)", generating: "var(--pc-making)", sending: "var(--pc-sending)" };   // play.css
  function made(piece, flags, spans) {
    if (!shown(piece)) return;
    if (segsChapter !== piece.chapter) { segs.clear(); segsChapter = piece.chapter; }
    segs.set(piece.id, { piece, flags: flags || null, spans: spans || null });

  }
  function drawLine(para) {
    const el = paraEl(para);
    if (!el) return;
    const len = el.textContent.length || 1, out = [];
    for (const { piece, flags, spans } of segs.values()) {
      const cs = spans || (g.PIECES ? PIECES.chunks(piece.speech) : []);
      let at = 0;
      for (const x of piece.parts) {
        const sp = x.speech || "", a = at, b = at + sp.length;
        if (sp) at = b + 1;
        if (x.para !== para || !sp) continue;
        const span = x.to - x.from;
        cs.forEach((c, j) => {
          const c0 = Math.max(c.from, a), c1 = Math.min(c.to, b);
          const f = !flags ? true : flags[j] == null ? false : flags[j];
          if (c1 > c0) out.push({ a: (x.from + span * (c0 - a) / sp.length) / len, b: (x.from + span * (c1 - a) / sp.length) / len, done: f === true, at: typeof f === "string" ? f : "" });
        });
      }
    }
    el.classList.toggle("made", out.length > 0);
    el.classList.toggle("allmade", out.length > 0 && out.every((s) => s.done));   // every chunk made: the simple dash (UX-16)
    if (!out.length) { el.style.removeProperty("--madeseg"); return; }
    out.sort((p, q) => p.a - q.a);
    // With the PC voice a waiting chunk shows where it is: queued on the PC, generating there, on the way.
    const colour = (s) => (s.done ? "var(--made)" : s.at ? (CLOUD_COLOURS[s.at] || PENDING) : PENDING);
    if (out.length === 1) { if (out[0].done) el.style.removeProperty("--madeseg"); else el.style.setProperty("--madeseg", colour(out[0])); return; }
    const pc = (f) => (Math.max(0, Math.min(1, f)) * 100).toFixed(2) + "%";
    const stops = [];
    out.forEach((s, i) => {
      stops.push(`${colour(s)} ${i ? `calc(${pc(s.a)} + 1px)` : pc(s.a)} ${i < out.length - 1 ? `calc(${pc(s.b)} - 1px)` : pc(s.b)}`);
      if (i < out.length - 1) stops.push(`transparent calc(${pc(s.b)} - 1px) calc(${pc(out[i + 1].a)} + 1px)`);
    });

  }

  // A piece's sound let go (clips mode, behind the playhead: player.js): its made line goes.
  function unmade(piece) {
    if (!segs.delete(piece.id) || !shown(piece)) return;
    for (const x of piece.parts) drawLine(x.para);
  }
  function refresh(list, state) {
    segs.clear(); segsChapter = null;
    for (const el of document.querySelectorAll("#book .made")) { el.classList.remove("made", "allmade"); el.style.removeProperty("--madeseg"); }
    for (const p of list || []) { const s = state(p.id); if (s) made(p, Array.isArray(s) ? s : s.flags, Array.isArray(s) ? null : s.spans); }
    if (speaking) speak(speaking.piece, speaking.part);
    if (tinted) { const t = tinted; tinted = null; span = null; word(t.piece, t.part, t.i); }
  }

  // ---- The marks' mode (UX-16, Jon 2026-10-20) ------------------------------------------------------
  // Simple (the default): one short dash at the left of a paragraph, green once every chunk of its
  // sound is made (.ready), blue while it is being read (.speaking); nothing else on the left edge.
  // Detailed (Settings → Debug → "Detailed marks (diagnostics)", live): the chunk segments, the
  // Play-start line, the listener's issue marks with a shape. The CSS switches on html[data-marks];
  // the classes are set either way, so a change needs no redraw.
  const detailed = () => !!(g.SETTINGS && SETTINGS.get("detailedMarks"));
  function applyMode() { document.documentElement.dataset.marks = detailed() ? "detailed" : "simple"; }
  applyMode();

  function settingsChanged(names) {
    if (!names || names.includes("detailedMarks")) applyMode();

  }
