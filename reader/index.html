  }
  const stored = (en) => BOOK.books.find((b) => b.shelf && b.shelf.id === en.id) || null;
  // For the Open window: every book with its standing here. Throws like catalog().
  async function list() {
    const cat = await catalog();
    return { url: cat.url, problems: cat.problems, books: cat.books.map((en) => { const have = stored(en); return { entry: en, stored: have, status: !have ? "new" : have.shelf.version === en.version ? "stored" : "update" }; }) };
  }

  // The index entry for ?book=, or an entry made from ?zip=.
  async function entry() {
    if (zipPath) {
      const url = new URL(zipPath, location.href);
      const name = decodeURIComponent(url.pathname.split("/").pop() || "book.zip");
      return { id: "zip:" + url.pathname, title: CHAPTER.pretty(name) || name, zip: name, url: url.href, version: "", size: 0, options: {} };
    }
    const cat = await catalog();
    const b = cat.books.find((x) => x.id === wanted);
    if (!b) {
      const p = cat.problems.find((x) => x.id === wanted);
      throw new Error(p ? `the shelf's folder "${wanted}" could not be listed: ${p.problem}` : `the shelf has no book "${wanted}" (it lists: ${cat.books.map((x) => x.id).join(", ") || "nothing"})`);
    }
    return b;
  }

  // The zip, with progress in the Open window ("Downloading American History: 2.1 of 5.4 MB").
  async function download(en) {
    let r;
    try { r = await fetch(en.url, { cache: "no-cache" }); }
    catch (e) { throw new Error(`${en.url} could not be fetched: ${e.message}${offline()}`); }
    if (!r.ok) throw new Error(`${en.url} answered ${r.status} ${r.statusText}`);
    const total = Number(r.headers.get("content-length")) || en.size || 0;
    const parts = [];
    let got = 0;
    const show = () => LIBRARY.download(`Downloading ${en.title}: ${MB(got)}${total ? ` of ${MB(total)}` : ""}`, total ? got / total : 0);
    show();
    if (r.body && r.body.getReader) {
      const reader = r.body.getReader();
      let last = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value); got += value.length;
        if (performance.now() - last > 100) { last = performance.now(); show(); }
      }
    } else { const buf = new Uint8Array(await r.arrayBuffer()); parts.push(buf); got = buf.length; }
    show();
    st.bytes = got;
    return new File(parts, en.zip.split("/").pop() || "book.zip", { type: "application/zip" });
  }

  // Open the book if it is stored at this version, else download it and add / replace it. Never throws.
  async function load(en) {
    if (st.state === "downloading" || st.state === "adding") { READER.say(`Still loading "${st.entry.title}"; wait for it`, 5000); return; }
    st.entry = en;
    if (en.options.across) log("book", `book shelf: "${en.title}" asks for Read across time; ignored (never set from the shelf; it is an option in the book's row)`);
    const have = stored(en);
    if (have && have.shelf.version === en.version) {
      try {
        if (BOOK.current !== have.id) await READER.openBook(have.id);
        if (LIBRARY.isOpen && LIBRARY.mode === "list") FLOAT.close("library");
        st.state = "opened";
        note(`"${have.title}" is already stored at the shelf's version${en.version ? ` ${en.version}` : ""}: opened, nothing downloaded`);
      } catch (e) { fail(`"${have.title}" is stored but could not be opened: ${e.message}`, e); }
      return;
    }
    st.state = "downloading";
    note(have ? `"${have.title}" is stored at version ${have.shelf.version || "?"}; the shelf has ${en.version || "another"}: downloading ${en.url} to replace it (the place is kept)` : `"${en.title}" is not stored: downloading ${en.url}`);
    let file;
    try { file = await download(en); }
    catch (e) { fail(`"${en.title}" could not be downloaded from the book shelf: ${e.message}`, e); return; }
    log("book", `book shelf: ${MB(st.bytes)} downloaded`);
    st.state = "adding";
    let r;
    try { r = await LIBRARY.pick([file], { sections: en.options.sections !== false, shelf: { id: en.id, version: en.version, title: en.title, existing: have ? have.id : null } }); }
    catch (e) { fail(`"${en.title}" could not be added: ${e.message}`, e); return; }
    if (!r || !r.added.length) { fail(`"${en.title}" could not be added: ${(r && r.failed.join(" ")) || "nothing came in"}`); return; }
    st.state = "added";
    note(`"${r.added[0].title}" ${have ? "replaced" : "added"} from the shelf (${r.added[0].chapters.toLocaleString("en-US")} chapters, version ${en.version || "none"}) and opened`);
  }

  async function autoload() {
    if (!wanted && !zipPath) return;
    st.state = "catalog";
    log("book", `book shelf: the page asks for ${wanted ? `book "${wanted}"` : `zip "${zipPath}"`}`);
    let en;
    try { en = await entry(); } catch (e) { fail(`"${wanted || zipPath}" could not be loaded from the book shelf: ${e.message}`, e); return; }
    await load(en);
  }

  globalThis.SHELF = { autoload, load, list, catalog, get state() { return st.state; }, get message() { return st.message; }, get entry() { return st.entry; }, get wanted() { return wanted || zipPath; } };
})();
</script>
<script>
/* relay-client.js: the PC Relay client (ONE source: Projects\pc-relay\client\relay-client.js; each page's build
   copies it in, so never edit a copy). Talks to PC Relay on Jon's PC (Tailscale Funnel).
   - Nothing happens until the page calls something: no background traffic of its own.
   - Status events: checking / connected / starting / ready / offline / off / signin / reload, each with a plain `why`.
   - Sign-in passes are per device and per scope ("screen", "files-private"), kept in localStorage, sent in the
     X-Relay-Pass header (HTTP) or as WebSocket subprotocols "pass.<p>" (a browser cannot set WebSocket headers);
     never in a URL, never cookies.
   - Version-checked: a relay that needs a newer client says so, and the status becomes "reload". */
(function (root) {
  "use strict";
  const VERSION = 1;
  const DEFAULT_PC = "https://desktop-krq9ti2.tail46434.ts.net";
  const store = {
    get(k) { try { return root.localStorage.getItem(k) || ""; } catch (e) { return ""; } },
    set(k, v) { try { if (v) root.localStorage.setItem(k, v); else root.localStorage.removeItem(k); } catch (e) {} },
    keys() { try { return Object.keys(root.localStorage); } catch (e) { return []; } },
  };
  let memDevice = "";
  function deviceId() {
    let d = store.get("relay-device") || memDevice;
    if (!/^[A-Za-z0-9_-]{8,64}$/.test(d)) {
      d = Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(16).padStart(2, "0")).join("");
      store.set("relay-device", d);
      memDevice = d;
    }
    return d;
  }
  function httpWhy(status) {
    return ({ 401: "the PC wants the password", 403: "the PC refused this page", 404: "the PC has no such program",
      410: "this page is out of date: reload it", 426: "this page is out of date: reload it",
      429: "too many requests: wait a minute", 502: "the PC is reachable but the relay is not running (502)",
      503: "the PC said it is busy or switched off (503)" })[status] || `the PC answered ${status}`;
  }
  function netWhy(err, ms) {
    if (err && err.name === "AbortError") return `no answer from the PC within ${Math.round(ms / 1000)} s`;
    if (typeof navigator !== "undefined" && navigator.onLine === false) return "this device is offline";
    return "could not reach the PC (no network, or the PC is off or asleep)";
  }
  async function readError(r) {
    try { const j = await r.clone().json(); if (j && j.error) return j.error; } catch (e) {}
    return httpWhy(r.status);
  }

  class Relay {
    constructor(opts) {
      this.app = (opts.app || "page").replace(/[^A-Za-z0-9_.-]/g, "");
      this.base = String(opts.base || DEFAULT_PC).replace(/\/+$/, "");
      this.status = { state: "idle", why: "", at: Date.now() };
      this.info = null;          // the last /relay/ping answer
      this.latency = 0;          // ms, the last ping's round trip
      this.bytes = 0;            // bytes this client has fetched through fetchJSON / fetch (approximate)
      this.subs = new Set();
      if (typeof opts.onStatus === "function") this.subs.add(opts.onStatus);
    }
    setBase(url) { this.base = String(url || DEFAULT_PC).replace(/\/+$/, ""); }
    on(fn) { this.subs.add(fn); return () => this.subs.delete(fn); }
    _set(state, extra) {
      this.status = Object.assign({ state, why: "", at: Date.now() }, extra || {});
      for (const f of this.subs) { try { f(this.status); } catch (e) {} }
    }
    // ---- passes ----
    pass(scope) { try { const j = JSON.parse(store.get("relay-pass:" + scope) || "null"); return (j && j.pass) || ""; } catch (e) { return ""; } }
    hasPass(scope) { return !!this.pass(scope); }
    passes() {
      const out = [];
      for (const k of store.keys()) if (k.startsWith("relay-pass:")) { const p = this.pass(k.slice(11)); if (p) out.push(p); }
      return out;
    }
    adoptPass(scope, pass) { if (pass) store.set("relay-pass:" + scope, JSON.stringify({ pass, at: Date.now() })); }
    forget(scope) { store.set("relay-pass:" + scope, ""); }
    headers(extra) {
      const h = { "X-Relay-Client": this.app + "/" + VERSION, "X-Relay-Device": deviceId() };
      const p = this.passes();

    }
    // ---- addresses ----
    url(service, path) { return `${this.base}/svc/${service}/${String(path || "").replace(/^\/+/, "")}`; }

      let timer = 0, ac = null;
      if (timeout && !opts.signal) { ac = new AbortController(); opts.signal = ac.signal; timer = setTimeout(() => ac.abort(), timeout); }
      try { return await fetch(this.url(service, path), opts); }

    }
    // ---- the light check ----
    async ping(timeoutMs) {
      timeoutMs = timeoutMs || 8000;
      this._set("checking", { why: "checking the connection…" });
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), timeoutMs), t0 = performance.now();
      try {
        const r = await fetch(`${this.base}/relay/ping?t=${Date.now()}`, { headers: this.headers(), cache: "no-store", signal: ac.signal });
        if (!r.ok) { const why = await readError(r); this._set(r.status === 426 ? "reload" : "offline", { why }); return { ok: false, why }; }
        const info = await r.json();
        this.latency = Math.round(performance.now() - t0);
        this.info = info;
        if ((info.min_client || 0) > VERSION) { const why = "this page is out of date: reload it"; this._set("reload", { why }); return { ok: false, why, info }; }
        if (!info.on) { const why = "the PC relay is switched off (tray icon on the PC)"; this._set("off", { why, info }); return { ok: false, why, info }; }
        this._set("connected", { why: `connected (${this.latency} ms)`, info, latency: this.latency });
        return { ok: true, info, latency: this.latency };
      } catch (err) {
        const why = netWhy(err, timeoutMs);
        this._set("offline", { why });
        return { ok: false, why };
      } finally { clearTimeout(timer); }
    }
    service(id) { return ((this.info && this.info.services) || []).find((s) => s.id === id) || null; }
    // ---- sign-in ----
    async signIn(scope, password) {
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 15000);
      try {
        const name = (typeof navigator !== "undefined" ? navigator.userAgent : "").replace(/\s+/g, " ").slice(0, 80);
        const r = await fetch(`${this.base}/relay/login`, { method: "POST", headers: this.headers({ "Content-Type": "application/json" }),
          body: JSON.stringify({ password, scope, device: deviceId(), name: this.app + ": " + name }), cache: "no-store", signal: ac.signal });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) return { ok: false, why: j.error || httpWhy(r.status) };
        this.adoptPass(scope, j.pass);
        return { ok: true };
      } catch (err) { return { ok: false, why: netWhy(err, 15000) }; }
      finally { clearTimeout(timer); }
    }
    async signOut(scope) {
      const p = this.pass(scope);
      this.forget(scope);
      if (!p) return { ok: true };
      try { await fetch(`${this.base}/relay/logout`, { method: "POST", headers: { "X-Relay-Pass": p, "X-Relay-Client": this.app + "/" + VERSION }, cache: "no-store" }); } catch (e) {}
      return { ok: true };
    }
    // ---- start a service, with progress ("starting the voice engine…") ----
    async open(service, onProgress, timeoutMs) {
      timeoutMs = timeoutMs || 60000;
      this._set("starting", { service, why: `starting ${service} on the PC…` });
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), timeoutMs);
      try {
        const r = await fetch(`${this.base}/relay/open/${service}`, { headers: this.headers(), cache: "no-store", signal: ac.signal });
        if (r.status === 401) { const why = await readError(r); this._set("signin", { service, why }); return { ok: false, signin: true, why }; }
        if (!r.ok) { const why = await readError(r); this._set("offline", { service, why }); return { ok: false, why }; }
        const rd = r.body.getReader(), dec = new TextDecoder();
        let buf = "", last = null;
        for (;;) {
          const { value, done } = await rd.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let i;
          while ((i = buf.indexOf("\n")) >= 0) {
            const line = buf.slice(0, i); buf = buf.slice(i + 1);
            if (!line.trim()) continue;
            try { last = JSON.parse(line); } catch (e) { continue; }
            if (onProgress) { try { onProgress(last); } catch (e) {} }
            if (last.state === "starting") this._set("starting", { service, why: last.text || "starting…", seconds: last.seconds || 0 });
          }
        }
        if (last && last.state === "ready") { this._set("ready", { service, why: last.warm ? "ready" : `ready (started in ${(last.ms / 1000).toFixed(1)} s)` }); return { ok: true, warm: !!last.warm, ms: last.ms || 0 }; }
        const why = (last && last.error) || "the PC stopped answering while it was starting";
        this._set("offline", { service, why });
        return { ok: false, why };
      } catch (err) {
        const why = netWhy(err, timeoutMs);
        this._set("offline", { service, why });
        return { ok: false, why };
      } finally { clearTimeout(timer); }
    }
    // ---- keep checking (only while the page wants it): backoff 1 s, 2 s, 4 s ... 30 s while it fails ----
    watch(everyMs) {
      everyMs = everyMs || 15000;
      let stopped = false, timer = 0, fails = 0;
      const tick = async () => {
        if (stopped) return;
        const r = await this.ping();
        fails = r.ok ? 0 : fails + 1;
        const wait = r.ok ? everyMs : Math.min(30000, 1000 * 2 ** Math.min(fails - 1, 5));
        if (!stopped) timer = setTimeout(tick, wait * (0.9 + Math.random() * 0.2));
      };
      const online = () => { clearTimeout(timer); tick(); };
      if (typeof addEventListener === "function") addEventListener("online", online);
      tick();
      return () => { stopped = true; clearTimeout(timer); if (typeof removeEventListener === "function") removeEventListener("online", online); };
    }
  }

  root.RelayClient = { VERSION, DEFAULT_PC, create: (opts) => new Relay(opts || {}), deviceId, httpWhy };
})(typeof window !== "undefined" ? window : globalThis);
</script>

// relay-client.js is copied in by build.py from pc-relay\client, never edited here). One shared RelayClient
// (PCRELAY.client()), made on first use: nothing talks to the PC until Settings → Cloud, Open → From my PC

<script>
// pcfiles.js: Open → From my PC (2026-10-25). Browses "Relay Files" on Jon's PC through PC Relay (the files
// service: Projects\pc-relay\services\files) inside the Open window: folders with their sizes and dates,
// search, sort, live updates while it is open, and the Private folder (🔒, the PC's password once per device;
// the relay keeps the pass). "Add" brings a file in through the normal import (library.js: the same preview as
// Add files); "Add as a book" brings a whole folder in as one zip (one book). Nothing is sent to the PC until
// From my PC is opened; closing it ends the live-updates stream. The PC's address: SETTINGS pcAddress (blank =
// Jon's PC), set in Settings → Cloud. Uses PCRELAY (cloud.js's shared RelayClient).
(function () {
  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const btn = (cls, text, fn, title) => { const b = h("button", cls, text); b.type = "button"; if (title) b.title = title; b.addEventListener("click", fn); return b; };
  const fmt = (n) => Number(n || 0).toLocaleString("en-US");
  const MB = (n) => (n < 1e3 ? `${n || 0} bytes` : n < 1e6 ? `${Math.max(1, Math.round(n / 1e3))} KB` : `${(n / 1e6).toFixed(n < 1e7 ? 1 : 0)} MB`);
  const when = (ms) => (ms ? new Date(ms).toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }) : "");
  const st = { body: null, folder: "root", data: null, results: null, q: "", sort: "name", msg: "", bad: false, loading: false, pw: false, pwMsg: "", ev: null, evFails: 0, seq: 0, qTimer: 0 };

  const R = () => PCRELAY.client();
  async function getJSON(path) {
    let r;
    try { r = await R().fetch("files", path, { timeout: 30000, cache: "no-store" }); }
    catch (e) { const err = new Error(e.name === "AbortError" ? "no answer from the PC within 30 s" : "could not reach the PC (no network, or the PC is off or asleep)"); err.net = true; throw err; }
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { const err = new Error(j.error || "the PC wants the password"); err.signin = j.signin || "files-private"; throw err; }
    if (!r.ok) throw new Error(j.error || RelayClient.httpWhy(r.status));
    return j;
  }
  function say(text, bad) { st.msg = text || ""; st.bad = !!bad; const m = st.body && st.body.querySelector(".pcmsg"); if (m) { m.textContent = st.msg; m.hidden = !st.msg; m.classList.toggle("bad", st.bad); } }

  async function load(folder, quiet) {
    const seq = ++st.seq;
    st.loading = true;
    if (!quiet) { say(st.data ? "Loading…" : "Opening Relay Files on the PC…"); }
    try {
      const j = await getJSON("list?folder=" + encodeURIComponent(folder));
      if (seq !== st.seq) return;
      st.folder = folder; st.data = j; st.pw = false; st.loading = false;
      say("");
      draw();
    } catch (e) {
      if (seq !== st.seq) return;
      st.loading = false;
      if (e.signin) { st.pw = { folder, scope: e.signin }; st.pwMsg = ""; say(""); draw(); return; }
      log("book", `From my PC: ${e.message}`);

  }
  async function search(q) {
    st.q = q;
    if (!q.trim()) { st.results = null; draw(); return; }
    const seq = ++st.seq;
    try {
      const j = await getJSON("search?q=" + encodeURIComponent(q));
      if (seq !== st.seq) return;
      st.results = j; say(j.more ? "More than 300 found: showing the first 300." : ""); draw();
    } catch (e) { if (seq === st.seq) say(`Search failed: ${e.message}.`, true); }
  }

  // ---- live updates: the files service's event stream, only while From my PC is open ------------------------
  async function events() {
    if (st.ev || !st.body) return;
    const ac = new AbortController();
    st.ev = ac;
    try {
      const r = await R().fetch("files", "events", { signal: ac.signal, cache: "no-store" });
      if (!r.ok || !r.body) throw new Error(RelayClient.httpWhy(r.status));
      st.evFails = 0;
      const rd = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await rd.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const block = buf.slice(0, i); buf = buf.slice(i + 2);
          const line = block.split("\n").find((l) => l.startsWith("data: "));
          if (!line) continue;
          let m; try { m = JSON.parse(line.slice(6)); } catch (e) { continue; }
          if (m.type === "changed" && st.body) {
            if (st.results && st.q) search(st.q);
            else if ((m.folders || []).includes(st.folder) || (st.data && (m.folders || []).some((f) => (st.data.items || []).some((it) => it.id === f)))) load(st.folder, true);
          }
        }
      }
    } catch (e) { if (ac.signal.aborted) return; }
    finally { if (st.ev === ac) st.ev = null; }
    if (st.body && !ac.signal.aborted) { st.evFails++; setTimeout(events, Math.min(30000, 1000 * 2 ** Math.min(st.evFails, 5))); }
  }
  function stop() { if (st.ev) { st.ev.abort(); st.ev = null; } st.body = null; clearTimeout(st.qTimer); }

  // ---- bringing a file or folder in: download with progress in the Open window, then the normal import ----
  async function bring(it) {
    const path = it.dir ? `zip/${it.id}` : `file/${it.id}`;
    const name = it.dir ? `${it.name}.zip` : it.name;
    const total = it.size || 0;
    stop();
    LIBRARY.download(`Downloading ${name} from the PC…`, 0);
    try {
      const r = await R().fetch("files", path, { cache: "no-store" });
      if (r.status === 401) throw new Error("the PC wants the password again (signed out on the PC?)");
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || RelayClient.httpWhy(r.status)); }
      const len = Number(r.headers.get("content-length")) || total;
      const parts = []; let got = 0, last = 0;
      const rd = r.body.getReader();
      for (;;) {
        const { done, value } = await rd.read();
        if (done) break;
        parts.push(value); got += value.length;
        if (performance.now() - last > 120) { last = performance.now(); LIBRARY.download(`Downloading ${name} from the PC: ${MB(got)}${len ? ` of ${it.dir ? "about " : ""}${MB(len)}` : ""}`, len ? Math.min(1, got / len) : 0); }
      }
      log("book", `From my PC: ${name} downloaded (${MB(got)})`);
      LIBRARY.download(null);
      const file = new File(parts, name, { type: it.dir ? "application/zip" : (r.headers.get("content-type") || ""), lastModified: it.mtime || Date.now() });
      await LIBRARY.pick([file]);
    } catch (e) {
      LIBRARY.download(null);
      log("book", `From my PC: ${name} could not be brought in: ${e.message}`);
      LIBRARY.say(`${name} could not be brought in from the PC: ${e.message}.`, true);
    }
  }

  // ---- drawing --------------------------------------------------------------------------------------------
  function sorted(items) {
    const k = st.sort;
    return [...items].sort((a, b) => (b.dir - a.dir) || (k === "date" ? (b.mtime || 0) - (a.mtime || 0) : k === "size" ? (b.size || 0) - (a.size || 0) : a.name.localeCompare(b.name, "en", { numeric: true, sensitivity: "base" })));
  }
  function item(it, showPath) {
    const r = h("div", "librow pcrow" + (it.locked ? " pclocked" : ""));
    r.dataset.id = it.id;
    const icon = it.locked ? "🔒 " : it.dir ? "📁 " : "📄 ";
    const top = btn("libopen", "", () => { if (it.dir) { st.results = null; st.q = ""; load(it.id); } else bring(it); }, it.dir ? `Open the folder "${it.name}"` : `Add "${it.name}" (the import preview comes first)`);
    const head = h("div", "libhead"); head.append(h("span", "libtitle", icon + it.name));
    top.appendChild(head);
    const sub = it.locked ? "needs the PC's password" : it.dir ? `${fmt(it.files || 0)} file${it.files === 1 ? "" : "s"} · ${MB(it.size)}${it.mtime ? " · " + when(it.mtime) : ""}` : `${MB(it.size)} · ${when(it.mtime)}`;
    top.appendChild(h("div", "libsub", sub));
    if (showPath) top.appendChild(h("div", "libsub", it.path));
    r.appendChild(top);
    if (!it.locked) {
      const acts = h("div", "libacts");
      if (it.dir) { acts.append(btn("libact", "Open", () => { st.results = null; st.q = ""; load(it.id); })); if (it.files) acts.append(btn("libact libget", "Add as a book", () => bring(it), `The whole folder as one book (one zip, ${MB(it.size)})`)); }
      else acts.appendChild(btn("libact libget", "Add", () => bring(it), `Add "${it.name}" (the import preview comes first)`));
      r.appendChild(acts);
    }
    return r;
  }
  function pwForm() {
    const box = h("form", "libspec pcpw");
    box.appendChild(h("div", "libh", "🔒 Private: the PC's password"));
    box.appendChild(h("div", "libsub", "The same password as Screen Peek (tray icon on the PC → Set password). This device remembers the sign-in."));
    const inp = h("input", "libname"); inp.type = "password"; inp.autocomplete = "current-password"; inp.placeholder = "Password"; inp.setAttribute("aria-label", "The PC's password");
    const m = h("div", "libmsg bad", st.pwMsg); m.hidden = !st.pwMsg;
    const go = btn("libbtn libadd", "Sign in", () => {}, "");
    go.type = "submit";
    const back = btn("libbtn", "Back", () => { st.pw = false; draw(); });
    const row = h("div", "libbtns"); row.append(go, back);
    box.append(inp, m, row);
    box.addEventListener("submit", async (e) => {
      e.preventDefault();
      go.disabled = true; m.hidden = false; m.classList.remove("bad"); m.textContent = "Signing in…";
      const res = await R().signIn(st.pw.scope, inp.value);
      go.disabled = false;
      if (!res.ok) { st.pwMsg = res.why.charAt(0).toUpperCase() + res.why.slice(1) + "."; m.textContent = st.pwMsg; m.classList.add("bad"); inp.select(); log("book", `From my PC: sign-in refused: ${res.why}`); return; }
      log("book", "From my PC: signed in for the Private folder");
      const f = st.pw.folder; st.pw = false; load(f);
    });
    setTimeout(() => { try { inp.focus(); } catch (e) {} }, 0);
    return box;
  }
  function draw() {
    const body = st.body;
    if (!body) return;
    const box = h("div", "lib pcfiles");
    const top = h("div", "libbtns");
    top.append(btn("libbtn", "◀ Books", () => { stop(); LIBRARY.showList(); }, "Back to the books stored here"));
    box.appendChild(top);
    box.appendChild(h("div", "libh", "From my PC"));
    const m = h("div", "libmsg pcmsg", st.msg); m.hidden = !st.msg; m.classList.toggle("bad", st.bad); m.setAttribute("aria-live", "polite");
    box.appendChild(m);
    if (st.pw) { box.appendChild(pwForm()); body.replaceChildren(box); return; }
    const d = st.data;
    if (d) {
      const crumbs = h("div", "pccrumbs");
      d.crumbs.forEach((c, i) => {
        if (i) crumbs.appendChild(h("span", "pcsep", "›"));
        crumbs.appendChild(i === d.crumbs.length - 1 && !st.results ? h("span", "pchere", c.name) : btn("pccrumb", c.name, () => { st.results = null; st.q = ""; load(c.id); }));
      });
      box.appendChild(crumbs);
      const bar = h("div", "pcbar");
      const q = h("input", "libname pcq"); q.type = "search"; q.placeholder = "Search all of Relay Files"; q.value = st.q; q.setAttribute("aria-label", "Search by name");
      q.addEventListener("input", () => { clearTimeout(st.qTimer); st.qTimer = setTimeout(() => search(q.value), 250); });
      const sort = h("select", "pcsort"); sort.setAttribute("aria-label", "Sort");
      for (const [v, t] of [["name", "Name"], ["date", "Newest"], ["size", "Largest"]]) { const o = h("option", "", t); o.value = v; o.selected = st.sort === v; sort.appendChild(o); }
      sort.addEventListener("change", () => { st.sort = sort.value; draw(); });
      bar.append(q, sort);
      box.appendChild(bar);
      const list = h("div", "liblist");
      const items = st.results ? st.results.items : d.items;
      for (const it of sorted(items)) list.appendChild(item(it, !!st.results));
      if (!items.length) list.appendChild(h("div", "libempty", st.results ? "Nothing on the PC matches." : "This folder is empty."));
      box.appendChild(list);
      const f = d.folder;
      box.appendChild(h("div", "libfoot", `${st.results ? `${fmt(items.length)} found · ` : ""}${fmt(f.files || 0)} file${f.files === 1 ? "" : "s"} · ${MB(f.size)} in ${f.name} · kept up to date while this is open`));
    }
    const hadFocus = document.activeElement && document.activeElement.classList.contains("pcq");
    body.replaceChildren(box);
    if (hadFocus) { const q = box.querySelector(".pcq"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
  }

  // Called by library.js when the Open window shows "From my PC" (render) or leaves it (stop).
  function render(body) {
    const fresh = !st.body;
    st.body = body;
    draw();
    if (fresh) { log("book", `From my PC: opened (${PCRELAY.client().base})`); load(st.data ? st.folder : "root", !!st.data); events(); }
  }

  globalThis.PCFILES = { render, stop, load, search, get state() { return { folder: st.folder, data: st.data, results: st.results, pw: !!st.pw, msg: st.msg, bad: st.bad, events: !!st.ev }; } };
})();
</script>
<script>
// engine.js: what every voice offers the player, and the registry of voices. An engine is
//   { id, name, voices: [{ id, name }], can: { timing, reroll, copies }, sampleRate, maxChars?, hidden?,
//     init(opts), synth(piece, opts) -> Promise<{ audio: Float32Array, sampleRate, words? }>, stop() }
// init(opts) loads the voice (opts: voice, runOn, precision, pace, steps, copies from the settings;
// calling it again with the same opts does nothing); synth makes one piece's sound from piece.speech
// (words: [[word, from, to], ...] in seconds when can.timing); stop() abandons the work in progress
// and keeps the model loaded. maxChars (the browser voices' 220 for online voices) cuts the pieces
// shorter. A voice that speaks for itself (the device makes the sound: the browser voices) has
// speak(piece, opts, { boundary(chars) }) -> Promise<{ chars, ms, stuck?, cancelled? }> instead of
// synth, resolving when the piece has been said (opts.from: say it from that character on; boundary
// is called with the character position of each word as it is spoken), plus position() ->
// { chars, estimated } for where it has got to and hasBoundaries() -> true / false / null (unknown)
// for whether this voice gives word boundaries; stop() cancels what is being said, and the promise
// resolves { cancelled: true }. describe(caps, runOn, voice) tells the Settings window which knobs
// apply to this voice and what the device can run: { runOn: [{ id: "gpu" | "cpu", label, off }],
// precisions: [{ id, label, size, off }], pace, steps, copies (booleans: the knob applies), speaker
// (the number of speakers of a multi-speaker voice, else 0) }, where `off` is a short reason the
// value can't be used here ("" when it can): the window greys it with that reason. caps is
// VOICEWORK.gpu()'s answer. A model engine also has files(opts) -> [{ url, size }] (the files that voice
// setting needs: the fit check, Save's download, Voice_data.zip) and catalog() -> [{ owner, files }] (every
// file it can use, by owner: Settings → Voice data's list and its Delete per voice). No fallbacks (PLAN.md): an engine asked for a setting it cannot run here
// fails at init or synth with a plain reason; `cannot` marks a setting that can't run on this device,
// `fatal` one that gave broken sound; the player stops the reading with the message. ENGINE.register(engine)
// adds one (steps 4b and 5); ENGINE.get(id); ENGINE.list() gives the ones for the voice list;
// ENGINE.parse("kokoro:af_heart") splits a voice setting. Built in: the `tone` voice, a quiet short tone
// per piece for the tests and for checking the player with nothing downloaded (hidden from the voice
// list; reachable as voice "tone:tone").
(function () {
  const engines = new Map();

  function register(e) {
    if (!e || !e.id || (typeof e.synth !== "function" && typeof e.speak !== "function") || typeof e.init !== "function") throw new Error("an engine needs an id, init and synth (or speak)");
    engines.set(e.id, Object.assign({ name: e.id, voices: [{ id: e.id, name: e.id }], can: {}, sampleRate: 24000, stop() {} }, e));
    return engines.get(e.id);
  }

  // ---- The tone voice: perChar ms per character (min 0.4 s), a 220 Hz sine at a tenth of full scale
  // with short fades; word times spread over the speech words by their length. For the tests:
  // failNext (the next n pieces fail), hangNext (the next n never answer), delayMs (each piece waits).
  const tone = {
    id: "tone", name: "Test tone", hidden: true,
    voices: [{ id: "tone", name: "Tone" }],
    can: { timing: true, reroll: false, copies: false },
    sampleRate: 24000,
    perChar: 50, failNext: 0, hangNext: 0, delayMs: 0,
    ready: false, inits: 0, stops: 0,
    async init() { this.ready = true; this.inits++; },
    stop() { this.stops++; },
    describe() { return { runOn: [], precisions: [], pace: false, steps: false, copies: false, speaker: 0 }; },
    async synth(piece) {
      if (this.delayMs) await new Promise((r) => setTimeout(r, this.delayMs));
      if (this.hangNext > 0) { this.hangNext--; await new Promise(() => {}); }
      if (this.failNext > 0) { this.failNext--; throw new Error("tone test failure (asked for)"); }
      const speech = String(piece && piece.speech || piece || "");
      const rate = this.sampleRate;
      const sec = Math.max(0.4, speech.length * this.perChar / 1000);
      const n = Math.round(sec * rate);
      const audio = new Float32Array(n);
      const fade = Math.min(n >> 1, Math.round(rate * 0.02));
      const k = 2 * Math.PI * 220 / rate;
      for (let i = 0; i < n; i++) {
        const env = i < fade ? i / fade : i >= n - fade ? (n - i) / fade : 1;
        audio[i] = 0.1 * env * Math.sin(k * i);
      }
      return { audio, sampleRate: rate, words: spread(speech, 0, sec) };
    },
  };

  // The words of text spread over [from, to] seconds by length: [[word, from, to], ...].
  function spread(text, from, to) {
    const words = String(text).split(/\s+/).filter(Boolean);
    const total = words.reduce((n, w) => n + w.length + 1, 0) || 1;
    const out = [];
    let at = from;
    for (const w of words) {
      const end = at + (to - from) * (w.length + 1) / total;
      out.push([w, at, end]);
      at = end;
    }
    return out;
  }

  register(tone);

  // ---- The silent-chunk check (job 4, BUGS 9: Supertonic's "Huh?" / "Hmph." came out silent) ---------
  // A chunk whose text has letters or digits must have some sound: silence(audio, rate, text) gives null
  // when it has, else { why, voicedMs, peak }: all silent (peak under 0.001) or near-silent (under
  // MIN_VOICED_MS of 10 ms windows with an RMS of VOICED_RMS or more; the quietest real word, a soft
  // "Hmph.", is well over 100 ms of such windows). Supertonic (seed-based) makes such a chunk again with a
  // new seed (engines/supertonic.js); the other model voices are deterministic, so the player only logs it.
  const VOICED_RMS = 0.01, MIN_VOICED_MS = 60;
  function silence(audio, rate, text) {
    if (!/[\p{L}\p{N}]/u.test(String(text || ""))) return null;
    if (!audio || !audio.length || !(rate > 0)) return { why: "no sound at all", voicedMs: 0, peak: 0 };
    const win = Math.max(1, Math.round(rate / 100));
    let peak = 0, voiced = 0;
    for (let s = 0; s < audio.length; s += win) {
      const e = Math.min(audio.length, s + win);
      let sum = 0;
      for (let i = s; i < e; i++) { const v = audio[i]; sum += v * v; const m = v < 0 ? -v : v; if (m > peak) peak = m; }
      if (Math.sqrt(sum / (e - s)) >= VOICED_RMS) voiced += e - s;
    }
    const voicedMs = Math.round(voiced / rate * 1000);
    if (peak < 0.001) return { why: "all silent", voicedMs, peak };
    if (voicedMs < MIN_VOICED_MS) return { why: `near-silent (${voicedMs} ms of voice in ${(audio.length / rate).toFixed(1)} s, peak ${peak.toFixed(3)})`, voicedMs, peak };
    return null;
  }

  // The voice order (PLAN.md): best-sounding first; the voice list follows it.
  const ORDER = ["kokoro", "piper", "supertonic", "webspeech"];
  const rank = (e) => { const i = ORDER.indexOf(e.id); return i < 0 ? ORDER.length : i; };

  globalThis.ENGINE = {
    register, ORDER,
    get: (id) => engines.get(id) || null,
    list: () => Array.from(engines.values()).filter((e) => !e.hidden).sort((a, b) => rank(a) - rank(b)),
    ids: () => Array.from(engines.keys()),
    parse: (setting) => { const [engine, ...rest] = String(setting || "").split(":"); return { engine, voice: rest.join(":") || engine }; },
    spread, silence, VOICED_RMS, MIN_VOICED_MS,
  };
})();
</script>
<script>
// models.js: the model file store. Every library and model file a voice or a listener needs is
// kept in the Cache API, in ONE named cache (br1-models) keyed by its web address; nothing is fetched
// at page open. ONE SOURCE besides the store: the web (an offline package, package.js, puts files in the
// store first; the old Voice_data.zip source that served a zip picked this visit went with it, 2026-10-23). MODELS.get(url) is the one "get this
// file" path: a stored file always serves; otherwise the web when the page is online and Offline mode
// is off; otherwise it fails with the file's name and what to do (`cannot`, so the
// player stops with it: no fallbacks). MODELS.offline() / offlineWhy() say which way it goes. A
// download in flight is shared: a second ask for the same file (Settings' Save, then Play) waits for
// it and gets the same progress. MODELS.need(owner, files) registers what a voice needs ([{ url,
// size }]) so the list of stored files can say which voice each file belongs to; MODELS.ensure(files,
// onProgress) gets the files not stored yet, one at a time, with progress (name, loaded, total, from:
// "web" / "zip") and a log line per file; MODELS.put(url, body, size) stores a file exactly as a
// download is stored (the zip's files: a later load cannot tell them apart; a Blob or a stream, never a
// big body in memory, tried once more on a failure: BUGS 37); MODELS.has(url);
// MODELS.fit(files, { freed }) is the storage half of the fit check (the files not yet stored against
// the free space from navigator.storage.estimate(), plus what Slim mode is about to free, said
// plainly); MODELS.fitMemory(mb) the memory half: a voice's peak working memory against the device's
// ceiling as step 7's benchmark measured it (localStorage br1-memory-ceiling = { mb, when, top?, crashed? }:
// top = the check reached its own 4 GB top, a lower bound that never refuses; crashed = where a check
// stopped with the page, a warning, never a refusal), else
// against half of navigator.deviceMemory (rough and rounded, 8 GB at most on phones: a warning, never a
// refusal);
// MODELS.stored() lists what is in the store (name, size, owner); MODELS.remove(urls, why) deletes,
// only ever from a Settings button or Slim mode's Save, never by itself (BUGS 11). MODELS.PEAK_MB /
// MODELS.peak() give each voice's peak working memory. MODELS.WORKER is the worker-side half as source
// text (voicework.js and mp3.js put it first in their workers): fetch() and caches.open() shims, so
// every file a library fetches or caches by itself lands in the same store under the same key (with
// progress messages to the page), importLib(url), which loads a library from the store (its text
// as a blob: address, so a stored library loads with no internet; the web address when the blob
// import fails, online only), and libUrl(url), a stored module's blob: address for a library that imports a file
// by itself (ONNX Runtime's wasmPaths.mjs).
(function () {
  const g = globalThis;
  const KEY = g.APP_KEY || "br1";
  const CACHE = KEY + "-models";
  const CEILING_KEY = KEY + "-memory-ceiling";
  const owners = new Map();           // url -> the voice it belongs to
  const sizes = new Map();            // url -> the size the voice's list says
  const inflight = new Map();         // url -> { done: Promise<stored?>, listeners: Set } (downloads under way)
  const MB = (n) => (n >= 2e9 ? (n / 1e9).toFixed(1) + " GB" : (n >= 1e8 ? (n / 1e6).toFixed(0) : (n / 1e6).toFixed(1)) + " MB");
  const href = (u) => { try { return new URL(u).href; } catch (e) { return String(u); } };
  const say = (type, msg) => { if (typeof g.log === "function") g.log(type, msg); };

  // A short name: the file name, with the package and version for a library from the CDN.
  function nameOf(url) {
    const u = String(url);
    const m = u.match(/^https:\/\/cdn\.jsdelivr\.net\/npm\/((?:@[^/]+\/)?[^/]+)(?:\/.*)?\/([^/]+)$/);
    if (m) return m[1] + "/" + m[2];
    return u.split("/").pop() || u;
  }
  const typeOf = (url) => (/\.wasm$/.test(url) ? "application/wasm" : /(\.m?js|\+esm)$/.test(url) ? "text/javascript" : /\.json$/.test(url) ? "application/json" : "application/octet-stream");
  const open = () => { if (typeof caches === "undefined") throw new Error("this browser has no file store here (Cache API)"); return caches.open(CACHE); };
  const sizeOf = async (res) => Number(res.headers.get("content-length")) || (await res.clone().blob()).size;
  // Offline: Offline mode is on (Settings → Voice data), or there is no internet.
  const modeOn = () => !!(g.SETTINGS && g.SETTINGS.get("offline"));
  const offline = () => modeOn() || navigator.onLine === false;
  const offlineWhy = () => (modeOn() ? "Offline mode is on" : "there is no internet");

  function need(owner, files) {
    for (const f of files) { const u = href(f.url); owners.set(u, owner); if (f.size) sizes.set(u, Number(f.size)); }
    return files;
  }

  // ---- The sources, tried in order. Each gets { url, size } and gives a Response or null (not mine). --
  async function fromStore(file) {
    let c;
    try { c = await open(); } catch (e) { return null; }
    return (await c.match(file.url)) || null;
  }
  const has = async (url) => !!(await fromStore({ url: href(url) }));
  // The web, only when online with Offline mode off. One download per file at a time, shared by every
  // ask (each gets the progress); the stored copy is what goes back.
  async function fromWeb(file, ctx) {
    if (offline()) return null;
    let job = inflight.get(file.url);
    if (!job) {
      job = { listeners: new Set() };
      job.done = download(file, ctx.signal, (name, loaded, total) => { for (const f of job.listeners) f(name, loaded, total, "web"); })
        .finally(() => inflight.delete(file.url));
      inflight.set(file.url, job);
    }
    if (ctx.progress) job.listeners.add(ctx.progress);
    try { await job.done; } finally { if (ctx.progress) job.listeners.delete(ctx.progress); }
    return (await fromStore(file)) || fetch(file.url, { signal: ctx.signal });
  }
  // The body is stored as it streams (one copy in memory at most) while a second reader counts it for
  // the progress. Resolves true when stored, false when it could not be (then each asker fetches).
  async function download(file, signal, progress) {
    const name = nameOf(file.url);
    const t0 = performance.now();
    let res;
    try { res = await fetch(file.url, { signal }); } catch (e) { if (e && e.name === "AbortError") throw e; throw new Error(`${name} could not be downloaded: ${e.message}. To bring it from another device instead, import an offline package (Settings → Offline package).`); }
    if (!res.ok) throw new Error(`${name} could not be downloaded (HTTP ${res.status})`);
    // A compressed transfer (the CDN's libraries) says the compressed length: the real count comes
    // from reading, and the stored record is given it afterwards.
    const packed = !!res.headers.get("content-encoding");
    const total = (!packed && Number(res.headers.get("content-length"))) || file.size || 0;
    const headers = { "content-type": res.headers.get("content-type") || typeOf(file.url) };
    if (!packed && res.headers.get("content-length")) headers["content-length"] = res.headers.get("content-length");
    let c = null;
    try { c = await open(); } catch (e) {}
    if (!c || !res.body) return false;
    const [a, b] = res.body.tee();
    const put = c.put(file.url, new Response(a, { status: 200, headers }));
    put.catch(() => {});                // awaited below; a body that breaks off rejects it too
    const reader = b.getReader();
    let loaded = 0, last = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;

        try { for (const k in inst.exports) keep(inst.exports[k]); } catch (e) {}
        try { for (const a in imports) for (const b in imports[a]) keep(imports[a][b]); } catch (e) {}
      };
      const Mem = WebAssembly.Memory;
      WebAssembly.Memory = function (d) { const m = new Mem(d); keep(m); return m; };
      WebAssembly.Memory.prototype = Mem.prototype;
      for (const fn of ["instantiate", "instantiateStreaming"]) {
        const orig = WebAssembly[fn];
        if (orig) WebAssembly[fn] = function (src, imports) { return orig.apply(this, arguments).then((r) => { scan(r.instance || r, imports); return r; }); };
      }
    })();
  `;
  const PROTOCOL = `
    const normalize = ${normalize.toString()};
    const explain = ${explain.toString()};
    const firstLine = ${firstLine.toString()};
    const api = { log: (msg, level) => postMessage({ type: "log", level: level || "info", msg: String(msg) }) };
    function finish(r) {
      if (!r || !r.audio || !r.audio.length) throw new Error("the voice gave no sound");
      let audio = r.audio instanceof Float32Array ? r.audio : Float32Array.from(r.audio);
      if (audio.byteOffset || audio.byteLength !== audio.buffer.byteLength) audio = audio.slice();
      const s = normalize(audio);
      if (s.nan) throw new Error("the voice gave broken sound (" + s.nan + " samples are not numbers)");
      return Object.assign({}, r, { audio, peak: s.peak, peakBefore: s.peakBefore });
    }
    let workedUntil = 0;
    onmessage = async (e) => {
      const m = e.data;
      if (m.type === "stop") { try { if (ENGINE.stop) ENGINE.stop(); } catch (x) {} return; }
      if (m.type === "memory") { postMessage({ type: "memory", id: m.id, wasmMB: wasmMB() }); return; }
      try {
        let result;
        if (m.type === "init") result = await ENGINE.init(m.opts, api);
        else if (m.type === "synth") { result = finish(await ENGINE.synth(m.text, m.opts, api)); workedUntil = performance.now(); }
        else if (m.type === "hear") { result = await ENGINE.hear(m.audio, m.opts, api); workedUntil = performance.now(); }
        else throw new Error("unknown message " + m.type);
        postMessage({ type: "done", id: m.id, result: result || {}, wasmMB: wasmMB() }, result && result.audio ? [result.audio.buffer] : []);
      } catch (err) {
        postMessage({ type: "fail", id: m.id, error: explain(err), cannot: /not enough memory/.test(explain(err)), wasmMB: wasmMB() });
      }
    };
    self.addEventListener("unhandledrejection", (e) => api.log("unhandled in the worker: " + firstLine((e.reason && (e.reason.message || e.reason)) || "?"), "warn"));
    let pulse = performance.now();
    setInterval(() => {
      const now = performance.now(), gap = (now - pulse) / 1000, was = pulse;
      pulse = now;
      if (gap > 3 && workedUntil < was) api.log("this worker was not run for " + gap.toFixed(1) + " s", "warn");
    }, 1000);
    postMessage({ type: "hello" });
  `;

  // ---- The page side ---------------------------------------------------------------------------------
  let gpuInfo = null;
  function gpu() {
    if (gpuInfo) return gpuInfo;
    gpuInfo = (async () => {
      if (!navigator.gpu) return { ok: false, f16: false, name: "", why: "this browser gives no WebGPU here" };
      let adapter = null;
      try { adapter = await navigator.gpu.requestAdapter(); } catch (e) { return { ok: false, f16: false, name: "", why: `WebGPU refused an adapter: ${e.message}` }; }
      if (!adapter) return { ok: false, f16: false, name: "", why: "WebGPU found no graphics adapter" };
      const info = adapter.info || {};
      const name = [info.vendor, info.architecture, info.description].filter(Boolean).join(" ") || "unnamed adapter";
      const f16 = !!(adapter.features && adapter.features.has("shader-f16"));
      g.log && g.log("voice", `WebGPU: ${name}, 16-bit math (shader-f16) ${f16 ? "yes" : "no"}`);
      return { ok: true, f16, name, why: "" };
    })();
    return gpuInfo;
  }
  // Copies on the processor: the setting, else half the cores (at least 1, at most 4) until the benchmark says.
  const copies = (n) => (Number(n) > 0 ? Math.max(1, Math.min(16, Math.round(Number(n)))) : Math.max(1, Math.min(8, Math.floor((navigator.hardwareConcurrency || 2) / 2))));   // half the threads, up to 8 (Jon's PC: 8 copies of Kokoro q8 = 1.9×)

  function pool(spec) {
    const name = spec.name || spec.id;
    const code = [HOOK, g.MODELS.WORKER, PROTOCOL, spec.code].join("\n");
    const P = { id: spec.id, name, copies: 1, workers: [], status: "", opts: null, key: "", pieces: 0, deaths: 0, growing: false, growFailed: "" };
    const waiters = [];
    let next = 0, seq = 0, startP = null;
    const wake = () => { while (waiters.length) waiters.shift()(); };
    const onStatus = (t) => { P.status = t; if (spec.onStatus) spec.onStatus(t); };
    const live = () => P.workers.filter((r) => r.ready);

    function spawn() {
      return new Promise((resolve, reject) => {
        const rec = { n: ++next, w: null, ready: false, busy: false, jobs: new Map(), wasmMB: 0, peakMB: 0, got: [], gotBytes: 0, dead: false };
        const url = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
        let w;
        try { w = new Worker(url, { name: `${spec.id}-${rec.n}` }); } catch (e) { URL.revokeObjectURL(url); reject(new Error(`the ${name} worker could not be started: ${e.message}`)); return; }
        URL.revokeObjectURL(url);
        if (g.MODELS && MODELS.track) MODELS.track(w);       // told when Offline mode changes (D15)
        rec.w = w;
        let started = false;
        const timer = setTimeout(() => { if (!started) { w.terminate(); reject(new Error(`the ${name} worker did not start in 10 s`)); } }, 10000);
        w.onerror = (e) => {
          if (e.preventDefault) e.preventDefault();
          const msg = e.message || "the worker stopped without a message";
          if (!started) { clearTimeout(timer); w.terminate(); reject(new Error(`the ${name} worker failed to start: ${msg}`)); return; }
          died(rec, Object.assign(new Error(`the ${name} worker stopped: ${msg}`), { worker: true }));
        };
        w.onmessage = (e) => {
          const m = e.data;
          if (m.type === "hello") { started = true; clearTimeout(timer); resolve(rec); return; }
          if (m.type === "log") { g.log(m.level === "error" ? "error" : "worker", `${name}${rec.n > 1 ? " #" + rec.n : ""}: ${m.msg}`); return; }
          if (m.type === "progress") { onStatus(`${m.total && m.loaded >= m.total ? "Loading" : "Downloading"} ${m.name}: ${MB(m.loaded)}${m.total ? ` of ${MB(m.total)}` : ""}`); return; }
          if (m.type === "fetched") {
            if (m.from === "web") g.log("download", `${name} worker downloaded ${m.name} (${MB(m.size)} in ${(m.ms / 1000).toFixed(1)} s)`);
            else { rec.got.push(m.name); rec.gotBytes += m.size; }
            return;
          }
          if (m.wasmMB) { rec.wasmMB = m.wasmMB; rec.peakMB = Math.max(rec.peakMB, m.wasmMB); }
          const job = rec.jobs.get(m.id);
          if (!job) return;
          rec.jobs.delete(m.id);
          clearTimeout(job.timer);
          if (m.type === "fail") job.rej(Object.assign(new Error(m.error), { cannot: !!m.cannot }));
          else job.res(m.type === "memory" ? m.wasmMB : m.result);
        };
      });
    }
    function send(rec, type, payload, ms, transfer) {
      return new Promise((res, rej) => {
        const id = ++seq;
        const job = { res, rej, type, timer: 0 };
        rec.jobs.set(id, job);
        if (ms > 0) job.timer = setTimeout(() => {
          if (!rec.jobs.has(id)) return;
          const text = payload && payload.text ? ` while making "${String(payload.text).slice(0, 40)}…"` : "";
          died(rec, Object.assign(new Error(`no answer from the ${name} worker in ${Math.round(ms / 1000)} s${text}`), { worker: true, timeout: true }));
        }, ms);
        rec.w.postMessage(Object.assign({ type, id }, payload || {}), transfer || []);
      });
    }
    // A worker that died or hangs: ended, its jobs failed, out of the pool. The next synth replaces it.
    function died(rec, err) {
      if (rec.dead) return;
      rec.dead = true;
      if (!err.stopped) P.deaths++;
      try { rec.w.terminate(); } catch (e) {}
      P.workers = P.workers.filter((r) => r !== rec);
      for (const job of rec.jobs.values()) { clearTimeout(job.timer); job.rej(err); }
      rec.jobs.clear();
      g.log(err.stopped ? "voice" : "error", `${name} worker${rec.n > 1 ? " #" + rec.n : ""} ended: ${err.message}${P.workers.length ? "" : "; it is started again on the next piece"}`);
      wake();
    }
    const INIT_MS = 240000;        // a load that takes longer than this is stuck (the files are prefetched by the page)
    async function startOne() {
      const rec = await spawn();
      P.workers.push(rec);
      const t0 = performance.now();
      try { rec.result = await send(rec, "init", { opts: P.opts }, INIT_MS); }
      catch (e) { if (!rec.dead) { P.workers = P.workers.filter((r) => r !== rec); rec.w.terminate(); } throw e; }
      if (rec.dead) throw new Error(`the ${name} worker stopped while loading`);
      rec.ready = true;
      rec.busy = false;
      g.log("voice", `${name}${rec.n > 1 ? " copy #" + rec.n : ""} loaded in ${((performance.now() - t0) / 1000).toFixed(1)} s${rec.got.length ? ` (${rec.got.length} files from the store, ${MB(rec.gotBytes)})` : ""}`);
      rec.got = []; rec.gotBytes = 0;
      // Fewer copies asked for while this one loaded (init(opts, 1) during a grow): shrink() skipped it
      // then, as it was not ready, so it is ended now instead of running on unwanted (steady-tests 2026-10-22).
      if (live().length > P.copies) shrink();
      wake();
      return rec;
    }
    // The first worker: started once at a time; the pool's init and a restart share it.
    function start() {
      if (!startP) startP = startOne().finally(() => { startP = null; });
      return startP;
    }
    async function grow() {
      if (P.growing) return;
      P.growing = true;
      try {
        while (P.opts && P.workers.length < P.copies && !P.growFailed) {
          try { await startOne(); } catch (e) { P.growFailed = firstLine(e.message); g.log("error", `no more ${name} copies: ${P.growFailed} (${live().length} running)`); break; }
        }
      } finally { P.growing = false; }
    }

    function shrink() {
      while (live().length > P.copies) {
        const rec = live().reverse().find((r) => !r.busy);
        if (!rec) return;
        rec.dead = true; rec.w.terminate();
        P.workers = P.workers.filter((r) => r !== rec);
        g.log("voice", `${name} copy #${rec.n} ended (${P.copies} wanted)`);
      }
    }
    // Load the voice: the first worker started here (the others follow in the background); workers
    // already loaded get the new opts in place (the worker side decides what that reloads).
    P.init = async function (opts, n) {
      const changed = JSON.stringify(opts) !== P.key;
      P.opts = opts; P.key = JSON.stringify(opts); P.copies = Math.max(1, n || 1);
      if (changed) P.growFailed = "";
      let first = live()[0];
      if (!first) { onStatus(`Loading ${name}`); first = await start(); onStatus(""); g.log("memory", P.memory()); }
      else if (changed) for (const rec of live()) rec.result = await send(rec, "init", { opts }, INIT_MS);
      shrink();
      if (P.workers.length < P.copies) grow();
      return first.result || {};
    };
    async function pick() {
      for (;;) {
        const rec = P.workers.find((r) => r.ready && !r.busy);
        if (rec) { rec.busy = true; return rec; }
        if (!P.workers.length) { if (!P.opts) throw new Error(`${name} is not loaded`); await start(); if (P.workers.length < P.copies) grow(); continue; }
        await new Promise((r) => waiters.push(r));
      }
    }
    P.synth = async function (text, opts, ms) {
      const limit = ms > 0 ? ms : 120000 + 400 * String(text).length;
      for (let attempt = 0; ; attempt++) {
        const rec = await pick();
        try {
          const r = await send(rec, "synth", { text, opts }, limit);
          rec.busy = false;
          wake();
          if (++P.pieces % 10 === 0) g.log("memory", P.memory());
          return r;
        } catch (e) {
          if (!rec.dead) { rec.busy = false; wake(); }
          if (!e.worker || attempt >= 1) throw e;
          g.log("error", `${name}: ${e.message}; a new worker gets the piece once more`);
        }
      }
    };
    // A listener's job (listener.js): the sound (copied to the worker; kept here for a second ask) to ENGINE.hear, with the
    // same watchdog, one more ask on a fresh worker when the first died, then the real error.
    P.hear = async function (audio, opts, ms) {
      for (let attempt = 0; ; attempt++) {
        const rec = await pick();
        const copy = attempt ? audio.slice() : audio;
        try {
          const r = await send(rec, "hear", { audio: copy, opts }, ms > 0 ? ms : 120000, attempt ? [copy.buffer] : []);
          rec.busy = false;
          wake();
          if (++P.pieces % 10 === 0) g.log("memory", P.memory());
          return r;
        } catch (e) {
          if (!rec.dead) { rec.busy = false; wake(); }
          if (!e.worker || attempt >= 1) throw e;
          g.log("error", `${name}: ${e.message}; a new worker gets the piece once more`);
        }
      }
    };
    P.stop = function () {
      for (const rec of P.workers.slice()) {
        if (rec.jobs.size) died(rec, Object.assign(new Error(`${name} was stopped while it was making a piece`), { stopped: true }));
        else { try { rec.w.postMessage({ type: "stop" }); } catch (e) {} }
      }
      wake();
    };
    P.close = function () {
      for (const rec of P.workers) { rec.dead = true; try { rec.w.terminate(); } catch (e) {} for (const job of rec.jobs.values()) { clearTimeout(job.timer); job.rej(Object.assign(new Error(`${name} was closed`), { stopped: true })); } }
      P.workers = [];
      wake();
    };
    P.memory = function () {
      const ws = P.workers.filter((r) => r.wasmMB);
      const peak = Math.max(0, ...P.workers.map((r) => r.peakMB));
      const heap = performance.memory ? ` · page heap ${Math.round(performance.memory.usedJSHeapSize / 1048576)} MB` : "";
      return `memory: ${name} worker wasm ${ws.length ? ws.map((r) => r.wasmMB + " MB").join(" + ") + ` (peak ${peak})` : "– (not reported yet)"}${P.workers.length > 1 ? ` · ${live().length} copies` : ""}${heap}`;
    };
    Object.defineProperty(P, "ready", { get: () => live().length });
    return P;
  }

  // What every model engine's init does: register and fit-check its files (a voice that won't fit
  // is a `cannot`: the player stops with the reason), get the missing ones (MODELS.ensure: the web, or
  // Voice_data.zip when offline; a file neither can give is a `cannot` naming it) with progress on
  // E.status, then load the voice in E.pool (made on first use from spec.code) with spec.copies.
  async function load(E, spec) {
    g.MODELS.need(spec.owner, spec.files);
    const f = await g.MODELS.fit(spec.files);
    g.log("storage", `${spec.owner}: ${f.text}`);
    if (!f.ok) throw Object.assign(new Error(f.text), { cannot: true });
    E.status = "";
    await g.MODELS.ensure(spec.files, (name, loaded, total, from) => { E.status = `${from === "zip" ? "Taking" : "Downloading"} ${name}${from === "zip" ? " from Voice_data.zip" : ""}: ${MB(loaded)}${total ? ` of ${MB(total)}` : ""}`; });
    if (!E.pool) E.pool = pool({ id: E.id, name: E.name, code: spec.code, onStatus: (t) => { E.status = t; } });
    const r = await E.pool.init(spec.opts, spec.copies);
    E.copies = E.pool.copies;
    E.status = "";
    return r;
  }

  g.VOICEWORK = { pool, load, gpu, copies, normalize, explain, PEAK, HOOK, PROTOCOL, MB };
})();
</script>
<script>
// engines/kokoro.js: Kokoro 82M, the main voice. Voices in their makers' grade order (PLAN.md "Voice
// order", af_heart first). Precisions fp32 / fp16 / q8 / q4 / q4f16, offered only where they run:
// fp16 and q4f16 need a graphics card with 16-bit math (shader-f16; the GTX 1050 Ti has none), q8 on a
// card is slow and was garbled on the 1050 Ti (the label says so), the processor runs q8 / fp32 / q4.
// fp16 is never picked by itself: on the Pixel's Adreno it gave NaN for every piece (BUGS 28), so the
// default is fp32 on every card and fp16 / q4f16 are choices "faster where it works". NO FALLBACKS
// (PLAN.md, BUGS 29): broken sound (NaN, or all zero) is the precision's fault on this device, not the
// voice's: that precision and where it ran go into the `brokenPrecisions` setting for good ("kokoro
// gpu fp16"), and the chunk FAILS with a plain reason marked `fatal` ("Kokoro fp16 gives broken sound
// on this card (the samples are not numbers). Choose fp32 in Settings → Voice."), which the player
// puts on the status line and in the log as it stops the reading; nothing is switched. The memory
// serves the Settings window only (describe() greys the precision with the reason), and a remembered
// precision chosen again fails at the load the same way. "Run on" card or processor; pace is the
// model's own speed. Asked for the card with no WebGPU here, or for a 16-bit precision on a card
// without shader-f16, init fails with `cannot` and the reason, and the player stops. The player gives
// synth() a piece's sentence CHUNKS (pieces.js), so a card run is a sentence or two: measured
// 2026-10-17 (research/gpu-yield), that cuts the screen freezes while the card works from 48 % of
// the time with 1.6 s worst to 8 % with 0.17 s worst on the 1050 Ti, at the same speed.
//
// The model is the TIMESTAMPED export, onnx-community/Kokoro-82M-v1.0-ONNX-timestamped: the same
// files and sizes as the plain one plus a `durations` output, one value per input token (the two pad
// tokens included), one unit = 600 samples at 24 kHz = 25 ms (seconds = value / 40). How it is run:
// kokoro-js 1.2.1 (which bundles Transformers.js 3.5.1 and ONNX Runtime 1.21.0) loads it as it loads
// the plain model, and its phonemizer (espeak-ng through the phonemizer package, with its English
// rules), tokenizer and voice files are used as they are, because that phonemization is what Jon
// judged (0.6 faults per 100 words). Its generate() reads only `waveform` from the model call and
// drops the rest, so the model's forward() is wrapped once at load to keep every output of the last
// call; synth then has the durations and the token ids of the piece it just made. That is the smaller
// path: calling the model through Transformers.js directly would mean re-writing kokoro-js's English
// text normalisation and phoneme post-processing (and its voice slicing) for no gain. The model's
// real output names are read at load and logged; with `durations` there, wordTimes() turns them into
// one time per word (tokens between space tokens = one word; the total is checked against the audio
// length, within 5 % logged as a match, and the times are scaled to the audio either way); when the
// token words do not pair one-to-one with the speech words, that piece falls back to the estimate
// (counted in the log). Without `durations` the log says so once and the highlight uses the estimate.
// Pieces are cut at 300 characters (the model reads at most 510 phonemes at a time).
// Engine choice (job 2, setting kokoroEngine, Settings → Voice → Engine): "current" (the default) is
// all of the above; "newer" (experimental) runs the same model file through Transformers.js 4.3.1 /
// ONNX Runtime 1.31's native WebGPU provider and keeps kokoro-js's front end (research/gpu-

// RedMagic it was half as fast, 1.19× against 2.52×). Its files (transformers.min.js and the asyncify
// ONNX Runtime) go through the same store, fit check, Voice_data.zip and export (files() / catalog():
// owners "Kokoro current engine" / the shared runtime's, MODELS.RUNTIME.owner: EFF-15). One engine per worker; a failed load closes

(function () {

  // Transformers.js 4.3.1 with ONNX Runtime 1.31's native WebGPU provider (its asyncify build) runs the
  // same model file; kokoro-js stays for the English front end (phonemizer, voices, its generate()).
  // The runtime is the one Supertonic and the listeners load too (MODELS.RUNTIME, EFF-15): one stored copy.

  const ORT4 = MODELS.RUNTIME.ort;

  const HF = `https://huggingface.co/${MODEL}/resolve/main/`;
  const UNIT = 1 / 40;
  const MAX_CHARS = 300;

  // id, name, grade (the makers'), in grade order.
  const VOICES = [
    ["af_heart", "Heart (US female)", "A"], ["af_bella", "Bella (US female)", "A-"], ["af_nicole", "Nicole (US female, soft)", "B-"], ["bf_emma", "Emma (UK female)", "B-"],
    ["af_aoede", "Aoede (US female)", "C+"], ["af_kore", "Kore (US female)", "C+"], ["af_sarah", "Sarah (US female)", "C+"], ["am_fenrir", "Fenrir (US male)", "C+"], ["am_michael", "Michael (US male)", "C+"], ["am_puck", "Puck (US male)", "C+"],
    ["af_nova", "Nova (US female)", "C"], ["af_alloy", "Alloy (US female)", "C"], ["bf_isabella", "Isabella (UK female)", "C"], ["bm_george", "George (UK male)", "C"], ["bm_fable", "Fable (UK male)", "C"],
    ["af_sky", "Sky (US female)", "C-"], ["bm_lewis", "Lewis (UK male)", "D+"],
    ["af_jessica", "Jessica (US female)", "D"], ["af_river", "River (US female)", "D"], ["am_echo", "Echo (US male)", "D"], ["am_eric", "Eric (US male)", "D"], ["am_liam", "Liam (US male)", "D"], ["am_onyx", "Onyx (US male)", "D"], ["bf_alice", "Alice (UK female)", "D"], ["bf_lily", "Lily (UK female)", "D"], ["bm_daniel", "Daniel (UK male)", "D"],

  ].map(([id, name, grade]) => ({ id, name: `${name}, grade ${grade}`, grade }));

  // The precisions: file, size, where they run, what to say.
  const PRECISIONS = [
    { id: "fp32", file: "model.onnx", size: 325532171, gpu: true, cpu: true, label: "fp32 (326 MB): the reference sound" },
    { id: "fp16", file: "model_fp16.onnx", size: 163232776, gpu: true, cpu: false, f16: true, label: "fp16 (163 MB): needs a graphics card with 16-bit math; faster where it works, broken sound on some cards" },
    { id: "q8", file: "model_quantized.onnx", size: 92361055, gpu: true, cpu: true, label: "8-bit (92 MB): best on the processor; slow on a graphics card, garbled on a GTX 1050 Ti" },
    { id: "q4", file: "model_q4.onnx", size: 305215905, gpu: true, cpu: true, label: "4-bit (305 MB): runs on either" },
    { id: "q4f16", file: "model_q4f16.onnx", size: 154584426, gpu: true, cpu: false, f16: true, label: "4-bit with fp16 (155 MB): needs a graphics card with 16-bit math; faster where it works, broken sound on some cards" },
  ];
