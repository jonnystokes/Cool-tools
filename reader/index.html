  // information for the Settings window, never an automatic switch (BUGS 29).
  const onWhat = (runOn) => (runOn === "gpu" ? "the card" : "the processor");
  const thisWhat = (runOn) => (runOn === "gpu" ? "this card" : "this processor");
  const brokenKey = (runOn, p) => `kokoro ${runOn} ${p}`;
  const brokenList = () => (globalThis.SETTINGS ? SETTINGS.get("brokenPrecisions") : []) || [];
  const isBroken = (runOn, p) => brokenList().includes(brokenKey(runOn, p));
  function markBroken(runOn, p) {
    const list = brokenList().slice();
    if (list.includes(brokenKey(runOn, p))) return;
    list.push(brokenKey(runOn, p));
    if (globalThis.SETTINGS) SETTINGS.set("brokenPrecisions", list);
  }
  const CHOOSE = (p) => `Choose ${p === "fp32" ? "8-bit" : "fp32"} in Settings → Voice.`;
  const fail = (message, kind) => Object.assign(new Error(message), { [kind]: true });
  // Why precision p can't be used on runOn here ("" when it can): the device (caps = VOICEWORK.gpu()'s
  // { ok, f16, name, why }), the precision's own limits, then the memory of broken sound.
  function offReason(caps, runOn, p) {
    if (runOn === "gpu") {
      if (!(caps && caps.ok)) return (caps && caps.why) || "no graphics card here";
      if (p.f16 && !caps.f16) return `needs a graphics card with 16-bit math (shader-f16); ${caps.name || "this card"} has none`;
    } else if (!p.cpu) return "a graphics-card precision; the processor runs fp32, 8-bit or 4-bit";
    if (isBroken(runOn, p.id)) return `gave broken sound on ${thisWhat(runOn)} before (remembered on this device)`;
    return "";
  }
  // The precisions this device can run (no reason against them): [{ id, label, size }].
  const precisions = (caps, runOn) => PRECISIONS.filter((p) => !offReason(caps, runOn, p)).map((p) => ({ id: p.id, label: p.label, size: p.size }));
  // The two engines: what they are called, and the runtime files each needs beside kokoro-js.
  const ENGINES = {
    current: { label: "the current engine (kokoro-js 1.2.1, Transformers.js 3.5.1, ONNX Runtime 1.21)", libs: [{ url: WASM + "mjs", size: 44484 }, { url: WASM + "wasm", size: 21596019 }] },
    newer: { label: "the newer engine (Transformers.js 4.3.1, ONNX Runtime 1.31, experimental)", libs: MODELS.RUNTIME.files.map((f) => Object.assign({}, f)) },
  };
  const which = (opts) => (opts && opts.engine === "newer" ? "newer" : "current");
  const libsOf = (opts) => [{ url: LIB, size: 2135146 }].concat(ENGINES[which(opts)].libs);
  function files(opts) {
    const p = PRECISIONS.find((x) => x.id === opts.precision) || PRECISIONS[0];
    return libsOf(opts).concat([{ url: HF + "config.json", size: 44 }, { url: HF + "tokenizer.json", size: 3497 }, { url: HF + "tokenizer_config.json", size: 113 },
      { url: HF + "onnx/" + p.file, size: p.size }, { url: VOICE_FILES + opts.voice + ".bin", size: 523000 }]);
  }
  // Every file Kokoro can use, by owner (Settings → Voice data's list and Delete, Voice_data.zip's
  // maker): one model file per precision, and the shared rest (libraries, settings, every voice).
  const catalog = () => [{ owner: "Kokoro shared files", files: files({ precision: "fp32", voice: VOICES[0].id }).filter((f) => !/\/onnx\//.test(f.url) && !/\/voices\//.test(f.url) && !ENGINES.current.libs.some((l) => l.url === f.url)).concat(VOICES.map((v) => ({ url: VOICE_FILES + v.id + ".bin", size: 523000 }))) },
    { owner: "Kokoro current engine", files: ENGINES.current.libs }, { owner: MODELS.RUNTIME.owner, files: ENGINES.newer.libs }]
    .concat(PRECISIONS.map((p) => ({ owner: `Kokoro ${p.id} model`, files: [{ url: HF + "onnx/" + p.file, size: p.size }] })));

  // The word times from the model's durations. phonemes: one symbol per token (the pads as "$");
  // durations: one value per token. The tokens between space tokens are the "token words"; they pair
  // with the speech words in order, but espeak-ng joins some little words to their neighbour ("of
  // the" is one token word) and the text rules can split one, so when the counts differ a token word
  // much longer than the speech word expected takes two speech words (split by their expected
  // length), and a speech word much longer than its token word takes two. Gives { words: [[word,
  // from, to]], total, ratio, ok, matched, merged, split, groups, count }: total is the durations' sum
  // in seconds, ratio total / audio length, ok whether that is within 5 % (the times are scaled to
  // the audio either way), matched whether the counts were equal.
  function wordTimes(speech, phonemes, durations, audioSec) {
    if (!phonemes || !durations || !durations.length || durations.length !== phonemes.length) return null;
    const total = durations.reduce((a, b) => a + Number(b), 0) * UNIT;
    const ratio = audioSec > 0 && total > 0 ? total / audioSec : 0;
    const scale = ratio > 0 ? 1 / ratio : 1;
    const groups = [];
    let start = -1;
    for (let i = 0; i < phonemes.length; i++) {
      const gap = phonemes[i] === " " || ((i === 0 || i === phonemes.length - 1) && phonemes[i] === "$");
      if (gap) { if (start >= 0) { groups.push([start, i]); start = -1; } }
      else if (start < 0) start = i;
    }
    if (start >= 0) groups.push([start, phonemes.length]);
    const words = String(speech).split(/\s+/).filter(Boolean);
    const out = { words: [], total, ratio, ok: ratio > 0 && Math.abs(ratio - 1) <= 0.05, matched: words.length === groups.length, merged: 0, split: 0, groups: groups.length, count: words.length };
    if (!words.length || !groups.length) { out.words = null; return out; }
    const cum = [];
    let c = 0;
    for (const d of durations) { c += Number(d) * UNIT * scale; cum.push(c); }
    // A word starts where the one before it ends; the first after the leading pad token (silence).
    const from = (g) => (g === 0 ? (groups[0][0] > 0 ? cum[groups[0][0] - 1] : 0) : cum[groups[g - 1][1] - 1]), to = (g) => cum[groups[g][1] - 1];
    const lens = groups.map(([a, b]) => b - a);
    const perChar = lens.reduce((n, l) => n + l, 0) / words.reduce((n, w) => n + w.length, 0);
    const expect = words.map((w) => w.length * perChar);
    let g = 0;
    for (let w = 0; w < words.length; w++) {
      const wordsLeft = words.length - w, groupsLeft = groups.length - g;
      if (groupsLeft <= 0) { const end = to(groups.length - 1); out.words.push([words[w], end, end]); continue; }
      if (wordsLeft > groupsLeft && w + 1 < words.length && lens[g] >= 1.5 * expect[w]) {
        const a = from(g), b = to(g), mid = a + (b - a) * expect[w] / (expect[w] + expect[w + 1]);
        out.words.push([words[w], a, mid], [words[w + 1], mid, b]);
        out.merged++; w++; g++;
      } else if (groupsLeft > wordsLeft && g + 1 < groups.length && expect[w] >= 1.5 * lens[g]) {
        out.words.push([words[w], from(g), to(g + 1)]);
        out.split++; g += 2;
      } else { out.words.push([words[w], from(g), to(g)]); g++; }
    }
    if (g < groups.length) out.words[out.words.length - 1][2] = to(groups.length - 1);
    return out;
  }

  const WORKER = `
    const LIB = ${JSON.stringify(LIB)}, WASM = ${JSON.stringify(WASM)}, MODEL = ${JSON.stringify(MODEL)}, TLIB = ${JSON.stringify(TLIB)}, ORT4 = ${JSON.stringify(ORT4)};
    self.ENGINE = {
      tts: null, key: "", last: null, vocab: null, symbols: new Map(), outputs: [], engine: "",
      async init(opts, api) {
        const engine = opts.engine === "newer" ? "newer" : "current";
        if (this.engine && this.engine !== engine) throw new Error("this worker runs the " + this.engine + " engine; the " + engine + " one needs a new worker");
        this.engine = engine;
        if (engine === "newer") return this.initNewer(opts, api);
        const key = opts.runOn + " " + opts.precision;
        if (this.tts && this.key === key) return { outputs: this.outputs, same: true };
        const lib = await importLib(LIB);
        lib.env.wasmPaths = { mjs: await libUrl(WASM + "mjs"), wasm: WASM + "wasm" };     // the .mjs from the store (offline too)
        if (this.tts) { try { await this.tts.model.dispose(); } catch (e) {} this.tts = null; this.key = ""; }
        const tts = await lib.KokoroTTS.from_pretrained(MODEL, { dtype: opts.precision, device: opts.runOn === "gpu" ? "webgpu" : "wasm" });
        const model = tts.model, forward = model.forward, me = this;
        model.forward = async function (inputs) { const out = await forward.call(this, inputs); me.last = { ids: inputs.input_ids, out }; return out; };
        const session = model.sessions && model.sessions.model;
        this.outputs = session && session.outputNames ? Array.from(session.outputNames) : [];
        this.vocab = tts.tokenizer && tts.tokenizer.model && Array.isArray(tts.tokenizer.model.vocab) ? tts.tokenizer.model.vocab : null;
        this.tts = tts; this.key = key;
        return { outputs: this.outputs, vocab: !!this.vocab };
      },
      // The newer engine (research/gpu-yield/yield-ort4.html's NEW_WORKER): Transformers.js 4.3.1 runs
      // the model (ONNX Runtime 1.31, its asyncify build with the native WebGPU provider; the .mjs from
      // the store so offline works, BUGS 33); kokoro-js's KokoroTTS gets a stand-in model that turns
      // its tensors into Transformers.js 4 tensors, and Transformers.js 4's tokenizer on the same
      // tokenizer.json (the token ids are identical on every text checked). kokoro-js's own ONNX Runtime
      // never runs (its wasm is never fetched). The stand-in keeps the last call's ids and outputs, so
      // the durations come back as before.
      async initNewer(opts, api) {
        const key = opts.runOn + " " + opts.precision;
        if (this.model && this.key === key) return { outputs: this.outputs, same: true };
        if (!this.K) this.K = await importLib(LIB);
        if (!this.T) {
          const T = await importLib(TLIB);
          T.env.useBrowserCache = false; T.env.allowLocalModels = false;
          const w = T.env.backends.onnx.wasm;
          w.numThreads = 1; w.wasmPaths = { mjs: await libUrl(ORT4 + "mjs"), wasm: ORT4 + "wasm" };
          this.T = T;
        }
        const T = this.T;
        if (this.model) { try { await this.model.dispose(); } catch (e) {} this.model = null; this.key = ""; }
        this.model = await T.StyleTextToSpeech2Model.from_pretrained(MODEL, { dtype: opts.precision, device: opts.runOn === "gpu" ? "webgpu" : "wasm" });
        if (!this.tok) this.tok = await T.AutoTokenizer.from_pretrained(MODEL);
        const me = this;
        const toT = (t) => (t instanceof T.Tensor ? t : new T.Tensor(t.type, Array.isArray(t.data) ? (t.type === "float32" ? Float32Array.from(t.data) : t.data) : t.data, t.dims));
        const standIn = async (inputs) => {
          const conv = {};
          for (const k in inputs) conv[k] = toT(inputs[k]);
          const out = await me.model(conv);
          me.last = { ids: conv.input_ids, out };
          return out;
        };
        this.tts = new this.K.KokoroTTS(standIn, this.tok);
        const s = this.model.sessions && this.model.sessions.model;
        this.outputs = s && s.outputNames ? Array.from(s.outputNames) : [];
        const v = this.tok.model && this.tok.model.vocab;
        this.vocab = Array.isArray(v) ? v : null;
        this.key = key;
        const ver = T.env.backends.onnx.versions || {};
        return { outputs: this.outputs, vocab: !!this.vocab, versions: "Transformers.js " + (T.env.version || "?") + ", ONNX Runtime " + (ver.web || ver.common || "?") };
      },
      symbol(id) {
        if (this.vocab && this.vocab[id] != null) return this.vocab[id];
        if (!this.symbols.has(id)) { let s = "?"; try { s = this.tts.tokenizer.decode([id], { skip_special_tokens: false }); } catch (e) {} this.symbols.set(id, s); }
        return this.symbols.get(id);
      },
      async synth(text, opts, api) {
        this.last = null;
        const out = await this.tts.generate(text, { voice: opts.voice, speed: Number(opts.pace) > 0 ? Number(opts.pace) : 1 });
        const r = { audio: out.audio, sampleRate: out.sampling_rate };
        const L = this.last;
        if (L && L.out && L.out.durations && L.ids) {
          r.durations = Array.from(L.out.durations.data, Number);
          r.phonemes = Array.from(L.ids.data, Number).map((i) => this.symbol(i)).join("");
        }
        return r;
      },
      stop() {},
    };
  `;

  const E = {
    id: "kokoro", name: "Kokoro",
    voices: VOICES,
    can: { timing: true, reroll: false, copies: true },
    sampleRate: 24000, maxChars: MAX_CHARS,
    status: "", copies: 1, pool: null, engine: "",
    where: "", runOn: "", precision: "", caps: null, timed: { pieces: 0, matched: 0, ok: 0, said: false },
    precisions, offReason, files, catalog, wordTimes, PRECISIONS, ENGINES, LIB, TLIB, ORT4, MODEL, code: WORKER,

    async init(opts) {
      if (!VOICES.some((v) => v.id === opts.voice)) throw fail(`Kokoro has no voice "${opts.voice}". Choose one in Settings → Voice.`, "cannot");
      const voice = opts.voice, runOn = opts.runOn === "cpu" ? "cpu" : "gpu";
      const caps = await VOICEWORK.gpu();
      if (runOn === "gpu" && !caps.ok) throw fail(`${caps.why}: Kokoro cannot run on the graphics card here. Choose "Processor" in Settings → Voice → Run on.`, "cannot");
      const p = PRECISIONS.find((x) => x.id === opts.precision);
      if (!p) throw fail(`Kokoro has no precision "${opts.precision}". Choose one in Settings → Voice.`, "cannot");
      if (isBroken(runOn, p.id)) throw fail(`Kokoro ${p.id} gave broken sound on ${thisWhat(runOn)} before (remembered on this device). ${CHOOSE(p.id)}`, "fatal");
      if (runOn === "gpu" && p.f16 && !caps.f16) throw fail(`This graphics card (${caps.name}) has no 16-bit math (shader-f16), so Kokoro ${p.id} cannot run on it. Choose fp32, 8-bit or 4-bit in Settings → Voice.`, "cannot");
      if (runOn === "cpu" && !p.cpu) throw fail(`Kokoro ${p.id} is a graphics-card precision. On the processor choose 8-bit, fp32 or 4-bit in Settings → Voice.`, "cannot");
      const engine = which(opts);
      const o = { voice, runOn, precision: p.id, pace: Number(opts.pace) > 0 ? Number(opts.pace) : 1, engine };
      // One engine per worker: two ONNX Runtimes never share one. Another engine = fresh workers.
      if (this.pool && this.engine && this.engine !== engine) { this.pool.close(); this.pool = null; log("voice", `Kokoro's workers closed: the engine changed to ${ENGINES[engine].label}`); }
      let r;
      try { r = await VOICEWORK.load(this, { owner: "Kokoro", files: files(o), code: WORKER, opts: o, copies: runOn === "gpu" ? 1 : VOICEWORK.copies(opts.copies) }); }
      catch (e) {
        // A failed load leaves ONNX Runtime's WebGPU state unusable for the next model in the same
        // worker (research/gpu-experiments, the phone-check dry run): the workers go, the next Play
        // starts fresh ones. No fallbacks: the reading stops with the reason (the player).
        if (this.pool) { this.pool.close(); this.pool = null; log("voice", `Kokoro's workers closed after the failed load (${ENGINES[engine].label})`); }
        this.engine = "";
        throw e;
      }
      this.engine = engine;
      this.where = runOn === "gpu" ? `the graphics card (${caps.name})` : "the processor";
      this.runsOn = runOn === "gpu" ? "the card" : `the processor (${this.copies} cop${this.copies === 1 ? "y" : "ies"})`;
      this.runOn = runOn; this.precision = p.id; this.caps = caps;
      const outs = r.outputs || [];
      this.can.timing = outs.includes("durations");
      if (!r.same) {
        log("voice", `Kokoro ${voice}, ${p.id}, on ${this.where}, ${ENGINES[engine].label}${r.versions ? ` (loaded: ${r.versions})` : ""}; model outputs: ${outs.join(", ") || "(not reported)"}`);
        log("timing", this.can.timing ? "the model gives durations: word times come from the voice" : "this model has no durations output: the word highlight falls back to the estimate");
        this.timed = { pieces: 0, matched: 0, ok: 0, said: false };
      }
    },
    // Broken sound is the precision's fault on this device (BUGS 28): remembered for the Settings
    // window, and the reading fails with the reason (BUGS 29); nothing is switched.
    broken(why) {
      markBroken(this.runOn, this.precision);
      log("voice", `remembered on this device: Kokoro ${this.precision} on ${onWhat(this.runOn)} gives broken sound (Settings greys it)`);
      return fail(`Kokoro ${this.precision} gives broken sound on ${thisWhat(this.runOn)} (${why}). ${CHOOSE(this.precision)}`, "fatal");
    },
    async synth(piece, opts) {
      const o = { voice: opts.voice, pace: Number(opts.pace) > 0 ? Number(opts.pace) : 1 };
      let r;
      try { r = await this.pool.synth(piece.speech, o); }
      catch (e) {
        // On the newer engine a failed run leaves the worker's WebGPU state broken for what follows
        // (research/gpu-experiments): its workers are ended; the pool starts a fresh one, with the
        // same settings, for the next piece asked (the player's ask-again / restart / stop).
        if (this.engine === "newer" && this.pool && !e.stopped) { this.pool.close(); log("voice", "Kokoro's newer-engine worker ended after a failed run; a fresh one loads for the next piece"); }
        throw /broken sound|not numbers/.test(String(e && e.message)) ? this.broken("the samples are not numbers") : e;
      }
      // All zero is broken sound only for a chunk with words in it; silence for one with none is not the precision's fault (P14).
      if (!(r.peak > 0)) throw /[\p{L}\p{N}]/u.test(piece.speech) ? this.broken("all the samples are zero") : new Error(`the voice gave only silence for "${String(piece.speech).slice(0, 40)}" (nothing to say in it)`);
      const out = { audio: r.audio, sampleRate: r.sampleRate, peak: r.peak };
      if (r.durations) {
        const t = wordTimes(piece.speech, r.phonemes, r.durations, r.audio.length / r.sampleRate);
        const T = this.timed;
        T.pieces++;
        if (t) {
          if (t.matched) T.matched++;
          if (t.ok) T.ok++;
          if (T.pieces <= 3 || T.pieces % 20 === 0 || !t.ok) log("timing", `word times: ${t.count} words, ${t.groups} token words${t.matched ? "" : ` (${t.merged} token word${t.merged === 1 ? "" : "s"} shared by two words, ${t.split} word${t.split === 1 ? "" : "s"} over two)`}; the durations add up to ${t.total.toFixed(2)} s against ${(r.audio.length / r.sampleRate).toFixed(2)} s of sound (${t.ok ? "match" : "off by " + Math.round(Math.abs(t.ratio - 1) * 100) + " %"}) · ${T.matched} of ${T.pieces} pieces paired one to one, ${T.ok} within 5 %`);
          if (t.words) out.words = t.words;
        } else if (!T.said) { T.said = true; log("timing", `the durations did not line up with the tokens (${r.durations.length} values, ${(r.phonemes || "").length} tokens): the estimate is used`); }
      }
      return out;
    },
    stop() { if (this.pool) this.pool.stop(); },
    memory() { return this.pool ? this.pool.memory() : ""; },
    isBroken, brokenKey,
    // For the Settings window: the knobs that apply to Kokoro, every value with the reason it can't
    // be used here (greyed there), or "" when it can.
    // more.engine: the Engine choice ("newer": 8-bit on a card is no longer garbled there, only slow).
    describe(caps, runOn, voice, more) {
      const newer = which(more) === "newer";
      const gpuOff = caps && caps.ok ? "" : (caps && caps.why) || "no graphics card here";
      return {
        runOn: [{ id: "gpu", label: "Graphics card", off: gpuOff }, { id: "cpu", label: "Processor", off: "" }],
        precisions: PRECISIONS.map((p) => ({ id: p.id, label: newer && p.id === "q8" ? "8-bit (92 MB): best on the processor; slow on a graphics card" : p.label, size: p.size, off: offReason(caps, runOn, p) })),
        engines: Object.keys(ENGINES).map((id) => ({ id, label: ENGINES[id].label })),
        pace: true, steps: false, copies: runOn === "cpu", speaker: 0,
      };
    },
  };
  ENGINE.register(E);
})();
</script>
<script>
// engines/piper.js: Piper (VITS) voices, all the English voices of rhasspy/piper-voices, on the
// processor only. low / medium / high are not a quality order for Jon: amy and lessac (the tested
// best) come first, then the rest by name. onnxruntime-web 1.22.0 (the wasm build, one thread per
// worker) runs the voice's .onnx; the text goes to phonemes through the espeak-ng phonemizer, the
// phonemizer package 1.2.1, the one the old app used (punctuation kept between the words, as before),
// then to the voice's phoneme ids. Pace is Piper's length scale (1 / pace, so pace above 1 is faster,
// as for Kokoro). The speaker number applies only to the voices with several speakers (libritts,
// vctk, arctic, l2arctic, aru, semaine: BUGS 5) and is ignored for the rest; there is no steps knob
// (BUGS 6). Copies on the processor. The sample rate comes from the voice's config (16 kHz low,
// 22.05 kHz medium and high). Pieces are cut at 400 characters. A voice id Piper does not have fails
// at init with the reason (`cannot`; no fallbacks, PLAN.md).
(function () {
  const ORT = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/";
  const PHON = "https://cdn.jsdelivr.net/npm/phonemizer@1.2.1/dist/phonemizer.js";
  const VOICES_URL = "https://huggingface.co/rhasspy/piper-voices/resolve/main/";
  const MAX_CHARS = 400;

  // id, .onnx bytes, .onnx.json bytes, speakers (rhasspy/piper-voices voices.json, 2026-10-17).
  const LIST = [
    ["en_US-amy-low", 63104526, 4164, 1], ["en_US-amy-medium", 63201294, 4882, 1],
    ["en_US-lessac-low", 63201294, 4882, 1], ["en_US-lessac-medium", 63201294, 4885, 1], ["en_US-lessac-high", 113895201, 4883, 1],
    ["en_GB-alan-low", 63104526, 4170, 1], ["en_GB-alan-medium", 63201294, 4888, 1], ["en_GB-alba-medium", 63201294, 4888, 1],
    ["en_US-arctic-medium", 76766385, 5148, 18], ["en_GB-aru-medium", 76754097, 5048, 12], ["en_US-bryce-medium", 63531379, 4966, 1],
    ["en_GB-cori-high", 114219352, 4963, 1], ["en_GB-cori-medium", 63531379, 4966, 1], ["en_US-danny-low", 63104526, 4166, 1],
    ["en_US-hfc_female-medium", 63201294, 5033, 1], ["en_US-hfc_male-medium", 63201294, 5033, 1], ["en_GB-jenny_dioco-medium", 63201294, 4895, 1],
    ["en_US-joe-medium", 63201294, 4794, 1], ["en_US-john-medium", 63531379, 4965, 1], ["en_US-kathleen-low", 63104526, 4169, 1],
    ["en_US-kristin-medium", 63531379, 4968, 1], ["en_US-kusal-medium", 63201294, 4884, 1], ["en_US-l2arctic-medium", 76778673, 5252, 24],
    ["en_US-libritts-high", 136673811, 20163, 904], ["en_US-libritts_r-medium", 78580914, 20123, 904],
    ["en_US-ljspeech-high", 114199011, 4970, 1], ["en_US-ljspeech-medium", 63531379, 4972, 1], ["en_US-mike-medium", 63221984, 5439, 1],
    ["en_US-norman-medium", 63531379, 4968, 1], ["en_GB-northern_english_male-medium", 63201294, 4847, 1], ["en_US-reza_ibrahim-medium", 63511038, 4976, 1],
    ["en_US-ryan-high", 120786792, 4166, 1], ["en_US-ryan-low", 63104526, 4165, 1], ["en_US-ryan-medium", 63201294, 4883, 1],
    ["en_US-sam-medium", 62950044, 5040, 1], ["en_GB-semaine-medium", 76737711, 5076, 4], ["en_GB-southern_english_female-low", 63104526, 4189, 1],
    ["en_GB-vctk-medium", 76952753, 6637, 109],
  ];
  const parts = (id) => { const [lang, name, quality] = id.split("-"); return { lang, name, quality }; };
  const path = (id) => { const p = parts(id); return `${p.lang.split("_")[0]}/${p.lang}/${p.name}/${p.quality}/${id}.onnx`; };
  const pretty = (id) => { const p = parts(id); return p.name.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase()); };
  const VOICES = LIST.map(([id, size, jsonSize, speakers]) => ({
    id, size, jsonSize, speakers,

    id: "piper", name: "Piper",
    voices: VOICES,

    status: "", copies: 1, pool: null, voice: "", speakers: 1,

      }
    },
    async synth(piece, opts) {
      const v = byId(opts.voice);

    },
    stop() { if (this.pool) this.pool.stop(); },
    memory() { return this.pool ? this.pool.memory() : ""; },
    // For the Settings window: Piper runs on the processor only; the speaker number only for a multi-speaker voice.

})();

<script>
// engines/supertonic.js: Supertonic 2 (Supertone), the fallback voice ("sounds drunk sometimes"),
// through Transformers.js 4.3.1 with ONNX Runtime 1.31.0-dev's asyncify build (the files the Kokoro
// newer engine and the listeners use: one stored copy, MODELS.RUNTIME, EFF-15; the sound is bit-identical
// to the 4.3.0 / 1.30 wasm it used before, research/eff15/README.md). Voices M3 first (the clearest), then the other nine. Steps (the only engine with
// them: BUGS 12): quality against time; null = 50 on the graphics card, 30 on the processor (below
// 30 the voice stumbles, above 100 nothing is gained, by Jon's ear). Every take starts from a seed
// (the library's random generator is seeded before each take); the seed goes back with the piece
// (`seed`), so a later re-roll can ask for the same text with a new one (can.reroll). A silent or
// near-silent result for a chunk with letters (ENGINE.silence; short lines sometimes give it: BUGS 9)
// is made again with a new seed up to twice; still silent, the reading stops with the reason (job 4). The raw voice is quiet (peaks 0.2-0.3): a fixed gain of 3 is applied, the
// same for every piece, and the protocol's 0.98 cap catches the rare loud one. Card or processor
// (asked for the card with no WebGPU here, init fails with `cannot` and the reason, and the player
// stops: no fallbacks, PLAN.md); copies on the processor. 44.1 kHz. Pieces are cut at 180
// characters (very short pieces garble, long ones lose words).
(function () {
  const LIB = MODELS.RUNTIME.lib;
  const ORT = MODELS.RUNTIME.ort;
  const MODEL = "onnx-community/Supertonic-TTS-2-ONNX";
  const HF = `https://huggingface.co/${MODEL}/resolve/main/`;
  const MAX_CHARS = 180;
  const GAIN = 3;
  const IDS = ["M3", "F1", "F2", "F3", "F4", "F5", "M1", "M2", "M4", "M5"];
  const VOICES = IDS.map((id) => ({ id, name: `${id[0] === "F" ? "Female" : "Male"} ${id[1]} (${id})${id === "M3" ? ", the clearest" : ""}` }));
  const ONNX = [["text_encoder.onnx", 433173], ["text_encoder.onnx_data", 28530432], ["latent_denoiser.onnx", 397050], ["latent_denoiser.onnx_data", 132098880], ["voice_decoder.onnx", 59730], ["voice_decoder.onnx_data", 101353472]];
  const LIBS = MODELS.RUNTIME.files.map((f) => Object.assign({}, f));
  const files = (opts) => LIBS.concat([{ url: HF + "config.json", size: 247 }, { url: HF + "tokenizer.json", size: 5658 }, { url: HF + "tokenizer_config.json", size: 119 }],
    ONNX.map(([f, size]) => ({ url: HF + "onnx/" + f, size })), [{ url: HF + "voices/" + opts.voice + ".bin", size: 51712 }]);
  // Every file Supertonic can use: its own under "Supertonic" (the voices are 52 kB each), the runtime
  // under the shared runtime's owner (so Delete Supertonic keeps what Kokoro newer and the listeners use).
  const catalog = () => [{ owner: "Supertonic", files: files({ voice: IDS[0] }).slice(LIBS.length).concat(IDS.slice(1).map((id) => ({ url: HF + "voices/" + id + ".bin", size: 51712 }))) },
    { owner: MODELS.RUNTIME.owner, files: LIBS }];
  const stepsFor = (steps, runOn) => (Number(steps) > 0 ? Math.max(1, Math.min(200, Math.round(Number(steps)))) : runOn === "gpu" ? 50 : 30);

  const WORKER = `
    const LIB = ${JSON.stringify(LIB)}, ORT = ${JSON.stringify(ORT)}, MODEL = ${JSON.stringify(MODEL)}, HF = ${JSON.stringify(HF)}, GAIN = ${GAIN};
    self.ENGINE = {
      T: null, tts: null, key: "", voices: new Map(),
      async init(opts, api) {
        if (!this.T) {
          const T = await importLib(LIB);
          T.env.useBrowserCache = false;
          T.env.allowLocalModels = false;
          const w = T.env.backends && T.env.backends.onnx && T.env.backends.onnx.wasm;
          if (w) { w.numThreads = 1; w.wasmPaths = { mjs: await libUrl(ORT + "mjs"), wasm: ORT + "wasm" }; }   // the .mjs from the store (offline too)
          this.T = T;
        }
        if (!this.tts || this.key !== opts.runOn) {
          if (this.tts) { try { await this.tts.dispose(); } catch (e) {} this.tts = null; }
          this.tts = await this.T.pipeline("text-to-speech", MODEL, { device: opts.runOn === "gpu" ? "webgpu" : "wasm", dtype: "fp32" });

        await this.voice(opts.voice);

      },
      async voice(id) {

        return this.voices.get(id);
      },
      async synth(text, opts, api) {
        const R = this.T.random, pace = Number(opts.pace) > 0 ? Number(opts.pace) : 1;
        const newSeed = () => (Math.random() * 4294967296) >>> 0;

          const out = await this.tts("<en>" + text + "</en>", { speaker_embeddings: await this.voice(opts.voice), num_inference_steps: opts.steps, speed: pace });

        const r = await take(seed);         // a silent take is checked and made again on the page (E.synth)

      stop() {},

  const E = {
    id: "supertonic", name: "Supertonic",
    voices: VOICES,
    can: { timing: false, reroll: true, copies: true },
    sampleRate: 44100, maxChars: MAX_CHARS,
    status: "", copies: 1, pool: null, steps: 0, where: "", voice: "",
    files, catalog, stepsFor, code: WORKER,

      this.sampleRate = r.sampleRate || 44100;

      this.runsOn = runOn === "gpu" ? "the card" : `the processor (${this.copies} cop${this.copies === 1 ? "y" : "ies"})`;
      if (this.steps !== steps || this.voice !== voice) {
        this.steps = steps; this.voice = voice;
        log("voice", `Supertonic ${voice} on ${this.where}, ${steps} steps${Number(opts.steps) > 0 ? "" : " (no benchmark yet: the default for " + (runOn === "gpu" ? "a card" : "a processor") + ")"}, seeded takes ${r.seeded ? "yes" : "NO (the library gave no seedable generator: re-rolls will not differ)"}`);
      }
    },
    // A silent or near-silent take of a chunk with letters (ENGINE.silence; BUGS 9: "Huh?", "Hmph.") is made
    // again with a new seed, up to SILENT_RETAKES times; still silent, the chunk FAILS with a plain reason
    // (`fatal`: the reading stops, no fallback). In a listener's re-roll it only ends that re-roll.
    async synth(piece, opts) {

      const sp = String(piece.speech), short = sp.length > 40 ? sp.slice(0, 40).trimEnd() + "…" : sp, seeds = [];
      for (let t = 0; ; t++) {
        const r = await this.pool.synth(piece.speech, Object.assign({}, o, { seed: t === 0 && Number.isInteger(opts.seed) ? opts.seed : undefined }));
        const q = ENGINE.silence(r.audio, r.sampleRate, piece.speech);
        if (!q) {
          if (t) log("voice", `Supertonic: "${short}" has sound with seed ${r.seed}, after ${t} silent take${t === 1 ? "" : "s"} (seed${t === 1 ? "" : "s"} ${seeds.join(", ")})`);
          return { audio: r.audio, sampleRate: r.sampleRate, seed: r.seed, peak: r.peak };
        }
        seeds.push(r.seed);
        if (t >= this.SILENT_RETAKES) {
          const msg = `Supertonic gave only silence for "${short}" ${t + 1} times (${q.why}; seeds ${seeds.join(", ")})`;
          throw Object.assign(new Error(piece.retake ? `${msg}: this re-roll is given up`
            : `${msg}. The reading has stopped here: tap the next paragraph and press Play to go on, or choose another voice in Settings → Voice.`), { fatal: !piece.retake, silent: true });
        }
        log("voice", `Supertonic gave silence for "${short}" (${q.why}, seed ${r.seed}): made again with a new seed (${t + 1} of ${this.SILENT_RETAKES})`);
      }
    },
    SILENT_RETAKES: 2,
    stop() { if (this.pool) this.pool.stop(); },
    memory() { return this.pool ? this.pool.memory() : ""; },
    // For the Settings window: card or processor (the card greyed with the reason when there is none), steps, copies on the processor.
    describe(caps, runOn) {
      const gpuOff = caps && caps.ok ? "" : (caps && caps.why) || "no graphics card here";
      return { runOn: [{ id: "gpu", label: "Graphics card", off: gpuOff }, { id: "cpu", label: "Processor", off: "" }], precisions: [], pace: true, steps: true, copies: runOn === "cpu", speaker: 0 };
    },
  };
  ENGINE.register(E);
})();

<script>
// engines/webspeech.js: the browser's own voices (the Web Speech API, speechSynthesis) as an engine
// that speaks for itself: the device makes the sound and nothing comes back to stream, so the
// player's say() path drives it (player.js) and the keep-alive tone keeps the media session
// (keepalive.js). The voices are whatever the device has (engine.voices: name, language, local or
// online; the list arrives late on most devices and Android lists nothing until its speech engine is
// awake, so init waits, wakes it with a silent empty utterance, and the list is refreshed on
// voiceschanged). A local voice speaks a whole piece in one utterance; an online voice (Google's, in
// Chrome on a computer) is cut off by Chrome after about 15 s, so init sets maxChars = 220 (pieces.js
// then cuts at sentence ends, else clause marks, else spaces) and a joined piece still over that is
// said as several utterances, cut the same way. Word boundaries (local desktop voices give them,
// Android mostly not) reach the player as character positions in the piece's speech; a voice that
// gives none is learned once and logged, and position() then estimates from the time elapsed at the
// rate the voice has shown. Chrome's stalls: an utterance that never starts is asked for again, then
// given up (the player restarts the voice); one that never ends is moved on from; a speechSynthesis
// found paused is resumed before each utterance, and online voices get a pause/resume nudge every
// 10 s (not on Android, where pause() cancels). A pause is a cancel: the player says the piece again
// from two words before the cut (Chrome loses an utterance paused for long; Android cancels it
// anyway). stop() cancels cleanly: the promise resolves { cancelled: true }, nothing is an error, and
// the next utterance waits 300 ms (Android drops one given right after cancel()). The voice setting
// "webspeech" (no voice named) means the device's default English voice; a named voice that is not
// on this device fails at init with the reason (`cannot`; no fallbacks, PLAN.md).
(function () {
  const ONLINE_MAX = 220;
  const ANDROID = /Android/i.test(navigator.userAgent);
  const synth = () => globalThis.speechSynthesis;
  const en = (v) => /^en([-_]|$)/i.test(v.lang || "");
  const idOf = (v) => v.voiceURI || v.name;

  const E = {
    id: "webspeech", name: "Browser voices",
    voices: [],                   // [{ id, name, lang, local }]: the device's list, English first
    can: { timing: true, reroll: false, copies: false },
    sampleRate: 22050,
    maxChars: 0,                  // 220 once an online voice is picked
    list: [],                     // the SpeechSynthesisVoice objects, same order
    voice: null,                  // the one in use
    known: new Map(),             // voice id -> true / false: it gives word boundaries
    cps: 0,                       // characters a second this voice has shown
    job: null, current: null, nudge: 0, cancelledAt: -1e9, listed: false,

    // The device's list, when it has one. True when there is something in it.
    refresh() {
      const ss = synth();
      const list = ss && ss.getVoices ? ss.getVoices() : [];
      if (!list || !list.length) return false;
      this.list = Array.from(list).sort((a, b) => (en(b) - en(a)) || String(a.lang).localeCompare(String(b.lang)) || a.name.localeCompare(b.name));
      this.voices = this.list.map((v) => ({ id: idOf(v), name: `${v.name} (${v.lang}${v.localService ? "" : ", online"})`, lang: v.lang, local: !!v.localService }));
      return true;
    },
    // Wait up to ms for the list (the voiceschanged event, and polling: Android fires it with an empty list first).
    wait(ms) {
      return new Promise((resolve) => {
        const ss = synth(), t0 = performance.now();
        let poll = 0;
        const done = () => { clearInterval(poll); try { ss.removeEventListener("voiceschanged", tryNow); } catch (e) {} resolve(); };
        const tryNow = () => { if (this.refresh() || performance.now() - t0 > ms) done(); };
        try { ss.addEventListener("voiceschanged", tryNow); } catch (e) {}
        poll = setInterval(tryNow, 200);
      });
    },
    async init(opts) {
      const ss = synth();
      if (!ss || typeof SpeechSynthesisUtterance === "undefined") throw new Error("this browser has no speech synthesis");
      if (!this.refresh()) await this.wait(800);

        log("voice", "no browser voices listed yet: waking the device's speech engine with a silent empty utterance");
        try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; ss.speak(u); } catch (e) {}

      if (want && !named) throw Object.assign(new Error(`The browser voice "${want}" is not on this device. Choose one in Settings → Voice.`), { cannot: true });

    },
    // For the Settings window: the device speaks; none of the model knobs apply (Speed covers the rate).
    describe() { return { runOn: [], precisions: [], pace: false, steps: false, copies: false, speaker: 0 }; },
    hasBoundaries() {

    },
    // Where the piece being said has got to, in its speech's characters: the last word boundary where
    // the voice gives them, else the time elapsed at the rate learned (15 characters a second x rate to start).
    position() {
      const j = this.job;
      if (!j) return null;
      if (j.bounded || this.hasBoundaries() === true) return { chars: j.chars, estimated: false };
      const cps = this.cps || 15 * j.rate;
      const chars = j.firstStart ? Math.min(j.len, j.from + ((performance.now() - j.firstStart) / 1000) * cps) : j.from;
      return { chars, estimated: true };
    },

    speak(piece, opts, on) {
      const ss = synth();
      const text = String((piece && piece.speech) || "");
      const from = Math.max(0, Math.min(text.length, Number(opts && opts.from) || 0));
      const v = this.voice, online = !!(v && !v.localService), vid = v ? idOf(v) : "", vname = v ? v.name : "the browser voice";
      const rate = Math.max(0.1, Math.min(10, (Number(opts && opts.speed) || 1) * (Number(opts && opts.pace) || 1)));
      const volume = opts && opts.volume != null ? Math.max(0, Math.min(1, Number(opts.volume))) : 1;
      const rest = text.slice(from);
      const spans = online && rest.length > ONLINE_MAX ? PIECES.cut(rest, ONLINE_MAX) : [{ from: 0, to: rest.length }];
      return new Promise((resolve, reject) => {
        const job = this.job = { t0: performance.now(), from, base: from, chars: from, len: text.length, rate, n: 0, tries: 0, timer: 0, started: 0, firstStart: 0, settled: false, bounded: false, retrying: false, finish: null };
        job.finish = (ok, r) => {
          if (job.settled) return;
          job.settled = true;
          clearTimeout(job.timer);
          this.nudgeOff();
          if (this.job === job) this.job = null;
          this.current = null;
          (ok ? resolve : reject)(r);
        };
        const stateOf = () => (ss.speaking ? "it says it is speaking" : ss.pending ? "the utterance is waiting" : "it is idle");
        // The watchdog: 6 s to start (asked again once), then a generous time to finish.
        const watch = () => {
          clearTimeout(job.timer);
          if (job.settled) return;
          const len = spans[job.n].to - spans[job.n].from;
          const wait = job.started ? Math.max(20000, (len / (4 * rate)) * 1000 + 15000) : 6000;
          job.timer = setTimeout(() => {
            if (job.settled) return;
            if (!job.started) {
              if (job.tries < 2) { log("voice", `${vname} did not start in 6 s (${stateOf()}); asking again`); restart(); }
              else job.finish(false, Object.assign(new Error(`${vname} did not start after two tries (${stateOf()})`), { timeout: true }));
            } else {
              log("voice", `${vname} has not finished an utterance of ${len} characters after ${((performance.now() - job.started) / 1000).toFixed(0)} s; moving on`);
              job.finish(true, { chars: job.len, ms: performance.now() - job.t0, stuck: true });
              try { ss.cancel(); } catch (e) {}
            }
          }, wait);
        };
        const go = () => {
          if (job.settled) return;
          if (ss.paused) { try { ss.resume(); } catch (e) {} }
          const s = spans[job.n];
          const u = new SpeechSynthesisUtterance(rest.slice(s.from, s.to));
          if (v) { u.voice = v; u.lang = v.lang; }
          u.rate = rate;
          u.volume = volume;
          u.onstart = () => { if (u !== this.current) return; job.started = performance.now(); if (!job.firstStart) job.firstStart = job.started; watch(); };
          u.onboundary = (e) => {
            if (u !== this.current || e.charIndex == null || (e.name && e.name !== "word")) return;
            job.chars = job.base + e.charIndex;
            if (!job.bounded) { job.bounded = true; if (this.known.get(vid) !== true) { this.known.set(vid, true); log("timing", `${vname} gives word boundaries: the word tint follows them`); } }
            if (on && on.boundary) on.boundary(job.chars);
          };
          u.onend = () => {
            if (u !== this.current) return;
            if (job.n + 1 < spans.length) { job.n++; job.base = from + spans[job.n].from; job.started = 0; job.tries = 0; clearTimeout(job.timer); go(); return; }
            const now = performance.now();
            if (job.firstStart && rest.length >= 40) { const said = (now - job.firstStart) / 1000; if (said > 0.5) { const cps = rest.length / said; this.cps = this.cps ? this.cps * 0.7 + cps * 0.3 : cps; } }
            if (!job.bounded && rest.length >= 20 && this.known.get(vid) === undefined) { this.known.set(vid, false); log("timing", `${vname} gives no word boundaries here: the word tint follows an estimate`); }
            job.chars = job.len;
            job.finish(true, { chars: job.len, ms: now - job.t0 });
          };
          u.onerror = (e) => {
            if (u !== this.current || job.retrying) return;
            const err = (e && e.error) || "unknown error";
            if (err === "interrupted" || err === "canceled") { job.finish(true, { cancelled: true, chars: job.chars }); return; }
            job.finish(false, new Error(`${vname} failed: ${err}`));
          };
          this.current = u;                  // kept: Chrome drops an utterance nothing refers to
          job.base = from + s.from; job.tries++; job.started = 0;
          ss.speak(u);
          watch();
          if (online && !ANDROID && !this.nudge) this.nudge = setInterval(() => { if (ss.speaking && !ss.paused) { try { ss.pause(); ss.resume(); } catch (e) {} } }, 10000);
        };
        const restart = () => { job.retrying = true; this.current = null; try { ss.cancel(); } catch (e) {} setTimeout(() => { job.retrying = false; go(); }, 300); };
        const begin = () => { if (job.settled) return; if (ss.speaking || ss.pending) restart(); else go(); };
        const wait = 300 - (performance.now() - this.cancelledAt);
        if (wait > 0) setTimeout(begin, wait); else begin();
      });
    },

    stop() {
      this.cancelledAt = performance.now();
      const j = this.job;
      if (j) j.finish(true, { cancelled: true, chars: j.chars });
      this.current = null;
      this.nudgeOff();
      const ss = synth();
      if (ss) { try { ss.cancel(); } catch (e) {} }
    },
    nudgeOff() { if (this.nudge) { clearInterval(this.nudge); this.nudge = 0; } },
  };

  const R = ENGINE.register(E);
  const ss = synth();
  if (ss) { R.refresh(); try { ss.addEventListener("voiceschanged", () => R.refresh()); } catch (e) {} }
})();
