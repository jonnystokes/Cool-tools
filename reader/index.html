<script>
// compare.js: the listener's word comparison (step 8a), pure (Node runs it in test/compare.mjs). The text
// SENT to the voice (a chunk of the piece's speech, after the text rules: numbers already spelled out,
// watermarks already gone) against the words the listener HEARD. COMPARE.run(sent, heard) gives
//   { words: [{ raw, from, to, status, heard, t0, t1 }], added: [{ after, heard, t0, t1 }], missing, added, spelled, red, timed }
// status per sent word: "ok" (heard as written), "spelled" (heard, spelled differently: a close spelling, a
// name the listener writes its own way, a word it joins or splits), "missing" (not heard). added: heard
// words with nothing behind them in the text, each after sent word `after` (-1 = before the first).
// red = missing + added: the faults a re-roll is for (a different spelling is usually the listener's
// own doing, never re-rolled). from / to: the word's characters in `sent`. timed: [[sent word, t0, t1]]
// for the words heard with times (the listener's word times for the highlight), else null.
// heard: the listener's text (a sentence model: Whisper without times, Moonshine), or its words
// [{ w, t0, t1 }] (seconds). Digits the listener writes ("Chapter 2,753.") are spelled out with the same
// NUMBERS.speak the text rules use, BEFORE punctuation goes (the comma would split the number), so the
// two sides line up word for word; a timed word spelled into several shares its time evenly. Words are
// compared as lower-case letters and digits (accents, apostrophes, quotes and punctuation dropped; hyphens and dashes
// split words on both sides). The alignment is an edit distance over words: a match costs 0, a close
// spelling 0.6, a missing or an added word 1, two sent words heard as one (or one as two) 0.1 when the
// letters are the same, 0.9 when a fifth of them differ at most (six letters or more); a word unlike the one heard is missing + added. A one-letter
// added word is dropped (listener noise); bracketed notes ("[BLANK_AUDIO]") are not words.
(function () {
  const g = globalThis;
  const norm = (w) => String(w).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
  const SPLIT = /[\s\-‐‑‒–—―_/]+/;

  // The sent words with their characters in the text: [{ raw, w, from, to }] (words with no letters left out).
  function sentWords(text) {
    const out = [], re = /[^\s\-‐‑‒–—―_/]+/g;
    let m;
    while ((m = re.exec(String(text)))) { const w = norm(m[0]); if (w) out.push({ raw: m[0], w, from: m.index, to: m.index + m[0].length }); }
    return out;
  }
  const speak = (t) => (g.NUMBERS ? g.NUMBERS.speak(t) : t);
  const unbracket = (t) => String(t).replace(/\[[^\]]*\]|\([^)]*\)/g, " ");
  // The heard words: [{ w, raw, t0?, t1? }].
  function heardWords(heard) {
    if (heard == null) return [];
    if (typeof heard === "string") return speak(unbracket(heard)).split(SPLIT).map((raw) => ({ raw, w: norm(raw) })).filter((x) => x.w);
    const out = [];
    for (const h of heard) {
      const parts = speak(unbracket(h.w != null ? h.w : h.text || "")).split(SPLIT).map((raw) => ({ raw, w: norm(raw) })).filter((x) => x.w);
      const timed = Number.isFinite(h.t0) && Number.isFinite(h.t1);
      parts.forEach((p, k) => { if (timed) { p.t0 = h.t0 + (h.t1 - h.t0) * k / parts.length; p.t1 = h.t0 + (h.t1 - h.t0) * (k + 1) / parts.length; } out.push(p); });
    }
    return out;
  }

  function lev(a, b) {
    if (a === b) return 0;
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[b.length];
  }

  const close = (a, b) => lev(a, b) <= Math.max(1, Math.round(Math.max(a.length, b.length) * 0.34)) && Math.min(a.length, b.length) >= 2;
  const pairCost = (a, b) => (a === b ? 0 : close(a, b) ? 0.6 : Infinity);

})();

// ZIP.read(blob, entry) slices one entry out and gives its text (stored as it is, deflated through

// stored entry's file itself, still on disk: voicedata.js stores a big model file from it, BUGS 37);
// ZIP.stream(blob, entry) gives one entry's bytes as a stream (Voice_data.zip's

//   text     the chapters, keyed [g, c]: { g, c, n, title, text: [paragraphs] }; g = the import that wrote them

      else if (/\.gz$/i.test(x.name) && CHAPTER.isText(x.name.replace(/\.gz$/i, ""))) items.push({ name: rel(x).replace(/\.gz$/i, ""), kind: "gz", file: x });
      else if (/\.zip$/i.test(x.name)) zips.push(x);
      else if (/\.epub$/i.test(x.name)) epubs.push(x);
      else ignored.push(f(x));
    }
    const specs = [];
    const inFolder = files.some((x) => x.webkitRelativePath && x.webkitRelativePath.includes("/"));
    const root = files.length === 1 && items.length === 1 ? CHAPTER.stem(items[0].name) : items.length ? CHAPTER.stem(items[0].name) : "Book";
    const make = (title, list, from) => specs.push({ title: (CHAPTER.pretty(title) || title).trim().slice(0, TITLE_MAX) || "Book", from: from || title, paths: list.map((s) => s.name), sources: list, files: list.length, bytes: 0 });
    let folders = false, sections = false;      // a folder of folders (sub-folders only, no loose files); sections: made one book
    const grouped = (list, rootTitle, fromZip) => {
      const byName = new Map(list.map((s) => [s.name, s]));
      const groups = CHAPTER.group(list.map((s) => s.name), rootTitle);
      // A folder of folders (Jon's manuscript, 2026-10-20): two or more sub-folders and nothing loose.
      // By default ONE book named after the folder: each sub-folder a section, its files the chapters
      // (sections in natural order, each file's title showing its section); opts.sections = false
      // gives the old one book per sub-folder. A zip of such a folder (the book shelf, 2026-10-21) the same.
      if (((inFolder && !zips.length) || fromZip) && groups.length >= 2 && groups.every((b) => !b.root)) {
        folders = true;
        sections = o.sections !== false;
        if (sections) {
          const srcs = [];
          for (const b of groups) for (const p of b.paths) { const s = byName.get(p); s.section = b.title; srcs.push(s); }
          const top = CHAPTER.topFolder(list.map((s) => s.name)) || rootTitle;
          make(top, srcs, top);
          specs[specs.length - 1].sections = groups.length;
          return;
        }
      }
      for (const b of groups) {
        const srcs = b.paths.map((p) => byName.get(p));
        if (!inFolder && o.separate && srcs.length > 1 && b.title === rootTitle) { for (const s of srcs) make(CHAPTER.stem(s.name), [s]); }
        else make(b.title, srcs);
      }
    };
    if (items.length) grouped(items, root);
    for (let k = 0; k < zips.length; k++) {
      const z = zips[k];
      let list;
      try { list = await ZIP.entries(z); } catch (e) { throw new Error(`"${f(z)}" could not be read as a zip: ${e.message}`); }
      const found = list.filter((e) => !e.dir && CHAPTER.isText(e.name));
      for (const e of list) if (!e.dir && !CHAPTER.isText(e.name)) ignored.push(e.name.split("/").pop());
      if (!found.length) throw new Error(`"${f(z)}" holds no text files (${list.filter((e) => !e.dir).length} entries). This reader opens plain text: .txt, .text and .md files, loose, in a folder, or in a zip.`);
      grouped(found.map((e) => ({ name: e.name, kind: "zip", zip: k, entry: e, size: e.size })), CHAPTER.stem(f(z)), true);
    }
    // An EPUB (2026-10-22, epub.js): one book each, its title and author from the package metadata; a locked
    // (DRM) or unreadable one stops the whole pick with its plain reason.
    for (const e of epubs) {
      let meta;
      try { meta = await EPUB.peek(e); } catch (err) { throw new Error(`"${f(e)}": ${err.message}`); }
      make(meta.title || CHAPTER.stem(f(e)), [{ name: rel(e), kind: "epub", file: e, size: e.size }], f(e));
      const s = specs[specs.length - 1];
      s.title = (meta.title || s.title).slice(0, TITLE_MAX);
      s.epub = true; s.author = meta.author || ""; s.spine = meta.spine; s.skipFront = true; s.footnotes = "skip";
    }
    if (!specs.length) {
      throw new Error(files.length
        ? `None of the ${files.length} file${files.length === 1 ? " picked is" : "s picked is"} a text file (.txt, .text, .md) or an EPUB.${/\.(pdf|docx?|rtf|mobi|azw3?)$/i.test(files.map(f).join(" ")) ? " PDF, Word, MOBI and AZW files are not supported; this reader opens plain text and EPUB." : ""}`
        : "Nothing was picked.");
    }
    // The sizes (for the fit line). File.size is a call into the browser per file, and on Android (a
    // content URI) about 32 ms each: all 2,406 froze Jon's phone 77 s before the preview (BUGS 40). So a
    // pick of over SAMPLE files measures SAMPLE of them, evenly spread, and the fit line says it is an
    // estimate from those (s.measured of s.files); zip entries carry their sizes and are all counted.
    const SAMPLE = 60;
    for (const s of specs) {
      const n = s.sources.length, picks = n <= SAMPLE ? s.sources : Array.from({ length: SAMPLE }, (_, k) => s.sources[Math.floor((k * n) / SAMPLE)]);
      let sum = 0;
      for (let i = 0; i < picks.length; i++) {
        const src = picks[i];
        if (src.size === undefined) src.size = src.kind === "gz" ? src.file.size * 3 : src.file.size;
        sum += src.size || 0;
        if (i % 10 === 9) await new Promise((r) => setTimeout(r, 0));
      }
      s.measured = s.sources.every((x) => x.size !== undefined) ? n : picks.length;
      s.bytes = s.measured === n ? s.sources.reduce((t, x) => t + (x.size || 0), 0) : Math.round((sum * n) / picks.length);
    }
    for (const s of specs) {
      s.numbered = !s.sections && !s.epub && CHAPTER.numbered(s.paths);     // a sections book goes by place: numbers would collide across sections
      s.kind = s.epub ? "epub" : s.numbered ? "numbered" : s.files === 1 ? "split" : "files";
      s.sources.forEach((src, i) => { src.c = i + 1; });
      const same = (a, b) => a && b && a.trim().toLowerCase() === b.trim().toLowerCase();
      const hit = books.find((b) => same(b.from, s.from)) || books.find((b) => same(b.title, s.title));
      s.existing = hit ? hit.id : null;
      s.existingTitle = hit ? hit.title : "";
      s.join = false; s.parts = false; s.wrapped = false; s.headings = 0; s.words = 0; s.grid = ""; s.across = false;
      // A small read of one file (raw: the outline needs the marks): at most 25 MB, else "".
      const peek = async (src) => {
        if (src.size === undefined) src.size = src.kind === "gz" ? src.file.size * 3 : src.file.size;
        if ((src.size || 0) > 25e6) return "";
        return ZIP.decode(await (src.kind === "zip" ? ZIP.bytes(zips[src.zip], src.entry) : src.kind === "gz" ? ZIP.gunzipBytes(src.file) : src.file.arrayBuffer())).text;
      };
      if (!s.numbered && !s.epub) {
        // One small read decides the defaults: hard-wrapped lines → join on; a single file's heading
        // lines and words → whether parts are offered.
        const first = s.sources[0];
        try {
          let t = await peek(first);
          if (/\.md$/i.test(first.name)) t = CHAPTER.softenMd(t);
          s.wrapped = s.join = CHAPTER.looksWrapped(t);
          if (s.kind === "split") { const r = CHAPTER.split(t, { title: s.title }); s.headings = r.chapters.length > 1 ? r.chapters.length : 0; s.words = CHAPTER.countWords(t); }
        } catch (e) { log("book", `could not look at "${first.name}" for the preview: ${e.message}`); }
      }
      // Does a sections book look like a GRID (topics × eras; Jon's history manuscript)? The first
      // Markdown file of up to four sections is read: two or more with hb-time eras → "time" (only those
      // eras count); else two files sharing a "##" heading → "heads" (every "##" heading is an era, the
      // labels shared by two or more sections make the table). Then "Read across time" is offered.
      if (s.sections && !s.numbered) {
        const firsts = [], seenSec = new Set();
        for (const src of s.sources) if (/\.md$/i.test(src.name) && !seenSec.has(src.section)) { seenSec.add(src.section); firsts.push(src); if (firsts.length >= 4) break; }
        const outlines = [];
        for (const src of firsts) { try { outlines.push(CHAPTER.outline(await peek(src))); } catch (e) { log("book", `could not look at "${src.name}" for the grid check: ${e.message}`); } }
        const timed = outlines.filter((o) => o.eras.length && !o.eras[0].plain).length;
        if (timed >= 2) s.grid = "time";
        else {
          const seenLabel = new Map();
          for (const o of outlines) for (const l of uniq(o.eras.map((e) => e.label))) seenLabel.set(l, (seenLabel.get(l) || 0) + 1);
          if (Array.from(seenLabel.values()).some((n) => n >= 2)) s.grid = "heads";
        }
        if (s.grid) log("book", `"${s.title}" looks like a grid (${s.grid === "time" ? "hb-time eras" : "shared ## headings"} in ${firsts.length} sampled files): a chapter per era, Read across time offered`);
      }
    }
    log("book", `plan: ${specs.map((s) => `"${s.title}" (${s.files} file${s.files === 1 ? "" : "s"}, ${s.kind}${s.existing ? `, replaces "${s.existingTitle}"` : ""})`).join("; ")}${ignored.length ? `; ${ignored.length} other file${ignored.length === 1 ? "" : "s"} ignored` : ""}`);
    return { books: specs, ignored, zips, inFolder, folders, sections, loose: !inFolder && items.length > 1 && !zips.length };
  }

  // Import one planned book (a spec from plan(), its title / join / parts as the preview left them).
  // onStatus(text, fraction) reports progress. Staged under a new generation; one final transaction
  // makes it visible, replacing the stored book of the same id when there is one (the place stays).
  // Resolves to a summary; throws with a plain message when nothing could be added.
  async function importBook(spec, onStatus, zips) {
    const say = onStatus || (() => {});
    const title = String(spec.title || "").trim().slice(0, TITLE_MAX) || "Book";
    const t0 = Date.now();
    await open();
    const gen = "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const replacing = books.find((b) => b.id === spec.existing) || null;
    const id = replacing ? replacing.id : "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    await tx(["imports"], "readwrite", (s) => { s.put({ g: gen, book: id, title, started: Date.now() }); });
    const total = spec.sources.length;
    log("book", `adding "${title}": ${total} file${total === 1 ? "" : "s"} (${spec.kind}${spec.join ? ", wrapped lines joined" : ""}${spec.parts ? ", parts by size" : ""})${replacing ? `, replacing "${replacing.title}"` : ""}`);
    let r, gridTable = null, acrossOn = false;
    try {
      r = await runJob({ db: DB_NAME, version: DB_VERSION, g: gen, kind: spec.kind, join: !!spec.join, parts: !!spec.parts, sections: spec.sections || 0, grid: spec.grid || "", title, batch: BATCH, sources: spec.sources, zips: zips || spec.zips || [], failAt: hooks.failAt,
        skipFront: spec.skipFront !== false, footnotes: spec.footnotes || "skip" },
        (m) => say(m.chapters ? `Adding ${title}: ${m.chapters.toLocaleString("en-US")} chapters found` : m.files ? `Adding ${title}: ${m.files.toLocaleString("en-US")} of ${(spec.spine || 0).toLocaleString("en-US")} files read` : `Adding ${title}: ${m.done.toLocaleString("en-US")} of ${total.toLocaleString("en-US")} file${total === 1 ? "" : "s"}`,
          m.files && spec.spine ? m.files / spec.spine : total ? m.done / total : 0));

      for (const x of r.info || []) log("book", `adding "${title}": ${x}`);
      if (!r.list.length) throw new Error("no chapter could be read.");
      const grid = nameChapters(r.list, spec.grid || "");
      gridTable = grid; acrossOn = !!(spec.across && grid);
      r.gridNote = spec.grid && !grid ? `"${title}" looked like a grid, but no era is shared by two of its sections: it reads file by file, and Read across time is not offered` : spec.across && grid ? `"${title}" reads across time: every topic's "${grid.eras[0].label}", then every topic's "${grid.eras[1].label}", …` : "";
      if (r.gridNote) log("book", r.gridNote);
      const now = Date.now();
      const row = { id, title, from: spec.from || title, kind: r.numbered ? "numbered" : spec.kind === "split" && r.list.length === 1 ? "one" : spec.kind, chapters: r.list.length, first: r.list[0].c, last: r.list[r.list.length - 1].c,
        bytes: r.bytes, added: replacing ? replacing.added : now, updated: now, gens: [gen], grid, across: !!(spec.across && grid), author: spec.author || "",
        shelf: spec.shelf ? { id: spec.shelf.id, version: spec.shelf.version } : null };   // from the public book shelf (shelf.js): which book and version, so ?book= opens it instead of downloading again
      await tx(["books", "index", "imports", "text"], "readwrite", (b, ix, im, t) => {
        b.put(row); ix.put({ id, list: r.list }); im.delete(gen);
        for (const og of (replacing && replacing.gens) || []) t.delete(genRange(og));

      books = books.filter((b) => b.id !== id).concat([row]);
      sortBooks();
      if (current && current.id === id) use(row, r.list);
      keep();
    } catch (e) {
      const stopped = /stopped by the Stop button/.test(e.message);
      log(stopped ? "book" : "error", `adding "${title}" ${stopped ? "stopped" : "failed"}`, stopped ? undefined : e);
      await tx(["text", "imports"], "readwrite", (t, s) => { t.delete(genRange(gen)); s.delete(gen); }).catch(() => {});
      throw new Error(`Adding "${title}" ${stopped ? "was stopped" : "failed: " + e.message} Nothing was added; your ${books.length ? "other " : ""}books are as they were.`);
    }
    for (const x of r.dupNames) log("book", `adding "${title}": ${x}`);
    for (const x of r.recoded) log("book", `adding "${title}": ${x}`);
    const seconds = (Date.now() - t0) / 1000;
    const summary = { id, title, chapters: r.list.length, first: r.list[0].c, last: r.list[r.list.length - 1].c, numbered: r.numbered, how: r.how, duplicates: r.duplicates, dupNames: r.dupNames, unreadable: r.unreadable, unreadNames: r.bad, recoded: r.recoded, info: r.info || [], seconds, where: r.where, replaced: !!replacing, join: !!spec.join, gridNote: r.gridNote || "" };

  // ---- Names, after the import: what the files say, else the folder and file names made readable ----
  // Entries of Markdown / sections books carry { file, sec (folder), h1, hb (hb-chapter title), era, heads }.
  // A section's name: the one hb-chapter title its files share, else the one "#" heading they share
  // (its "Chapter 32:" lead dropped: the section is "Art"), else the folder prettified. A chapter's
  // short name: its own "#" heading as written when no other file of the section has the same, else the
  // file name prettified ("part1-before-1800" → "Part 1: Before 1800"); in a grid book the era's label.
  // Titles: a grid chapter "Art: Before 1500" (read aloud); a sections chapter "Art · Part 1: Before 1800"
  // (not read aloud, as before); a plain files book the short name. Gives the era table { eras: [{ id,

  const stripNo = (s) => String(s || "").replace(/^\s*(?:chapter|part|ch\.?)\s*\d+[.:\-–—]?\s*/i, "").trim();
  const uniq = (a) => Array.from(new Set(a));
  function nameChapters(list, grid) {
    if (!list.some((e) => e.file !== undefined)) return null;
    const groups = new Map();
    for (const e of list) { const k = e.sec || ""; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); }
    for (const [folder, es] of groups) {
      const hbs = uniq(es.map((e) => e.hb).filter(Boolean)), h1s = uniq(es.map((e) => stripNo(e.h1)).filter(Boolean));
      const secName = !folder ? "" : hbs.length === 1 ? hbs[0] : h1s.length === 1 && es.filter((e) => e.h1).length > 1 ? h1s[0] : CHAPTER.pretty(folder);

    for (const e of list) e.era = e.era && ok.has(e.era.id) ? { id: e.era.id, label: e.era.label } : null;

  }

  // ---- Reading places, per book ---------------------------------------------------------------------
  // { c, p: paragraph read, top: paragraph at the top of the screen, at: when, pct: progress 0-100 }.
  const posOf = (id) => { const p = ls.get(posKey(id)); return p && typeof p.c === "number" ? p : null; };
  const pos = () => (current ? posOf(current.id) : null);
  function setPos(p) {
    if (!current) return;
    if (!p) { ls.set(posKey(current.id), null); return; }
    const i = byC.has(p.c) ? byC.get(p.c) : 0, paras = (index[i] && index[i].paras) || 1;
    const pct = index.length ? Math.min(100, Math.round(100 * (i + Math.min(1, (p.p || 0) / paras)) / index.length)) : 0;
