          ex = (await WebAssembly.instantiate(m.module)).exports;
          const need = 2 * B; if (ex.mem.buffer.byteLength < need) ex.mem.grow(Math.ceil((need - ex.mem.buffer.byteLength) / 65536));
          const f = new Float32Array(ex.mem.buffer, 0, need / 4); for (let i = 0; i < f.length; i++) f[i] = 0.5 + (i & 7) * 0.125;
          postMessage({ id: m.id });
        } else if (m.cmd === "one") {
          // warm up to 1 s (at least 0.3 s, until three batches agree within 5 %), then the windows
          const n = calib(), t0 = now(), last = [];
          while (now() - t0 < 1000) { const t = now(); sink += run(n); last.push(n / (now() - t)); if (last.length > 3) last.shift(); if (now() - t0 > 300 && last.length === 3 && (Math.max(...last) - Math.min(...last)) / Math.max(...last) < 0.05) break; }
          const rates = []; for (let i = 0; i < m.samples; i++) rates.push(rate(n, m.windowMs));
          postMessage({ id: m.id, rates, sink: sink === 1.5 ? 1 : 0 });
        } else if (m.cmd === "all") {
          const n = calib(), end = now() + 150; while (now() < end) sink += run(n);
          while (Date.now() < m.startAt) {}
          postMessage({ id: m.id, rate: rate(n, m.windowMs), late: Date.now() - m.startAt });
        }
      } catch (err) { postMessage({ id: m.id, error: String((err && err.message) || err) }); }
    };`;
  let modP = null;
  const kmodule = () => modP || (modP = WebAssembly.compile(Uint8Array.from(atob(KMOD), (c) => c.charCodeAt(0))));
  async function kworker(ctl) { const w = worker(KWORKER, ctl); await w.ask({ cmd: "init", module: await kmodule() }, 20000); return w; }

  async function oneCore(ctl) {
    const w = await kworker(ctl);
    try { const r = await w.ask({ cmd: "one", samples: 5, windowMs: 400 }, 30000); return { f32: median(r.rates), samples: r.rates.map((x) => Math.round(x)) }; }
    finally { w.kill(); }
  }
  async function allCores(ctl) {
    const k = Math.max(1, Math.min(32, navigator.hardwareConcurrency || 2)), pool = [];
    try {
      for (let i = 0; i < k; i++) { stopped(ctl); pool.push(await kworker(ctl)); }
      const totals = [];
      for (let round = 0; round < 3; round++) {
        stopped(ctl);
        const startAt = Date.now() + 200 + 10 * pool.length;
        const rs = await Promise.all(pool.map((w) => w.ask({ cmd: "all", windowMs: 400, startAt }, 30000)));
        totals.push(rs.reduce((s, r) => s + r.rate, 0));
      }
      return { multi: median(totals), totals: totals.map((x) => Math.round(x)), workers: pool.length };
    } finally { for (const w of pool) w.kill(); }
  }

  // ---- The graphics card: the Studio's gpu.alu (16 f32 multiply-adds per thread per iteration) -----
  const ALU = `
    struct P { iters: u32, seed: u32, a: u32, b: u32 }
    @group(0) @binding(0) var<storage, read_write> o: array<f32>;
    @group(0) @binding(1) var<uniform> p: P;
    @compute @workgroup_size(64) fn main(@builtin(global_invocation_id) g: vec3u) {
      var a0 = vec4<f32>(f32(g.x ^ p.seed) * 1e-9); var a1 = a0 + 1e-3; var a2 = a0 + 2e-3; var a3 = a0 + 3e-3;
      let y = vec4<f32>(0.999, 0.998, 0.997, 0.996); let x = vec4<f32>(1e-4);
      for (var i = 0u; i < p.iters; i++) { a0 = fma(a0, y, x); a1 = fma(a1, y, x); a2 = fma(a2, y, x); a3 = fma(a3, y, x); }
      o[g.x] = dot(a0 + a1 + a2 + a3, vec4<f32>(1.0));
    }`;
  const TINY = `@group(0) @binding(0) var<storage, read_write> o: array<u32>;
    @compute @workgroup_size(1) fn main() { o[0] = o[0] + 1u; }`;
  async function card(ctl) {
    if (!navigator.gpu) return { ok: false, why: "this browser gives no WebGPU here" };
    const a = await timeout(navigator.gpu.requestAdapter({ powerPreference: "high-performance" }), 8000, "WebGPU");
    if (!a) return { ok: false, why: "WebGPU gave no adapter" };
    const U = GPUBufferUsage, d = await timeout(a.requestDevice(), 10000, "the graphics card");
    const done = () => timeout(d.queue.onSubmittedWorkDone(), 5000, "the graphics card");
    try {
      const pipe = async (code) => d.createComputePipelineAsync({ layout: "auto", compute: { module: d.createShaderModule({ code }), entryPoint: "main" } });
      const bind = (p, bufs) => d.createBindGroup({ layout: p.getBindGroupLayout(0), entries: bufs.map((b, i) => ({ binding: i, resource: { buffer: b } })) });
      // 256 dependent dispatches of o[0] += 1 must give exactly 256 (a card that drops work is no use).
      const tiny = await pipe(TINY), tb = d.createBuffer({ size: 16, usage: U.STORAGE | U.COPY_SRC | U.COPY_DST }), rb = d.createBuffer({ size: 16, usage: U.MAP_READ | U.COPY_DST });
      let enc = d.createCommandEncoder(), ps = enc.beginComputePass();
      ps.setPipeline(tiny); ps.setBindGroup(0, bind(tiny, [tb])); for (let i = 0; i < 256; i++) ps.dispatchWorkgroups(1); ps.end();
      enc.copyBufferToBuffer(tb, 0, rb, 0, 16); d.queue.submit([enc.finish()]);
      await timeout(rb.mapAsync(GPUMapMode.READ), 10000, "the graphics card");
      const got = new Uint32Array(rb.getMappedRange().slice(0))[0]; rb.unmap();
      if (got !== 256) return { ok: false, why: `the card gave a wrong answer in a tiny test (${got} instead of 256)` };
      const alu = await pipe(ALU), W = 256, threads = W * 64;
      const ob = d.createBuffer({ size: threads * 4, usage: U.STORAGE }), ub = d.createBuffer({ size: 16, usage: U.UNIFORM | U.COPY_DST }), bg = bind(alu, [ob, ub]);
      const submit = async (k) => {
        const e = d.createCommandEncoder();
        for (let i = 0; i < k; i++) { const p = e.beginComputePass(); p.setPipeline(alu); p.setBindGroup(0, bg); p.dispatchWorkgroups(W); p.end(); }
        const t = performance.now(); d.queue.submit([e.finish()]); await done(); return performance.now() - t;
      };
      let iters = 256, per = 0;
      for (;;) { d.queue.writeBuffer(ub, 0, new Uint32Array([iters, 777, 0, 0])); per = (await submit(4)) / 4; if (per >= 2 || iters >= 1048576) break; iters *= per < 0.25 ? 8 : 2; }
      const t0 = performance.now(), warmK = Math.max(1, Math.min(64, Math.round(30 / per)));
      while (performance.now() - t0 < 1000) { stopped(ctl); await submit(warmK); }       // wake the card from its power-saving state
      const k = Math.max(1, Math.min(256, Math.round(50 / per))), samples = [];
      for (let s = 0; s < 3; s++) {
        let fma = 0; const w0 = performance.now(); let w1 = w0;
        while (w1 - w0 < 250) { await submit(k); fma += k * threads * iters * 16; w1 = performance.now(); }
        samples.push(fma / ((w1 - w0) / 1000) / 1e9);
      }
      return { ok: true, alu: median(samples), samples: samples.map((x) => Math.round(x)) };
    } finally { try { d.destroy(); } catch (e) {} }
  }

  // ---- The working-memory ceiling ------------------------------------------------------------------
  const PWORKER = `
    let mem = null;
    onmessage = (e) => {
      const m = e.data;
      try {
        if (!mem) { try { mem = new WebAssembly.Memory({ initial: 0, maximum: 65536 }); } catch (x) { mem = new WebAssembly.Memory({ initial: 0 }); } }
        mem.grow(m.pages);
        const u = new Uint8Array(mem.buffer);
        for (let i = m.from; i < u.length; i += 4096) u[i] = 1;     // every page touched: really given
        postMessage({ id: m.id, mb: mem.buffer.byteLength / 1048576 });
      } catch (err) { postMessage({ id: m.id, refused: String((err && err.message) || err) }); }
    };`;
  async function probe(progress, ctl) {
    const step = hooks.probeStepMB, top = hooks.probeTopMB, started = Date.now();
    const w = worker(PWORKER, ctl);
    let reached = 0, why = "", next = 0, away = "";
    // The page going away or hidden mid-check is marked in the record, so the next start can tell it
    // from a crash (Android discards hidden tabs; a reload or a closed tab fires pagehide).
    const mark = () => { try { localStorage.setItem(PROBE_KEY, JSON.stringify({ reached, next, top, started, away })); } catch (e) {} };
    const onAway = (e) => {
      if (away === "closed or reloaded") return;           // pagehide comes before the last visibilitychange
      away = e.type === "pagehide" ? "closed or reloaded" : e.type === "freeze" ? "frozen in the background" : document.visibilityState === "hidden" ? "hidden" : "";
      if (next) mark();
    };
    const EVENTS = ["pagehide", "visibilitychange", "freeze"];
    for (const ev of EVENTS) (ev === "visibilitychange" ? document : window).addEventListener(ev, onAway);
    try {
      while (reached < top) {
        stopped(ctl);
        next = Math.min(top, reached + step);
        localStorage.setItem(PROBE_KEY, JSON.stringify({ reached, next, top, started, away }));     // BEFORE the step: a crash leaves it
        const r = await stepped(`memory check to ${next} MB`, `growing from ${reached} MB by ${next - reached} MB, every page touched`,
          () => w.ask({ pages: (next - reached) * 16, from: reached * 1048576 }, 30000),
          (x) => (x.refused ? `the browser gave no more: ${x.refused}` : `reached ${Math.round(x.mb)} MB`));
        if (r.refused) { why = `the browser gave no more (${r.refused})`; break; }
        reached = Math.round(r.mb);
        if (progress) progress(reached, top);
        if (hooks.probeDelay) await sleep(hooks.probeDelay);
      }
    } catch (e) { if (e.stopped || (ctl && ctl.cancelled)) { localStorage.removeItem(PROBE_KEY); w.kill(); throw e; } why = e.message; }
    finally { w.kill(); for (const ev of EVENTS) (ev === "visibilitychange" ? document : window).removeEventListener(ev, onAway); }
    localStorage.removeItem(PROBE_KEY);
    const c = { mb: reached, when: Date.now(), top: reached >= top, why: reached >= top ? `the check's top, ${top} MB, was reached` : why };
    if (reached > 0) localStorage.setItem(CEILING_KEY, JSON.stringify(c.top ? { mb: reached, when: c.when, top: true } : { mb: reached, when: c.when }));
    log("device", `working-memory ceiling: ${c.top ? "at least " : ""}${reached} MB (${c.why}; ${((c.when - started) / 1000).toFixed(1)} s)`);
    return c;
  }

  // ---- The light benchmark ---------------------------------------------------------------------------
  // progress(text, fraction). opts: { probe: false } skips the memory check (after a crash it is known).
  async function light(progress, ctl, opts = {}) {
    const say = (t, f) => { if (progress) progress(t, f); };
    const t0 = performance.now();
    say("Checking what this device can do…", 0.02);
    const gates = await stepped("gates", "the graphics card's adapter, WebAssembly, the MP3 stream, storage, battery, browser voices", () => DEVICE.gates(),
      (g) => `card ${g.card && g.card.ok ? "yes" : "no"}, model voices ${g.wasm && g.wasm.ok ? "can run" : "cannot run"}, ${g.ms} ms`);
    stopped(ctl);
    let s;
    if (hooks.measure) {      // the tests: stubbed numbers (and gates)
      s = await stepped("processor and card scores", "stubbed by a test", () => hooks.measure(gates), (x) => `one core ${r0(x.f32 || 0)}, all cores ${r0(x.multi || 0)}, card ${r0(x.alu || 0)}`);
      if (s.gates) Object.assign(gates, s.gates);
    } else {
      s = { why: {} };
      const step = async (name, text, frac, detail, fn, result) => { say(text, frac); try { return await stepped(name, detail, fn, result); } catch (e) { if (e.stopped) throw e; s.why[name] = e.message; log("device", `${name} test failed: ${e.message}`); return null; } };
      const threads = Math.max(1, Math.min(32, navigator.hardwareConcurrency || 2));
      const one = gates.wasm.simd ? await step("one-core", "Measuring the processor, one core…", 0.08, "one worker, SIMD f32 kernel, 1 s warm-up + five 400 ms windows", () => oneCore(ctl), (x) => `${r0(x.f32)} MMAC/s`) : null;
      stopped(ctl);
      const all = gates.wasm.simd ? await step("all-cores", "Measuring the processor, all cores…", 0.35, `${threads} workers at once, three 400 ms windows`, () => allCores(ctl), (x) => `${r0(x.multi)} MMAC/s from ${x.workers} workers`) : null;
      stopped(ctl);
      const gpu = gates.card.ok ? await step("card", "Measuring the graphics card…", 0.5, `${gates.card.name || "WebGPU adapter"}: a 256-dispatch exact check, 1 s wake-up, three 250 ms windows of f32 multiply-adds`, () => card(ctl), (x) => (x.ok ? `${r0(x.alu)} G FMA/s` : `not usable: ${x.why}`)) : { ok: false, why: gates.card.why };
      Object.assign(s, { f32: one ? one.f32 : 0, f32Samples: one ? one.samples : [], multi: all ? all.multi : 0, multiTotals: all ? all.totals : [], workers: all ? all.workers : 0,
        alu: gpu && gpu.ok ? gpu.alu : 0, aluSamples: gpu && gpu.ok ? gpu.samples : [], cardOk: !!(gpu && gpu.ok), cardWhy: gpu ? gpu.why || "" : s.why.card || "" });
    }
    stopped(ctl);
    let ceiling = null;
    if (opts.probe === false) { const c = ceilingNow(); ceiling = c ? { mb: c.mb, when: c.when, top: !!c.top, crashed: !!c.crashed, why: c.crashed ? "from the check that crashed" : "measured before" } : null; }
    else { say("Measuring the working memory…", 0.75); ceiling = await probe((mb, top) => say(`Measuring the working memory: ${r0(mb)} MB…`, 0.75 + 0.23 * mb / top), ctl); }
    const voices = DEVICE.voices();
    const input = { f32: s.f32 || 0, multi: s.multi || 0, alu: s.alu || 0, card: { ok: !!s.cardOk, f16: !!(gates.card && gates.card.f16), why: s.cardWhy || (gates.card && gates.card.why) || "" },
      wasm: gates.wasm.ok, mobile: gates.mobile, battery: gates.onBattery, threads: gates.threads, ceilingMB: ceiling && ceiling.mb > 0 && !ceiling.top ? ceiling.mb : null, voices };
    const predictions = RULES.predict(input), suggestion = RULES.suggest(predictions, input);
    const old = record();
    const rec = save({ version: globalThis.APP_VERSION || "", when: Date.now(), seconds: +((performance.now() - t0) / 1000).toFixed(1), gates: { browser: gates.browser, mobile: gates.mobile, onBattery: gates.onBattery, threads: gates.threads, memoryGB: gates.memoryGB, card: gates.card, wasm: gates.wasm, mediaSource: gates.mediaSource, elementTiming: gates.elementTiming, storage: gates.storage, voices },
      scores: { f32: Math.round(s.f32 || 0), multi: Math.round(s.multi || 0), alu: Math.round(s.alu || 0), f32Samples: s.f32Samples, multiTotals: s.multiTotals, aluSamples: s.aluSamples, workers: s.workers, why: s.why },
      ceiling, input, predictions, suggestion, measured: {}, full: null, choice: old && old.choice ? old.choice : null });
    log("device", `light benchmark (${rec.seconds} s): one core ${r0(input.f32)} MMAC/s · all cores ${r0(input.multi)} MMAC/s · card ${input.card.ok ? r0(input.alu) + " G FMA/s" : "none (" + input.card.why + ")"} · memory ceiling ${ceiling ? (ceiling.top ? "at least " : "") + r0(ceiling.mb) + " MB" : "not measured"}`);
    log("device", `predictions: ${predictions.map((p) => `${p.label}: ${p.status}${p.x ? ` (${p.x.toFixed(1)}×)` : ""}`).join(" · ")}`);
    log("device", suggestion ? `suggested: ${suggestion.setup.label} (${suggestion.reason})` : "suggested: nothing (no voice runs on this device)");
    return rec;
  }

  // ---- The full benchmark ---------------------------------------------------------------------------
  const TEXTS = [
    "The road ran on between the hills, and the light was going gold over the fields.",
    "She waited at the gate for a long moment, then lifted the latch and walked through.",
    "Nobody in the village could say when the old tower had last been opened, or by whom.",
    "He counted the coins twice, frowned, and pushed the smaller pile back across the table.",
    "By morning the rain had stopped, and the river was louder than anyone had ever heard it.",
    "They followed the track until it vanished into the reeds, and then they followed the birds.",
  ];
  // The suggested model voice, and the best alternative on the other kind of chip.
  function candidates(rec) {
    if (!rec || !rec.predictions) return [];
    const usable = (p) => p.suggest && p.engine !== "webspeech" && p.status !== "can't run here";
    const first = rec.suggestion && rec.suggestion.setup.engine !== "webspeech" ? rec.predictions.find((p) => p.id === rec.suggestion.id) : null;
    const alt = rec.predictions.find((p) => usable(p) && p !== first && (!first || p.runOn !== first.runOn)) || rec.predictions.find((p) => usable(p) && p !== first);
    return [first, alt].filter(Boolean);
  }
  const optsOf = (p) => { const E = ENGINE.get(p.engine); return { voice: p.voice || (p.engine === "kokoro" ? "af_heart" : E.voices[0].id), runOn: p.runOn, precision: p.precision || "fp32", pace: 1, steps: p.steps || null, copies: p.copies || null, speaker: 0 }; };
  // What the candidates still need to download, for the notice before the full benchmark starts.
  async function plan(rec) {
    const out = [];
    for (const p of candidates(rec)) { const E = ENGINE.get(p.engine); const f = await MODELS.fit(E.files(optsOf(p))); out.push({ setup: p, need: f.need, fit: f }); }
    return out;
  }
  async function measure(p, say, ctl) {
    const E = ENGINE.get(p.engine), o = optsOf(p), texts = hooks.texts || TEXTS;
    const f = await MODELS.fit(E.files(o));
    if (!f.ok) return { id: p.id, label: p.label, skipped: f.text };
    const mem = MODELS.fitMemory(p.memMB || 0);
    if (!mem.ok) return { id: p.id, label: p.label, skipped: mem.text };
    const tick = setInterval(() => say(`${p.label}: ${E.status || "loading"}…`), 300);
    const settings = `${o.voice}, ${o.runOn === "gpu" ? "graphics card" : "processor"}, ${o.precision}${o.steps ? `, ${o.steps} steps` : ""}${o.copies ? `, ${o.copies} copies` : ""}`;
    const what = `full benchmark: ${p.label}`;
    try {
      say(`${p.label}: loading…`);
      await stepped(`${what}: loading`, settings, async () => {
        await E.init(o);
        stopped(ctl);
        clearInterval(tick);
        const want = E.pool ? E.pool.copies : 1, t0 = performance.now();
        while (E.pool && E.pool.ready < want && performance.now() - t0 < 120000) { say(`${p.label}: starting copy ${E.pool.ready + 1} of ${want}…`); stopped(ctl); await sleep(300); }
      }, () => `${E.pool ? Math.max(1, E.pool.ready) : 1} cop${E.pool && E.pool.ready > 1 ? "ies" : "y"} ready`);
      const copies = E.pool ? Math.max(1, E.pool.ready) : 1;
      say(`${p.label}: a first sentence (not counted)…`);
      await stepped(`${what}: a first sentence (not counted)`, settings, () => E.synth({ speech: texts[0] }, o), (r) => (r && r.audio ? `${(r.audio.length / r.sampleRate).toFixed(1)} s of sound` : ""));
      stopped(ctl);
      const n = p.runOn === "gpu" ? 3 : Math.max(2, 2 * copies);
      say(`${p.label}: making ${n} sentences${copies > 1 ? `, ${copies} at once` : ""}…`);
      let sound = 0;
      const one = async (i) => { const r = await E.synth({ speech: texts[1 + (i % (texts.length - 1))] }, o); sound += r.audio.length / r.sampleRate; };
      let s0 = performance.now();
      await stepped(`${what}: ${n} timed sentences`, `${settings}${copies > 1 ? `, ${copies} at once` : ""}`, async () => {
        s0 = performance.now();      // after the log's flush: the timing counts only the sentences
        if (p.runOn === "gpu") for (let i = 0; i < n; i++) { stopped(ctl); await one(i); }
        else await Promise.all(Array.from({ length: n }, (_, i) => one(i)));
      }, () => `${sound.toFixed(1)} s of sound in ${((performance.now() - s0) / 1000).toFixed(1)} s`);
      const seconds = (performance.now() - s0) / 1000;
      const peakMB = E.pool ? Math.max(0, ...E.pool.workers.map((w) => w.peakMB || 0)) : 0;
      const r = { id: p.id, label: p.label, x: sound / seconds, steps: p.steps || null, pieces: n, sound: +sound.toFixed(1), seconds: +seconds.toFixed(1), copies, peakMB, when: Date.now() };
      log("device", `full benchmark: ${p.label}: ${r.x.toFixed(2)}× real time measured (${n} sentences, ${r.sound} s of sound in ${r.seconds} s${copies > 1 ? `, ${copies} copies` : ""}), predicted ${p.predicted ? p.predicted.toFixed(2) : "?"}×; worker memory ${peakMB || "?"} MB`);
      return r;
    } catch (e) {
      if (e.stopped || (ctl && ctl.cancelled)) throw Object.assign(new Error("stopped"), { stopped: true });
      log("device", `full benchmark: ${p.label} failed: ${e.message}`);
      return { id: p.id, label: p.label, failed: String(e.message || e).split("\n")[0] };
    } finally {
      clearInterval(tick);
      if (E.pool && typeof E.pool.close === "function") E.pool.close();
    }
  }
  async function full(rec, progress, ctl) {
    const say = (t) => { if (progress) progress(t); };
    const P = globalThis.PLAYER;
    if (P && P.state !== "stopped") throw new Error("Stop the reading first: the full benchmark needs the voices and the processor to itself.");
    if (P) P.hooks.hold = "The full benchmark is using the voices: press Play when it has finished.";
    const results = [];
    try {
      for (const p of candidates(rec)) { stopped(ctl); results.push(await measure(p, say, ctl)); }
    } finally {
      if (P) { P.hooks.hold = ""; if (P.forget) P.forget(); }
    }
    rec.measured = Object.assign({}, rec.measured);
    for (const r of results) if (r.x > 0) rec.measured[r.id] = { x: r.x, steps: r.steps, peakMB: r.peakMB, when: r.when };
    rec.full = { when: Date.now(), results };
    rec.input = Object.assign({}, rec.input, { measured: rec.measured });
    rec.predictions = RULES.predict(rec.input);
    rec.suggestion = RULES.suggest(rec.predictions, rec.input);
    save(rec);
    log("device", rec.suggestion ? `suggested after the full benchmark: ${rec.suggestion.setup.label}` : "suggested after the full benchmark: nothing");
    return rec;
  }

  // A control for a run: cancel() stops at the next step and ends its workers.
  const control = () => { const c = { cancelled: false, kills: new Set() }; c.cancel = () => { c.cancelled = true; for (const k of Array.from(c.kills)) k(); }; return c; };
  // The Voice tab's mark for a voice setting: the stored setup's status, or null.
  const statusFor = (value) => { const r = record(); return r && r.predictions ? RULES.statusOf(r.predictions, value) : null; };

  globalThis.BENCH = { KEY, PROBE_KEY, CEILING_KEY, hooks, record, save, light, full, probe, candidates, plan, control, statusFor, TEXTS,
    get crashed() { return crashed; }, get interrupted() { return interrupted; }, oneCore, allCores, card };
})();
</script>
<script>
// firstrun.js: the first-run window (PLAN.md "First run"). It opens after the first book import (no
// device check stored yet), at the start after a memory check that crashed the page (to finish the
// check, without measuring the memory again), and from Settings → Debug → Re-check this device. A
// floating window in the Settings window's look. The light benchmark starts at once (about 10 s,
// nothing downloaded, the page stays usable; the step and a progress bar in the head). Then, the
// suggestion first: the setup's name with its status chip and a one-line reason;
// what the buttons do; what was found, in plain words, with the numbers and the technical list under a
// "Numbers and details" fold; every setup marked runs well / barely / too slow / can't run here with its
// speed and the working in small type. Buttons: Good enough (the suggestion is APPLIED at once, UX-02:
// SETTINGSWIN.choose saves it as Apply would, the Settings window opens on the Voice tab to show it with
// the download's progress; a refusal says why and leaves it marked for Apply), Full benchmark (the first tap says what it
// would download, a second within 15 s starts it; the measured speeds then stand next to the predicted
// ones and the suggestion is made again; while it runs the button stops it), Default (Kokoro af_heart
// fp32 on the card, applied at once the same way, no benchmark needed) and Skip (closes; the window does not come
// back at later imports). Every step is optional: Default and Skip stop a running benchmark. The
// buttons' choice is kept in the record (br1-device.choice). FIRSTRUN.open({ reason }) / close() /
// state / ctl for the tests.
(function () {
  let win = null, el = null, ctl = null, rec = null, phase = "", reason = "", armedAt = 0, fullNote = "";
  const U = () => SETTINGSWIN.ui;
  const h = (tag, cls, text) => U().h(tag, cls, text);
  const r0 = (x) => Math.round(x).toLocaleString("en-US");
  const r1 = (x) => (x >= 10 ? x.toFixed(0) : x.toFixed(1));
  const CHIP = { "runs well": "ok", barely: "barely", "too slow": "slow", "can't run here": "cant" };
  // A line "Label: text" with the label in bold (the Found list and the details).
  const labelled = (cls, label, text) => { const d = h("div", cls); d.append(h("b", null, label + ": "), document.createTextNode(text)); return d; };
  // What the gates mean, in plain words (DEVICE.lines keeps the technical list for the details fold).
  function plainGates(g) {
    const c = g.card || {}, s = g.storage, v = g.voices || {}, wasm = g.wasm || {};
    const free = s ? Math.max(0, s.quota - s.usage) : 0;
    return [
      { label: "Graphics card", text: c.ok ? `${c.name || "yes"}; the model voices can use it` : `none the voices can use${c.why ? ` (${c.why})` : ""}`, bad: !c.ok },
      { label: "Processor", text: `${g.threads || "?"} threads${g.memoryGB ? `, about ${g.memoryGB} GB of memory` : ""}; ${g.mobile ? "a phone or tablet" : g.onBattery ? "a computer on battery" : "a computer"}` },
      { label: "Model voices", text: wasm.ok ? "can run here" : "cannot run here: this browser lacks what they need (see the details)", bad: !wasm.ok },
      { label: "Background playback", text: g.mediaSource ? "yes, one continuous sound stream" : "no: each piece plays as its own clip", bad: !g.mediaSource },
      { label: "Room for voice files", text: s ? `${MODELS.MB(free)} free${s.persisted ? "; the browser keeps the files even when space runs short" : `. ${MODELS.KEEP_NOTE}`}` : "the browser does not say", bad: !!(s && free < 4e8) },
      { label: "Browser voices", text: v.supported ? (v.total ? `${v.total} listed, ${v.enLocal || 0} English on the device` : "none listed yet") : "none: this browser cannot speak", bad: !v.supported },
    ];
  }

  function say(text, frac) {
    if (!el) return;
    el.msg.textContent = text || "";
    el.prog.hidden = typeof frac !== "number";
    if (typeof frac === "number") el.prog.firstElementChild.style.width = (Math.max(0, Math.min(1, frac)) * 100).toFixed(1) + "%";
  }
  function choose(what) {
    const r = BENCH.record() || { version: globalThis.APP_VERSION || "", when: Date.now() };
    r.choice = what; r.chosen = Date.now();
    BENCH.save(r);
  }

  // ---- The window ---------------------------------------------------------------------------------
  function build() {
    const root = h("div", "swin frun");
    const head = h("div", "shead");
    const btns = h("div", "sbtns");
    const good = U().button("save", "Finish", goodEnough);     // was "Good enough" (Jon, 2026-10-22)
    good.title = "Use the suggested voice and close this window";
    const fullB = U().button("sfull", "Full test", fullClick);
    fullB.title = "Try the voices for real before choosing (a few minutes)";
    const def = U().button("sdef", "Default", useDefault);
    def.title = "Use the standard voice without testing";
    const skip = U().button("exit", "Skip", () => close());
    skip.title = "Close and decide later";
    btns.append(good, fullB, def, skip);
    const msg = h("div", "smsg");
    msg.setAttribute("aria-live", "polite");
    const prog = h("div", "sprog");
    prog.hidden = true;
    prog.appendChild(h("div"));
    head.append(btns, msg, prog);
    const body = h("div", "sbody");
    root.append(head, body);
    win.body.replaceChildren(root);
    el = { root, body, msg, prog, good, full: fullB, def, skip };
  }
  function render() {
    if (!el) return;
    const top = win.body.scrollTop;
    const B = el.body, row = U().row;
    B.replaceChildren();
    const g = (rec && rec.gates) || null;
    const crashNote = reason === "crashed" ? `The last check stopped while measuring the working memory (the page crashed): ${BENCH.crashed ? r0(BENCH.crashed.mb) + " MB" : "that step"} is taken as this device's limit, and the rest of the check runs now.`
      : reason === "interrupted" ? `The last check was cut short while measuring the working memory (the page was ${BENCH.interrupted ? BENCH.interrupted.away : "closed"}; not a crash), so it runs again now.` : "";
    // 1. The suggestion (while the check runs: what is happening)
    if (phase === "light" || !(rec && rec.predictions)) {
      const box = h("div", "sfit");
      box.appendChild(h("div", "sline", phase === "light" ? "Finding the best voice for this phone or computer. This takes about 10 seconds." : "Not checked."));
      B.appendChild(row(phase === "light" ? "Checking this device" : "Best voice for this device", crashNote, box, { block: true }));
    } else {
      const sg = rec.suggestion, box = h("div", "sfit");
      if (sg) {
        const pick = h("div", "spick");
        pick.append(h("span", "spickname", sg.setup.label), h("span", "schip " + (CHIP[sg.level] || "cant"), sg.level));
        box.appendChild(pick);
        box.appendChild(h("div", "sline", sg.reason));
      } else box.appendChild(h("div", "sline bad", "No voice can read aloud on this device."));
      B.appendChild(row("Best voice for this device", "Press Finish to use it. Its voice files download once (Settings shows the progress).", box, { block: true }));
    }
    // 2. The full benchmark, while it runs and once it has
    if (phase === "full" || fullNote) B.appendChild(row("Full test", "Each voice makes a few sentences, timed. Nothing is played aloud.", h("div", "sline frun-full", fullNote || "Running…"), { block: true }));
    // 3. What the buttons do
    const bl = h("div", "sfit");
    const done = !!(rec && rec.full);
    for (const [name, what] of [
      ["Finish", "use the best voice shown above. You can change it any time in Settings."],
      [done ? "Run the full test again" : "Full test", done ? "test the voices again." : "not sure? Try the voices for real first. Takes a few minutes and downloads the voices."],
      ["Default", "use the standard voice (Kokoro) without testing."],
      ["Skip", "close and decide later. To see this again: Settings → System → Debug → Re-check this device."],
    ]) bl.appendChild(labelled("sline", name, what));
    B.appendChild(row("Your choices", "", bl, { block: true }));
    // 4. What was found, in plain words; the numbers and the technical list under a fold
    if (g) {
      const found = h("div", "sfit");
      for (const l of plainGates(g)) found.appendChild(labelled("sline" + (l.bad ? " bad" : ""), l.label, l.text));
      const det = h("details", "sdet");
      det.appendChild(h("summary", null, "Numbers and details"));
      const dl = h("div", "sfit");
      if (rec.scores) {
        const s = rec.scores, c = rec.ceiling;
        dl.appendChild(h("div", "sline", `Processor: one core ${r0(s.f32)} MMAC/s, all cores ${r0(s.multi)} MMAC/s${s.workers ? ` (${s.workers} at once)` : ""}.`));
        dl.appendChild(h("div", "sline", `Graphics card: ${rec.input.card.ok ? `${r0(s.alu)} G FMA/s` : `none usable (${rec.input.card.why})`}.`));
        dl.appendChild(h("div", "sline", `Working memory: ${c && c.mb > 0 ? `${c.top ? "at least " : ""}${r0(c.mb)} MB${c.crashed ? " (where the check crashed)" : ""}` : "not measured"}.`));
        dl.appendChild(h("div", "sline", `Jon's PC = 1000: one core ${r0(s.f32 / 14.161)}, all cores ${r0(s.multi / 95.82)}${rec.input.card.ok ? `, card ${r0(s.alu / 0.749)}` : ""}.`));
      }
      for (const l of DEVICE.lines(g)) dl.appendChild(labelled("sline" + (l.bad ? " bad" : ""), l.label, l.text));
      det.appendChild(dl);
      found.appendChild(det);
      B.appendChild(row("About this device",`${crashNote ? crashNote + " " : ""}Checked ${LOG.when(rec.when)}${rec.seconds ? ` in ${rec.seconds} s` : ""}.`, found, { block: true }));
    }
    // 5. Every setup
    if (rec && rec.predictions) {
      const sg = rec.suggestion, list = h("div", "sdevlist");
      for (const p of rec.predictions) {
        const r = h("div", "sdevrow" + (sg && sg.id === p.id ? " pick" : ""));
        r.appendChild(h("div", "sdevname", p.label));
        r.appendChild(h("span", "sdevx", p.status === "can't run here" || !p.x ? "" : p.measured ? `measured ${r1(p.x)}×` : `about ${r1(p.keep)}×`));
        r.appendChild(h("span", "schip " + (CHIP[p.status] || "cant"), p.status));
        const m = rec.full && rec.full.results.find((x) => x.id === p.id);
        const extra = m && (m.skipped || m.failed) ? ` Full benchmark: ${m.skipped ? "skipped: " + m.skipped : "failed: " + m.failed}.` : m && m.peakMB ? ` Worker memory ${r0(m.peakMB)} MB.` : "";
        r.appendChild(h("div", "why", (p.measured ? `Measured ${r1(p.x)}× real time, predicted ${r1(p.predicted)}×. ` : p.x ? "" : "") + p.why + (p.note ? `; ${p.note}` : "") + "." + extra));
        list.appendChild(r);
      }
      B.appendChild(row("All voices on this device", "Best-sounding first. 2× means the voice is made twice as fast as it is spoken. Runs well: no pauses. Barely: may pause now and then. Too slow: will keep pausing.", list, { block: true }));
    }
    buttons();
    win.body.scrollTop = top;
  }
  function buttons() {
    if (!el) return;
    const busy = phase === "light" || phase === "full";
    el.good.disabled = busy || !(rec && rec.suggestion);
    el.good.classList.toggle("hot", !el.good.disabled);
    el.full.disabled = phase === "light" || !(rec && rec.predictions && BENCH.candidates(rec).length);
    const done = !!(rec && rec.full);
    el.full.textContent = phase === "full" ? "Stop the test" : armedAt && Date.now() - armedAt < 15000 ? "Start the full test" : done ? "Run the full test again" : "Full test";
  }

  // ---- The runs -----------------------------------------------------------------------------------
  async function runLight() {
    if (ctl) ctl.cancel();
    const my = ctl = BENCH.control();
    phase = "light"; fullNote = ""; armedAt = 0;
    render();
    try {
      rec = await BENCH.light((t, f) => { if (my === ctl) say(t, f); }, my, { probe: reason !== "crashed" });
      if (my !== ctl) return;
      phase = "ready";
      say(rec.suggestion ? "Done. Press Finish to use the best voice." : "Done.");
    } catch (e) {
      if (my !== ctl) return;
      phase = "ready";
      say(e.stopped ? "Stopped." : `The benchmark failed: ${e.message}`);
      if (!e.stopped) log("error", "the light benchmark failed", e);
    }
    render();
    if (SETTINGSWIN.isOpen) SETTINGSWIN.ui.rerender();     // This device and the Voice tab's marks
  }
  async function fullClick() {
    if (phase === "full") { if (ctl) ctl.cancel(); say("Stopping after the current step…"); return; }
    if (!rec) return;
    if (globalThis.PLAYER && PLAYER.state !== "stopped") { say("Stop the reading first: the full benchmark needs the voices and the processor to itself."); return; }
    if (!armedAt || Date.now() - armedAt > 15000) {
      armedAt = Date.now();
      let plan = [];
      try { plan = await BENCH.plan(rec); } catch (e) {}
      const need = plan.reduce((n, x) => n + x.need, 0);
      say(`The full test tries ${plan.map((x) => `${x.setup.label}${x.need ? ` (${MODELS.MB(x.need)} to download)` : ""}`).join(" and ")}${need ? `: ${MODELS.MB(need)} to download in all` : ""}. It takes a few minutes. Tap "Start the full test" to go on.`);
      buttons();
      setTimeout(buttons, 15100);
      return;
    }
    armedAt = 0;
    const my = ctl = BENCH.control();
    phase = "full"; fullNote = "";
    render();
    try {
      rec = await BENCH.full(rec, (t) => { if (my === ctl) { fullNote = t; say(t); const n = el && el.body.querySelector(".frun-full"); if (n) n.textContent = t; } }, my);
      const res = rec.full.results;
      fullNote = res.map((r) => (r.x ? `${r.label}: measured ${r1(r.x)}× real time` : `${r.label}: ${r.skipped ? "skipped (" + r.skipped + ")" : "failed (" + r.failed + ")"}`)).join(" · ") + ".";
      say(`Full test done.${rec.suggestion ? ` Best voice: ${rec.suggestion.setup.label}. Press Finish to use it.` : ""}`);
    } catch (e) {
      fullNote = e.stopped ? "Stopped; nothing was measured." : `The full benchmark stopped: ${e.message}`;
      say(fullNote);
    }
    if (my === ctl) phase = "ready";
    render();
    if (SETTINGSWIN.isOpen) SETTINGSWIN.ui.rerender();
  }

  // ---- The choices --------------------------------------------------------------------------------
  function goodEnough() {
    if (!rec || !rec.suggestion) return;
    const v = Object.assign({}, rec.suggestion.settings);
    // The voice you chose stays when the engine is the same and its speed does not depend on the voice.
    const cur = ENGINE.parse(SETTINGS.get("voice")), sug = ENGINE.parse(v.voice);
    const E = ENGINE.get(cur.engine);
    if (cur.engine === sug.engine && (cur.engine === "kokoro" || cur.engine === "supertonic") && E && E.voices.some((x) => x.id === cur.voice)) v.voice = SETTINGS.get("voice");
    choose("suggested");
    close(true);
    return SETTINGSWIN.choose(v, `The benchmark's suggestion: ${rec.suggestion.setup.label}.`);
  }
  function useDefault() {
    if (ctl) ctl.cancel();
    const D = SETTINGS.DEFAULTS;
    choose("default");
    close(true);
    return SETTINGSWIN.choose({ voice: D.voice, runOn: D.runOn, precision: D.precision, steps: D.steps, copies: D.copies, numbersToWords: D.numbersToWords }, "The default: Kokoro af_heart, fp32, on the graphics card.");
  }

  function open(opts = {}) {
    reason = opts.reason || "recheck";
    if (win) { FLOAT.open("firstrun"); return win; }
    rec = null; phase = ""; fullNote = ""; armedAt = 0;
    win = FLOAT.open("firstrun", { title: "This device", width: 600, height: 680, onClose: () => { if (ctl) ctl.cancel(); ctl = null; if (!quiet && reason !== "recheck" && !(BENCH.record() || {}).choice) choose("skip"); win = null; el = null; quiet = false; } });
    build();
    log("device", `first-run window opened (${reason === "import" ? "after the first import" : reason === "crashed" ? "to finish the check that crashed" : reason === "interrupted" ? "to run the check that was cut short again" : "Re-check this device"})`);
    runLight();
    return win;
  }
  let quiet = false;           // closing through Good enough / Default: the choice is already kept
  function close(byChoice) { quiet = !!byChoice; if (win) win.close(); }

  // After the first import (nothing checked yet); at the start after a crashed memory check. The test
  // browser marks every page BR1_TEST.firstRun = false (test/_chrome.mjs) so other tests' imports do not
  // start a benchmark; the first-run test sets it true.
  const allowed = () => !(globalThis.BR1_TEST && BR1_TEST.firstRun === false);
  READER.onChange((what) => { if (what === "added" && !BENCH.record() && !win && allowed()) open({ reason: "import" }); });   // after books are added, not on a switch
  if (BENCH.crashed || BENCH.interrupted) {
    const t0 = Date.now(), t = setInterval(() => {
      if (Date.now() - t0 > 15000) { clearInterval(t); return; }
      if (window.APP && APP.ready && allowed()) { clearInterval(t); if (READER.state === "book" && !win) open({ reason: BENCH.crashed ? "crashed" : "interrupted" }); }
    }, 200);
  }

  globalThis.FIRSTRUN = {
    open, close: () => close(false),
    get isOpen() { return !!win; },
    get state() { return { phase, reason, rec, armed: !!armedAt }; },
    get ctl() { return ctl; },
  };
})();
</script>
<script>
// app.js: startup. Logs the page facts, starts the reader (the book from storage, or the import
// screen), settles the keep-alive tone and the media session, and then marks the page ready
// (window.APP, which the tests wait for). The page's comings and goings are logged with the player's
// state (type page): hidden / visible, freeze / resume, pagehide / pageshow, online / offline, and a
// heartbeat that notices when the page was not run for a while (a hidden tab throttled, the device asleep).
(function () {
  const n = navigator;
  log("app", `page ${location.protocol} · ${n.userAgent} · cores ${n.hardwareConcurrency || "?"} · memory ${n.deviceMemory || "?"} GB · screen ${screen.width}x${screen.height} · online ${n.onLine}`);
  log("app", `can: MP3 stream ${STREAM.supported() ? "yes" : "no"} · word highlight API ${HIGHLIGHT.canHighlightAPI ? "yes" : "no (spans)"} · workers ${typeof Worker !== "undefined" ? "yes" : "no"} · WebGPU ${"gpu" in n ? "offered (checked at the first voice load)" : "no"} · file store ${typeof caches !== "undefined" ? "yes" : "no"} · speech ${"speechSynthesis" in window ? "yes" : "no"} · media session ${MEDIA.supported ? "yes" : "no"} · wake lock ${"wakeLock" in n ? "yes" : "no"}`);
  const page = (what) => log("page", `${what} (player ${PLAYER.state})`);
  document.addEventListener("visibilitychange", () => page(document.visibilityState));
  document.addEventListener("freeze", () => page("freeze"));
  document.addEventListener("resume", () => page("resume"));
  window.addEventListener("pagehide", (e) => page("pagehide" + (e.persisted ? " (kept whole)" : "")));
  window.addEventListener("pageshow", (e) => page("pageshow" + (e.persisted ? " (kept whole)" : "")));
  window.addEventListener("online", () => page("online"));
  window.addEventListener("offline", () => page("offline"));
  let beat = performance.now();
  setInterval(() => {
    const now = performance.now(), gap = (now - beat) / 1000;
    beat = now;
    if (gap > 3) log("page", `the page was not run for ${gap.toFixed(1)} s (${document.visibilityState}, player ${PLAYER.state})`);
  }, 1000);
  // Long tasks on the page's thread (50 ms and over): each one of 100 ms or more is logged with when it
  // began (so a log tells whether it came before the page's own work, as the picker's does) and what
  // the player was doing; the shorter ones are counted and summed up every 10 s (type timing).
  if (typeof PerformanceObserver !== "undefined" && (PerformanceObserver.supportedEntryTypes || []).includes("longtask")) {
    const L = { n: 0, max: 0, since: 0 };
    try {
      new PerformanceObserver((list) => {
        for (const e of list.getEntries()) {
          const ms = Math.round(e.duration), now = performance.now();
          if (ms >= 100) log("timing", `long task on the page: ${ms} ms from ${LOG.clock(new Date(performance.timeOrigin + e.startTime))}${PLAYER.state !== "stopped" ? " while " + PLAYER.activity() : ""}`);
          else { L.n++; L.max = Math.max(L.max, ms); if (!L.since) L.since = now; else if (now - L.since > 10000) { log("timing", `${L.n} long tasks of 50-99 ms on the page in the last ${Math.round((now - L.since) / 1000)} s (the longest ${L.max} ms)`); L.n = 0; L.max = 0; L.since = now; } }
        }
      }).observe({ type: "longtask", buffered: true });
    } catch (e) {}
  }
  READER.start().catch((e) => log("error", "start failed", e)).then(() => {
    KEEPALIVE.settle("start");
    MEDIA.update();
    window.APP = { version: APP_VERSION, built: APP_BUILT, ready: true };
    log("app", `ready (${READER.state})`);
    SHELF.autoload().catch((e) => log("error", "book shelf failed", e));   // reader/?book=<id>: a book from the public shelf (shelf.js); nothing without it
  });
})();
</script>

</body>
