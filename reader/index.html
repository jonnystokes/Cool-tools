    const listening = !!(g.LISTENER && g.LISTENER.enabled() && !g.LISTENER.cannot());
    const rows = det ? [
      ["current", "Play-start line (left, outer): the paragraph Play starts from, the last one read. Tap a paragraph to move it."],
      ["made", "Sound made: one segment per chunk (a sentence or two), solid once made, faint while waiting."],
      ["speaking", "Being read now: the ring on its line and the blue background."],
      ["piece", "The rest of the piece being read (short lines are read together)."],
    ] : [
      ["current", "Play-start line (left, outer): where Play starts. Tap a paragraph to move it, at any time."],
      ["dash allmade", "A green line at the left: this paragraph's sound is made and ready to play."],
      ["dash speaking", "The line turns blue: being read now (the paragraph is shaded too)."],
      ["piece", "The rest of the piece being read (short lines are read together)."],
    ];
    // The PC voice's marks (Settings → Cloud → Use my PC), in the detailed view: where each chunk is.
    if (det && g.SETTINGS && SETTINGS.get("useMyPC")) rows.splice(2, 0,
      ["made pcq", "Grey-violet segment: queued on your PC, waiting its turn."],
      ["made pcm", "Orange segment: being made on your PC now."],
      ["made pcs", "Cyan segment: made, on the way from your PC."],
      ["made", "Green segment: ready in the browser (solid once its sound is here)."]);
    if (src !== "off") rows.push(["word", `The word being spoken (timing ${src === "voice" ? "from the voice" : src === "listener" ? "from the listener" : "estimated"}).`]);
    // The listener's marks, only while it is on (step 8a); its left-edge marks only in the detailed view.
    if (listening && det) rows.push(
      ["issue", "Inner left stripe, dotted red: the listener found a missing or added word in this paragraph (listed under it)."],
      ["issue slight", "Inner left stripe, dashed yellow: only words spelled differently (often the listener's own spelling)."]);
    if (listening) rows.push(
      ["miss", "Under a paragraph, struck through: a word the listener did not hear (missing)."],
      ["add", "Under a paragraph, with +: a word heard that is not in the text (added)."],
      ["spell", "Under a paragraph, word → heard: heard, but spelled differently."]);
    const box = document.createElement("div");
    box.className = "keylist";
    const ver = document.createElement("div");
    ver.className = "keyver";
    ver.textContent = `${g.APP_VERSION || "Book reader"} · built ${g.APP_BUILT || "?"}${g.APP_NOTE ? " · " + g.APP_NOTE : ""}`;
    box.appendChild(ver);
    for (const [cls, text] of rows) {
      const row = document.createElement("div");
      row.className = "keyrow";
      const sw = document.createElement("span");
      sw.className = "sw " + cls;
      sw.textContent = { word: "word", miss: "word", add: "word", spell: "a → b" }[cls] || "";
      const t = document.createElement("span");
      t.textContent = text;
      row.append(sw, t);
      box.appendChild(row);
    }
    const mode = document.createElement("div");
    mode.className = "keymode";
    mode.textContent = det ? "Detailed marks (diagnostics) are on: Settings → System → Debug switches back to the simple dashes." : "Simple marks. Settings → System → Debug → Detailed marks shows the chunk segments, the Play-start line and the listener's issue marks.";
    box.appendChild(mode);
    w.body.replaceChildren(box);
  }
  const keyBtn = document.getElementById("key");
  if (keyBtn) { keyBtn.title = "Key: what the marks on the page mean"; keyBtn.addEventListener("click", key); }

  g.HIGHLIGHT = Object.assign(pure, { speak, word, made, unmade, refresh, key, settingsChanged, detailed, canHighlightAPI: canHL });
})();

<script>
// listener.js: the listener (step 8a, SETTINGS.md "Listener", PLAN.md "Listener"). A speech-to-text model
// hears each chunk the voice made and compare.js lines its words up with the text SENT to the voice;
// what differs is shown under the paragraph (missing, added, spelled differently, coloured) with an issue
// mark on the paragraph's left edge. Three listeners, from the voice comparison (Backup/2026-10-16
// version 0.9/research/voice-comparison/REPORT.md): Whisper base on the card (the most accurate: 1 false
// alarm in 12,872 words; the timestamped export, so it gives word times: 4.2× real time on Jon's PC headless),
// Parakeet on the card (the fast one, 29-32×; CTC frames give word times; 643 MB and it froze the Pixel in
// 0.9), Moonshine tiny on the processor (28 MB, for phones; no word times; drops short exclamations).
// Each runs in its own worker (a VOICEWORK pool with the `hear` message: the store, Voice_data.zip, the
// fit check, export lists, watchdogs) on Transformers.js 4.3.1 / ORT 1.31, the runtime Supertonic and the
// Kokoro newer engine share (MODELS.RUNTIME, one owner in Voice data: EFF-15).
//
// Settings: listenerOn (off by default since 2026-10-20; on only when chosen,
// whose re-roll would give the same sound), listener ("whisper-base:gpu" / "parakeet:gpu" /
// "moonshine-tiny:cpu"), listenMode (null = automatic: "before" for Supertonic, else "play"): "play" =
// check while it plays (marks only), "before" = check before reading (each chunk waits until it has been
// heard and, for Supertonic, re-rolled), reroll (Supertonic only: a chunk with a missing or an added word
// is made again with a new seed, at most 3 takes in all, the best kept, and only when the voice has spare
// speed: REROLL.minAhead s of sound ready and the voice with the listener at REROLL.minX× real time).
// "play" = check as it is generated: every chunk is heard as soon as it exists, the player never waits.
// CONTENTION (Jon, 2026-10-17; 2026-10-18: no waiting for the playhead): a card listener with a card
// voice is allowed; gate(kind, fn) runs one card job at a time and they alternate, one job each (voice,

    for (const w of found.missing) chip("miss", w, "missing: the listener did not hear this word");
    for (const w of found.added) chip("add", w, "added: heard, but not in the text");
    for (const [w, h] of found.spelled) chip("spell", `${w} → ${h}`, "heard, spelled differently (often the listener's own spelling)");

  // After the chapter is drawn again: the marks back.
  function redraw() {
    if (typeof document === "undefined") return;
    for (const r of results.values()) draw(r.piece);
  }

  // ---- The "Listener" word timing: the heard words' times, shifted to where each chunk starts in the entry
  function timedFor(entry) {
    const r = results.get(entry.id);
    if (!r || !entry.offs) return null;
    const out = [];
    for (const [i, c] of Array.from(r.chunks.entries()).sort((a, b) => a[0] - b[0])) {
      if (!(i in entry.offs) || !c.res.timed) continue;
      for (const w of c.res.timed) out.push([w[0], entry.offs[i] + w[1], entry.offs[i] + w[2]]);
    }
    return out.length ? out : null;
  }

  function end() {
    cur.gen++;
    // Jobs still queued at the card gate belong to the reading that ended: they never run (P11).
    for (const x of gateQ.splice(0)) x.rej(Object.assign(new Error("the reading stopped"), { stopped: true }));
    for (const job of cur.queue.splice(0)) job.done(null);
    if (cur.busy) { const b = cur.busy; cur.busy = null; b.done(null); }
    if (cur.on && cur.stats && cur.stats.checks) log("listener", `listener summary: ${cur.stats.checks} takes heard (${cur.stats.sound.toFixed(0)} s of sound in ${sec(cur.stats.ms)} s, ${(cur.stats.sound / Math.max(0.001, cur.stats.ms / 1000)).toFixed(1)}× real time) · ${cur.stats.red} chunks left with a missing or an added word${cur.stats.rerolls ? ` · ${cur.stats.rerolls} re-rolls, ${cur.stats.fixed} chunks fixed` : ""}${cur.stats.skipped ? ` · ${cur.stats.skipped} re-rolls skipped (no spare speed)` : ""}`);
    cur.on = false;
    shared = false;
  }
  function reset() {
    results.clear();
    version++;
    if (typeof document !== "undefined") {
      for (const el of document.querySelectorAll("#book .heard")) el.remove();
      for (const el of document.querySelectorAll("#book .issue")) el.classList.remove("issue", "slight");
    }
  }
  // The listener settings changed (Save): a listener no longer chosen lets its worker go.
  function settingsChanged() {
    const want = enabled() && !cannot() ? choice().id : "";
    for (const [id, r] of pools) if (id !== want && r.pool) { r.pool.close(); r.pool = null; r.ready = null; r.loaded = false; log("listener", `${r.name} unloaded (the listener settings changed)`); }
    reset();
  }
  // What the status line says while reading.
  function note() {
    if (!cur.on) return "";
    if (cur.why) return cur.note;
    const r = cur.L ? pools.get(cur.L.id) : null;
    if (r && !r.loaded) return `listener: ${r.status || "loading " + cur.L.name + "…"}`;
    if (cur.mode === "before" && cur.busy) return `checking ${where1(cur.busy)}`;
    return "";
  }
  // For the status lines (playbar.js): the listener in short ("Whisper base (card)", "" when it is not
  // checking), and the chunks being checked and waiting to be checked, in order.
  function brief() {
    if (!cur.on || cur.why || !cur.L) return "";
    const r = pools.get(cur.L.id), where = cur.L.runOn === "gpu" ? "card" : "processor";
    return `${cur.L.name} (${where})${r && !r.loaded ? " loading…" : ""}`;
  }
  const jobOf = (job, busy) => ({ id: job.piece.id, ch: job.ch, name: job.name, i: job.i, chunks: job.chunks, busy });
  function jobs() {
    if (!active()) return [];
    return (cur.busy ? [jobOf(cur.busy, true)] : []).concat(cur.queue.map((j) => jobOf(j, false)));
  }
  // Why the sound may have run out (the player's "ran out" line).
  function why() {
    if (!active() || cur.mode !== "before") return "";
    const n = cur.queue.length + (cur.busy ? 1 : 0);
    return n ? `${n} chunk${n === 1 ? "" : "s"} waiting for the listener's check (check before reading)` : "";
  }

  // One take heard outside a reading (the --real smoke test): { text, words, res, ms }.
  async function probe(id, audio, rate, text) {
    const L = byId(id);
    if (!L) throw new Error(`no listener called ${id}`);
    await load(L);
    const t0 = performance.now(), out = await rec(L).pool.hear(audio, { rate, kind: L.kind, pad: L.pad || 0 }, 300000);
    return { text: out.text, words: out.words, res: COMPARE.run(text, L.times && out.words ? out.words : out.text || ""), ms: performance.now() - t0, memory: rec(L).pool.memory() };
  }

  if (typeof document !== "undefined" && g.READER) READER.onChange((what) => { if (what === "chapter") setTimeout(redraw, 0); });

  g.LISTENER = {
    LIST, LIBS, MAX_TAKES, REROLL, hooks, WORKER, byId, files, catalog,
    enabled, mode, choice, cannot, where, contention, timingOff, voiceOnCard,
    begin, made, end, reset, settingsChanged, gate, timedFor, redraw, note, why, probe, brief, jobs,
    get active() { return active(); },
    get shared() { return shared; },
    get state() { return { on: cur.on, name: cur.L ? cur.L.name : "", runOn: cur.L ? cur.L.runOn : "", loaded: !!(cur.L && pools.get(cur.L.id) && pools.get(cur.L.id).loaded), mode: cur.mode, reroll: cur.reroll, why: cur.why, queue: cur.queue.length, busy: !!cur.busy, stats: cur.stats, gate: { busy: gateBusy, queued: gateQ.map((x) => x.kind), voice: gateStats.voice, listen: gateStats.listen, order: gateStats.order } }; },
    results: (id) => results.get(id) || null,
    version: () => version,
    pool: (id) => (pools.get(id || (cur.L && cur.L.id)) || {}).pool || null,
  };
})();
</script>
<script>
// present.js: when did a frame really reach the screen? Animation frames and the audio clock run on
// while the graphics card is busy (measured 2026-10-17: the page ticked, the tint froze), so the only
// honest measure is the presentation time. The Element Timing API gives it: the first paint of any
// element carrying an elementtiming attribute is reported once, with renderTime = when that frame was
// put on the screen. PRESENT.mark() adds a fresh small marker (a 10 px digit in the corner of the play
// bar, #present; the last eight are kept, stacked) and gives back { id, created, render }: render is filled in
// when the browser reports it, and stays 0 when the frame never showed (the page hidden; headless
// Chrome, which presents nothing). PRESENT.wait(after, cap) resolves true once a frame was presented
// after the given performance.now() time, false after cap ms. PRESENT.last is the latest presentation
// time seen, PRESENT.supported whether the API exists here. The player logs the per-word lag from
// these marks (one timing line per piece); research/gpu-yield measured the page with the same trick.
// A marker must be a BLOCK element with text: the API credits inline text to its containing block
// (measured 2026-10-17: spans were never reported, divs always, in 4 ms steps; headless Chrome
// reports them too).
(function () {
  const g = globalThis;
  const host = typeof document !== "undefined" ? document.getElementById("present") : null;
  let supported = !!host && typeof PerformanceElementTiming !== "undefined" && typeof PerformanceObserver !== "undefined";
  const P = { last: 0, n: 0, reported: 0, pending: new Map(), waiters: [] };
  if (supported) {
    try {
      new PerformanceObserver((list) => {
        for (const e of list.getEntries()) {
          const m = P.pending.get(e.identifier);
          if (!m) continue;
          P.pending.delete(e.identifier);
          m.render = e.renderTime || 0;
          if (!m.render) continue;
          P.reported++;
          if (m.render > P.last) P.last = m.render;
          const w = P.waiters;
          P.waiters = [];
          for (const x of w) { if (m.render >= x.after) x.res(true); else P.waiters.push(x); }
        }
      }).observe({ type: "element", buffered: true });
    } catch (e) { supported = false; }
  }
  function mark() {
    const m = { id: "p" + (++P.n), created: performance.now(), render: 0 };
    if (!supported) return m;
    const s = document.createElement("div");
    s.setAttribute("elementtiming", m.id);
    s.textContent = String(P.n % 10);
    host.appendChild(s);
    P.pending.set(m.id, m);
    while (host.children.length > 8) host.removeChild(host.firstChild);
    if (P.pending.size > 64) for (const k of P.pending.keys()) { if (P.pending.size <= 32) break; P.pending.delete(k); }   // never reported (the page hidden): forgotten
    return m;
  }
  function wait(after, cap) {
    if (!supported) return Promise.resolve(false);
    if (P.last >= after) return Promise.resolve(true);
    mark();
    return new Promise((res) => {
      const w = { after, res: (v) => { clearTimeout(t); res(v); } };
      const t = setTimeout(() => { P.waiters = P.waiters.filter((x) => x !== w); res(false); }, cap);
      P.waiters.push(w);
    });
  }
  g.PRESENT = { mark, wait, get last() { return P.last; }, get supported() { return supported; }, get reported() { return P.reported; } };
})();
</script>
<script>
// playbar.js: the play bar at the bottom (⏮ ▶/⏸ ⏭ ⏹, the status, and the lock button at the right
// end): locked, the screen follows the reading (auto-scroll keeps the paragraph read between the top bar
// and the play bar, measured from the bars themselves); unlocked, the screen stays put. Scrolling never
// affects playback. Keys: Space = play / pause, ↑ ↓ = previous / next piece (← → stay the reader's
// chapter keys). The lock starts locked at every page open (not remembered).
// The status (Jon's spec, 2026-10-18): two compact lines right of Stop. Line 1 = the state and the
// compute-heavy parts at work ("Playing · Kokoro fp32 (card) · Whisper base (card)"), an error in the
// error colour replacing it (the reading stopped) or leading it; line 2 = "ready 25 s" first (bold,
// tabular digits, a small meter, amber under 10 s, red at 0, never cut), then what is being made and
// checked ("making 3103: 5 6.2 8  checking 3103: 3 4"); right after "ready", the voice's speed over the
// last minute ("2.3×": seconds of sound made ÷ seconds spent making them; "resting" while it rests;
// shown once a chunk has landed; job 1). Nothing is clipped: the lines wrap and the bar
// grows (its height goes to --play-h so the page keeps clear of it). A tap on the status opens the
// full-status window (float.js), live while open. The player gives the content: PLAYBAR.provide({ status,
// detail }) (player.js status() / detail()) and calls PLAYBAR.refresh(), PLAYBAR.update(state),
// PLAYBAR.follow(element); PLAYBAR.status(text, isError) sets line 1 directly (kept for old callers).
(function () {
  const $ = (id) => document.getElementById(id);
  const KEY = (globalThis.APP_KEY || "br1") + "-lock";
  const playBtn = $("playbtn"), stopBtn = $("stopbtn"), prevBtn = $("prevpiece"), nextBtn = $("nextpiece"), lockBtn = $("lock");
  const box = $("stbox"), status = $("status"), readyEl = $("ready"), readyNum = $("readynum"), readyBar = $("readybar"), workEl = $("work"), speedEl = $("vspeed");
  const LOW = 10, METER_SEC = 60;            // ready: amber under LOW s; the meter is full at METER_SEC s
  // The lock always starts locked when the page opens (Jon, 2026-10-19: an unlock left from an earlier visit
  // kept the screen on the opening chapter while the reading went on). Not remembered between visits.
  let locked = true, provider = null, win = null;
  try { localStorage.removeItem(KEY); } catch (e) {}

  function setLock(on, quiet) {
    locked = !!on;
    lockBtn.classList.toggle("open", !locked);
    lockBtn.title = locked ? "Locked: the screen follows the reading (tap to unlock)" : "Unlocked: the screen stays put (tap to lock)";
    lockBtn.setAttribute("aria-pressed", locked ? "true" : "false");
    if (!quiet) log("playback", locked ? "lock on: the screen follows the reading" : "lock off: the screen stays put");
    if (locked && !quiet && globalThis.PLAYER) PLAYER.show();     // the piece played now (any chapter), or the Play-start marker
  }
  setLock(locked, true);
  lockBtn.addEventListener("click", () => setLock(!locked));

  function update(state) {
    playBtn.textContent = state === "playing" ? "⏸" : "▶";
    playBtn.title = (state === "playing" ? "Pause" : state === "paused" ? "Resume" : "Play from the paragraph last read") + " (Space)";
    playBtn.setAttribute("aria-label", state === "playing" ? "Pause" : "Play");
    stopBtn.disabled = state === "stopped";
    document.body.dataset.player = state;
    refresh();
  }

  // ---- The two lines ---------------------------------------------------------------------------------
  const readyText = (r) => (r == null ? "ready —" : `ready ${Math.floor(r)} s`);
  const readyClass = (w) => (w.idle || w.ready == null ? "idle" : w.ready < 0.5 ? "empty" : w.ready < LOW ? "low" : "");
  function line1(el, l) {
    el.replaceChildren();
    if (l.lead) { const s = document.createElement("span"); s.className = "stlead"; s.textContent = l.lead; el.append(s, l.text ? " · " + l.text : ""); }
    else el.textContent = l.text;
    el.classList.toggle("err", !!l.err && !!l.text);
  }
  function workText(w) {
    const out = [];
    if (w.making) out.push([w.verb, w.making]);
    if (w.checking) out.push(["checking", w.checking]);
    return out;
  }
  function fillWork(el, w) {
    el.replaceChildren();
    for (const [verb, list] of workText(w)) {
      const s = document.createElement("span");
      s.className = "wk";
      const v = document.createElement("span"); v.className = "wv"; v.textContent = verb + " ";
      s.append(v, list);
      el.appendChild(s);
    }
  }
  function fillReady(el, num, bar, w) {
    num.textContent = readyText(w.ready);
    el.className = "ready" + (readyClass(w) ? " " + readyClass(w) : "");
    bar.style.width = w.ready == null ? "0" : Math.round(Math.min(1, w.ready / METER_SEC) * 100) + "%";
    el.title = w.ready == null ? "The device speaks the text itself: no sound is made ahead." : `${Math.floor(w.ready)} s of sound made ahead of what is being read${w.idle ? " (stopped)" : ""}`;
  }
  // The voice's speed now: "2.3×" (the sliding window's figure), "resting", or nothing yet.
  const speedText = (v) => (v === "resting" ? "resting" : v && v.x ? `${x1(v.x)}×` : "");
  function fillSpeed(el, v) {
    if (!el) return;
    const t = speedText(v);
    el.hidden = !t;
    el.textContent = t;
    el.classList.toggle("slow", !!(v && v.x && v.x < 1));
    el.title = v === "resting" ? "The voice is resting: enough sound is made ahead" : v && v.x ? `The voice's speed over the last ${v.window === 60 ? "minute" : v.window + " s"}: ${v.sound} s of sound made in ${v.busy} s of work (${v.chunks} chunk${v.chunks === 1 ? "" : "s"}); above 1× it keeps ahead of the reading` : "";
  }
  // Draw the bar from the player's status: each part only when what it SHOWS changed (job 3, C3: the
  // raw "ready" float changed the old single key on every call, so all three parts were rebuilt every
  // second). The periodic redraws (the player's 1 s tick, the window's timer) skip a hidden page, which
  // is drawn again when it is back; a state change or a message still draws at once (the text is right
  // whenever the page shows). The full-status window is drawn by its own 1 s timer (C4), not here.
  const drawn3 = { l1: "", ready: "", speed: "", work: "" };
  function refresh() {
    if (!provider) return;
    let s;
    try { s = provider.status(); } catch (e) { return; }
    const w = s.work, k1 = JSON.stringify(s.line1);
    const kr = [readyText(w.ready), readyClass(w), w.ready == null ? "n" : Math.round(Math.min(1, w.ready / METER_SEC) * 100), w.ready == null ? "" : Math.floor(w.ready), !!w.idle].join("|");
    const ks = JSON.stringify(w.speed && typeof w.speed === "object" ? [w.speed.x, w.speed.sound, w.speed.busy, w.speed.chunks, w.speed.window] : w.speed == null ? null : w.speed);
    const kw = JSON.stringify(workText(w));
    if (k1 !== drawn3.l1) { drawn3.l1 = k1; line1(status, s.line1); }
    if (kr !== drawn3.ready) { drawn3.ready = kr; fillReady(readyEl, readyNum, readyBar, w); }
    if (ks !== drawn3.speed) { drawn3.speed = ks; fillSpeed(speedEl, w.speed); }
    if (kw !== drawn3.work) { drawn3.work = kw; fillWork(workEl, w); }
  }
  const redrawAll = () => { drawn3.l1 = drawn3.ready = drawn3.speed = drawn3.work = ""; };
  document.addEventListener("visibilitychange", () => { if (document.visibilityState !== "hidden") { refresh(); if (win) drawWindow(); } });
  // Line 1 set directly (the player draws over it at its next refresh).
  function setStatus(text, isError) { drawn3.l1 = ""; line1(status, { lead: "", text: text || "", err: !!isError }); }

  // The bar grows with its lines: the page keeps that much clear at the bottom.
  const play = $("play");
  if (globalThis.ResizeObserver && play) new ResizeObserver(() => document.documentElement.style.setProperty("--play-h", play.offsetHeight + "px")).observe(play);

  // ---- The full-status window ------------------------------------------------------------------------
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const x1 = (x) => (x >= 10 ? x.toFixed(0) : x.toFixed(1));
  const row = (k, v) => `<div class="stw-row"><span class="stw-k">${esc(k)}</span><span class="stw-v">${v}</span></div>`;
  const section = (title, body) => `<section class="stw-sec"><h3>${esc(title)}</h3>${body}</section>`;
  const CHIP = { waiting: "waiting", making: "making", made: "made" };
  function chunkChip(c) {
    const chk = c.chk ? ` · ${c.chk}` : "";
    const cls = ["stw-c", "st-" + c.st, c.chk ? "ck-" + c.chk.replace(/[^a-z]+/g, "-").replace(/-$/, "") : ""].filter(Boolean).join(" ");
    return `<span class="${cls}" title="chunk ${c.n}: ${esc(c.chars)} characters${c.sec != null ? `, ${c.sec.toFixed(1)} s of sound` : ""}">${c.n} ${CHIP[c.st] || esc(c.st)}${esc(chk)}</span>`;
  }
  function html(d) {
    const out = [];
    const l = d.line1, w = d.work;
    out.push(`<div class="stw-now"><div class="stw-l1${l.err ? " err" : ""}">${l.lead ? `<span class="stlead">${esc(l.lead)}</span>${l.text ? " · " : ""}` : ""}${esc(l.text)}</div>`
      + `<div class="stw-ready ready ${readyClass(w)}"><span class="stw-big">${esc(readyText(w.ready))}</span><span class="rbar"><span style="width:${w.ready == null ? 0 : Math.round(Math.min(1, w.ready / METER_SEC) * 100)}%"></span></span></div>`
      + (speedText(w.speed) ? `<span class="vspeed stw-speed">${esc(speedText(w.speed))}</span>` : "")
      + `<div class="stw-work">${workText(w).map(([v, s]) => `<div><span class="wv">${esc(v)}</span> ${esc(s)}</div>`).join("") || (d.state === "stopped" ? "" : "<div>nothing being made or checked</div>")}</div></div>`);
    if (d.error) out.push(section("Last error", `<div class="stw-err">${esc(d.error.text)}</div><div class="stw-dim">at ${esc(d.error.when)}</div>`));
    const v = d.voice;
    if (v) {
      const b = [row("Voice", esc(v.short || "?") + (v.loaded ? "" : ` (loading${v.status ? ": " + esc(v.status) : ""})`))];
      if (!v.live) {
        b.push(row("Speed now", v.now ? `${x1(v.now.x)}× real time over the last ${v.window === 60 ? "1 min" : v.window + " s"} (${v.now.sound} s of sound made in ${v.now.busy} s of work, ${v.now.chunks} chunk${v.now.chunks === 1 ? "" : "s"})` : v.resting ? `resting (no chunk made in the last ${v.window === 60 ? "1 min" : v.window + " s"})` : `no chunk made in the last ${v.window === 60 ? "1 min" : v.window + " s"}`));
        b.push(row("Speed", v.x ? `${x1(v.x)}× real time (measured: ${v.sound.toFixed(0)} s of sound in ${v.chunks} chunks)` : "not measured yet"));
        b.push(row("Chunks", `up to ${v.chunkSize} characters, ${v.copies > 1 ? v.copies + " at a time" : "one at a time"}; ${v.pieces} pieces made this reading`));
        b.push(row("Bursts", v.burst ? (v.resting ? "resting until the buffer runs down" : "making sound") : "off (makes whenever there is room)"));
      } else b.push(row("Pieces", `${v.pieces} said this reading`));
      if (v.failures) b.push(row("Failures", `${v.failures}${v.timeouts ? ` (${v.timeouts} timed out)` : ""}`));
      out.push(section("Voice", b.join("")));
    }
    const bf = d.buffer;
    if (bf && bf.ready != null) {
      out.push(section("Buffer", row("Ready", `${bf.ready.toFixed(1)} s of sound ahead of the playhead`)
        + row("Limits", v && v.burst ? `makes up to ${bf.high} s, rests, starts again under ${bf.low} s` : `up to ${bf.high} s`)
        + row("Sound path", bf.mode === "stream" ? "one MP3 stream" : bf.mode === "clips" ? "one clip per piece" : "closed")
        + (bf.stalls ? row("Ran out", `${bf.stalls} time${bf.stalls === 1 ? "" : "s"} this reading`) : "")
        + (bf.held ? row("Scroll pause", "the next chunk waits while the page is scrolled") : "")));
    }
    const L = d.listener;
    if (L) {
      const st = L.stats || {}, lx = st.ms ? st.sound / (st.ms / 1000) : 0;
      const b = [row("Listener", `${esc(L.name || "?")} (${L.runOn === "gpu" ? "graphics card" : "processor"})${L.loaded ? "" : " loading…"}`),
        row("When", L.mode === "before" ? "each chunk before it is read (the reading waits)" : "each chunk as it is generated (the player never waits)")];
      if (L.why) b.push(row("Stopped", `<span class="stw-err">${esc(L.why)}</span>`));
      b.push(row("Checked", st.checks ? `${st.checks} takes, ${x1(lx)}× real time; ${st.red} with a missing or added word${st.rerolls ? `; ${st.rerolls} re-rolls, ${st.fixed} fixed` : ""}` : "nothing yet"));
      b.push(row("Waiting", `${L.queue} chunk${L.queue === 1 ? "" : "s"} to check`));
      if (L.shared) b.push(row("Card", `shared with the voice, taking turns: ${L.gate.voice} voice jobs, ${L.gate.listen} checks so far`));
      out.push(section("Listener", b.join("")));
    }
    if (d.lag) out.push(section("Word lag", `<div>${esc(d.lag)}</div>`));
    if (d.activity) out.push(section("Doing now", `<div>${esc(d.activity)}</div>`));
    if (d.pieces && d.pieces.length) {
      const rows = d.pieces.map((p) => `<div class="stw-p${p.reading ? " reading" : ""}"><span class="stw-pn">${p.reading ? "▶ " : ""}${esc(p.name)}${p.title ? " (title)" : ""}</span>`
        + `<span class="stw-ps">${esc(p.st)}${p.inStream ? ` · ${p.inStream} in the stream` : ""}</span>`
        + (p.chunks.length > 1 || (p.chunks[0] && p.chunks[0].chk) ? `<span class="stw-cs">${p.chunks.map(chunkChip).join("")}</span>` : "") + "</div>");
      out.push(section("Pieces from the one being read", `<div class="stw-dim">Each piece's chunks: waiting / making / made, then to check / checking / checked.</div>${rows.join("")}`));
    }
    return out.join("");
  }
  function drawWindow() {
    if (!win || !provider) return;
    let d;
    try { d = provider.detail(); } catch (e) { win.inner.textContent = "The status could not be read: " + e.message; win.drawn = ""; return; }
    const h = html(d);
    if (h !== win.drawn) { win.drawn = h; win.inner.innerHTML = h; }
  }
  function openWindow() {
    if (win) { FLOAT.open("status"); return; }
    const w = FLOAT.open("status", { title: "Status", width: 460, height: 560, onClose: () => { win = null; } });
    w.inner = document.createElement("div");
    w.inner.className = "stwin";
    w.body.appendChild(w.inner);
    win = w;
    drawWindow();
  }
  box.addEventListener("click", openWindow);
  box.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); openWindow(); } });
  // The window is live once a second whatever the player's state (while stopped the player does not
  // tick: a download, a finished benchmark), never while the page is hidden (job 3, C4: it was drawn
  // twice a second while playing, plus on every status() call).
  setInterval(() => { if (win && document.visibilityState !== "hidden") { refresh(); drawWindow(); } }, 1000);

  // ---- Following the reading ---------------------------------------------------------------------------
  // The band the reader can see: under the top bar, above the play bar. A paragraph outside it is
  // brought to a quarter of the way down (a tall one nearer the top, so as much as possible shows).
  function band() {
    const top = Math.max(0, $("top").getBoundingClientRect().bottom);
    const bottom = Math.max(top + 60, $("play").getBoundingClientRect().top);
    return { top, bottom };
  }
  function follow(el) {
    if (!locked || !el) return;
    const r = el.getBoundingClientRect(), b = band();
    if (r.top >= b.top + 4 && r.bottom <= b.bottom - 4) return;
    const h = b.bottom - b.top;
    const down = Math.max(12, Math.min(h * 0.25, h - r.height - 12));
    const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    scrollTo({ top: Math.max(0, scrollY + r.top - b.top - down), behavior: smooth ? "smooth" : "auto" });
  }

  playBtn.addEventListener("click", () => PLAYER.toggle());
  stopBtn.addEventListener("click", () => PLAYER.stop());
  prevBtn.addEventListener("click", () => PLAYER.step(-1));
  nextBtn.addEventListener("click", () => PLAYER.step(1));
  // A mouse click leaves no focus on a bar button, so Space stays Play / Pause instead of pressing it again.
  for (const b of [playBtn, stopBtn, prevBtn, nextBtn, lockBtn]) b.addEventListener("click", (e) => { if (e.detail > 0) b.blur(); });
  document.addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || e.defaultPrevented) return;
    const t = e.target;
    if (t instanceof Element && (t.matches("input, textarea, select, button") || t.isContentEditable || t.closest(".float"))) return;
    if (e.key === "ArrowUp") { e.preventDefault(); PLAYER.step(-1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); PLAYER.step(1); }
    else if (e.key === " ") { e.preventDefault(); PLAYER.toggle(); }
  });

  globalThis.PLAYBAR = {
    update, status: setStatus, refresh, follow, lock: setLock, open: openWindow,
    provide: (p) => { provider = p; redrawAll(); refresh(); },
    get window() { return win; },
    get locked() { return locked; },
  };
})();
</script>
<script>
// scrollrail.js: a thin scroll rail on the right edge, between the top bar and the play bar, for screens
// whose own scroll bar fades away (touch screens; Android Chrome and some Windows setups draw "overlay"
// scroll bars, which a page cannot keep on screen). Jon, 2026-10-19: "can you make the scroll bar
// always visible?" The thumb shows where the screen is in the chapter; drag it to scroll, tap the
// track to jump there. It only scrolls the page: the reading never moves (scrolling never affects
// playback). Shown when the page's scroll bar takes no room (overlay) or the pointer is coarse (touch),
// and the page can scroll. Work happens only on a scroll, a resize or a drag (no per-frame loop).
// SCROLLRAIL.update() redraws; SCROLLRAIL.on tells whether it is shown.
(function () {
  const $ = (id) => document.getElementById(id);
  const book = $("book"), top = $("top"), play = $("play");
  const rail = document.createElement("div"), thumb = document.createElement("div");
  rail.className = "rail"; rail.id = "rail"; rail.hidden = true; rail.setAttribute("aria-hidden", "true");
  thumb.className = "thumb";
  rail.appendChild(thumb);
  document.body.appendChild(rail);

  const root = document.documentElement;
  const MIN_THUMB = 28;
  let on = false, why = "", queued = 0, drag = null, geo = null;

  // The page's own scroll bar takes no room: overlay (or none at all).
  const overlay = () => innerWidth - root.clientWidth <= 0;
  const touch = () => matchMedia("(pointer: coarse)").matches;
  function measure() {
    const t = Math.round(top.getBoundingClientRect().bottom) + 4;
    const b = Math.round(play.getBoundingClientRect().height) + 4;
    const track = Math.max(0, innerHeight - t - b);
    const range = Math.max(0, root.scrollHeight - innerHeight);
    const h = range > 0 ? Math.max(MIN_THUMB, Math.min(track, Math.round(track * innerHeight / root.scrollHeight))) : track;
    return { t, b, track, range, h };
  }
  function draw() {
    queued = 0;
    const want = (overlay() || touch()) && !book.hidden;
    geo = want ? measure() : null;
    const show = !!geo && geo.range > 8 && geo.track > MIN_THUMB * 2;
    const reason = !want ? "" : overlay() ? "the scroll bar is an overlay" : "a touch screen";
    if (show !== on || (show && reason !== why)) { on = show; why = reason; if (on) log("page", `scroll rail on (${why})`); }
    rail.hidden = !show;
    // While the rail is shown, the browser's own (fading) scroll bar is hidden, so the two never show
    // out of step (Jon, 2026-10-19: "it appears and disappears when I scroll ... hide it").
    root.classList.toggle("rail-on", show);
    if (!show) return;
    rail.style.top = geo.t + "px";
    rail.style.bottom = geo.b + "px";
    thumb.style.height = geo.h + "px";
    const y = (geo.track - geo.h) * Math.min(1, Math.max(0, scrollY / geo.range));
    thumb.style.transform = `translateY(${Math.round(y)}px)`;
  }
  const update = () => { if (!queued) queued = requestAnimationFrame(draw); };

  // Thumb position (its top, px inside the track) to the page's scroll position.
  function scrollFor(y) {
    const g = geo || measure(), free = Math.max(1, g.track - g.h);
    scrollTo(0, Math.round(Math.min(1, Math.max(0, y / free)) * g.range));
  }
  rail.addEventListener("pointerdown", (e) => {
    if (!geo || (e.pointerType === "mouse" && e.button !== 0)) return;
    e.preventDefault();
    const r = rail.getBoundingClientRect(), tr = thumb.getBoundingClientRect();
    // On the thumb: keep the grip; on the track: jump so the thumb is centred there, then drag on.
    const grip = e.clientY >= tr.top && e.clientY <= tr.bottom ? e.clientY - tr.top : geo.h / 2;
    drag = { id: e.pointerId, grip, top: r.top };
    try { rail.setPointerCapture(e.pointerId); } catch (x) {}
    rail.classList.add("dragging");
    scrollFor(e.clientY - drag.top - grip);
  });
  rail.addEventListener("pointermove", (e) => { if (drag && e.pointerId === drag.id) scrollFor(e.clientY - drag.top - drag.grip); });
  const end = (e) => { if (drag && e.pointerId === drag.id) { drag = null; rail.classList.remove("dragging"); } };
  rail.addEventListener("pointerup", end);
  rail.addEventListener("pointercancel", end);
  rail.addEventListener("click", (e) => e.stopPropagation());

  addEventListener("scroll", update, { passive: true });
  addEventListener("resize", update);
  if (typeof ResizeObserver !== "undefined") { const ro = new ResizeObserver(update); ro.observe(book); ro.observe(top); ro.observe(play); }
  update();

  globalThis.SCROLLRAIL = { update, get on() { return on; } };
})();
</script>
<script>
// logwin.js: the log viewer (step 8b). LOGWIN.view(opts) makes one: a bar (Copy · Save to file · what
// they take: the shown lines or every line · which visit: this one, live, or a past one from the
// database · the count · a "Log types" fold with a tick box per type) over a scrolling box with the
// lines, newest at the bottom. Live, it follows new lines while the box is at the bottom; scrolled up
// it stays put and a "↓ N new" button brings it back down. Unticking a type hides it in every viewer
// (the setting logTypesOff, saved at once; everything is still logged). LOGWIN.open() is the floating
// Log window (from the Log button in Settings) with a viewer filling it; Settings → Debug embeds one
// (settingswin.js). A past visit is read whole from LOG.read(id) and shown as it was.
// Job 3, C5: the text sits in blocks of BLOCK lines (each line ends with "\n") and a new line is
// appended to the last block only, so the layout touches that block, not the whole log.
(function () {
  const g = globalThis;
  const BLOCK = 200;
  const text = (l) => `${l.t} ${l.type.padEnd(8)} ${l.msg}`;
  const TYPE_RE = /^\d{1,2}:\d\d:\d\d\.\d{3} [AP]M (\w+)/;        // the type of a stored line's text
  const offTypes = () => new Set(g.SETTINGS ? SETTINGS.get("logTypesOff") : []);
  const views = new Set();                                         // every viewer alive
  const h = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  let win = null, winView = null;

  // Save a text file: the browser's save picker where there is one, else a download. Gives "saved",
  // "downloaded" or "cancelled". The tests replace LOGWIN.hooks.save.
  const hooks = {
    save: async (name, body) => {
      if (typeof g.showSaveFilePicker === "function") {
        let fh;
        try { fh = await g.showSaveFilePicker({ suggestedName: name, types: [{ description: "Text", accept: { "text/plain": [".txt"] } }] }); }
        catch (e) { if (e && e.name === "AbortError") return "cancelled"; throw e; }
        const w = await fh.createWritable();
        await w.write(body); await w.close();
        return "saved";
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([body], { type: "text/plain" })); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      return "downloaded";
    },
  };
  const fileName = (when) => { const d = new Date(when); return `reader log ${LOG.date(d)} ${LOG.when(d).slice(11).replace(":", ".")}.txt`; };
  const n0 = (n) => n.toLocaleString("en-US");

  function view(opts = {}) {
    const el = h("div", "logview"), bar = h("div", "logbar"), box = h("div", "logbox"), pre = h("pre", "logtext");
    const copyBtn = h("button", null, "Copy"), saveBtn = h("button", null, "Save to file");
    copyBtn.type = saveBtn.type = "button";
    const scope = h("select"); scope.setAttribute("aria-label", "What Copy and Save take");
    for (const [v, t] of [["shown", "the shown lines"], ["all", "every line"]]) { const o = h("option", null, t); o.value = v; scope.appendChild(o); }
    const visitSel = h("select"); visitSel.setAttribute("aria-label", "Which visit's log");
    const count = h("span", "lcount");
    const types = h("details", "logtypes"), sum = h("summary"), ticks = h("div", "sticks");
    types.open = !!opts.typesOpen;
    types.append(sum, ticks);
    const newBtn = h("button", "lognew"); newBtn.type = "button"; newBtn.hidden = true;
    bar.append(copyBtn, saveBtn, scope, visitSel, count, types);
    box.appendChild(pre);
    el.append(bar, box, newBtn);
    if (opts.height) el.style.height = opts.height;          // embedded (Settings → Debug): the viewer's own height
    const V = { el, box, visit: "now", stored: null, started: 0, block: null, inBlock: 0, n: 0, paused: false, unseen: 0 };

    // ---- The lines ----
    const atBottom = () => box.scrollTop + box.clientHeight >= box.scrollHeight - 24;
    const down = () => { box.scrollTop = box.scrollHeight; V.paused = false; V.unseen = 0; newBtn.hidden = true; };
    const newBlock = () => { V.block = h("div"); pre.appendChild(V.block); V.inBlock = 0; };
    const shownOf = () => { const off = offTypes(); return V.visit === "now" ? LOG.lines.filter((l) => !off.has(l.type)).map(text) : (V.stored || []).filter((s) => { const m = TYPE_RE.exec(s); return !m || !off.has(m[1]); }); };
    const total = () => (V.visit === "now" ? LOG.lines.length : (V.stored || []).length);
    function render() {
      const lines = shownOf();
      pre.replaceChildren(); V.block = null;
      for (let i = 0; i < lines.length; i += BLOCK) { newBlock(); const part = lines.slice(i, i + BLOCK); V.block.textContent = part.join("\n") + "\n"; V.inBlock = part.length; }
      V.n = lines.length;
      counts();
      down();
    }
    function counts() {
      const all = total(), off = offTypes();
      count.textContent = (V.n === all ? `${n0(V.n)} lines` : `${n0(V.n)} of ${n0(all)} lines`) + (V.visit === "now" ? "" : " · a past visit, not live");
      sum.textContent = `Log types (${LOG.TYPES.length - off.size} of ${LOG.TYPES.length} shown)`;
    }
    // The box's size changes when it is put on the page, when the bar wraps or the window is resized:
    // keep the bottom in view unless the reader scrolled up.
    if (g.ResizeObserver) new ResizeObserver(() => { if (!V.paused) box.scrollTop = box.scrollHeight; }).observe(box);
    function arrived(line) {
      if (V.visit !== "now") return;
      if (offTypes().has(line.type)) { counts(); return; }
      if (!V.block || V.inBlock >= BLOCK) newBlock();
      V.block.append(text(line) + "\n");
      V.inBlock++; V.n++;
      counts();
      if (!V.paused) box.scrollTop = box.scrollHeight;
      else { V.unseen++; newBtn.textContent = `↓ ${n0(V.unseen)} new`; newBtn.hidden = false; }
    }
    box.addEventListener("scroll", () => { V.paused = !atBottom(); if (!V.paused) { V.unseen = 0; newBtn.hidden = true; } }, { passive: true });
    newBtn.addEventListener("click", down);

    // ---- The bar ----
    const body = () => (scope.value === "all" ? (V.visit === "now" ? LOG.text() : (V.stored || []).join("\n")) : shownOf().join("\n"));
    const said = (what) => { count.textContent = what; setTimeout(counts, 4000); };
    copyBtn.addEventListener("click", async () => {
      const t = body(), n = t ? t.split("\n").length : 0;
      try { await navigator.clipboard.writeText(t); said(`copied ${n0(n)} lines`); }
      catch (e) {
        const st = box.scrollTop, r = document.createRange(); r.selectNodeContents(pre);
        const s = getSelection(); s.removeAllRanges(); s.addRange(r);
        const ok = document.execCommand && document.execCommand("copy");
        if (ok) s.removeAllRanges();
        box.scrollTop = st;                                     // the selection scrolled the box
        said(ok ? `copied ${n0(n)} lines` : "select the text and copy it");
      }
    });
    saveBtn.addEventListener("click", async () => {
      const t = body(), n = t ? t.split("\n").length : 0;
      try { const r = await hooks.save(fileName(V.visit === "now" ? LOG.visit.started : V.started), t + "\n"); said(r === "cancelled" ? "not saved" : `${r} ${n0(n)} lines`); }
      catch (e) { said("could not save: " + (e && e.message)); log("error", "saving the log to a file failed", e); }
    });
    for (const t of LOG.TYPES) {
      const l = h("label", "stick"), c = h("input");
      c.type = "checkbox"; c.value = t;
      c.addEventListener("change", () => { const off = offTypes(); if (c.checked) off.delete(t); else off.add(t); setTypes(Array.from(off)); });
      l.append(c, h("span", null, t));
      ticks.appendChild(l);
    }
    const tick = () => { const off = offTypes(); for (const c of ticks.querySelectorAll("input")) c.checked = !off.has(c.value); };
    // The visits: this one (live) and the stored ones, newest first.
    async function visits() {
      const list = (await LOG.visits()).filter((v) => v.id !== LOG.visit.id).sort((a, b) => (b.started || 0) - (a.started || 0));
      visitSel.replaceChildren();
      const now = h("option", null, "This visit (live)"); now.value = "now"; visitSel.appendChild(now);
      for (const v of list) { const o = h("option", null, `${LOG.when(v.started || v.last || 0)} · ${n0(v.lines || 0)} lines · ${String(v.version || "").replace("Book reader ", "")}`); o.value = v.id; o.dataset.started = v.started || 0; visitSel.appendChild(o); }
      visitSel.value = V.visit;
      if (visitSel.value !== V.visit) { V.visit = "now"; V.stored = null; visitSel.value = "now"; render(); }
    }
    visitSel.addEventListener("change", () => show(visitSel.value));
    async function show(id) {
      if (id === "now") { V.visit = "now"; V.stored = null; render(); return; }
      const t = await LOG.read(id);
      const o = Array.from(visitSel.options).find((x) => x.value === id);
      V.visit = id; V.stored = t ? t.split("\n") : []; V.started = o ? Number(o.dataset.started) : 0;
      if (visitSel.value !== id) visitSel.value = id;
      render();
    }
    tick();
    render();
    visits();
    V.render = render; V.arrived = arrived; V.tick = tick; V.visits = visits; V.show = show; V.counts = counts;
    V.close = () => views.delete(V);
    views.add(V);
    return V;
  }
  LOG.watch((line) => { for (const v of views) v.arrived(line); });

  // The types changed (a tick here or in Settings): every viewer again.
  function setTypes(list) {
    SETTINGS.set("logTypesOff", list);
    filterChanged();
  }
  function filterChanged() { for (const v of views) { v.tick(); v.render(); } }
  // Past visits cleared (Settings → Debug): their entries go from every visit list.
  function pastChanged() { for (const v of views) v.visits(); }

  function open(visit) {
    if (!win) {
      win = FLOAT.open("log", { title: "Log", width: 600, height: 460, onClose: () => { if (winView) winView.close(); win = null; winView = null; } });
      winView = view();
      win.body.replaceChildren(winView.el);
    } else FLOAT.open("log");
    if (visit) winView.visits().then(() => winView.show(visit));
    return win;
  }

  globalThis.LOGWIN = { view, open, setTypes, filterChanged, pastChanged, hooks, fileName, get isOpen() { return !!win; }, get views() { return views.size; } };
})();
</script>
<script>
// debugview.js: the Debug view (Settings → Debug → Debug view, a live setting): a floating window that
// lists, as they are found, the listener's word findings (a chunk heard with a missing, added or
// differently spelled word, and its re-rolls), errors (every log line of type error) and issues (a
// line of another type that reports a problem: the sound ran out, a failed chunk, a watchdog restart,
// a stopped listener, a silent take, a refused store...). Each row carries a shape and a colour: ≠ for
// words, ✗ for an error, ! for an issue. Newest at the bottom, following while the list is at the
// bottom. No waveforms (PLAN.md). The window IS the setting: switching it on opens the window (what
// this visit already found is listed first), closing the window switches it off, said in the log.
// DEBUGVIEW.apply() follows the setting (Settings calls it); classify(line) is pure, for the tests.
(function () {
  const g = globalThis;
  const MAX = 500;
  const SHAPE = { words: "≠", error: "✗", issue: "!" };
  const NAME = { words: "word finding", error: "error", issue: "issue" };
  // A line that reports a problem (not a count of them: the Stop summaries are left out).
  const ISSUE = /ran out at|the voice failed|failed on piece|failed (to|at|:|;)|load(ing)? failed|download failed|could not|cannot|can't run|is not stored|refused|crash|gave up|had stalled|stalled|silent|broken sound|not re-rolled|listener stopped|watchdog|restarted it|too slow|long task|not saved|tick gap|the last run stopped|not a number|NaN\b/i;
  const ISSUE_TYPES = new Set(["playback", "voice", "pieces", "listener", "worker", "download", "storage", "memory", "app", "device", "book", "media", "timing", "page"]);
  function classify(line) {
    if (line.type === "error") return "error";
    if (line.type === "listener") {
      if (/^heard .*\): (?!all \d+ words heard)/.test(line.msg) || /^re-rolled /.test(line.msg)) return "words";
    }
    if (/^(listener )?summary:/.test(line.msg)) return null;
    return ISSUE_TYPES.has(line.type) && ISSUE.test(line.msg) ? "issue" : null;
  }

  let win = null, list = null, bar = null, closingSelf = false;
  const rows = [];                         // { kind, t, msg }, oldest first, at most MAX
  const counts = { words: 0, error: 0, issue: 0 };
  const h = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const n0 = (n) => n.toLocaleString("en-US");

  function rowEl(r) {
    const d = h("div", "dbrow " + r.kind);
    d.append(h("span", "dbk", SHAPE[r.kind]), h("span", "dbt", r.t.replace(/\.\d{3}/, "")), h("span", "dbm", r.msg));
    d.title = NAME[r.kind];
    return d;
  }
  function head() {
    if (!bar) return;
    const parts = ["words", "error", "issue"].map((k) => `${n0(counts[k])} ${NAME[k]}${counts[k] === 1 ? "" : "s"}`);
    bar.firstChild.textContent = rows.length ? parts.join(" · ") : "Nothing found yet: the listener's word findings, errors and issues appear here as they happen.";
  }
  function add(line, draw = true) {
    const kind = classify(line);
    if (!kind) return;
    const r = { kind, t: line.t, msg: line.msg };
    rows.push(r);
    counts[kind]++;
    if (rows.length > MAX) { const old = rows.shift(); counts[old.kind]--; if (list && list.firstChild) list.firstChild.remove(); }
    if (!draw || !list) return;
    const atBottom = list.scrollTop + list.clientHeight >= list.scrollHeight - 24;
    list.appendChild(rowEl(r));
    head();
    if (atBottom) list.scrollTop = list.scrollHeight;
  }
  LOG.watch((line) => { if (win) add(line); });

  function open() {
    if (win) { FLOAT.open("debug"); return win; }
    win = FLOAT.open("debug", { title: "Debug view", width: 520, height: 420, onClose: () => {
      win = null; list = null; bar = null;
      if (!closingSelf && g.SETTINGS && SETTINGS.get("debugView")) {
        SETTINGS.set("debugView", false);
        if (g.SETTINGSWIN && SETTINGSWIN.isOpen && SETTINGSWIN.tab.tab === "Debug") SETTINGSWIN.ui.rerender();
      }
    } });
    rows.length = 0; counts.words = counts.error = counts.issue = 0;
    for (const l of LOG.lines) add(l, false);          // what this visit found so far
    bar = h("div", "dbbar");
    bar.appendChild(h("span", "dbcount"));
    const clear = h("button", null, "Clear"); clear.type = "button"; clear.title = "Empty this list (the log keeps everything)";
    clear.addEventListener("click", () => { rows.length = 0; counts.words = counts.error = counts.issue = 0; list.replaceChildren(); head(); });
    bar.appendChild(clear);
    list = h("div", "dblist");
    for (const r of rows) list.appendChild(rowEl(r));
    win.body.replaceChildren(bar, list);
    head();
    list.scrollTop = list.scrollHeight;
    return win;
  }
  function close() { if (!win) return; closingSelf = true; try { win.close(); } finally { closingSelf = false; } }
  // The setting as it is now: on = the window open, off = closed.
  function apply() { if (g.SETTINGS && SETTINGS.get("debugView")) open(); else close(); }

  g.DEBUGVIEW = { apply, open, close, classify, rows, get isOpen() { return !!win; }, get counts() { return Object.assign({}, counts); } };
  if (g.SETTINGS && SETTINGS.get("debugView")) open();
})();
</script>
<script>
// keepalive.js: the keep-alive tone. A quiet tone (HZ at LEVEL: far below what an ear or an earphone
// makes anything of; Jon is testing 10 Hz) looping on its own <audio> element, so that Android keeps
// the tab playing and shows the lock-screen controls while reading, and so that a page whose voice is
// the device's own (the browser voices make no sound of their own) still has a media session. On
// while reading when "Keep-alive sound" is on; "...also while stopped or paused" keeps it going
// between reads (the browser plays nothing before a tap, so then it starts at the first tap). An
// outside pause of the tone alone while reading starts it again after a moment; an outside pause of
// the reading (a call, another app taking the sound; KEEPALIVE.outside from the player) HOLDS it quiet,
// idle setting or not, until the reader plays again or the page is tapped (BUG-20, job 4). KEEPALIVE.settle(why) after every player state change and
// settings save; KEEPALIVE.on / playing / element for the Debug view and the tests.
(function () {
  const HZ = 10, LEVEL = 0.003, RATE = 8000, LOOP_SEC = 12;   // 120 whole cycles: a seamless loop
  let el = null, on = false, waitingForTap = false, held = false;

  function element() {
    if (el) return el;
    const n = RATE * LOOP_SEC, a = new Float32Array(n);
    for (let i = 0; i < n; i++) a[i] = LEVEL * Math.sin(2 * Math.PI * HZ * i / RATE);
    el = new Audio(URL.createObjectURL(new Blob([STREAM.wav(a, RATE)], { type: "audio/wav" })));
    el.loop = true;
    el.preload = "auto";
    el.setAttribute("playsinline", "");
    el.addEventListener("pause", () => {
      if (!on) return;                                 // our own stop: on was cleared first
      on = false;
      held = true;
      const reading = PLAYER.state === "playing";
      log("playback", `the keep-alive tone was paused from outside the page${reading ? "; it starts again in a moment if the reading goes on" : "; it stays quiet until the reader plays again or the page is tapped"}`);
      // Only the tone paused while the reading goes on: start it again. A call or another app pauses the
      // reading too (the player's outside pause): then it stays quiet (held), even with "Keep-alive also
      // while stopped or paused" on, so it never takes the sound back from the call (BUG-20).
      if (reading) setTimeout(() => { if (held && PLAYER.state === "playing") { held = false; settle("after an outside pause"); } }, 1500);
      MEDIA.update();
    });

    return el;
  }

  const wanted = () => !!SETTINGS.get("keepAlive") && (PLAYER.state === "playing" || !!SETTINGS.get("keepAliveIdle"));

  function start(why) {
    const a = element();
    if (on && !a.paused) return;
    a.play().then(() => {
      waitingForTap = false;
      if (!on) { on = true; log("playback", `keep-alive tone on (${HZ} Hz${why ? ", " + why : ""})`); MEDIA.update(); }
    }, (e) => {
      on = false;
      if (e && e.name === "AbortError") return;        // our own stop came first
      if (!waitingForTap) { waitingForTap = true; log("playback", `the keep-alive tone waits for a tap on the page (the browser plays no sound before one): ${e && e.message}`); }
    });
  }
  function stop() {
    if (!el) return;
    const was = on;
    on = false;
    if (!el.paused) el.pause();
    if (was) log("playback", "keep-alive tone off");
  }

  // headset button) or the page is tapped.
  function settle(why) {

    if (held) { stop(); return; }
    if (wanted()) start(why); else stop();

  function release(why) { if (!held) return; held = false; log("playback", `keep-alive tone no longer held (${why})`); }

  function outside(why) {

    held = true;
    stop();
  }

  for (const ev of ["pointerup", "touchend", "click", "keydown"]) document.addEventListener(ev, () => {
    if (typeof PLAYER === "undefined") return;

})();

<script>
// media.js: the lock-screen / notification controls and the headset buttons (the Media Session API).
// MEDIA.update() puts the chapter being read in the notification (its title; the book as the artist;
// "Chapter N · i of count" as the album); while reading, MEDIA.now(sentence) from the player makes
// the title the sentence being read and the second line "Ch 3103 · ¶ 12" (job 2, E6: the system draws
// the notification, so it moves even while the page is frozen; the metadata is set only when it
// changes, so it stands still while paused). It also sets playbackState from the player: "playing" while
// reading, "paused" when paused (and when stopped while the keep-alive tone plays, so ▶ there starts
// a reading), so that the notification shows ▶ when paused and ▶ there resumes everything (BUGS 18).
// The handlers: play, pause, stop, previous / next track and seek backward / forward (both move by
// one piece); every press is logged (type media). A one-button headset arrives as "pause" whenever
// the browser hears sound from the page (the keep-alive tone is sound), so "pause" while nothing is
// being read means play. Media keys that reach the page as key events (a headset before the page
// has a media session) go through the same handlers. MEDIA.press(action) runs one (the tests).

  const handlers = {
    play: () => PLAYER.play(),
    pause: () => { if (PLAYER.state === "playing") PLAYER.pause(); else { log("media", "pause taken as play: nothing was being read"); PLAYER.play(); } },
    stop: () => PLAYER.stop(),
    previoustrack: () => PLAYER.step(-1),
    nexttrack: () => PLAYER.step(1),
    seekbackward: () => PLAYER.step(-1),
    seekforward: () => PLAYER.step(1),
  };
  const set = [];
  function press(action, details) {
    const fn = handlers[action];
    if (!fn) return false;
    log("media", `media button: ${action} (player ${PLAYER.state})`);
    try { fn(details); } catch (e) { log("error", `the media button ${action} failed`, e); }
    return true;
  }
  if (ms) for (const a of Object.keys(handlers)) { try { ms.setActionHandler(a, (d) => press(a, d)); set.push(a); } catch (e) {} }

  let last = "", lastMeta = "", said = null, sentences = 0;
  function update() {
    if (!ms || typeof PLAYER === "undefined") return;
    const state = PLAYER.state;
    const pb = state === "playing" ? "playing" : state === "paused" || KEEPALIVE.on ? "paused" : "none";
    const ph = PLAYER.playhead, ch = ph ? ph.ch : READER.chapter, info = ch >= 0 ? BOOK.info(ch) : null;
    const book = BOOK.title || "Book reader";
    // While reading: the sentence as the title, "Ch 3103 · ¶ 12" under it (E6); else the chapter.
    const meta = info ? (said && state !== "stopped" && said.ch === ch ? { title: said.title, artist: said.line, album: `${info.title} · ${book}` }
      : { title: info.title, artist: book, album: `${BOOK.label(ch)} · ${ch + 1} of ${BOOK.count}` }) : null;
    try {
      const key = meta ? JSON.stringify(meta) : "";

      ms.playbackState = pb;
    } catch (e) {}

    if (now !== last) { last = now; log("media", `media session: ${pb}${info ? `, ${BOOK.label(ch).toLowerCase()}` : ""}`); }
  }
  // The sentence being read now (player.js, E6): { title, line, ch, para }, or null when the reading
  // stopped. One media line for the first of a reading; the rest only change the notification.
  function now(s) {
    said = s || null;
    if (said && ++sentences === 1) log("media", `notification title follows the sentence: "${said.title}" · ${said.line}`);
    if (!said) sentences = 0;
    update();
  }

  document.addEventListener("keydown", (e) => {
    const m = /^Media(PlayPause|Play|Pause|Stop|TrackNext|TrackPrevious)$/.exec(e.key || "");
    if (!m) return;
    e.preventDefault();
    if (e.repeat) return;
    const k = m[1];
    log("media", `media key: ${e.key}`);
    press(k === "PlayPause" ? (PLAYER.state === "playing" ? "pause" : "play") : k === "TrackNext" ? "nexttrack" : k === "TrackPrevious" ? "previoustrack" : k.toLowerCase());

})();

<script>
// screen.js: keeping the screen on while reading, when "Keep the screen awake" is on. The wake lock
// (navigator.wakeLock) is asked for at every Play, again whenever the page comes back in front (the
// browser lets it go when the page is hidden) and, after a refusal, at the next tap: a refusal is
// never final. Where it is refused or missing (a page opened from a file manager, content:// on
// Android, is always refused) a 2x2 canvas drawn once a second feeds a muted, almost transparent
// <video> in the top-left corner: Chromium keeps the screen on for a video playing in view on a
// visible page, with no permission check. The video plays only while reading and stops with it. One
// log line says which way is in use, one when it changes, one when the screen may sleep again.
// SCREEN.update() after every player state change; SCREEN.state for the Debug view and the tests.
(function () {
  let lock = null, busy = false, again = false, way = "";      // way: "lock", "video" or "" (none)
  const vid = { el: null, ctx: null, timer: 0, frame: 0, broken: "", failed: "" };
  const wanted = () => typeof PLAYER !== "undefined" && !!SETTINGS.get("screenAwake") && PLAYER.state === "playing";
  const why = (e) => `${(e && e.name) || "Error"}: ${String((e && e.message) || e).slice(0, 160)}`;

  function said(w, note) {
    if (w === way) return;
    way = w;
    if (w === "lock") log("page", "keeping the screen awake (wake lock)");
    else if (w === "video") log("page", `keeping the screen awake with a silent 2-pixel video (${note})`);
    else log("page", "the screen may sleep again");
  }
  function draw() { if (vid.ctx) { vid.ctx.fillStyle = vid.frame++ % 2 ? "#010101" : "#020202"; vid.ctx.fillRect(0, 0, 2, 2); } }
  function video(want, note) {

        const c = document.createElement("canvas");
        c.width = c.height = 2;
        vid.ctx = c.getContext("2d");

        const v = document.createElement("video");

        v.setAttribute("playsinline", ""); v.setAttribute("aria-hidden", "true"); v.tabIndex = -1; v.className = "wake";
        v.style.cssText = "position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;pointer-events:none;z-index:2147483647;margin:0;padding:0;border:0";

        document.body.appendChild(v);
        vid.el = v;

    }

    if (!v) return;
    if (want) {
      if (!vid.timer) vid.timer = setInterval(draw, 1000);
      if (v.paused) v.play().then(() => { vid.failed = ""; if (wanted() && !lock) said("video", note); else v.pause(); },
        (e) => { if (e && e.name === "AbortError") return;            // our own pause came first (the page hidden or the reading stopped): not a failure
          const w = why(e); if (w !== vid.failed) { vid.failed = w; log("error", `the video that keeps the screen awake did not play (${w}); it is tried again at the next chance`); } });
      else said("video", note);
    } else {
      if (vid.timer) { clearInterval(vid.timer); vid.timer = 0; }
      if (!v.paused) v.pause();
    }
  }

  // One request at a time; a call made meanwhile looks again after.
  async function update() {
    if (busy) { again = true; return; }
    busy = true;
    try {
      do {
        again = false;
        const want = wanted(), visible = document.visibilityState === "visible";
        let note = "";
        if (want && !lock && visible) {
          if (navigator.wakeLock && typeof navigator.wakeLock.request === "function") {
            try {
              const w = await navigator.wakeLock.request("screen");
              w.addEventListener("release", () => { if (lock === w) lock = null; });
              lock = w;
            } catch (e) { note = `the wake lock was refused: ${why(e)}`; }
          } else note = "this browser has no wake lock";
        } else if (!want && lock) {
          const w = lock;
          lock = null;
          try { await w.release(); } catch (e) {}
        }
        video(want && !lock && visible, note);
        if (want && lock) said("lock");
        else if (!want) said("");
      } while (again);
    } catch (e) { log("error", "keeping the screen awake failed", e); }
    finally { busy = false; }
  }

  // Hidden: the lock is let go and the video stops (job 3, C7: a hidden page has no screen to keep on;
  // the video drew once a second and played on); visible again: asked for afresh.
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" ? wanted() : lock || vid.timer) update(); });
  document.addEventListener("pointerdown", () => { if (way !== "lock" && wanted()) update(); }, { capture: true, passive: true });

  globalThis.SCREEN = { update, get state() { return { way, lock: !!lock, video: !!vid.el && !vid.el.paused, broken: vid.broken || vid.failed }; } };
})();

<script>
// player.js: the player. States stopped / playing / paused. Play from stopped starts at the paragraph
// last read, in the chapter where the reading stopped (the view goes there, even when the page shows
// another chapter because the lock was off), unless Jon moved to another chapter or tapped a paragraph
// by hand since: then at the paragraph read in the chapter shown. Never the screen position. It reads
// on into the next chapter when Continue is on (its pieces prepared ahead). Two kinds of voice
// (engine.js). One gives sound back: the pump hands it the pieces' CHUNKS (pieces.js: a paragraph is
// one piece on the page and in the stream, but the voice makes it a sentence or two at a time), as
// many at once as the voice has copies, earliest chunk of the earliest piece first, never idle while
// chunks wait, with a generation watchdog on every chunk (one that never answers is given up on and
// logged) and a pump watchdog every second (chunks waiting, a worker free, nothing being made:
// restart it, and say so); each chunk's sound goes to the stream (stream.js) as soon as it and the
// chunks before it are made, so the first sound comes after one sentence, and its word times are
// shifted into the piece. The other kind speaks for itself (the browser voices): say() gives it the
// pieces one after another, the playhead follows its word boundaries or its estimate as character
// positions, pause cuts the piece and resume says it again from two words before the cut; the
// keep-alive tone keeps the media session. Pause pieces are half a second of silence, never sent to
// the voice. Tapping a paragraph, ⏮ ⏭ and ↑ ↓ move the reading (also while paused; a joined piece is
// split back into its parts first, queue.js). The paragraph read is saved as it changes (reader.js /
// book.js). A failed chunk: ask again (only the chunks still missing), then restart the voice, then
// stop with a plain message. NO FALLBACKS (PLAN.md, BUGS 29): a chosen setting the voice cannot run
// here (`cannot`) or that gives broken sound (`fatal`) stops the reading at once with the plain
// reason on the status line and in the log; nothing is switched (no other engine, precision or
// device), so Jon can fix the setting. Nothing loads before the first Play. The chunk size follows
// the voice's measured speed on the graphics card (about one second of card time per chunk, BUGS 31).
// PLAYER.settingsChanged(names) is what the Settings window's Save calls; while the full benchmark
// uses the voices, hooks.hold makes Play wait (saying so) and forget() makes the next Play load the
// voice afresh (bench.js). Every state change is told
// to the keep-alive tone (keepalive.js), the media session (media.js) and the screen (screen.js). Log
// lines: one per piece made ("in N chunks"; a chunk line when the log would go quiet for 10 s), the
// sound running out (with why), recoveries, one timing line per piece start and one per piece for the
// word lag (due / moved / on screen, from present.js), the chunk size, a summary at Stop.
// Job 2: "Pause making sound while I scroll" (holdOnScroll, experimental: the next chunk waits while
// the page is scrolled or touched, see holding()), and the sentence being read goes to the media
// session as the notification's title (nowReading() → MEDIA.now).
// Step 8a: the listener (listener.js) hears every chunk made (listen()); in "check before reading" a
// chunk waits in feed() until its check (and re-rolls) are done and a kept re-roll replaces its sound;
// a card voice beside a card listener goes through LISTENER.gate (one card job at a time, taking turns).
// The status (2026-10-18): status() gives the two lines playbar.js draws (line 1 the state and the parts
// at work, or the error; line 2 ready seconds and the chunks being made and checked), detail() the
// full-status window.
(function () {
  const AHEAD_SEC = STREAM.AHEAD_SEC;
  const AHEAD_LOW = 120;             // bursts: the voice rests until this much is left
  const LOOK_AHEAD = 40;             // pieces beyond the stream head the pump looks at
  const MADE_MAX = 150;              // made pieces kept; the sound of the oldest goes
  const PAUSE_SEC = 0.5;
  const QUIET_MS = 10000;            // a chunk line when no pieces line came for this long
  const CHUNK_FLOOR = 30;            // characters: the smallest chunk the measured speed may ask for
  const TROUBLE = ["asking for the piece again", "restarting the voice, then asking again"];
  const ANDROID = /Android/i.test(navigator.userAgent);
  const hooks = { pumpOff: false, watchdogMs: 0, ahead: null, chunk: 0, hold: "", holdMinAhead: null, holdAfter: 0, holdMomentum: 0, madeMax: 0 };   // chunk: a size pinned by the tests (0 = by speed); hold: Play waits, saying this (the full benchmark, bench.js); holdMinAhead: the scroll hold's buffer floor in s (null = 30); holdAfter / holdMomentum: its quiet window / momentum in ms (0 = 10000 / 1500)

  let state = "stopped";
  let gen = 0;                       // a Stop makes everything in flight stale
  const lists = new Map();           // chapter index -> its pieces (split in place when a joined piece is tapped)
  const loading = new Map();         // chapter index -> promise of its list
  const made = new Map();            // piece id -> m: { piece, chunks: [{ text, chars, audio?, mp3?, sampleRate?, dur?, words?, ms? }], done, dur, chars, ms, t0, complete, appended (chunks in the stream, in run `run`), url?, peak?, seed? }
  const making = new Map();          // piece id -> rec: { piece, ch, k, name, t0, m, jobs: Map(chunk -> { t0, timer }) }: chunks being made, or the piece being said
  let head = null;                   // { ch, k }: the next piece to append to the stream, or to say
  let playhead = null;               // { ch, id, part, word }: what is being spoken
  let last = null;                   // { ch, para }: where the reading stopped, for Play from stopped
  let engine = null, engineKey = "", engineOpts = null, engineReady = null, engineLoaded = false, copies = 1;
  let live = false;                  // the voice speaks for itself (engine.speak): no pump, no stream
  let saying = null, cut = null, liveEntry = null, hiddenPause = false;

  let feeding = false, refeed = false;

  fresh();

  const nameOf = (ch, k) => `${(BOOK.info(ch) || { c: "?" }).c}:${k}`;

  function pickEngine() {

    return { engine: e, voice: want.voice };
  }
  function loadEngine() {
    const pick = pickEngine();
    const opts = { voice: pick.voice, runOn: SETTINGS.get("runOn"), precision: SETTINGS.get("precision"), pace: SETTINGS.get("pace"), steps: SETTINGS.get("steps"), copies: SETTINGS.get("copies"), speaker: SETTINGS.get("speaker"), engine: pick.engine.id === "kokoro" ? SETTINGS.get("kokoroEngine") : undefined };
    const key = pick.engine.id + " " + JSON.stringify(opts);
    if (engineReady && engine === pick.engine && engineKey === key) return engineReady;
    if (engineKey && engineKey !== key) reset();             // another voice: its pieces and sound are not this one's
    if (engine && engine !== pick.engine && engine.pool && typeof engine.pool.close === "function") {   // another engine: the old one's workers go (a phone's memory)
      try { engine.pool.close(); } catch (e) {}
      log("voice", `${engine.name} unloaded: the voice changed to ${pick.engine.name}`);
    }

    live = typeof engine.speak === "function";

      log("voice", `${engine.name} (${opts.voice}) ready in ${sec(performance.now() - t0)} s${copies > 1 ? `, ${copies} copies` : ""}`);
    });

    p.catch(() => { if (engineReady === p) engineReady = null; });
    return p;
  }
  const engineUp = () => !!(engine && engineLoaded && !recovering);
  // Chunks at a time: the copies RUNNING, read live (the pool loads the others one at a time in the
  // background and may stop short, e.g. out of memory: P7), so no job waits unseen in the pool with its
  // watchdog and its making time running. copiesAsked: what the setting asked for.
  const copiesAsked = () => (engine && engine.can && engine.can.copies ? Math.max(1, Number(engine.copies) || Number(engineOpts && engineOpts.copies) || 1) : 1);
  const copiesNow = () => {
    const asked = copiesAsked(), pool = engine && engine.pool;
    return pool && typeof pool.ready === "number" ? Math.max(1, Math.min(asked, pool.ready)) : asked;
  };

  // stops with the engine's plain message, which says what to choose instead. Nothing is switched.
  const settingFailed = (e) => !!(e && (e.cannot || e.fatal));

  // ---- The chunk size (BUGS 31) --------------------------------------------------------------------

  // chunk should cost about one second of card time: the size comes from the voice's measured speed
  // (milliseconds of making per character, remembered per voice setting for the next reading on it),
  // between CHUNK_FLOOR and the voice's piece limit; PIECES.CHUNK (120 characters) until it is
  // measured, and always on the processor, where copies run side by side and the screen is not
  // starved. One pieces line per choice says the size and why; hooks.chunk pins it for the tests.
  const speeds = new Map();          // engine key -> { ms: making per character, x: times real time }
  let chunkSize = PIECES.CHUNK;
  const onCard = () => !!(engine && engine.runsOn === "the card");
  const measured = () => ({ ms: stats.synthMs / stats.chars, x: stats.sound / (stats.synthMs / 1000) });
  function chooseChunk() {
    const known = speeds.get(engineKey);
    let why;
    if (hooks.chunk) { chunkSize = hooks.chunk; why = "pinned by the tests"; }
    else if (!onCard()) { chunkSize = PIECES.CHUNK; why = "the voice runs on the processor"; }
    else if (known) { chunkSize = Math.max(CHUNK_FLOOR, Math.min((engine && engine.maxChars) || 300, Math.round(1000 / known.ms / 10) * 10)); why = `about 1 s of card time each: ${engine.name} measured at ${known.x.toFixed(1)}× real time on the card`; }
    else { chunkSize = PIECES.CHUNK; why = "until the voice's speed on the card is measured"; }
    log("pieces", `chunks of up to ${chunkSize} characters (${why})`);
  }

  // ---- The pieces of a chapter --------------------------------------------------------------------
  function loadList(ch) {
