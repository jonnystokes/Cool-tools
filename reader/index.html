      if (now - pw.since < 2000 || now - pw.lastFire < 5000) return;
      pw.lastFire = now;
      stats.pumpRestarts++;
      log("error", `the reading had stalled: piece ${nameOf(head.ch, head.k)} waiting, nothing being said for ${((now - pw.since) / 1000).toFixed(0)} s; restarted it`);
      pw.since = 0;
      say();
      return;
    }
    if (!engineUp() || jobsInFlight() > 0 || held) { pw.since = 0; return; }   // a hold while scrolling is not a stall
    if (!nextJob(true)) { pw.since = 0; return; }
    if (!pw.since) { pw.since = now; return; }              // seen once: the normal path gets a second
    if (now - pw.lastFire < 5000) return;
    pw.lastFire = now;
    stats.pumpRestarts++;
    const x = nextToMake();
    log("error", `the generation pump had stalled: piece ${x ? nameOf(x.ch, x.k) : Array.from(making.values()).map((r) => r.name).join(", ")} waiting, the voice free, nothing being made for ${((now - pw.since) / 1000).toFixed(0)} s; restarted it`);
    pw.since = 0;
    pump(true);
  }
  setInterval(() => {
    if (state === "stopped") return;
    if (head && !feeding && STREAM.ahead() < AHEAD_SEC) feed();
    pump();
    try { pumpWatchdog(); } catch (e) { log("error", "the pump watchdog failed", e); }
    if (document.visibilityState !== "hidden") PLAYBAR.refresh();   // job 3, C3: nothing drawn while hidden (playbar.js draws on the way back)
  }, 1000);
  // The estimate between word boundaries, or without them (a plain timer: it runs with the page hidden).
  setInterval(() => {
    if (!live || state !== "playing" || !saying || !liveEntry || saying.piece.pause || !engine.position) return;
    const p = engine.position();
    if (p) follow(liveEntry, p.chars);
  }, 250);
  PLAYBAR.provide({ status: statusNow, detail });
  PLAYBAR.update(state);

  globalThis.PLAYER = {
    play, pause, resume, toggle, stop, step, jumpToPara, show, chapterPicked, hooks, stats, activity, settingsChanged,
    status: statusNow, detail,
    // engines/cloud.js: a chunk's place on the PC changed (queued / generating / sending): its marks are drawn again.
    cloudMark(partId) {
      const pid = String(partId).replace(/#\d+$/, "");
      const r = making.get(pid);
      const m = (r && r.m) || made.get(pid);
      if (m && m.chunks) HIGHLIGHT.made(m.piece, flagsOf(m), m.spans);
    },
    rebuild: () => { stop(); reset(); },           // everything made goes (the tests; Settings goes through settingsChanged)
    // The voice's workers were used by someone else (the full benchmark): load it afresh at the next Play.
    forget: () => { if (state !== "stopped") stop(); reset(); engineReady = null; engineLoaded = false; engineKey = ""; },
    get chunkSize() { return chunkSize; },
    get state() { return state; },
    get playhead() { return playhead; },
    get head() { return head; },
    get last() { return last; },
    get engine() { return engine; },
    get live() { return live; },
    get source() { return live ? liveSrc() : source; },
    get cut() { return cut; },
    pieces: (ch) => lists.get(ch) || null,
    isMade: (id) => { const m = made.get(id); return !!(m && m.complete); },
    made: (id) => made.get(id) || null,            // the chunk record (the tests look at it)
    get making() { return Array.from(making.keys()); },
    get jobs() { return jobsInFlight(); },
    get resting() { return resting; },
    get held() { return !!held; },                  // the next chunk waiting while the page is scrolled (E3)
    get sentence() { return nowSaid; },             // what the notification title shows (E6)
  };
})();
</script>
<script>
// settingswin.js: the Settings window (SETTINGS.md), opened by the gear in the top bar. A floating
// window (float.js: move, resize, a scroll bar when needed, kept on screen, its size and place
// remembered) with the tabs in four groups across the top, in SETTINGS.md's order: Reading (Book ·
// Reading · Text) | Sound (Voice · Word highlight · Listener · Voice data · Offline package) | System
// (Background · Storage · Debug; Storage is storagetab.js), and the buttons above them.
// LIVE vs APPLY (Jon, 2026-10-20, job 1): the light settings (LIVE: theme, text size, UI size, speed,
// volume, title first, continue, word timing, scroll pause, keep-alive ×2, screen awake, debug view, log
// types) are saved and applied the moment they change (a slider logs once when it is let go); only the
// heavy ones (voice, engine, run on, precision, pace, steps, copies, bursts, the listener, background
// playback, the text rules, offline, slim) wait as pending for Apply, and their rows say so ("Applies
// when you press Apply"). A choice made on a button elsewhere (first run's Good enough / Default:
// SETTINGSWIN.choose) is applied at once, as if Apply had been pressed for exactly those settings,
// downloads with progress here. The rest of this note says "Save" for what the Apply button does.
// Save (applies what changed, keeps the window
// open; with a voice or Voice data setting pending it first makes sure the saved settings' files can
// be had (VOICEDATA.plan): the fit check refuses before anything starts (memory only when the change
// makes the need bigger; Copies alone gets the memory check too), online the missing files download
// after the Save with progress here; offline with files missing the Save stops, naming them and pointing
// to Settings → Offline package (import a package that has them, then Apply again: 2026-10-23, the old
// "Apply and upload data" zip pick is gone), and nothing is switched; Slim mode deletes the old
// voice's files only after the new ones are in and the Save is written; a write the browser refuses
// says "Not saved" and keeps the changes pending), Delete downloaded voices (N MB) (was Clear data:
// deletes only the big re-downloadable files, voice
// models and libraries, through MODELS.remove; never the book, settings or logs; the first tap
// says what would go, the second deletes and says what went) and a big ✕ Exit. Changing a heavy control
// loads nothing: changes wait in `pending` (a dot on the tab and its group,
// the Save button lit) until Save writes them in one go (SETTINGS.update: one settings log line) and
// applies them (READER.applyLook, STREAM.apply, KEEPALIVE.settle, SCREEN.update,
// PLAYER.settingsChanged). Exit with unsaved changes keeps them pending, no pop-up. Smart options:
// the chosen voice's engine says through describe(caps, runOn, voice) which knobs apply (the rest are
// not shown: steps only for Supertonic, precision only for Kokoro, the speaker only for a Piper voice
// with several) and which values this device can't use or has remembered as broken: those are greyed
// with the reason, and a greyed value that is the current choice gets a warning, because Play will
// stop with that reason (no fallbacks, PLAN.md). With a stored benchmark (bench.js, step 7) the Voice
// tab marks the voice, Run on and each precision "runs well / barely / too slow on this device", and
// Debug shows This device (scores, memory ceiling, suggestion, last check) with Re-check this device
// (firstrun.js); SETTINGSWIN.choose(values, note) applies the benchmark's Good enough / Default at
// once (propose(values, note) still puts values in as pending, for a view that wants a review first).
// UI size scales the window's content, never the
// window. The Listener tab (step 8a, listener.js): on / off, the model, when to check, re-roll; it and
// the Voice tab show what runs on the card and on the processor and the contention warning (whereRow).
// The Debug tab (step 8b): the Debug view switch (debugview.js's window), Detailed marks (the
// left-edge diagnostics, highlight.js), the log viewer (logwin.js, embedded, with the Log types fold),
// the past logs with Clear (two taps), the version and This device; the Log button in the button row
// opens the same viewer in its own window (UX-09: it left the top bar; the ? button stays there). The
// Voice data tab is datatab.js, Offline package packtab.js and the Storage tab storagetab.js, added through SETTINGSWIN.addTab
// with the builders in SETTINGSWIN.ui. A progress bar
// under the message line shows files being taken or downloaded.
// SETTINGSWIN.open / close / show(group, tab) / save / clearData / choose / pending / tab, for the tests.
(function () {
  const S = globalThis.SETTINGS;
  const GROUPS = [["Reading", ["Book", "Reading", "Text"]], ["Sound", ["Voice", "Cloud", "Word highlight", "Listener", "Voice data", "Offline package"]], ["System", ["Background", "Storage", "Debug"]]];
  const OWNS = {
    Book: ["skipWatermarks", "watermarkRules"], Reading: ["speed", "volume", "readTitle", "continueChapters", "theme", "textSize", "uiSize"],
    Text: ["spelling", "capsAsWords", "numbersToWords", "joinShort"], Voice: ["voice", "kokoroEngine", "runOn", "precision", "pace", "steps", "copies", "speaker", "burst"],
    Cloud: ["useMyPC", "pcAddress"], "Word highlight": ["wordTiming"], Listener: ["listenerOn", "listener", "listenMode", "reroll"], "Voice data": ["offline", "slim"], "Offline package": [], Background: ["backgroundPlay", "keepAlive", "keepAliveIdle", "holdOnScroll", "screenAwake"],
    Debug: ["debugView", "detailedMarks", "logTypesOff"],
  };
  const LABELS = {
    skipWatermarks: "Skip website watermarks", watermarkRules: "Watermark rules", speed: "Speed", volume: "Volume", readTitle: "Read the chapter title first",
    continueChapters: "Continue into the next chapter", theme: "Theme", textSize: "Text size", uiSize: "UI size", spelling: "Spelling replacements",
    capsAsWords: "Read ALL-CAPS as normal words", numbersToWords: "Read numbers as words", joinShort: "Join short pieces", voice: "Voice", runOn: "Run on",
    precision: "Precision", pace: "Pace", steps: "Steps", copies: "Copies", speaker: "Speaker", burst: "Make sound in bursts", wordTiming: "Word timing source",
    backgroundPlay: "Background playback", keepAlive: "Keep-alive sound", keepAliveIdle: "Keep-alive while stopped or paused", screenAwake: "Keep the screen awake",
    offline: "Offline mode", slim: "Slim mode", kokoroEngine: "Engine", holdOnScroll: "Pause making sound while I scroll",
    listenerOn: "Listener", listener: "Listener model", listenMode: "Word check timing", reroll: "Re-roll faulty chunks",
    debugView: "Debug view", detailedMarks: "Detailed marks (diagnostics)", logTypesOff: "Log types",
    useMyPC: "Use my PC for the voice", pcAddress: "PC address",
  };
  // Saved and applied the moment they change (Jon, 2026-10-20). Everything else a tab owns waits for Apply.
  const LIVE = ["theme", "textSize", "uiSize", "speed", "volume", "readTitle", "continueChapters", "wordTiming", "holdOnScroll", "keepAlive", "keepAliveIdle", "screenAwake", "debugView", "detailedMarks", "logTypesOff", "pcAddress"];
  const HEAVY = new Set(Object.values(OWNS).flat().filter((n) => !LIVE.includes(n)));
  const APPLY_NOTE = "Applies when you press Apply";
  const LATER = {};                                         // tabs not built yet (none); datatab.js and storagetab.js add theirs
  const FILE_KEYS = ["voice", "kokoroEngine", "runOn", "precision", "offline", "listenerOn", "listener"];   // a change here may need model files
  const MEM_KEYS = ["voice", "kokoroEngine", "runOn", "precision", "copies", "listenerOn", "listener"];     // a change here may change the working memory (D3)
  const pending = new Map();                                // name -> the value not saved yet; kept while the window is closed
  const lastTab = {};                                       // group -> the tab shown last
  let win = null, el = null;                                // el: { body, msg, save, clear, groups, tabs }
  let group = "Reading", tab = "Book";
  let caps = null, capsAsked = false;                       // VOICEWORK.gpu(), asked when the Voice tab first opens
  let armed = 0;                                            // Delete downloaded voices: when the first tap was
  let storedBytes = null;                                   // the size on that button (refreshClear)
  const dragFrom = new Map();                               // a live slider being dragged: name -> the value before the drag
  let working = "";                                         // a Save taking or checking files: what it is doing

  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const value = (name) => (pending.has(name) ? pending.get(name) : S.get(name));
  // A control changed: a light setting is saved and applied now (live), a heavy one waits for Apply.
  // opts.drag: a slider still moving (no log line, no message until it is let go: dragEnd).
  function change(name, v, opts = {}) {
    if (LIVE.includes(name)) { live(name, v, opts); return; }
    pend(name, v);
  }
  function pend(name, v) {
    if (same(v, S.get(name))) pending.delete(name); else pending.set(name, v);
    marks();
    if (FILE_KEYS.includes(name)) refreshNeed();
  }
  // The word timing the voice as it will be (pending voice included) can't give becomes Estimate, said.
  function timingFor(v, a) {
    const E = engineOf(a.voice);
    if (v === "model" && E && !(E.can && E.can.timing)) return { v: "estimate", note: `Word timing source is now Estimate (${E.name} gives no word times)` };
    const lt = v === "listener" ? LISTENER.timingOff(Object.assign({}, a, { wordTiming: v })) : "";
    if (lt) return { v: "estimate", note: `Word timing source is now Estimate (Listener: ${lt})` };
    return { v, note: "" };
  }
  function live(name, v, opts = {}) {
    pending.delete(name);
    let note = "";
    if (name === "wordTiming") ({ v, note } = timingFor(v, after()));
    if (opts.drag && !dragFrom.has(name)) dragFrom.set(name, S.get(name));
    let names;
    try { names = S.update({ [name]: v }, { quiet: !!opts.drag }); }
    catch (e) { dragFrom.delete(name); say(`Not saved: ${firstLine(e.message)}. ${LABELS[name] || name} is unchanged; Settings → System → Storage shows what is stored.`); rerender(); return; }
    if (names.length) apply(names);
    if (opts.drag) { marks(); return; }
    say(`Saved: ${LABELS[name] || name}.${note ? ` ${note}.` : ""}`);
    rerender();
  }
  // A live slider let go: one settings log line for the whole drag, and the message.
  function dragEnd(name) {
    if (!dragFrom.has(name)) return;
    const was = dragFrom.get(name), now = S.get(name);
    dragFrom.delete(name);
    if (!same(was, now)) log("settings", `saved: ${name} ${S.short(was)} -> ${S.short(now)}`);
    say(`Saved: ${LABELS[name] || name}.`);
  }
  const after = () => Object.assign(S.all(), Object.fromEntries(pending));
  const dirtyTab = (t) => (OWNS[t] || []).some((n) => pending.has(n));
  const dirtyGroup = (g) => GROUPS.find((x) => x[0] === g)[1].some(dirtyTab);
  const engineOf = (voice) => ENGINE.get(ENGINE.parse(voice).engine);

  // ---- Small builders -----------------------------------------------------------------------------
  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const button = (cls, text, onClick) => { const b = h("button", cls, text); b.type = "button"; b.addEventListener("click", onClick); return b; };
  // A row: the label and its help on the left, the control on the right (under it in a narrow window,
  // or always when `block`). Rows that own a setting are marked while that setting is pending.
  function row(label, help, control, opts = {}) {
    const r = h("div", "srow" + (opts.block ? " block" : ""));
    const lab = h("div", "slab");
    lab.appendChild(h("div", "sname", label));
    if (help) lab.appendChild(h("div", "shelp", help));
    const ctl = h("div", "sctl");
    if (control) ctl.appendChild(control);
    r.append(lab, ctl);
    if (opts.name) r.dataset.setting = opts.name;
    if (opts.name && HEAVY.has(opts.name)) { r.classList.add("heavy"); lab.appendChild(h("div", "sapply", APPLY_NOTE)); }
    return r;
  }
  const warn = (r, text) => { r.classList.add("bad"); r.querySelector(".slab").appendChild(h("div", "swarn", text)); };

  function toggle(name, label, help, off) {
    const lab = h("label", "sw");
    const inp = h("input");
    inp.type = "checkbox"; inp.checked = !!value(name); inp.disabled = !!off;
    inp.setAttribute("aria-label", label);
    inp.addEventListener("change", () => change(name, inp.checked));
    lab.append(inp, h("span", "knob"));
    const r = row(label, help, lab, { name });
    if (off) { r.classList.add("off"); r.querySelector(".slab").appendChild(h("div", "swhy", off)); }
    return r;
  }
  // A range with its value shown. show(v) formats; toValue / fromValue map the slider's number to the setting's.
  function slider(name, label, help, { min, max, step, show, toValue = (x) => x, fromValue = (x) => x }) {
    const box = h("div", "srange");
    const inp = h("input");
    inp.type = "range"; inp.min = min; inp.max = max; inp.step = step; inp.value = fromValue(value(name));
    inp.setAttribute("aria-label", label);
    const out = h("span", "val", show(value(name)));
    inp.addEventListener("input", () => { const v = toValue(Number(inp.value)); out.textContent = show(v); change(name, v, { drag: true }); });
    inp.addEventListener("change", () => dragEnd(name));
    if (name === "uiSize") {
      // Jon, 2026-10-20: while the UI size slider is held, this window keeps its size (the rest of the app
      // follows live), so the slider doesn't jump under the finger; it takes the new size on release.
      const PINNED = ["font-size", "--ui", "--tap", "--tap-big"];
      let held = null;
      const release = () => { if (!held) return; for (const k of PINNED) held.style.removeProperty(k); held = null; window.removeEventListener("pointerup", release); window.removeEventListener("pointercancel", release); };
      inp.addEventListener("pointerdown", () => {
        held = inp.closest(".float"); if (!held) return;
        const px = parseFloat(getComputedStyle(held).fontSize);   // the window's --ui now (base.css: --tap = 2.75, --tap-big = 3 × --ui)
        [px, px, px * 2.75, px * 3].forEach((v, i) => held.style.setProperty(PINNED[i], v + "px"));
        window.addEventListener("pointerup", release); window.addEventListener("pointercancel", release);
      });
      inp.addEventListener("change", release);
    }
    box.append(inp, out);
    return row(label, help, box, { name });
  }
  // One of several: a segmented control (few, short) or a list of radio options with help and, when
  // the device can't use one, the reason (greyed). The current choice being one of those is a warning.
  function choice(name, label, help, options, { segment, badText, current } = {}) {
    const cur = current !== undefined ? current : value(name), curOpt = options.find((o) => o.id === cur);   // current: the value an automatic (null) setting stands for
    const pick = (id) => { change(name, id); rerender(); };
    let ctl;
    if (segment) {
      ctl = h("div", "ssegwrap");
      const seg = h("div", "sseg");
      for (const o of options) {
        const b = button(null, o.label, () => pick(o.id));
        b.setAttribute("aria-pressed", o.id === cur ? "true" : "false");
        if (o.off) { b.classList.add("off"); b.title = o.off; }   // still selectable (Jon): a warning, never a lock
        seg.appendChild(b);
      }
      ctl.appendChild(seg);
      for (const o of options) if (o.off) ctl.appendChild(h("div", "swhy", `${o.label}: ${o.off}`));
      for (const o of options) if (o.mark) ctl.appendChild(h("div", "sdev " + o.mark.cls, `${o.label}: ${o.mark.text}`));
    } else {
      ctl = h("div", "sopts");
      for (const o of options) {
        const l = h("label", "sopt" + (o.id === cur ? " on" : "") + (o.off ? " off" : ""));
        const inp = h("input");
        inp.type = "radio"; inp.name = "s-" + name; inp.value = o.id; inp.checked = o.id === cur;   // an option the device can't use stays selectable, with its reason (Jon)
        inp.addEventListener("change", () => { if (inp.checked) pick(o.id); });
        l.append(inp, h("span", "olab", o.label));
        if (o.help) l.appendChild(h("span", "ohelp", o.help));
        if (o.off) l.appendChild(h("span", "swhy", o.off));
        if (o.mark) l.appendChild(h("span", "sdev " + o.mark.cls, o.mark.text));
        ctl.appendChild(l);
      }
    }
    const r = row(label, help, ctl, { name, block: !segment });
    if (curOpt && curOpt.off) warn(r, badText ? badText(curOpt) : `"${curOpt.label}" is chosen but can't be used here: ${curOpt.off}. Play will stop with that reason; choose another.`);
    return r;
  }
  function select(name, label, help, options, { toValue = (x) => x, fromValue = (x) => x } = {}) {
    const sel = h("select");
    sel.setAttribute("aria-label", label);
    for (const o of options) { const e = h("option", null, o.label); e.value = o.id; sel.appendChild(e); }
    const cur = fromValue(value(name));
    if (!options.some((o) => String(o.id) === String(cur))) { const e = h("option", null, String(cur)); e.value = cur; sel.appendChild(e); }
    sel.value = cur;
    sel.addEventListener("change", () => change(name, toValue(sel.value)));
    return row(label, help, sel, { name });
  }
  const later = (name) => h("div", "slater", LATER[name] || "Arrives in a later step.");

  // ---- The tabs -----------------------------------------------------------------------------------
  function bookTab(body) {
    body.appendChild(row("Books", `Opens the Open window: your stored books (open, rename, delete) and Add files or a zip / Add a folder.${BOOK.title ? ` Open now: "${BOOK.title}" (${BOOK.count.toLocaleString("en-US")} chapters).` : " No book is open."}`,
      button("sbtn", "Open / add books…", () => { LIBRARY.open(); if (win) win.close(); })));
    body.appendChild(toggle("skipWatermarks", "Skip website watermarks", "Leaves website junk (site names, links, scraper notes) out of the reading. Each skipped word is listed in the log once."));
    body.appendChild(rulesRow());
  }
  // The four watermark lists as text, one pattern per line; the built-in lists until edited (null).
  function rulesRow() {
    const LISTS = [["characters", "Characters"], ["words", "Words"], ["keep", "Keep"], ["phrases", "Phrases"]];
    const cur = value("watermarkRules");
    const lines = (v) => (Array.isArray(v) ? v : String(v == null ? "" : v).split("\n")).map((s) => String(s).trim()).filter(Boolean);
    const text = (name) => lines(cur && cur[name] !== undefined ? cur[name] : TEXT.RULES[name]).join("\n");
    const det = h("details", "slists");
    det.open = !!cur;
    const sum = h("summary", null, "");
    // Only the edited lists are stored (D8): the others keep following the built-ins of later builds.
    const title = () => { const v = value("watermarkRules"); sum.textContent = `Rule lists (${v ? `edited: ${LISTS.filter(([n]) => v[n] !== undefined).map(([, l]) => l).join(", ")}; the others built-in` : "built-in"})`; };
    title();
    det.appendChild(sum);
    det.appendChild(h("div", "shelp", "One pattern per line, as plain text or /a regular expression/. Characters: hex code points or ranges; any word containing one is skipped. Words: any word containing the text (case ignored) is skipped. Keep: real words that match a Words pattern but must stay. Phrases: lead-in text removed once the junk words are gone; * stands for the removed words."));
    const areas = {};
    const commit = () => {
      const out = {};
      let edited = false;
      for (const [name] of LISTS) { const list = lines(areas[name].value); if (list.join("\n") !== lines(TEXT.RULES[name]).join("\n")) { out[name] = list; edited = true; } }
      change("watermarkRules", edited ? out : null);
      title();
    };
    for (const [name, label] of LISTS) {
      const l = h("label", "slist");
      l.appendChild(h("span", "sname", label));
      const ta = h("textarea");
      ta.value = text(name); ta.spellcheck = false; ta.rows = Math.min(12, Math.max(4, text(name).split("\n").length + 1));
      ta.addEventListener("input", commit);
      areas[name] = ta;
      l.appendChild(ta);
      det.appendChild(l);
    }
    det.appendChild(button("slink", "Restore the built-in lists", () => { for (const [name] of LISTS) areas[name].value = lines(TEXT.RULES[name]).join("\n"); commit(); }));
    return row("Watermark rules", "The patterns that decide what counts as a watermark. Edit them to catch one that slips through.", det, { name: "watermarkRules", block: true });
  }

  function readingTab(body) {
    body.appendChild(slider("speed", "Speed", "Playback speed; the pitch is unchanged.", { min: 0.5, max: 3, step: 0.05, show: (v) => `${Number(v).toFixed(2).replace(/0$/, "")}×` }));
    body.appendChild(slider("volume", "Volume", "Playback volume.", { min: 0, max: 100, step: 5, show: (v) => `${Math.round(v * 100)}%`, toValue: (x) => x / 100, fromValue: (v) => Math.round(v * 100) }));
    body.appendChild(toggle("readTitle", "Read the chapter title first", "Reads the chapter title before its text."));
    body.appendChild(toggle("continueChapters", "Continue into the next chapter", "At the end of a chapter, reading goes straight on into the next one."));
    body.appendChild(choice("theme", "Theme", "Light or dark colours.", [{ id: "light", label: "Light" }, { id: "dark", label: "Dark" }], { segment: true }));
    body.appendChild(slider("textSize", "Text size", "Size of the book text only.", { min: 50, max: 250, step: 5, show: (v) => `${v}%` }));

  // One list, best-sounding first, grouped per engine; this device's browser voices last (refreshed as the device lists them).

  function pastRow() {

      const past = list.filter((v) => v.id !== LOG.visit.id), oldest = past.reduce((m, v) => (v.started && (!m || v.started < m) ? v.started : m), 0);
      line.textContent = past.length ? `${past.length} past visit${past.length === 1 ? "" : "s"} kept (the oldest ${oldest ? LOG.when(oldest) : "undated"}; the newest 30 stay, older ones go by themselves). Open one from the visit list in the log above.` : "No past logs yet: the logs of earlier visits appear here and in the log's visit list.";

  async function clearPast() {
    if (!armedPast || Date.now() - armedPast > 8000) {
      armedPast = Date.now();
      say("Tap Clear past logs again to delete the logs of every earlier visit. This visit's log stays.");
      rerenderIf("Debug");
      setTimeout(() => { if (armedPast) { armedPast = 0; rerenderIf("Debug"); } }, 8000);
      return;
    }
    armedPast = 0;
    try {
      const n = (await LOG.visits()).filter((v) => v.id !== LOG.visit.id).length;
      await LOG.clear();
      log("storage", `cleared ${n} past log${n === 1 ? "" : "s"} (Settings → Debug); this visit's log stays`);
      say(`Deleted the logs of ${n} earlier visit${n === 1 ? "" : "s"}. This visit's log stays.`);

  // This device: the stored benchmark (step 7): scores, the memory ceiling, the suggestion, the last

  function deviceRow() {

    const line = (t, bad, into = box) => into.appendChild(h("div", "sline" + (bad ? " bad" : ""), t));
    const ceil = MODELS.ceiling();
    if (rec && rec.scores) {
      const s = rec.scores, c = rec.ceiling, sg = rec.suggestion;
      // The outcome first, in plain words; the numbers under a fold.
      if (sg) line(`Suggested: ${sg.setup.label} (${PLAIN[sg.level] || sg.level}).`);
      else line("Suggested: nothing. No model voice keeps up here and the browser lists no voices of its own.", true);
      for (const p of rec.predictions || []) if (p.measured) line(`Full benchmark: ${p.label} measured ${r1(p.x)}× real time (predicted ${r1(p.predicted)}×).`);
      line(`Last check: ${LOG.when(rec.when)} with ${rec.version || "an earlier version"}${rec.choice ? ` · chosen: ${{ suggested: "Finish", default: "Default", skip: "Skip" }[rec.choice] || rec.choice}` : ""}.`);
      const det = h("details", "sdet"), dl = h("div", "sfit");
      det.appendChild(h("summary", null, "Numbers"));
      line(`Processor: one core ${r0(s.f32)} MMAC/s, all cores ${r0(s.multi)} MMAC/s (${rec.gates ? rec.gates.threads : "?"} threads).`, false, dl);
      line(`Graphics card: ${rec.input && rec.input.card.ok ? `${r0(s.alu)} G FMA/s, ${rec.gates.card.name}${rec.gates.card.f16 ? ", 16-bit math" : ""}` : `none usable (${rec.input ? rec.input.card.why : "?"})`}.`, false, dl);

  function show(g, t) {

    if (!entry || !el) return;

    group = g;
    tab = t && list.includes(t) ? t : (lastTab[g] && list.includes(lastTab[g]) ? lastTab[g] : list[0]);
    lastTab[g] = tab;

    el.tabs.replaceChildren(...list.map((name) => { const b = button(null, name, () => show(g, name)); b.dataset.t = name; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", name === tab ? "true" : "false"); return b; }));

  }
  function renderBody() {

  const say = (text) => { if (el) el.msg.textContent = text || ""; };
  // The unsaved marks: the groups, the tabs, the rows, the Apply button (lit while changes wait).
  // refreshNeed: the store may have changed (a download, an import, a Delete): the Clear button's count.
  function refreshNeed() { refreshClear(); }
  function marks() {
    if (!el) return;
    for (const b of el.groups.children) b.classList.toggle("dirty", dirtyGroup(b.dataset.g));
    for (const b of el.tabs.children) b.classList.toggle("dirty", dirtyTab(b.dataset.t));
    for (const r of el.body.querySelectorAll(".srow[data-setting]")) r.classList.toggle("pending", pending.has(r.dataset.setting));
    el.save.classList.toggle("hot", pending.size > 0 && !working);

    el.save.textContent = working || "Apply";

  // Save: the pending values in one write and one log line, then applied. A word timing the saved
  // voice cannot give (Voice model with Piper) is saved as Estimate, said here, never silently. With a
  // model-file setting pending, the files come first (see the top of this file).
  function saveClick() {
    if (working) { say(`${working} Wait for it to finish.`); return Promise.resolve(); }
    if ((globalThis.VOICEDATA && VOICEDATA.busy) || (globalThis.PACKAGE && PACKAGE.busy)) { say("An offline package is being made or imported; wait for it to finish (or stop it in Offline package)."); return Promise.resolve(); }
    if (!pending.size) { say("Nothing to apply."); return Promise.resolve(); }
    return doSave();
  }
  // opts.fetch false: no download after the Save (Export does its own); opts.only: save just these
  // pending names (a choice made on a button: choose), the rest stay pending; opts.lead: said first.
  // Gives true when it saved.
  async function doSave(opts = {}) {
    const changes = Object.fromEntries(Array.from(pending).filter(([k]) => !opts.only || opts.only.includes(k)));
    const notes = [];
    const wt = changes.wordTiming !== undefined ? changes.wordTiming : S.get("wordTiming");
    const t = timingFor(wt, Object.assign(S.all(), changes));
    if (t.note) { changes.wordTiming = t.v; notes.push(t.note); }
    const fin = (names) => finish(names, notes, opts.lead);
    const fileChange = FILE_KEYS.some((k) => k in changes), memChange = MEM_KEYS.some((k) => k in changes);
    if (!globalThis.VOICEDATA || (!fileChange && !memChange)) return !!fin(commit(changes));

    const stop = (text) => { say(`${opts.lead ? opts.lead + " " : ""}${text} Nothing was saved.${opts.only ? " The chosen settings wait here, marked, for Apply." : ""}`); return false; };
    // The memory half refuses only when this change makes the need bigger than what is saved now (D4:
    // a Save of Offline mode alone is never refused for the voice already saved); otherwise a note.
    const memRefused = (m) => { if (!m || m.ok) return false; const m0 = VOICEDATA.memory(before); return !m0 || m.mb > m0.mb; };
    if (!fileChange) {         // Copies and the like: no files, only the memory check (D3)
      const m = VOICEDATA.memory(next);
      if (memRefused(m)) return stop(`${VOICEDATA.label(next)}: ${m.text}.`);
      if (m && m.warn) notes.push(`Note: ${m.text}`);
      return !!fin(commit(changes));
    }
    busy("Checking files…");
    let p, took = "";
    try {
      p = await VOICEDATA.plan(before, next);
      if (p.missing.length && !p.fit.ok) return stop(`${p.label}: ${p.fit.text}.`);
      if (memRefused(p.mem)) return stop(`${p.label}: ${p.mem.text}.`);
      // Slim mode deletes the old voice's files only once the new ones are in and the Save is written
      // (D1), so the room for the new files must be there before it.
      const roomNow = p.fit.free === null || p.fit.need <= p.fit.free * 0.95;
      if (p.missing.length && p.drop.length && !roomNow) return stop(`${p.label}: its files fit only once Slim mode deletes the old voice's (${MODELS.MB(p.dropBytes)}), and Slim mode deletes them only after the new files are in. Delete the old voice's files in Settings → Voice data first, then Apply again.`);
      if (p.missing.length && p.offline) {
        // Offline: the files come only from an offline package imported first (Settings → Offline package).
        const names = p.missing.map((f) => MODELS.nameOf(f.url));
        return stop(`${p.label} needs ${count(p.missing.length)} that ${p.missing.length === 1 ? "is" : "are"} not stored (${MODELS.MB(p.missingBytes)}: ${names.slice(0, 4).join(", ")}${names.length > 4 ? ", …" : ""}), and ${p.why}. Import an offline package that has ${p.missing.length === 1 ? "it" : "them"} (Settings → Offline package → Import parts), then Apply again.`);
      }
    } catch (e) { return stop(`${firstLine(e.message)}${p && p.drop.length ? " The old voice's files were not deleted." : ""}`); }
    finally { busy(""); }
    const names = commit(changes, took ? `${took}; they stay stored.` : "");
    if (!names) return false;
    if (p.drop.length) {
      busy("Deleting the old voice's files…");
      try { await slim(p); notes.push(`Slim mode deleted ${count(p.drop.length)} of the old voice (${MODELS.MB(p.dropBytes)})`); }
      catch (e) { notes.push(`Slim mode could not delete the old voice's files (${firstLine(e.message)})`); }
      finally { busy(""); }
    }
    if (p.mem && p.mem.warn) notes.push(`Note: ${p.mem.text}`);
    const saved = fin(names);
    if (p.missing.length && !p.offline && opts.fetch !== false) fetchNow(p, saved);
    return true;
  }
  const count = (n) => `${n} file${n === 1 ? "" : "s"}`;
  const firstLine = (t) => String(t || "").split("\n")[0];
  // Writes the changes and applies them; gives the changed names. A write the browser refuses (D6)
  // says so, keeps the changes pending and gives null (`extra`: what else to say then).
  function commit(changes, extra = "") {

  }
  // The "Applied: …" line after a commit (nothing when the commit failed: it said why). Gives the text.
  function finish(names, notes, lead) {
    if (!names) return null;
    const text = `${lead ? lead + " " : ""}Applied: ${names.map((n) => LABELS[n] || n).join(", ") || "nothing had changed"}.${notes.length ? " " + notes.join("; ") + "." : ""}`;
    say(text);
    renderBody();
    refreshNeed();
    return text;
  }
  async function slim(p) {
    busy("Deleting the old voice's files…");
    await MODELS.remove(p.drop.map((f) => f.url), "(Slim mode, on Apply: the voice changed)");
  }
  // Progress over a list of files, by bytes: (name, loaded, total) per file, any order; after `lead`
  // (what was said before, kept in view).
  function overall(files, verb, lead = "") {
    const total = files.reduce((n, f) => n + (f.size || 0), 0) || 1, got = new Map();

  }
  // Online: the files the saved settings need download now, with progress here (the player's own load

  function fetchNow(p, saved) {
    const t0 = performance.now();

    VOICEDATA.download(p.missing, overall(p.missing, "Downloading", saved)).then(
      (r) => { progress(""); say(`${saved} Downloaded ${count(r.fetched)} for ${p.label} (${MODELS.MB(r.bytes)}) in ${((performance.now() - t0) / 1000).toFixed(0)} s.`); refreshNeed(); rerenderIf("Voice data"); },
      (e) => { progress(""); say(`${saved} The download failed: ${firstLine(e.message)} Play will try again.`); rerenderIf("Voice data"); });
  }
  function busy(what) { working = what; if (!what) progress(""); marks(); }
  function progress(text, frac) {

  const ownerOf = (f) => f.owner || (/cdn\.jsdelivr\.net/.test(f.url) ? "libraries" : (/huggingface\.co\/[^/]+\/([^/]+)/.exec(f.url) || [])[1] || "other files");

    let files;

    storedBytes = files.reduce((n, f) => n + (f.size || 0), 0);
    if (!files.length) { disarm(); say("Nothing to delete: no voice or listener files are stored. The book, settings and logs are never deleted here."); return; }

    const groups = new Map();

    const list = Array.from(groups, ([o, b]) => `${o} ${MODELS.MB(b)}`).join(", ");

      say(`${files.length} stored file${files.length === 1 ? "" : "s"}, ${MODELS.MB(bytes)}: ${list}. Tap again to delete them; a voice downloads them again when it needs them (offline: from an offline package). The book, settings and logs stay.`);

  function open() {
    if (win) { FLOAT.open("settings"); return win; }

    log("settings", `proposed${note ? " (" + note + ")" : ""}: ${Object.entries(values || {}).map(([k, v]) => `${k} ${JSON.stringify(v)}${pending.has(k) ? "" : " (as saved)"}`).join(" · ")}`);
    return n;
  }

  globalThis.SETTINGSWIN = {
    open, show, save: saveClick, clearData, choose, propose, LIVE,
    // For datatab.js (the Voice data tab) and storagetab.js (Storage): register a tab, and the window's builders.
    addTab: (name, fn) => { TABS[name] = fn; delete LATER[name]; },
    ui: { h, button, row, toggle, warn, value, after, change, pend, say, save: (opts) => (working ? Promise.resolve(false) : doSave(opts)), progress, busy, overall, rerender, refreshNeed, refreshClear, count, FILE_KEYS, LIVE, apply, get working() { return working; } },
    close: () => { if (win) win.close(); },
    get isOpen() { return !!win; },
    get pending() { return new Map(pending); },
    get tab() { return { group, tab }; },
    get window() { return win; },
  };
})();

<script>
// datatab.js: the Voice data tab of the Settings window (SETTINGS.md "Voice data"). The work is in
// voicedata.js; the window's builders come from SETTINGSWIN.ui, so it looks like every other tab. Rows:
// Offline mode and Slim mode (settings: they wait for Apply like the other heavy ones); the fit check for
// the voice as it would be saved (files stored / to get, storage, memory, what Slim mode would delete;
// offline with files missing, a button opens the Offline package tab to import them); the stored files
// (by owner with Delete per voice, two taps, never automatic; every file, sortable; the one-line note
// when the browser has not promised to keep them: BUGS 32). 2026-10-23: Import everything and Export
// voice data moved to the Offline package tab (packtab.js), which replaced them.
(function () {
  const W = globalThis.SETTINGSWIN, V = globalThis.VOICEDATA;
  if (!W || !V) return;
  const U = W.ui, h = U.h, MB = (n) => MODELS.MB(n);

  const shown = () => W.isOpen && W.tab.tab === "Voice data";
  const redo = () => { if (shown()) U.rerender(); };

  }

  function render(body) {
    const t = U.toggle("offline", "Offline mode", "Never downloads. Voice files come only from an offline package you import (Settings → Offline package). Also used automatically when there is no internet.");
    if (navigator.onLine === false) t.querySelector(".slab").appendChild(h("div", "swhy", "No internet right now: offline either way."));
    body.appendChild(t);
    body.appendChild(U.toggle("slim", "Slim mode", "When you switch to another voice or listener and apply, the files of the one you stopped using are deleted. Off: every file ever loaded is kept."));
    body.appendChild(fitRow());
    body.appendChild(storedRow());
  }

  // ---- The fit check -------------------------------------------------------------------------------
  function fitRow() {
    const box = h("div", "sfit", "Checking…");

      const p = await V.plan(SETTINGS.all(), U.after());
      if (!p.model) return line(`${p.label}: browser voices need no files.`);
      const all = p.files.reduce((n, f) => n + f.size, 0);
      const out = [line(`${p.label}: ${U.count(p.files.length)}, ${MB(all)} (libraries and the MP3 encoder included); ${p.missing.length ? `${p.stored} stored, ${MB(p.missingBytes)} to ${p.offline ? `import from an offline package (${p.why})` : "download"}` : "all stored"}.`),
        line(`Storage: ${p.fit.text}.`, !p.fit.ok)];

      if (p.drop.length) out.push(line(`Slim mode deletes ${U.count(p.drop.length)} of the voice no longer used (${MB(p.dropBytes)}) on Apply.`));
      if (p.offline && p.missing.length) out.push(U.button("sbtn", "Import an offline package…", () => W.show("Sound", "Offline package")));
      return out;
    });
    return U.row("Fit check", "Whether the voice as it would be saved fits this device: the files it needs, the storage room, and its working memory.", box, { block: true });
  }

  // ---- The stored files -----------------------------------------------------------------------------
  function storedRow() {
    const box = h("div", "sstored", "Reading the store…");
    later(box, async () => {
      const files = await V.stored();
      if (!files.length) return line("No files are stored yet. A voice downloads its files at its first Play, or they come from an imported offline package.");
      const total = files.reduce((n, f) => n + f.size, 0);
      const owners = new Map();
      for (const f of files) { const o = owners.get(f.owner) || { n: 0, bytes: 0 }; o.n++; o.bytes += f.size; owners.set(f.owner, o); }
      const out = [line(`${U.count(files.length)}, ${MB(total)} in all.`)];
      const list = h("div", "sown");
      for (const [owner, o] of Array.from(owners).sort((a, b) => b[1].bytes - a[1].bytes)) {
        const r = h("div", "sownrow");
        const armed = st.armed === owner && Date.now() - st.armedAt < 8000;

        r.append(h("span", "soname", owner), h("span", "sosize", `${MB(o.bytes)} · ${U.count(o.n)}`), del);

      table.append(head("name", "Name"), head("owner", "Belongs to"), head("size", "Size"));
      const cmp = { name: (a, b) => a.name.localeCompare(b.name), owner: (a, b) => a.owner.localeCompare(b.owner) || a.name.localeCompare(b.name), size: (a, b) => a.size - b.size };
      for (const f of files.slice().sort((a, b) => st.dir * cmp[st.sort](a, b))) {
