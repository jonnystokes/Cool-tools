  }
  const redoKeepOpen = () => redo();
  // Delete per voice: the first tap says what would go, a second within 8 s deletes.
  async function removeOwner(owner, o) {
    const under = V.storeBusy();          // D20: never while a download or a zip copy could land afterwards
    if (under) { st.armed = ""; U.say(`Not now: ${under}. Delete waits until that is finished (or stopped), so nothing of ${owner} lands in the store after it is deleted.`); redo(); return; }
    if (st.armed !== owner || Date.now() - st.armedAt > 8000) {
      st.armed = owner; st.armedAt = Date.now();
      // EFF-15: the shared runtime serves three things at once; the retired files serve nothing.
      const why = owner === MODELS.RUNTIME.owner ? " The Kokoro newer engine, Supertonic and the listeners all use these; whichever runs next downloads them again (or they come from an offline package)." : MODELS.RETIRED.some((r) => r.owner === owner) ? " This reader no longer uses them: nothing needs them again." : " They can be downloaded, or imported from an offline package, again later.";
      U.say(`${owner}: ${U.count(o.n)}, ${MB(o.bytes)}. Tap Delete again to confirm.${why}`);
      redo();
      setTimeout(() => { if (st.armed === owner && Date.now() - st.armedAt >= 8000) { st.armed = ""; redo(); } }, 8100);
      return;
    }
    st.armed = "";
    try { const n = await V.removeOwner(owner); U.say(`Deleted ${owner}: ${U.count(n)} (${MB(o.bytes)}).`); }
    catch (e) { U.say(`Deleting failed: ${e.message}`); }
    U.refreshNeed();
    redo();
  }

  W.addTab("Voice data", render);
})();
</script>
<script>
// packtab.js: the Offline package tab of the Settings window (SETTINGS.md "Offline package"; the work is
// package.js). Two rows:
//   MAKE A PACKAGE: a tree of everything the reader can download (engines → their voices, precisions and
//   files; listeners; runtimes and libraries; the online library's books), grouped and collapsible, each
//   row with its size and whether it is stored here, a tri-state tick (a group ticks all it holds; a file
//   in two groups is one tick, counted once) and the running total. Presets: what my current settings
//   need, everything stored here, none. Selection as in a file manager: click selects, Shift+click a
//   range, Ctrl/Cmd+click adds or removes one, Space ticks or unticks every selected row, Up/Down move,
//   Shift+Up/Down extend, Left/Right collapse / expand (or go to the parent / first child), Home/End,
//   Ctrl+A selects every shown row; a click on a row's box ticks it. Touch: a tap ticks, a long press
//   starts a range (the next tap ticks or unticks every row from there to it). role tree / treeitem with
//   aria-level, aria-expanded, aria-selected and aria-checked (true / false / mixed). Then Include my
//   settings and Make the package (Stop while it runs).
//   IMPORT A PACKAGE: pick one or more parts (any order, several packages at once, an old Voice_data.zip
//   too); what each holds, which parts are missing and the fit check are shown first; the zip's settings
//   come in only when ticked (light ones at once, heavy ones pending for Apply, the device-tuned ones only
//   with a second tick); Import (Stop while it runs) and the report stays on the page.
(function () {
  const W = globalThis.SETTINGSWIN, P = globalThis.PACKAGE, V = globalThis.VOICEDATA;
  if (!W || !P || !V) return;
  const U = W.ui, h = U.h, MB = (n) => MODELS.MB(n);
  const LONG_MS = 500;
  const st = { tree: null, loading: false, have: new Set(), expanded: new Set(), selected: new Set(), focus: "", anchor: "", ticked: new Set(),
    touchAnchor: "", withSettings: false, running: "", pkgs: null, bring: false, bringTuned: false, report: null };
  const shown = () => W.isOpen && W.tab.tab === "Offline package";
  const redo = () => { if (shown()) U.rerender(); };
  const line = (text, bad) => h("div", "sline" + (bad ? " bad" : ""), text);
  const plural = (n, w) => `${n.toLocaleString("en-US")} ${w}${n === 1 ? "" : "s"}`;

  function render(body) {
    body.appendChild(makeRow());
    body.appendChild(importRow());
  }

  // ---- The tree's data ----------------------------------------------------------------------------
  function load() {
    if (st.loading) return;
    st.loading = true;
    Promise.all([P.tree(), P.storedSet()]).then(([t, have]) => { st.tree = t; st.have = have; }, (e) => { st.tree = { nodes: [], leaves: new Map(), why: e.message }; })
      .finally(() => { st.loading = false; redo(); });
  }
  const keysOf = (n) => n._keys || (n._keys = n.kids ? Array.from(new Set(n.kids.flatMap(keysOf))) : [n.key]);
  const sizeOf = (keys) => keys.reduce((s, k) => s + ((st.tree.leaves.get(k) || {}).size || 0), 0);
  const isHere = (k) => P.isStored(st.tree.leaves.get(k), st.have);
  function tickState(n) {
    const keys = keysOf(n), on = keys.filter((k) => st.ticked.has(k)).length;
    return on === 0 ? "false" : on === keys.length ? "true" : "mixed";
  }
  // The rows shown: [{ n, level, parent }] in order, under the expanded groups only.
  function visible() {
    const out = [];
    const walk = (list, level, parent) => { for (const n of list) { out.push({ n, level, parent }); if (n.kids && st.expanded.has(n.id)) walk(n.kids, level + 1, n.id); } };
    walk(st.tree.nodes, 1, "");
    return out;
  }
  // Tick (or untick, when every one is ticked already) all the keys under these rows.
  function tick(ids) {
    const rows = visible().filter((r) => ids.includes(r.n.id));
    const keys = Array.from(new Set(rows.flatMap((r) => keysOf(r.n))));
    if (!keys.length) return;
    const off = keys.every((k) => st.ticked.has(k));
    for (const k of keys) if (off) st.ticked.delete(k); else st.ticked.add(k);
  }
  function setTicks(ids, on) {
    for (const r of visible().filter((x) => ids.includes(x.n.id))) for (const k of keysOf(r.n)) if (on) st.ticked.add(k); else st.ticked.delete(k);
  }
  const between = (a, b) => { const v = visible().map((r) => r.n.id); let i = v.indexOf(a), j = v.indexOf(b); if (i < 0) i = j; if (i > j) [i, j] = [j, i]; return v.slice(i, j + 1); };

  // ---- Make a package -----------------------------------------------------------------------------
  let treeEl = null, totalEl = null, goEl = null;
  function makeRow() {
    const box = h("div", "spkg");
    if (!st.tree) { load(); box.appendChild(line("Reading what can go in…")); return U.row("Make a package", "", box, { block: true }); }
    if (st.tree.why) { box.appendChild(line(`The list could not be made: ${st.tree.why}`, true)); return U.row("Make a package", "", box, { block: true }); }
    const pre = h("div", "sbtnrow");
    pre.append(U.button("sbtn", "What my current settings need", () => preset("needs")), U.button("sbtn", "Everything stored here", () => preset("stored")), U.button("sbtn", "None", () => preset("none")));
    box.appendChild(pre);
    treeEl = h("div", "ptree");
    treeEl.tabIndex = 0;
    treeEl.setAttribute("role", "tree");
    treeEl.setAttribute("aria-label", "What can go in the offline package");
    treeEl.setAttribute("aria-multiselectable", "true");
    wire(treeEl);
    box.appendChild(treeEl);
    totalEl = h("div", "sline ptotal");
    box.appendChild(totalEl);
    const t = h("label", "stick");
    const inp = h("input");
    inp.type = "checkbox"; inp.checked = st.withSettings;
    inp.addEventListener("change", () => { st.withSettings = inp.checked; });
    t.append(inp, h("span", null, "Include my settings (every setting changed from its default; not this device's record of broken precisions)"));
    box.appendChild(t);
    if (st.made) {
      // The parts, each saved on its own tap (a browser holds back a second download no tap started).
      const m = st.made;
      box.appendChild(line(`The package is ready in ${m.parts.length} parts. Save each one (a tap each); keep them together and import them all on the other device.`));
      const list = h("div", "sbtnrow");
      m.parts.forEach((p, i) => list.appendChild(U.button("sbtn" + (m.saved.has(i) ? "" : " hot"), `${m.saved.has(i) ? "✓ " : ""}Save part ${i + 1} of ${m.parts.length} (${MB(p.size)})`, () => savePart(i))));
      box.appendChild(list);
      box.appendChild(U.button("sbtn", m.saved.size === m.parts.length ? "Done" : "Done (the parts not saved are let go)", () => { st.made = null; P.release(); U.say(""); redo(); }));
    }
    const btns = h("div", "sbtnrow");
    if (st.running === "make") btns.appendChild(U.button("sbtn", "Stop", () => { P.stop(); U.say("Stopping…"); }));
    else { goEl = U.button("sbtn hot", "Make the package…", makeNow); btns.appendChild(goEl); }
    box.appendChild(btns);
    if (st.makeMsg) box.appendChild(line(st.makeMsg.text, st.makeMsg.bad));    // the outcome beside the button, not only at the window's top
    drawTree();
    // What is stored may have changed since (a download, an import, a Delete): the marks follow.
    const el = treeEl;
    P.storedSet().then((have) => { st.have = have; if (treeEl === el && el.isConnected) drawTree(); }, () => {});
    return U.row("Make a package", `Everything the reader can download, to carry to a device without internet. Ticked files stored here are copied from the store; the others are downloaded first. ${P.canPick() ? "This browser saves it as one file where you choose." : `This browser gets it as downloads in parts of at most ${MB(P.PART_BYTES)}.`}`, box, { block: true });
  }
  function drawTree() {
    if (!treeEl || !st.tree) return;
    const rows = visible();
    const ids = rows.map((r) => r.n.id);
    if (!ids.includes(st.focus)) st.focus = ids[0] || "";
    const out = [];
    rows.forEach((r, i) => {
      const n = r.n, keys = keysOf(n), state = tickState(n), size = sizeOf(keys), here = keys.filter(isHere).length;
      const el = h("div", "prow" + (st.selected.has(n.id) ? " sel" : "") + (st.focus === n.id ? " focus" : "") + (st.touchAnchor === n.id ? " anchor" : ""));
      el.id = "pkr-" + i;
      el.dataset.id = n.id;
      el.setAttribute("role", "treeitem");
      el.setAttribute("aria-level", String(r.level));
      el.setAttribute("aria-checked", state);
      el.setAttribute("aria-selected", st.selected.has(n.id) ? "true" : "false");
      if (n.kids) el.setAttribute("aria-expanded", st.expanded.has(n.id) ? "true" : "false");
      el.style.paddingLeft = `${(r.level - 1) * 1.2 + 0.3}em`;
      const tw = h("span", "ptw", n.kids ? (st.expanded.has(n.id) ? "▾" : "▸") : "");
      const bx = h("span", "pbox " + state);
      const what = n.why ? `can't be read: ${n.why}` : n.kids ? `${plural(keys.length, n.kind === "book" || n.id === "b" ? "book" : "file")}, ${MB(size)}` : MB(size);
      const stored = n.why ? "" : n.kind === "book" ? { stored: "stored here", update: "update available", new: "not here" }[n.status] || ""
        : here === keys.length ? (n.kids ? "all stored" : "stored") : here ? `${here} of ${keys.length} stored` : "not stored";
      el.append(tw, bx, h("span", "plab", n.label), h("span", "psize", what), h("span", "phere" + (here === keys.length && keys.length ? " yes" : ""), stored));
      out.push(el);
    });
    treeEl.replaceChildren(...out);
    const fi = ids.indexOf(st.focus);
    if (fi >= 0) treeEl.setAttribute("aria-activedescendant", "pkr-" + fi); else treeEl.removeAttribute("aria-activedescendant");
    const f = treeEl.children[fi];
    if (f && document.activeElement === treeEl && f.scrollIntoView) f.scrollIntoView({ block: "nearest" });
    drawTotal();
  }
  function drawTotal() {
    if (!totalEl) return;
    const keys = Array.from(st.ticked).filter((k) => st.tree.leaves.has(k));
    const bytes = sizeOf(keys), here = keys.filter(isHere), hereBytes = sizeOf(here);
    const books = keys.filter((k) => st.tree.leaves.get(k).kind === "book").length;
    const parts = P.canPick() ? 1 : P.split(keys.map((k) => ({ size: st.tree.leaves.get(k).size })), P.PART_BYTES).length;
    totalEl.textContent = keys.length
      ? `Ticked: ${plural(keys.length, "file")}${books ? ` (${plural(books, "book")})` : ""}, ${MB(bytes)}: ${here.length ? `${MB(hereBytes)} stored here` : "nothing stored here"}${keys.length > here.length ? `, ${MB(bytes - hereBytes)} to download` : ""}${parts > 1 ? `; about ${parts} parts` : ""}.`
      : "Nothing ticked.";
    if (goEl) { goEl.classList.toggle("hot", !!keys.length && !(st.running || P.busy || V.busy)); goEl.textContent = keys.length ? `Make the package (${MB(bytes)})…` : "Make the package…"; }
    globalThis.PACKTAB.last = { ticked: keys.length, bytes, here: here.length };
  }
  function preset(which) {
    if (which === "none") st.ticked.clear();
    else if (which === "stored") st.ticked = new Set(Array.from(st.tree.leaves.keys()).filter(isHere));
    else {
      const need = P.needs(U.after()).filter((k) => st.tree.leaves.has(k));
      st.ticked = new Set(need);
      if (!need.length) U.say("The voice as set here is a browser voice: it needs no files.");
    }
    drawTree();
  }

  // ---- Selection: mouse, keys, touch ------------------------------------------------------------------
  function wire(el) {
    let press = null;
    el.addEventListener("pointerdown", (e) => {
      const row = e.target.closest(".prow");
      if (!row) return;
      press = { id: row.dataset.id, touch: e.pointerType === "touch" || e.pointerType === "pen", fired: false, x: e.clientX, y: e.clientY };
      if (press.touch) press.timer = setTimeout(() => { press.fired = true; startRange(press.id); }, LONG_MS);
    });
    const cancel = () => { if (press && press.timer) clearTimeout(press.timer); };
    el.addEventListener("pointerup", cancel);
    el.addEventListener("pointercancel", () => { cancel(); press = null; });
    el.addEventListener("pointermove", (e) => { if (press && press.timer && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) { clearTimeout(press.timer); press.timer = null; } });
    el.addEventListener("contextmenu", (e) => { if (press && press.touch) e.preventDefault(); });
    el.addEventListener("click", (e) => {
      const row = e.target.closest(".prow");
      const p = press;
      press = null;
      if (!row) return;
      const id = row.dataset.id;
      if (p && p.fired) return;                                       // the long press already did its part
      st.focus = id;
      if (e.target.closest(".ptw") && row.hasAttribute("aria-expanded")) { toggleOpen(id); return; }
      if (p && p.touch) {
        if (st.touchAnchor && st.touchAnchor !== id) {
          const a = visible().find((r) => r.n.id === st.touchAnchor);
          const on = a ? tickState(a.n) !== "true" : true;
          setTicks(between(st.touchAnchor, id), on);
          st.touchAnchor = "";
        } else { st.touchAnchor = ""; tick([id]); }
        st.selected = new Set([id]); st.anchor = id;
      } else if (e.target.closest(".pbox")) { tick([id]); st.selected = new Set([id]); st.anchor = id; }
      else if (e.shiftKey) st.selected = new Set(between(st.anchor || id, id));
      else if (e.ctrlKey || e.metaKey) { if (st.selected.has(id)) st.selected.delete(id); else st.selected.add(id); st.anchor = id; }
      else { st.selected = new Set([id]); st.anchor = id; }
      el.focus({ preventScroll: true });
      drawTree();
    });
    el.addEventListener("dblclick", (e) => { const row = e.target.closest(".prow"); if (row && row.hasAttribute("aria-expanded") && !e.target.closest(".pbox")) toggleOpen(row.dataset.id); });
    el.addEventListener("keydown", key);
  }
  function startRange(id) {
    st.touchAnchor = id; st.focus = id; st.selected = new Set([id]); st.anchor = id;
    U.say("Range started: tap another row to tick (or untick) every row from here to there.");
    drawTree();
  }
  function toggleOpen(id) { if (st.expanded.has(id)) st.expanded.delete(id); else st.expanded.add(id); drawTree(); }
  function key(e) {
    const rows = visible(), ids = rows.map((r) => r.n.id);
    let i = ids.indexOf(st.focus);
    if (i < 0) i = 0;
    const r = rows[i];
    const move = (j, extend) => {
      j = Math.max(0, Math.min(ids.length - 1, j));
      st.focus = ids[j];
      if (extend) st.selected = new Set(between(st.anchor || ids[i], ids[j]));
      else { st.selected = new Set([ids[j]]); st.anchor = ids[j]; }
    };
    const k = e.key;
    if (k === "ArrowDown") move(i + 1, e.shiftKey);
    else if (k === "ArrowUp") move(i - 1, e.shiftKey);
    else if (k === "Home") move(0, e.shiftKey);
    else if (k === "End") move(ids.length - 1, e.shiftKey);
    else if (k === "ArrowRight") {
      if (r && r.n.kids && !st.expanded.has(r.n.id)) st.expanded.add(r.n.id);
      else if (r && r.n.kids && r.n.kids.length) move(i + 1, false);
    } else if (k === "ArrowLeft") {
      if (r && r.n.kids && st.expanded.has(r.n.id)) st.expanded.delete(r.n.id);
      else if (r && r.parent) move(ids.indexOf(r.parent), false);
    } else if (k === " " || k === "Spacebar") tick(st.selected.size ? Array.from(st.selected) : [st.focus]);
    else if ((k === "a" || k === "A") && (e.ctrlKey || e.metaKey)) st.selected = new Set(ids);
    else return;
    e.preventDefault();
    drawTree();
  }

  // ---- Making it ------------------------------------------------------------------------------------
  const cancelled = (e) => !!(e && (e.stopped || e.name === "AbortError"));
  // Every step of Make goes to the log and beside the button (Jon, 2026-10-23: on the phone Make seemed to
  // do nothing, with no log line).
  function makeSay(text, bad) { st.makeMsg = text ? { text, bad: !!bad } : null; U.say(text); if (text) log(bad ? "error" : "storage", `offline package: ${text}`); }
  function makeNow() {
    const keys = Array.from(st.ticked).filter((k) => st.tree.leaves.has(k));
    log("storage", `offline package: Make pressed: ${keys.length} ticked · way: ${P.canPick() ? "one file through the save picker" : "downloads in parts"} (save picker ${typeof showSaveFilePicker === "function" ? "listed" : "not listed"}, mobile ${/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? "yes" : "no"})`);
    if (st.running || P.busy || V.busy) { makeSay(`A package is already being made or imported (${st.running || (P.busy && P.busy.what) || "voice data busy"}).`, true); redo(); return; }
    if (!keys.length) { makeSay("Tick what goes in first.", true); redo(); return; }
    let target = null;
    try { target = P.savePicker(); } catch (e) { target = null; log("error", "offline package: the save picker could not open", e); }
    if (target) target.then(() => log("storage", "offline package: a file was chosen in the save picker"), (e) => log(e && e.name === "AbortError" ? "storage" : "error", `offline package: the save picker gave no file: ${e && e.name}: ${e && e.message}`));
    st.running = "make"; st.made = null; st.makeMsg = null;
    redo();
    (async () => {
      let said = "", bad = false;
      try {
        log("storage", `offline package: making it: ${keys.length} files${target ? ", into the chosen file" : ", as downloads in parts"}`);
        const r = await P.build(keys, st.tree.leaves, Object.assign({ target, settings: st.withSettings ? V.mySettings() : null, progress: (t, f) => U.progress(t, f) }, globalThis.PACKTAB.hooks));
        said = `Made the offline package: ${plural(r.files, "file")}, ${MB(r.bytes)}${st.withSettings ? " and your settings" : ""}${r.downloaded ? ` (${r.downloaded} downloaded for it)` : ""}; ${r.how}.`;
        if (r.held && r.held.length) st.made = { parts: r.held, saved: new Set() };
      } catch (e) {
        said = e && e.name === "AbortError" && !e.stopped ? `No file was chosen: nothing was written${e.message ? ` (${e.message})` : ""}.` : cancelled(e) ? "Stopped: no package was written." : `The package was not made: ${e && e.name ? e.name + ": " : ""}${e && e.message}`;
        bad = !cancelled(e);
        if (bad) log("error", "offline package: making it failed", e);
      } finally {
        st.running = ""; U.progress("");
        st.have = await P.storedSet().catch(() => st.have);
        makeSay(said, bad); redo();
      }
    })();
  }

  function savePart(i) {
    const p = st.made.parts[i];
    const a = document.createElement("a");
    a.href = URL.createObjectURL(p.blob); a.download = p.name; a.hidden = true;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 600000);
    st.made.saved.add(i);
    log("storage", `offline package: ${p.name} offered as a download (${MB(p.size)})`);
    U.say(`${p.name} offered as a download.${st.made.saved.size === st.made.parts.length ? " Every part has been offered: press Done when they have all landed." : ""}`);
    redo();
  }

  // ---- Import -----------------------------------------------------------------------------------------
  function importRow() {
    const box = h("div", "simp");
    if (st.running === "import") {
      box.appendChild(U.button("sbtn", "Stop importing", () => { P.stop(); U.say("Stopping after the current file…"); }));
      return U.row("Import a package", "", box, { block: true });
    }
    if (st.report) for (const [t, bad] of st.report) box.appendChild(line(t, bad));
    if (!st.pkgs) {
      box.appendChild(U.button("sbtn", st.report ? "Import more parts…" : "Import parts…", importPick));
      return U.row("Import a package", "Choose every part of an offline package (or several), in any order; an old Voice_data.zip works too. Each file is checked before it is stored; what is missing is named.", box, { block: true });
    }
    for (const e of st.pkgs.errors) box.appendChild(line(`${e.name} ${e.why}.`, true));
    if (!st.pkgs.packages.length) box.appendChild(line("No package among them: nothing to import.", true));
    const go = U.button("sbtn hot", "Import", importNow);
    go.disabled = true;
    const fit = h("div", "sfit", "Checking…");
    for (const p of st.pkgs.packages) P.describe(p).forEach((t, i) => box.appendChild(line(t, i > 0 && /not given/.test(t))));
    box.appendChild(fit);
    Promise.resolve().then(async () => {
      let take = [], here = 0;
      for (const p of st.pkgs.packages) { const q = await P.plan(p); take = take.concat(q.take); here += q.here.length; }
      const f = await MODELS.fit(take.filter((r) => r.kind === "file").map((r) => ({ url: r.url, size: r.size })));
      go.disabled = !(take.length ? f.ok : st.bring && settingsOf());
      go.textContent = take.length ? `Import ${plural(take.length, "file")} (${MB(take.reduce((n, r) => n + r.size, 0))})` : st.bring ? "Bring in the settings" : "Nothing to import";
      return [line(take.length ? `${here ? `${plural(here, "file")} already here; ` : ""}${plural(take.length, "file")} to import.` : "Everything given is already here."), line(`Storage: ${f.text}.`, !f.ok)];
    }).then((nodes) => { if (fit.isConnected) fit.replaceChildren(...nodes); }, (e) => { if (fit.isConnected) fit.replaceChildren(line(`Could not be checked: ${e.message}`, true)); });
    const s = settingsOf();
    if (s) {
      const vals = Object.keys(V.validSettings(s)), tuned = vals.filter((k) => V.DEVICE_TUNED.includes(k));
      const t1 = h("label", "stick"), i1 = h("input");
      i1.type = "checkbox"; i1.checked = st.bring;
      i1.addEventListener("change", () => { st.bring = i1.checked; redo(); });
      t1.append(i1, h("span", null, `Also bring in the package's settings (${vals.length - tuned.length}): the light ones apply at once, the others wait for Apply`));
      box.appendChild(t1);
      if (st.bring && tuned.length) {
        const t2 = h("label", "stick"), i2 = h("input");
        i2.type = "checkbox"; i2.checked = st.bringTuned;
        i2.addEventListener("change", () => { st.bringTuned = i2.checked; redo(); });
        t2.append(i2, h("span", null, `…and the ones tuned to the device it was made on (${tuned.join(", ")})`));
        box.appendChild(t2);
      }
    }
    const btns = h("div", "sbtnrow");
    btns.append(go, U.button("sbtn", "Cancel", () => { st.pkgs = null; st.bring = st.bringTuned = false; redo(); }));
    box.appendChild(btns);
    return U.row("Import a package", "", box, { block: true });
  }
  const settingsOf = () => (st.pkgs && (st.pkgs.packages.find((p) => p.settings) || {}).settings) || null;
  function importPick() {
    const picked = P.pick();
    (async () => {
      const files = await picked;
      if (!files.length) return;
      try { st.pkgs = await P.open(files); st.report = null; st.bring = st.bringTuned = false; U.say(""); } catch (e) { st.pkgs = null; U.say(e.message); }
      redo();
    })();
  }
  async function importNow() {
    const pk = st.pkgs;
    if (!pk) return;
    const s = st.bring ? settingsOf() : null;
    st.running = "import"; redo();
    const rep = [];
    let said = "";
    try {
      for (const p of pk.packages) {
        const r = await P.take(p, (t, f) => U.progress(t, f));
        const what = p.old ? p.name : `the package of ${p.made}`;
        rep.push([`From ${what}: ${r.took ? `imported ${plural(r.took, "file")} (${MB(r.bytes)}), each checked` : "nothing new imported"}${r.here ? `; ${plural(r.here, "file")} already here` : ""}.`, false]);
        for (const m of r.missing) rep.push([`Part ${m.part} of ${p.parts} not given: ${plural(m.files, "file")} (${MB(m.bytes)}) not imported: ${m.names.slice(0, 6).join(", ")}${m.names.length > 6 ? ", …" : ""}.`, true]);
        for (const f of r.failed) rep.push([`Failed: ${f.why}.`, true]);
      }
      if (s) rep.push([bringIn(s), false]);
      said = rep.map((x) => x[0]).join(" ");
      st.pkgs = null; st.bring = st.bringTuned = false;
    } catch (e) {
      said = e.stopped ? "Import stopped. The files imported so far are kept (each was checked)." : e.message;
      rep.push([said, !e.stopped]);
    } finally {
      st.report = rep; st.running = ""; U.progress(""); U.say(said); U.refreshNeed();
      st.have = await P.storedSet().catch(() => st.have);
      redo();
    }
  }
  // The package's settings: the light ones applied now, the heavy ones pending, the tuned ones only when asked.
  function bringIn(values) {
    const vals = V.validSettings(values), dropped = V.droppedSettings(values);
    const left = st.bringTuned ? [] : Object.keys(vals).filter((k) => V.DEVICE_TUNED.includes(k) && JSON.stringify(vals[k]) !== JSON.stringify(SETTINGS.get(k)));
    const names = Object.keys(vals).filter((k) => !left.includes(k) && JSON.stringify(vals[k]) !== JSON.stringify(SETTINGS.get(k)));
    const now = names.filter((k) => U.LIVE.includes(k)), wait = names.filter((k) => !U.LIVE.includes(k));
    for (const k of names) U.change(k, vals[k]);
    log("settings", `brought in from an offline package: ${names.length ? `applied now: ${now.join(", ") || "none"} · waiting for Apply: ${wait.join(", ") || "none"}` : "none differ"}${left.length ? ` · left out (tuned to the other device): ${left.join(", ")}` : ""}${dropped.length ? ` · not taken (unknown here or of the wrong kind): ${dropped.join(", ")}` : ""}`);
    let t = names.length ? `${now.length ? `Applied now from the package's settings: ${now.join(", ")}.` : ""}${wait.length ? `${now.length ? " " : ""}Waiting for Apply (review them first): ${wait.join(", ")}.` : ""}` : "Its settings are the same as these.";
    if (left.length) t += ` Left out, as tuned to the device it was made on: ${left.join(", ")}.`;
    if (dropped.length) t += ` Not taken (this reader does not know them, or they are of the wrong kind): ${dropped.join(", ")}.`;
    return t;
  }

  globalThis.PACKTAB = { st, hooks: {}, last: null, reload: () => { st.tree = null; redo(); } };
  W.addTab("Offline package", render);
})();
</script>
<script>
// storagetab.js: Settings → System → Storage, "Stored data" (SETTINGS.md "Storage"). Everything this
// reader keeps in the browser, and ONLY that: every name starting with the reader's key ("br1-"). The
// file:// origin is shared by every local page (Jon's other tools too), so a name without the prefix is
// never listed, counted or deleted here. What is looked at: localStorage keys, IndexedDB databases
// (indexedDB.databases(); where a browser lacks it, the reader's own br1-book and br1-logs) and Cache API
// caches. Grouped: Books (br1-book: a row per stored book with its chapters and size; the reading
// places br1-pos-<id> / br1-reading-<id>, br1-current, br1-library-kept) · Voice and listener files (br1-models, by owner
// from voicedata.js) · Settings (br1-settings and every other br1- key: window places, the lock; each
// with a "show" fold of its JSON) · Logs (br1-logs: past logs, lines) · Device results (br1-device,
// br1-memory-ceiling, br1-memory-probe, br1-step / br1-step-stopped: log.js's self-test step marks) · Other (a br1- name this version does not know). Within a group
// the items go by size, biggest first. Each group has a Delete (two taps, no pop-up, like Delete downloaded voices)
// and a plain line saying what it removes and what that means: the books → the empty page (the Open
// window deletes one book at a time); settings →
// the defaults (applied at once); logs → the past logs (this visit's stays: it is still being written);
// voice files → MODELS.remove (they download again). Then the total, the browser's used / quota line
// and whether the storage is persisted; Refresh looks again. Sizes are estimates (a record's JSON
// length; a stored file's real size). At the top, Delete all storage (Jon, 2026-10-20): every br1- name
// of every kind in one go, two taps, then the page reloads as on a first run. STORED.survey() /
// remove(id) / removeAll() for the tests (STORED.hooks.reload = false keeps the page).
(function () {
  const W = globalThis.SETTINGSWIN;
  if (!W) return;
  const U = W.ui, h = U.h;
  const P = (globalThis.APP_KEY || "br1") + "-";
  const mine = (name) => typeof name === "string" && name.startsWith(P);
  const st = { data: null, scanning: null, armed: "", armedAt: 0, open: new Set(), hooks: { reload: true } };   // hooks.reload: the tests keep the page
  const shown = () => W.isOpen && W.tab.tab === "Storage";
  const redo = () => { if (shown()) U.rerender(); };
  const line = (text, bad) => h("div", "sline" + (bad ? " bad" : ""), text);
  const size = (n) => (n < 1000 ? `${n} bytes` : n < 1e6 ? `${(n / 1e3).toFixed(1)} KB` : MODELS.MB(n));
  const plural = (n, w) => `${n.toLocaleString("en-US")} ${w}${n === 1 ? "" : "s"}`;
  // A record's size: a string's length, a buffer's bytes, anything else its JSON's length.
  function sizeOf(v) {
    if (v == null) return 0;
    if (typeof v === "string") return v.length;
    if (typeof v === "number" || typeof v === "boolean") return 8;
    if (v instanceof ArrayBuffer) return v.byteLength;
    if (ArrayBuffer.isView(v)) return v.byteLength;
    if (typeof Blob !== "undefined" && v instanceof Blob) return v.size;
    try { return JSON.stringify(v).length; } catch (e) { return 0; }
  }

  // ---- Looking ------------------------------------------------------------------------------------
  async function dbNames() {
    if (indexedDB.databases) { try { return (await indexedDB.databases()).map((d) => d.name).filter(mine); } catch (e) {} }
    return [P + "book", P + "logs"];
  }
  // One database, read-only: records and an estimate of their size per store; a database that does not
  // exist is not made (its first open is aborted). The book's index record gives its name and chapters.
  function scanDb(name) {
    return new Promise((res) => {
      let r;
      try { r = indexedDB.open(name); } catch (e) { return res(null); }
      r.onupgradeneeded = () => { try { r.transaction.abort(); } catch (e) {} };
      r.onerror = () => res(null);
      r.onsuccess = () => {
        const db = r.result, names = Array.from(db.objectStoreNames), out = { bytes: 0, count: 0, stores: {}, meta: null, books: [] };
        const done = () => { try { db.close(); } catch (e) {} res(out); };
        if (!names.length) return done();
        let t;
        try { t = db.transaction(names, "readonly"); } catch (e) { return done(); }
        for (const s of names) {
          const one = (out.stores[s] = { count: 0, bytes: 0 });
          const q = t.objectStore(s).openCursor();
          q.onsuccess = () => {
            const c = q.result;
            if (!c) return;
            const b = sizeOf(c.value) + sizeOf(c.key);
            one.count++; one.bytes += b; out.count++; out.bytes += b;
            if (s === "books" && c.value && c.value.id) out.books.push({ id: c.value.id, title: c.value.title || "", chapters: c.value.chapters || 0, bytes: c.value.bytes || 0 });
            c.continue();
          };
        }
        t.oncomplete = done; t.onabort = done; t.onerror = done;
      };
    });
  }
  async function scanCache(name) {
    const out = { bytes: 0, count: 0, urls: [] };
    const c = await caches.open(name);
    for (const req of await c.keys()) {
      const res = await c.match(req);
      if (!res) continue;
      const n = Number(res.headers.get("content-length")) || (await res.clone().blob()).size;
      out.count++; out.bytes += n; out.urls.push(req.url);
    }
    return out;
  }

  // The groups in the order shown. kind: "ls" (localStorage), "db", "cache".
  const DEVICE = [P + "device", P + "memory-ceiling", P + "memory-probe", P + "step", P + "step-stopped"];
  const GROUPS = [
    { id: "book", title: "Books", help: "Every stored book: its chapters and your reading place in it. Delete removes them all and leaves the page empty; the Open window (top left) deletes one book at a time, or adds books again." },
    { id: "voice", title: "Voice and listener files", help: "The voice and listener models and their libraries. Delete removes them all: a voice downloads its files again at its next Play, or comes from an imported offline package." },
    { id: "settings", title: "Settings", help: "Your settings and the small things the page remembers (window sizes and positions, the lock button). Delete returns every setting to its default at once; unsaved changes in this window stay pending. This device's broken precisions (graphics-card facts, not choices) are kept." },
    { id: "logs", title: "Logs", help: "The logs of earlier visits. Delete removes them; this visit's log stays, as it is still being written." },
    { id: "device", title: "Device results", help: "The results of the device check and the measured working-memory limit. Delete forgets them: the Voice tab loses its \"runs well / too slow\" marks until System → Debug → Re-check this device runs again. Settings stay." },
    { id: "other", title: "Other", help: "Data stored under the reader's br1- names that this version does not recognise (from an earlier build or a test). Delete removes it." },
  ];
  function groupOf(kind, name) {
    if (name === P + "book" || name === P + "pos" || name === P + "book-kept" || name === P + "current" || name === P + "library-kept" || name.startsWith(P + "pos-") || name.startsWith(P + "reading-")) return "book";
    if (name === P + "models") return "voice";
    if (name === P + "logs") return "logs";
    if (DEVICE.includes(name)) return "device";
    return kind === "ls" ? "settings" : "other";
  }
  const WHERE = { ls: "localStorage", db: "IndexedDB", cache: "Cache" };

  async function survey() {
    const found = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!mine(k)) continue;
        const v = localStorage.getItem(k) || "";
        found.push({ kind: "ls", name: k, bytes: k.length + v.length, value: v });
      }
    } catch (e) {}
    for (const name of await dbNames()) { const d = await scanDb(name); if (d) found.push(Object.assign({ kind: "db", name }, d)); }
    let cnames = [];
    try { cnames = (await caches.keys()).filter(mine); } catch (e) {}
    for (const name of cnames) { try { found.push(Object.assign({ kind: "cache", name }, await scanCache(name))); } catch (e) {} }
    const groups = GROUPS.map((g) => ({ id: g.id, title: g.title, help: g.help, targets: [], items: [], bytes: 0, summary: "" }));
    const byId = Object.fromEntries(groups.map((g) => [g.id, g]));
    for (const f of found) { const g = byId[groupOf(f.kind, f.name)]; g.targets.push(f); g.bytes += f.bytes; }
    // What each group lists: the stored names, except the voice files (by owner) and the logs (by kind).
    for (const g of groups) {
      for (const f of g.targets) {
        if (g.id === "voice" && f.name === P + "models") {
          let files = [];
          try { files = globalThis.VOICEDATA ? await VOICEDATA.stored() : await MODELS.stored(); } catch (e) {}
          const owners = new Map();
          for (const x of files) { const o = owners.get(x.owner || "other files") || { n: 0, bytes: 0 }; o.n++; o.bytes += x.size; owners.set(x.owner || "other files", o); }
          for (const [owner, o] of owners) g.items.push({ label: owner, note: plural(o.n, "file"), bytes: o.bytes });
          continue;
        }
        const note = f.kind === "db" ? (f.name === P + "book" && f.books ? `${WHERE.db} ${f.name}: ${plural(f.books.length, "book")}, ${plural(f.books.reduce((n, b) => n + b.chapters, 0), "chapter")}`
          : f.name === P + "logs" && f.stores.visits ? `${WHERE.db} ${f.name}: ${plural(f.stores.visits.count, "log")}, ${plural((f.stores.lines || { count: 0 }).count, "line")}`
          : `${WHERE.db}: ${plural(f.count, "record")}`) : f.kind === "cache" ? `${WHERE.cache}: ${plural(f.count, "file")}` : WHERE.ls;
        g.items.push({ label: f.name, note, bytes: f.bytes, value: f.kind === "ls" ? f.value : undefined });
      }
      g.items.sort((a, b) => b.bytes - a.bytes);
    }
    const book = byId.book.targets.find((f) => f.name === P + "book");
    if (book && book.books) { for (const b of book.books) byId.book.items.push({ label: b.title, note: plural(b.chapters, "chapter"), bytes: b.bytes }); byId.book.items.sort((a, b) => b.bytes - a.bytes); }
    byId.book.summary = book && book.books && book.books.length ? `${plural(book.books.length, "book")}: ${book.books.map((b) => `"${b.title}" (${plural(b.chapters, "chapter")})`).join(", ")}; about ${size(book.bytes)} in all.` : "No book is stored.";
    const files = byId.voice.items.reduce((n, i) => n + (parseInt(i.note, 10) || 0), 0);
    byId.voice.summary = files ? `${plural(files, "file")} for ${plural(byId.voice.items.length, "owner")}, ${size(byId.voice.bytes)}.` : "No voice or listener files are stored.";
    byId.settings.summary = byId.settings.targets.length ? `${plural(byId.settings.targets.length, "key")}, ${size(byId.settings.bytes)}${byId.settings.targets.some((f) => f.name === P + "settings") ? "" : "; every setting is at its default"}.` : "Nothing stored: every setting is at its default.";
    const logs = byId.logs.targets.find((f) => f.name === P + "logs");
    const visits = logs && logs.stores.visits ? logs.stores.visits.count : 0;
    byId.logs.summary = logs ? `${plural(visits, "log")} (this visit's included), about ${size(logs.bytes)}.` : "No logs are stored.";
    byId.device.summary = byId.device.targets.length ? `${byId.device.targets.map((f) => f.name).join(", ")}: ${size(byId.device.bytes)}.` : "Nothing: this device has not been checked.";
    byId.other.summary = byId.other.targets.length ? `${plural(byId.other.targets.length, "name")}, about ${size(byId.other.bytes)}.` : "";
    let est = null, persisted = null;
    try { est = await navigator.storage.estimate(); } catch (e) {}
    try { persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null; } catch (e) {}
    const total = groups.reduce((n, g) => n + g.bytes, 0);
    return { groups, total, names: found.map((f) => f.name), count: found.length, usage: est ? est.usage || 0 : null, quota: est ? est.quota || 0 : null, persisted, when: Date.now() };
  }
  // Look (again); one look at a time, the tab redrawn when it lands.
  function refresh() {
    if (st.scanning) return st.scanning;
    st.scanning = survey().then((d) => { st.data = d; return d; }, (e) => { st.data = { error: e.message }; return st.data; })
      .finally(() => { st.scanning = null; redo(); });
    redo();
    return st.scanning;
  }

  // ---- Deleting -----------------------------------------------------------------------------------
  function dropDb(name) {
    return new Promise((res, rej) => {
      const q = indexedDB.deleteDatabase(name);
      const t = setTimeout(() => rej(new Error(`${name} is still open elsewhere (another tab of the reader?); close it and try again`)), 8000);
      q.onsuccess = () => { clearTimeout(t); res(); };
      q.onerror = () => { clearTimeout(t); rej(q.error || new Error(`${name} could not be deleted`)); };
    });
  }
  // Delete one group: only its own br1- names (checked again here), then what it means for the page.
  async function remove(id) {
    const d = await survey();
    const g = d.groups.find((x) => x.id === id);
    if (!g || !g.targets.length) return { names: [], bytes: 0, text: "Nothing to delete." };
    const targets = g.targets.filter((f) => mine(f.name));
    const under = id === "voice" && globalThis.VOICEDATA ? VOICEDATA.storeBusy() : "";       // D20
    if (under) return { names: [], bytes: 0, text: `Not now: ${under}. Delete waits until that is finished, so nothing lands in the store after it is deleted.` };
    if (id === "book") { if (globalThis.PLAYER && PLAYER.state !== "stopped") PLAYER.stop(); READER.closeBook(); BOOK.forget(); }
    // Logs: past visits pruned through the log store; when the log is not being saved this visit (no
    // store open, D13), the whole database goes instead (this visit's log is in memory anyway).
    let logNote = "";
    if (id === "logs") {
      if (LOG.state() === "kept") await LOG.clear();
      else { await dropDb(P + "logs"); logNote = ` This visit's log was not being saved (${String(LOG.state()).replace(/^not saved: /, "")}), so the whole log store was deleted; this visit's log is in memory only.`; }
    }
    for (const f of targets) {
      if (f.kind === "ls") { try { localStorage.removeItem(f.name); } catch (e) {} }
      else if (f.kind === "db" && id !== "logs") await dropDb(f.name);
      else if (f.kind === "cache") { if (f.name === MODELS.CACHE) await MODELS.remove(f.urls, "(Delete in Settings → Storage)"); else await caches.delete(f.name); }
    }
    let text = "";
    if (id === "book") { if (globalThis.LIBRARY) LIBRARY.render(); text = `Deleted every book (${g.summary.replace(/\.$/, "")}) with the reading places. The Open button (top left) adds books again.`; }
    else if (id === "settings") {
      const before = SETTINGS.all();
      SETTINGS.reset();
      const names = Object.keys(before).filter((k) => JSON.stringify(before[k]) !== JSON.stringify(SETTINGS.get(k)));
      if (names.length) U.apply(names);
      const bp = SETTINGS.get("brokenPrecisions");
      text = `Deleted ${targets.map((f) => f.name).join(", ")}: every setting is back to its default${names.length ? ` (${names.length} changed)` : ""}.${bp.length ? ` Kept: this device's broken precisions (${bp.join(", ")}), which are device facts, not settings.` : ""}`;
    } else if (id === "logs") text = `Deleted the past logs (${g.summary.replace(/\.$/, "")})${logNote ? "." + logNote : "; this visit's log stays."}`;
    else text = `Deleted ${g.title.toLowerCase()}: ${targets.map((f) => f.name).join(", ")} (${size(g.bytes)}).`;
    log("storage", `Settings → Storage, Delete ${g.title}: ${id === "logs" ? "past logs in " : ""}${targets.map((f) => f.name).join(", ")} (about ${size(g.bytes)})`);
    return { names: targets.map((f) => f.name), bytes: g.bytes, text };
  }
  // ---- Delete all storage (Jon, 2026-10-20) ----------------------------------------------------------
  // Everything the reader keeps here, in one go: every br1- name of every kind (the books and places,
  // the voice and listener files, the settings and the small keys, the logs, the device results, the
  // unknown ones), then the page reloads as on a first run. Two taps, like the groups. The databases
  // are let go of first (BOOK.forget, LOG.close) so deleteDatabase is not blocked by this page.
  async function removeAll() {
    const under = globalThis.VOICEDATA ? VOICEDATA.storeBusy() : "";
    if (under) return { ok: false, text: `Not now: ${under}. Delete all storage waits until that is finished, so nothing lands in the store after it is deleted.` };
    const d = await survey();
    const targets = d.groups.flatMap((g) => g.targets).filter((f) => mine(f.name));
    if (globalThis.PLAYER && PLAYER.state !== "stopped") PLAYER.stop();
    READER.closeBook(); BOOK.forget();
    if (globalThis.LOG && LOG.close) LOG.close();
    const failed = [];
    for (const f of targets) {
      try {
        if (f.kind === "ls") localStorage.removeItem(f.name);
        else if (f.kind === "db") await dropDb(f.name);
        else if (f.kind === "cache") await caches.delete(f.name);
      } catch (e) { failed.push(`${f.name}: ${e.message}`); }
    }
    try { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (mine(k)) localStorage.removeItem(k); } } catch (e) {}   // anything written meanwhile
    const text = failed.length ? `Deleted ${targets.length - failed.length} of ${targets.length} stored names (${size(d.total)}); not deleted: ${failed.join("; ")}.`
      : `Deleted everything this reader stored here: ${plural(targets.length, "stored name")}, ${size(d.total)}. Reloading as a first run…`;
    log("storage", `Settings → Storage, Delete all storage: ${targets.map((f) => f.name).join(", ")} (about ${size(d.total)})${failed.length ? `; failed: ${failed.join("; ")}` : ""}`);
    return { ok: !failed.length, text, names: targets.map((f) => f.name), bytes: d.total };
  }
  async function tapAll() {
    if (st.armed !== "all" || Date.now() - st.armedAt > 8000) {
      const d = st.data && !st.data.error ? st.data : await survey();
      const parts = d.groups.filter((g) => g.targets.length).map((g) => `${g.title.toLowerCase()} ${size(g.bytes)}`);
      st.armed = "all"; st.armedAt = Date.now();
      U.say(d.count ? `Delete all storage: ${plural(d.count, "stored name")}, ${size(d.total)} (${parts.join(", ")}). Tap Delete all storage again to delete every book, voice file, setting, log and device result this reader keeps in this browser; the page then reloads as on a first run.`
        : "Nothing is stored: the page is already as on a first run. Tap again to reload it anyway.");
      redo();
      setTimeout(() => { if (st.armed === "all" && Date.now() - st.armedAt >= 8000) { st.armed = ""; redo(); } }, 8100);
      return;
    }
    st.armed = "";
    let r;
    try { r = await removeAll(); } catch (e) { r = { ok: false, text: `Deleting failed: ${e.message}` }; }
    U.say(r.text);
    if (r.ok && st.hooks.reload) setTimeout(() => location.reload(), 400);
    else { U.refreshNeed(); st.data = null; refresh(); }
  }

  // Two taps: the first says what would go, a second within 8 s deletes.
  async function tap(g) {
    if (st.armed !== g.id || Date.now() - st.armedAt > 8000) {
      st.armed = g.id; st.armedAt = Date.now();
      U.say(`${g.title}: ${g.summary} Tap Delete again to delete it. ${g.help.replace(/^.*?Delete /, "Delete ")}`);
      redo();
      setTimeout(() => { if (st.armed === g.id && Date.now() - st.armedAt >= 8000) { st.armed = ""; redo(); } }, 8100);
      return;
    }
    st.armed = "";
    try { const r = await remove(g.id); U.say(r.text); }
    catch (e) { U.say(`Deleting failed: ${e.message}`); }
    U.refreshNeed();
    st.data = null;
    refresh();
  }

  // ---- The tab ------------------------------------------------------------------------------------
  function render(body) {
    const d = st.data;
    const allArmed = st.armed === "all" && Date.now() - st.armedAt < 8000;
    const allBtn = U.button("sbtn sdel", allArmed ? `Delete all storage${d && !d.error ? ` (${size(d.total)})` : ""}?` : "Delete all storage", tapAll);
    allBtn.dataset.group = "all";
    const allRow = U.row("Delete all storage", "Deletes everything this reader keeps in this browser: the books and your places in them, the voice and listener files, every setting, the logs and the device results. Two taps; the page then reloads as on a first run.", allBtn, { block: true });
    allRow.dataset.group = "all";
    body.appendChild(allRow);
    const top = h("div", "sbtnrow");
    const rb = U.button("sbtn", st.scanning ? "Refreshing…" : "Refresh", () => { st.data = null; refresh(); });
    rb.disabled = !!st.scanning;
    top.appendChild(rb);
    body.appendChild(U.row("Stored data", `Everything this reader keeps in this browser (names starting with ${P}). Other pages opened from files share this storage; nothing of theirs is listed or deleted here.${d && d.when ? ` Last refreshed ${LOG.when(d.when)}.` : ""}`, top));
    if (!d) { body.appendChild(h("div", "snote", "Reading the stored data…")); if (!st.scanning) refresh(); return; }
    if (d.error) { body.appendChild(line(`The stored data could not be read: ${d.error}`, true)); return; }
    for (const g of d.groups) {
      if (g.id === "other" && !g.targets.length) continue;
      const box = h("div", "sstor");
      box.appendChild(line(g.summary));
      if (g.items.length) {
        const list = h("div", "sown");
        for (const it of g.items) {
          const r = h("div", "sitem");
          const name = h("span", "soname", it.label);
          r.append(name, h("span", "sosize", `${it.note ? it.note + " · " : ""}${size(it.bytes)}`));
          r.dataset.bytes = it.bytes;
          if (it.value !== undefined) {
            const det = h("details", "sdet sshow");
            const key = g.id + ":" + it.label;
            det.open = st.open.has(key);
            det.addEventListener("toggle", () => { if (det.open) st.open.add(key); else st.open.delete(key); });
            det.appendChild(h("summary", null, "show"));
            let text = it.value;
            try { text = JSON.stringify(JSON.parse(it.value), null, 1); } catch (e) {}
            det.appendChild(h("pre", "sjson", text));
            r.appendChild(det);
          }
          list.appendChild(r);
        }
        box.appendChild(list);
      }
      if (g.targets.length) {
        const armed = st.armed === g.id && Date.now() - st.armedAt < 8000;
        const del = U.button("sbtn sdel", armed ? `Delete ${size(g.bytes)}?` : "Delete", () => tap(g));
        del.dataset.group = g.id;
        box.appendChild(del);
      }
      const r = U.row(g.title, g.help, box, { block: true });
      r.dataset.group = g.id;
      body.appendChild(r);
    }
    const sum = h("div", "sfit");
    sum.appendChild(line(`${size(d.total)} in ${plural(d.count, "stored name")} (sizes are estimates).`));
    if (d.quota) sum.appendChild(line(`Browser storage: ${size(d.usage)} used of ${size(d.quota)} allowed, shared by every page opened from files.`));
    else sum.appendChild(line("The browser does not report how much storage is used or allowed."));
    sum.appendChild(line(d.persisted === true ? "Persisted: yes. The browser has promised to keep this data when the device runs short of space."
      : d.persisted === false ? MODELS.KEEP_NOTE : "Persisted: the browser does not say."));
    const r = U.row("Total", "", sum, { block: true });
    r.dataset.group = "total";
    body.appendChild(r);
  }

  W.addTab("Storage", render);
  // The stored data changed elsewhere (the Open window added or deleted a book): the next look is fresh.
  const stale = () => { st.data = null; if (shown()) refresh(); };
  globalThis.STORED = { PREFIX: P, survey, remove, removeAll, refresh, stale, hooks: st.hooks, get data() { return st.data; } };
})();
</script>
<script>
// cloudtab.js: Settings → Sound → Cloud (2026-10-25): Jon's PC through PC Relay. Opening the tab is one of the
// three things that may contact the PC (with Open → From my PC and Use my PC): it checks the link at once
// ("Checking connection…", then the address, round trip, relay version, the PC's programs and their state,
// signed in or not). Use my PC for the voice (Apply): the voice chosen in the Voice tab is made on the PC
// (engines/cloud.js). PC address (live). Test: one short sentence made on the PC and played here, with its
// timing. Sign in / out (the PC's password: the Private files, and the voice when the PC asks for it). Data used.
// "Use this device's voice" turns Use my PC off at once (the button the play bar shows after a failed Play too).
(function () {
  const W = globalThis.SETTINGSWIN;
  if (!W) return;
  const { h, button, row, toggle, value, change, say } = W.ui;
  const R = () => PCRELAY.client();
  const MB = (n) => (n < 1e6 ? `${Math.round((n || 0) / 1e3)} KB` : `${(n / 1e6).toFixed(1)} MB`);
  const SCOPES = ["files-private", "voice"];
  let checkedAt = 0;

  function statusBox() {
    const box = h("div", "cloudstat");
    box.textContent = "Checking connection…";
    const draw = (r) => {
      if (!box.isConnected && checkedAt) return;
      box.replaceChildren();
      const c = R();
      if (!r.ok) { box.appendChild(h("div", "swarn", `The PC can't be reached: ${r.why}.`)); box.appendChild(h("div", "shelp", `Address: ${c.base}. The PC must be on, with PC Relay running (tray icon).`)); return; }
      const i = r.info;
      box.appendChild(h("div", "sname", `Connected · ${c.latency} ms · PC Relay ${i.version} on ${i.pc}${i.game ? " · Game mode is on" : ""}`));
      box.appendChild(h("div", "shelp", `Address: ${c.base}`));
      for (const s of i.services || []) {
        const state = s.blocked ? "switched off on the PC" : s.unavailable ? s.unavailable : s.state + (s.clients ? `, ${s.clients} connected` : "");
        box.appendChild(h("div", "shelp", `${s.name}: ${state}${s.password ? " · needs the password" : ""}`));
      }
      const signed = (i.scopes || []).length ? `Signed in here for: ${(i.scopes || []).join(", ")}.` : "Not signed in on this device.";
      box.appendChild(h("div", "shelp", signed));
    };
    checkedAt = Date.now();
    R().ping(8000).then(draw, (e) => draw({ ok: false, why: e.message }));
    return box;
  }

  function addressRow() {
    const inp = h("input", "stext");
    inp.type = "url"; inp.placeholder = RelayClient.DEFAULT_PC; inp.value = value("pcAddress") || "";
    inp.setAttribute("aria-label", "PC address");
    inp.addEventListener("change", () => { change("pcAddress", inp.value.trim()); });
    return row("PC address", `Blank = your PC (${RelayClient.DEFAULT_PC}). Saved as soon as you leave the box.`, inp, { name: "pcAddress" });
  }

  function testRow() {
    const out = h("div", "shelp", "");
    const b = button("sbtn", "Test", async () => {
      b.disabled = true; out.textContent = "Starting the voice on the PC…";
      try {
        const o = await R().open("voice", (p) => { if (p.text) out.textContent = p.text; });
        if (!o.ok) throw new Error(o.why);
        const ws = R().ws("voice", "ws"); ws.binaryType = "arraybuffer";
        const v = ENGINE.parse(value("voice"));
        const t0 = performance.now();
        const got = await new Promise((resolve, reject) => {
          const t = setTimeout(() => { reject(new Error("no answer within 90 s")); ws.close(); }, 90000);
          ws.onmessage = (ev) => {
            if (typeof ev.data === "string") {
              const m = JSON.parse(ev.data);
              if (m.type === "hello") ws.send(JSON.stringify({ type: "synth", id: "test", text: "This is your PC speaking, through the relay.", engine: v.engine, voice: v.voice, runOn: value("runOn") === "cpu" ? "cpu" : "gpu", precision: value("precision") || "fp32", pace: value("pace") }));
              else if (m.type === "loading") out.textContent = m.text;
              else if (m.type === "state") out.textContent = m.state === "queued" ? `Queued on the PC (place ${m.pos})…` : "Making it on the PC…";
              else if (m.type === "error") { clearTimeout(t); reject(new Error(m.error)); ws.close(); }
              return;
            }
            clearTimeout(t);
            const n = new DataView(ev.data).getUint32(0, true);
            const head = JSON.parse(new TextDecoder().decode(new Uint8Array(ev.data, 4, n)));
            resolve({ head, pcm: new Int16Array(ev.data.slice(4 + n)), ms: performance.now() - t0, bytes: ev.data.byteLength });
            ws.close();
          };
          ws.onclose = (ev) => { if (ev.code !== 1000 && ev.code !== 1005) reject(new Error(ev.reason || `closed (${ev.code})`)); };
        });
        const sec = got.pcm.length / got.head.sampleRate;
        out.textContent = `Made ${sec.toFixed(1)} s of sound on the PC in ${(got.head.ms / 1000).toFixed(1)} s (${got.head.x}× real time); ${Math.round(got.ms)} ms here from asking to hearing, ${MB(got.bytes)}. Playing it…`;
        const ac = new AudioContext();
        const buf = ac.createBuffer(1, got.pcm.length, got.head.sampleRate);
        const ch = buf.getChannelData(0);
        for (let i = 0; i < got.pcm.length; i++) ch[i] = got.pcm[i] / 32768;
        const src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start();
        src.onended = () => { ac.close(); };
        log("voice", `Cloud tab test: ${sec.toFixed(1)} s in ${(got.head.ms / 1000).toFixed(1)} s on the PC (${got.head.x}×), ${Math.round(got.ms)} ms round trip`);
      } catch (e) { out.textContent = `The test failed: ${e.message}`; log("voice", `Cloud tab test failed: ${e.message}`); }
      finally { b.disabled = false; }
    });
    const box = h("div", "sstack"); box.append(b, out);
    return row("Test", "Makes one short sentence on the PC with the voice chosen in the Voice tab and plays it here.", box);
  }

  function signRow() {
    const box = h("form", "sstack");
    const pw = h("input", "stext"); pw.type = "password"; pw.autocomplete = "current-password"; pw.placeholder = "The PC's password"; pw.setAttribute("aria-label", "The PC's password");
    const msg = h("div", "shelp", SCOPES.some((s) => R().hasPass(s)) ? "Signed in on this device." : "Not signed in on this device.");
    const inBtn = h("button", "sbtn", "Sign in"); inBtn.type = "submit";
    const outBtn = button("sbtn", "Sign out here", async () => { for (const s of SCOPES) await R().signOut(s); msg.textContent = "Signed out on this device."; log("voice", "Cloud tab: signed out on this device"); });
    const btns = h("div", "sbtnrow"); btns.append(inBtn, outBtn);
    box.append(pw, btns, msg);
    box.addEventListener("submit", async (e) => {
      e.preventDefault();
      inBtn.disabled = true; msg.textContent = "Signing in…";
      let res = null;
      for (const s of SCOPES) { res = await R().signIn(s, pw.value); if (!res.ok) break; }
      inBtn.disabled = false;
      msg.textContent = res && res.ok ? "Signed in on this device (Private files; the voice if the PC asks for the password)." : `Not signed in: ${res ? res.why : "?"}.`;
      if (res && res.ok) pw.value = "";
      log("voice", `Cloud tab: sign-in ${res && res.ok ? "done" : "refused: " + (res && res.why)}`);
    });
    return row("Sign in", "The PC's password (the same as Screen Peek's), once per device. Only needed for the Private files, or when the PC asks for it for everything.", box, { block: true });
  }

  function dataRow() {
    const i = globalThis.CLOUDVOICE ? CLOUDVOICE.info : { bytes: 0, pieces: 0 };
    return row("Data used", `${MB(i.bytes)} of sound from the PC this visit (${i.pieces} piece${i.pieces === 1 ? "" : "s"}${i.x ? `, last made at ${i.x}× real time` : ""}). Sound comes as 16-bit samples at 24 kHz: about 0.4 megabits a second of reading, fine on mobile data.`, null);
  }

  function cloudTab(body) {
    body.appendChild(row("Your PC", "", statusBox(), { block: true }));
    body.appendChild(toggle("useMyPC", "Use my PC for the voice", "The voice chosen in the Voice tab is made on your PC (its graphics card or processor, as Run on says) and sent here, with its word times. The PC is contacted only while this is on: a light check when a book opens, the real work when you press Play. If the PC can't be reached, the reading stops and says why; nothing switches by itself. The PC runs Kokoro voices (card or processor) and Piper voices (processor)."));
    const back = button("sbtn", "Use this device's voice", () => { change("useMyPC", false); say("Use my PC is off (press Apply): this device makes the voice again."); });
    body.appendChild(row("", "Choose the voice in the Voice tab; it runs on your PC.", back));
    body.appendChild(addressRow());
    body.appendChild(testRow());
    body.appendChild(signRow());
    body.appendChild(dataRow());
  }
  W.addTab("Cloud", cloudTab);

  // The play bar's "Use this device's voice" button: shown after a Play that could not reach the PC.
  const btn = h("button", "cloudoff", "Use this device's voice");
  btn.type = "button"; btn.hidden = true; btn.id = "cloudoff";
  btn.title = "Turns off Use my PC for the voice; the next Play uses this device's voice";
  btn.addEventListener("click", () => {
    try { SETTINGS.update({ useMyPC: false }); } catch (e) { return; }
    btn.hidden = true;
    PLAYER.settingsChanged(["useMyPC"]);
    log("voice", "Use my PC switched off from the play bar: this device's voice from the next Play");
    PLAYBAR.status("Using this device's voice. Press Play.");
  });
  const box = document.getElementById("stbox");
  if (box && box.parentNode) box.parentNode.insertBefore(btn, box.nextSibling);
  setInterval(() => { const show = !!(globalThis.CLOUDVOICE && CLOUDVOICE.failed && PLAYER.status().state === "stopped"); if (btn.hidden === show) btn.hidden = !show; }, 1000);
})();
</script>
<script>
// device.js: the gates, a quick check of what this device and browser can do, with nothing downloaded
// and nothing heavy (well under a second): the WebGPU adapter (a real card, not a software renderer;
// 16-bit math, subgroups, the largest buffer), the threads, navigator.deviceMemory (rough and rounded,
// 8 GB at most on Android), WebAssembly SIMD with a shared memory (what every model voice needs),
// MediaSource with MP3 (the one stream background play needs), the storage estimate and whether the
// browser promised to keep the files, the Element Timing API (the word-lag line), the browser's own
// voices, a phone or a computer, on battery or not (the rules' warm factor). DEVICE.gates() checks and
// logs one line (type device); DEVICE.lines(g) is the short readable list the first-run window shows;
// DEVICE.voices() counts the browser's voices again (the list arrives late on most devices).
(function () {
  const n = navigator;
  // A tiny module with one SIMD instruction: WebAssembly.validate says whether SIMD is there.
  const SIMD = new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0, 10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11]);
  const MB = (b) => (b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : Math.round(b / 1e6) + " MB");
  const timeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(`no answer in ${ms / 1000} s`)), ms))]);

  function wasm() {
    let simd = false, shared = false;
    try { simd = typeof WebAssembly === "object" && WebAssembly.validate(SIMD); } catch (e) {}
    try { new WebAssembly.Memory({ initial: 1, maximum: 1, shared: true }); shared = true; } catch (e) {}
    return { simd, shared, ok: simd && shared };
  }
  async function card() {
    if (!n.gpu) return { ok: false, why: "this browser gives no WebGPU here" };
    let a = null;
    try { a = await timeout(n.gpu.requestAdapter({ powerPreference: "high-performance" }), 8000); }
    catch (e) { return { ok: false, why: `WebGPU gave no adapter (${e.message})` }; }
    if (!a) return { ok: false, why: "WebGPU gave no adapter (no graphics driver, or the browser blocks this card)" };
    const info = a.info || {};
    const name = [info.vendor, info.architecture, info.description].filter(Boolean).join(" ") || "unnamed adapter";
    const out = { ok: true, why: "", name, f16: a.features.has("shader-f16"), subgroups: a.features.has("subgroups"), maxBuffer: a.limits.maxBufferSize || 0, maxBinding: a.limits.maxStorageBufferBindingSize || 0 };
    if (info.isFallbackAdapter || /swiftshader|basic render|llvmpipe|softpipe|software/i.test(name)) Object.assign(out, { ok: false, why: `a software renderer (${name}), not a graphics card` });
    return out;
  }
  function voices() {
    const ss = globalThis.speechSynthesis;
    if (!ss || typeof SpeechSynthesisUtterance === "undefined") return { supported: false, total: 0, local: 0, enLocal: 0, enOnline: 0 };
    let list = [];
    try { list = ss.getVoices() || []; } catch (e) {}
    const en = (v) => /^en([-_]|$)/i.test(v.lang || "");
    const c = { supported: true, total: list.length, local: 0, enLocal: 0, enOnline: 0 };
    for (const v of list) { if (v.localService) c.local++; if (en(v)) { if (v.localService) c.enLocal++; else c.enOnline++; } }
    return c;
  }
  function browser() {
    const brands = (n.userAgentData && n.userAgentData.brands) || [];
    const b = brands.find((x) => !/Not.?A.?Brand|Chromium/i.test(x.brand)) || brands.find((x) => /Chromium/.test(x.brand));
    if (n.brave) return "Brave" + (b ? " " + b.version : "");
    return b ? `${b.brand} ${b.version}` : (/Firefox\/(\d+)/.exec(n.userAgent) || [])[0] || "a browser";
  }

  async function gates() {
    const t0 = performance.now();
    const g = { when: Date.now(), browser: browser(), threads: n.hardwareConcurrency || 0, memoryGB: n.deviceMemory || 0,
      mobile: !!((n.userAgentData && n.userAgentData.mobile) || /Android|iPhone|iPad|Mobile/i.test(n.userAgent)),
      wasm: wasm(), mediaSource: globalThis.STREAM ? STREAM.supported() : !!(globalThis.MediaSource && MediaSource.isTypeSupported("audio/mpeg")),
      elementTiming: typeof PerformanceObserver !== "undefined" && (PerformanceObserver.supportedEntryTypes || []).includes("element"),
      voices: voices(), storage: null, battery: null, card: null };
    const [cardInfo, storage, battery] = await Promise.all([
      card().catch((e) => ({ ok: false, why: `the card check failed: ${e.message}` })),
      (async () => { const s = n.storage; if (!s || !s.estimate) return null; const e = await timeout(s.estimate(), 3000); return { quota: e.quota || 0, usage: e.usage || 0, persisted: s.persisted ? await timeout(s.persisted(), 3000) : null }; })().catch(() => null),
      (async () => { if (!n.getBattery) return null; const b = await timeout(n.getBattery(), 2000); return { charging: !!b.charging, level: b.level }; })().catch(() => null),
    ]);
    Object.assign(g, { card: cardInfo, storage, battery, ms: Math.round(performance.now() - t0) });
    g.onBattery = !!(battery && !battery.charging && !g.mobile);
    log("device", `gates: ${g.browser} · ${g.mobile ? "phone or tablet" : "computer"}${g.onBattery ? " on battery" : ""} · ${g.threads || "?"} threads · memory ${g.memoryGB || "?"} GB (reported) · card ${g.card.ok ? `${g.card.name}, 16-bit math ${g.card.f16 ? "yes" : "no"}, subgroups ${g.card.subgroups ? "yes" : "no"}, largest buffer ${MB(g.card.maxBuffer)}` : "no: " + g.card.why} · WebAssembly SIMD ${g.wasm.simd ? "yes" : "no"}, shared memory ${g.wasm.shared ? "yes" : "no"} · MP3 stream ${g.mediaSource ? "yes" : "no"} · storage ${g.storage ? `${MB(Math.max(0, g.storage.quota - g.storage.usage))} free of ${MB(g.storage.quota)}, kept ${g.storage.persisted ? "yes" : "not promised"}` : "unknown"} · Element Timing ${g.elementTiming ? "yes" : "no"} · browser voices ${g.voices.supported ? `${g.voices.total} (${g.voices.local} on the device)` : "none"} · ${g.ms} ms`);
    return g;
  }

  // The readable list: [{ label, text, bad }].
  function lines(g) {
    if (!g) return [];
    const c = g.card || {}, s = g.storage, v = g.voices || {};
    return [
      { label: "Graphics card", text: c.ok ? `${c.name}; 16-bit math ${c.f16 ? "yes" : "no"}` : `none usable: ${c.why}`, bad: !c.ok },
      { label: "Processor", text: `${g.threads || "?"} threads; memory ${g.memoryGB ? g.memoryGB + " GB as the browser reports it (rough)" : "not reported"}; ${g.mobile ? "a phone or tablet" : g.onBattery ? "a computer on battery" : "a computer"}` },
      { label: "Model voices", text: g.wasm.ok ? "can run here (WebAssembly SIMD with shared memory)" : `cannot run here: WebAssembly ${g.wasm.simd ? "" : "SIMD "}${!g.wasm.simd && !g.wasm.shared ? "and " : ""}${g.wasm.shared ? "" : "shared memory "}missing`, bad: !g.wasm.ok },
      { label: "Background play", text: g.mediaSource ? "yes (one MP3 stream)" : "no MP3 stream here: each piece plays as its own clip", bad: !g.mediaSource },
      { label: "Storage", text: s ? `${MB(Math.max(0, s.quota - s.usage))} free of ${MB(s.quota)}; ${s.persisted ? "kept even when space runs short" : "kept unless the device runs very short of space"}` : "the browser does not say", bad: !!(s && s.quota - s.usage < 4e8) },
      { label: "Browser voices", text: v.supported ? (v.total ? `${v.total} (${v.local} on the device, ${v.enLocal} English there)` : "none listed yet") : "no speech synthesis", bad: !v.supported },
      { label: "Word-lag timing", text: g.elementTiming ? "yes (Element Timing)" : "no (the word-lag line is left out)" },
    ];
  }

  globalThis.DEVICE = { gates, lines, voices, wasm };
})();
</script>
<script>
// rules.js: the benchmark's rules, pure (no page, no device: test/rules.mjs runs this file in Node).
// RULES.predict(input) turns the light benchmark's scores into a prediction for every voice setup, in
// the PLAN.md voice order (best-sounding first), each marked "runs well" / "barely" / "too slow" /
// "can't run here" with a one-line why; RULES.suggest(list, input) picks the setup to suggest: the
// best-sounding engine with a setup above real time (1.05× after the warm factor, so the Pixel's
// predicted 1.4× card counts: Jon would rather have the card's voice than the highlight), given its
// fastest setup (the spare speed pays for re-rolls), else the browser's voices. The word highlight is
// not part of the suggestion (Off by default since 2026-10-20). Sources, x = times real time:
//   - Processor voices, one copy: x = k × cpu.f32 / 1000 (ANALYSIS-2026-10-13 3.2): Piper low 0.435,
//     medium 0.309, Supertonic 30 steps 0.051; margin = the line's worst over-prediction (3.4).
//   - Kokoro q8 on the processor, all copies: x = 0.0196 × all-core / 1000 (REPORT 2026-10-16, the
//     Simple Bench all-core score; over-predicted the RedMagic by 24 %, so that is the margin).
//   - Kokoro fp32 on the card: 1/x = 0.2125 + 104.2 / alu, fitted on the three cards measured
//     (PC alu 749 → 3.16×, RedMagic 279, Pixel 203 → 1.5×); a fixed cost per chunk plus the card's part,
//     like Supertonic's line. EFF-11 (2026-10-20): the RedMagic's speed is now Jon's real in-reader log,
//     1.7× over 7.5 minutes (fp32, the current engine, chunks of 120 then 40 characters; 2-3× in the
//     first minute, about 1.5× after), not the 1.47× of the device tests; the line already gives it
//     1.71×, so a and b stay (errors −10 / +0.4 / −8 %). The margin, 13 %, is that log's sag from its
//     1.7× average to the ~1.5× it held once warm (1.7 / 1.5), larger than any device's
//     over-prediction; it keeps both phones "barely" (the RedMagic 1.2× after it and the warm factor,
//     1.4× warm), as Jon's log reads: it keeps up with little to spare. fp16 and 8-bit on a card were never
//     measured: rough guesses (×1.6, ×0.5), never suggested (fp16 broke on the Pixel, BUGS 28; 8-bit is
//     garbled on the GTX 1050 Ti). A phone's alu reading can be high (the RedMagic read 536 in Simple
//     Bench on 2026-10-16, 279 in the Studio): the full benchmark measures the real speed.
//   - Supertonic on the card: 1/x = 0.039 + 4.13 × steps / alu (3.3); steps from 30 to 100.
//   - Warm factor 0.8 for phones, tablets and laptops on battery, 1.0 for a computer on mains (3.4).
// "Runs well" = 1.3× after the margin and the warm factor; "barely" = keeps up (1.0×) with the warm

  // The setups, in the voice order. card: needs the graphics card; f16: needs shader-f16; guess: never measured.
  const SETUPS = [
    { id: "kokoro-gpu-fp32", engine: "kokoro", runOn: "gpu", precision: "fp32", label: "Kokoro on the graphics card, fp32", card: true, margin: KOKORO_CARD.margin, suggest: true, timing: true },
    { id: "kokoro-gpu-fp16", engine: "kokoro", runOn: "gpu", precision: "fp16", label: "Kokoro on the graphics card, fp16", card: true, f16: true, margin: 0.3, guess: 1.6, of: "kokoro-gpu-fp32", note: "faster where it works; some cards give broken sound (the Pixel did)" },
    { id: "kokoro-gpu-q8", engine: "kokoro", runOn: "gpu", precision: "q8", label: "Kokoro on the graphics card, 8-bit", card: true, margin: 0.3, guess: 0.5, of: "kokoro-gpu-fp32", note: "slow on a card, and garbled on the GTX 1050 Ti" },
    { id: "kokoro-cpu-q8", engine: "kokoro", runOn: "cpu", precision: "q8", label: "Kokoro on the processor, 8-bit", margin: 0.25, suggest: true, timing: true, copies: true },
    { id: "piper-low", engine: "piper", runOn: "cpu", voice: "en_US-amy-low", label: "Piper Amy (low) on the processor", k: 0.435, margin: 0.18, suggest: true },
    { id: "piper-medium", engine: "piper", runOn: "cpu", voice: "en_US-lessac-medium", label: "Piper Lessac (medium) on the processor", k: 0.309, margin: 0.11, suggest: true },
    { id: "supertonic-gpu", engine: "supertonic", runOn: "gpu", voice: "M3", label: "Supertonic M3 on the graphics card", card: true, margin: ST_CARD.margin, suggest: true },

        ? `${lead}This is its fastest setup here: ${speed} real time.`

    // a choice in Settings → Word highlight turns it on. (BUGS 31's rule, Off under 2.5× on a card, is

  function statusOf(list, value) {

<script>
// bench.js: the benchmarks (PLAN.md "First run"). Nothing here runs at page open except one
// localStorage read (a memory check that crashed, below).
// LIGHT (about 10 s, nothing downloaded, the page stays usable: the processor work is in workers, the
// card's is asynchronous): the gates (device.js); the processor, one core (the Studio's cpu.f32: the
// same WebAssembly SIMD kernel module as Simple Bench, so the scores match the rules' data: a batch
// sized to 20 ms, a warm-up of up to 1 s, five 400 ms windows, the median, in MMAC/s); all cores (one
// worker per thread, each warmed, all starting at one moment; three 400 ms windows, the median of the
// totals); the graphics card (the Studio's gpu.alu kernel: f32 multiply-adds, after a tiny exact check
// and 1 s of card work to wake it; three 250 ms windows, the median, in G FMA/s); the working-memory
// ceiling; then the rules (rules.js) make the predictions and the suggestion. The result is stored in
// localStorage br1-device: { version, when, gates, scores, ceiling, input, predictions, suggestion,
// measured, full, choice } (Settings → Debug and the Voice tab read it).
// MEMORY CEILING (crash-safe, PLAN.md): a worker grows one WebAssembly.Memory 64 MB at a time up to
// 4 GB, touching every page so the system really gives it; BEFORE each step the page writes
// br1-memory-probe = { reached, next }. Refused or the worker killed: the ceiling is the last step
// reached. If the page itself crashes mid-step, the next start finds br1-memory-probe still there,
// takes `reached` as the ceiling (`crashed: true`: models.js's fit check only warns on it) and logs it;
// a page closed, reloaded or hidden mid-check is marked `away` in the record and gives no ceiling at
// all (the check runs again: bug fixes B, D2). The ceiling goes to br1-memory-ceiling = { mb, when }
// (models.js's fit check reads it). Run only from a benchmark the user started.

// processor's copies all at once) and the workers' memory, stores them in `measured`, and the rules

(function () {
