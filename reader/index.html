.sseg button.off { opacity: 0.6; border-style: dashed; }   /* can't run here, still selectable */
.ssegwrap { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.srow.block .ssegwrap { align-items: flex-start; }
@container (max-width: 480px) { .ssegwrap { align-items: flex-start; } }
.sopts { display: flex; flex-direction: column; gap: 6px; }
.sopt {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1px 10px; align-items: start;
  min-height: var(--tap); padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
  cursor: pointer;
}
.sopt input { width: 1.15em; height: 1.15em; margin: 0.15em 0 0; accent-color: var(--accent); }
.sopt .olab { font-weight: 500; }
.sopt .ohelp, .sopt .swhy { grid-column: 2; }
.sopt .ohelp { color: var(--muted); font-size: 0.86em; line-height: 1.35; }
.sopt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
.sopt.off { opacity: 0.6; cursor: pointer; }   /* can't run here, still selectable with its reason */
.sopt.off.on { opacity: 1; }
.sctl select {
  max-width: 100%; min-height: var(--tap); padding: 0 0.5em;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
}
.snum { width: 6em; min-height: var(--tap); padding: 0 0.5em; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); text-align: center; }

/* The two editors */
.spairs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 6px 8px; align-items: center; }
.spairs .ph { color: var(--muted); font-size: 0.86em; }
.spairs .pr { display: contents; }
.spairs input { min-width: 0; min-height: var(--tap); padding: 0 0.5em; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.spairs .del { min-width: var(--tap); min-height: var(--tap); padding: 0; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
.spairs .del:hover { border-color: var(--line); color: var(--fg); }
.slists { display: flex; flex-direction: column; gap: 8px; }
.slists summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.slists .slist { display: flex; flex-direction: column; gap: 4px; }
.slists textarea {
  width: 100%; padding: 0.4em 0.6em;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg);
  font: 0.82em/1.4 ui-monospace, Consolas, monospace; resize: vertical; white-space: pre; overflow-wrap: normal; overflow-x: auto;
}

/* Progress (files being taken, downloaded or written) under the message line */
.sprog { height: 4px; margin: 0 12px 6px; border-radius: 2px; background: var(--line); overflow: hidden; }
.sprog > div { height: 100%; width: 0; background: var(--accent); transition: width 0.15s; }

/* The Voice data tab (datatab.js) */
.sfit, .simp, .sexp, .sstored { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sline { line-height: 1.4; font-size: 0.92em; overflow-wrap: anywhere; }
.sline.bad { color: var(--err); font-weight: 600; }
.sbtn.hot { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
.sbtn:disabled { opacity: 0.5; cursor: default; }
.sfit > .sbtn, .simp > .sbtn, .sexp .sfit > .sbtn { align-self: flex-start; }
.sbtnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.stick { display: flex; align-items: center; gap: 10px; min-height: var(--tap); cursor: pointer; line-height: 1.35; font-size: 0.92em; }
.stick input { flex: none; width: 1.25em; height: 1.25em; margin: 0; accent-color: var(--accent); }
.sticks { display: flex; flex-direction: column; gap: 4px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; }
.sown { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.sownrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 5px 6px 5px 10px; border-top: 1px solid var(--line); }
.sownrow:first-child { border-top: 0; }
.soname { overflow-wrap: anywhere; }
.sosize { color: var(--muted); font-size: 0.86em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sdel { min-height: var(--tap); padding: 0 0.8em; }
.sall summary, .sdet summary, .slists summary { min-height: var(--tap); display: flex; align-items: center; }
.sall summary::before, .sdet summary::before, .slists summary::before { content: "\25B8"; margin-right: 0.4em; }
.sall[open] summary::before, .sdet[open] summary::before, .slists[open] summary::before { content: "\25BE"; }
.sall summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.stable { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 2px 10px; margin-top: 6px; font-size: 0.86em; }
.sth { min-height: calc(0.8 * var(--tap)); padding: 2px 0; border: 0; background: none; color: var(--muted); text-align: left; cursor: pointer; font-weight: 600; }
.sth.on { color: var(--fg); }
.sth:last-of-type, .sts { text-align: right; }
.stn, .sto { overflow-wrap: anywhere; }
.sto { color: var(--muted); }
.sts { font-variant-numeric: tabular-nums; white-space: nowrap; }
.spersist { padding: 0; font-size: 0.86em; }
.spersist:empty { display: none; }

/* Device marks (bench.js, step 7): the Voice tab's "runs well / barely / too slow on this device",
   and the first-run window (firstrun.js) in this window's look: its own close hidden (Skip closes),
   the suggestion, every setup with a status chip and its why. */
:root { --ok: light-dark(#2f7d45, #7fcf95); --warn: light-dark(#8a5a00, #e6c25c); }
.sdev { margin-top: 3px; color: var(--muted); font-size: 0.86em; line-height: 1.35; }
.sdev.ok { color: var(--ok); }
.sdev.barely { color: var(--warn); }
.sdev.slow { color: var(--err); }
.sopt .sdev { grid-column: 2; }
.float[data-name="firstrun"] .float-close { display: none; }
/* The first-run window's buttons: a 2×2 grid when the four would wrap (a phone). */
@container (max-width: 480px) {
  .frun .sbtns { display: grid; grid-template-columns: 1fr 1fr; }
  .frun .sbtns .exit { margin-left: 0; min-width: 0; }
}
/* The suggestion: the setup's name large, its status as a chip beside it. */
.spick { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 2px 0 2px; font-weight: 600; font-size: 1.15em; line-height: 1.3; }
.spick .spickname { overflow-wrap: anywhere; }
.spick .schip { font-size: 0.7em; }
.sline b { font-weight: 600; }
/* Numbers and the technical list, folded (both windows). */
.sdet { margin-top: 2px; }
.sdet summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 0.9em; }
.sdet > .sfit { margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--line); }
.sdet .sline { color: var(--muted); font-size: 0.86em; }
.sdet .sline.bad { color: var(--err); }
.sdevlist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.sdevrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 2px 10px; align-items: center; padding: 7px 10px; border-top: 1px solid var(--line); }
.sdevrow:first-child { border-top: 0; }
.sdevrow.pick { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.sdevname { overflow-wrap: anywhere; font-weight: 500; }
.sdevx { color: var(--muted); font-size: 0.86em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sdevx:empty { display: none; }
.sdevrow .why { grid-column: 1 / -1; color: var(--muted); font-size: 0.82em; line-height: 1.35; overflow-wrap: anywhere; }
.schip { padding: 1px 8px; border-radius: 999px; font-size: 0.82em; font-weight: 600; white-space: nowrap; }
.schip.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); }
.schip.barely { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
.schip.slow { color: var(--err); background: color-mix(in srgb, var(--err) 13%, transparent); }
.schip.cant { color: var(--muted); background: color-mix(in srgb, var(--muted) 15%, transparent); }

/* The Storage tab (storagetab.js): a group's summary, its items by size (a "show" fold for a setting's
   JSON), its Delete; the same list look as the Voice data tab's stored files. */
.sstor { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sstor > .sdel { align-self: flex-start; }
.sitem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 5px 10px; border-top: 1px solid var(--line); }
.sitem:first-child { border-top: 0; }
.sitem .sshow { grid-column: 1 / -1; margin-top: 0; }
.sjson {
  margin: 4px 0 0; padding: 0.4em 0.6em; max-height: 16em; overflow: auto;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg);
  font: 0.8em/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
}

/* The Listener tab and the Voice tab (step 8a): what runs where, and the contention warning (allowed, so amber, not red). */
.swhere { font-size: 0.92em; line-height: 1.4; }
.swarn.scontend { color: var(--warn); font-weight: 500; line-height: 1.35; }

/* The Offline package tab (packtab.js): the tree */
.spkg { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ptree { max-height: 24em; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; outline: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.ptree:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
.prow { display: grid; grid-template-columns: 1.1em 1.25em minmax(0, 1fr) auto; grid-template-areas: "tw box lab size" "tw box here here"; column-gap: 8px; align-items: center;
  min-height: var(--tap); padding: 3px 8px; border-top: 1px solid var(--line); cursor: pointer; font-size: 0.92em; }
.prow:first-child { border-top: 0; }
.prow.sel { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.prow.focus { box-shadow: inset 2px 0 0 var(--accent); }
.prow.anchor { outline: 2px dashed var(--accent); outline-offset: -2px; }
.ptw { grid-area: tw; color: var(--muted); text-align: center; }
.pbox { grid-area: box; width: 1.1em; height: 1.1em; border: 2px solid var(--muted); border-radius: 3px; position: relative; }
.pbox.true { background: var(--accent); border-color: var(--accent); }
.pbox.true::after { content: ""; position: absolute; left: 0.28em; top: 0.05em; width: 0.3em; height: 0.6em; border: solid var(--bg); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.pbox.mixed { border-color: var(--accent); }
.pbox.mixed::after { content: ""; position: absolute; left: 0.15em; right: 0.15em; top: calc(50% - 1px); height: 2px; background: var(--accent); }
.plab { grid-area: lab; overflow-wrap: anywhere; }
.psize { grid-area: size; color: var(--muted); font-size: 0.9em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.phere { grid-area: here; color: var(--muted); font-size: 0.82em; }
.phere.yes { color: var(--accent); }
.ptotal { font-weight: 600; }
/* Settings → Cloud (cloudtab.js) */
.cloudstat { display: flex; flex-direction: column; gap: 0.2em; padding: 0.4em 0.6em; border: 1px solid var(--line); border-radius: 8px; background: var(--bar); }
.stext { width: 100%; min-width: 0; min-height: var(--tap); padding: 0 0.6em; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: inherit; box-sizing: border-box; }
.sstack { display: flex; flex-direction: column; gap: 8px; width: 100%; }
</style>

</head>
<body>
<header class="top" id="top">

  <div class="ctop">

    <input type="search" id="csearch" placeholder="Search sections, chapters, headings" aria-label="Search the contents" autocomplete="off">
  </div>
  <div class="chead" id="chead">Contents</div>

  <button id="playbtn" type="button" title="Play (Space)" aria-label="Play">▶</button>

  <div class="stbox" id="stbox" role="button" tabindex="0" title="Tap for the full status" aria-label="Status (tap for the full status)">
    <div class="status" id="status" aria-live="polite"></div>
    <div class="st2"><span class="ready idle" id="ready"><span id="readynum">ready 0 s</span><span class="rbar"><span id="readybar"></span></span></span><span class="vspeed" id="vspeed" hidden></span><span class="work" id="work"></span></div>
  </div>
  <button id="lock" class="lock" type="button" aria-pressed="true" title="Locked: the screen follows the reading">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10" rx="2"/>
      <path class="closed-shackle" d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/><path class="open-shackle" d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0"/></svg>
  </button>
</footer>
<span id="present" class="present" aria-hidden="true"></span>
<audio id="audio" preload="auto"></audio>
<script>
// log.js: the crash-safe log. log(type, message, data?) keeps every line in memory and in the console
// and writes it to IndexedDB in small batches: a batch is whatever arrived while the last one was being
// written, so a crash loses at most the batch in flight (measured 2026-10-16: a page left within
// ~100 ms of starting can lose its first batch; after that, nothing). window.LOG is what the Debug
// tab will use later (viewer, Save / Copy, past logs); window.log is the function every file calls.
// Times as Jon reads them are 12-hour with AM/PM, never 24-hour (his rule, 2026-10-17): LOG.clock(d)
// is the line time "5:24:36.884 PM" (milliseconds kept, no leading zero on the hour), LOG.when(d) a
// date with a time, "2026-10-17 5:24 PM"; every file that shows a time uses one of these.
(function () {
  const g = globalThis;
  const TYPES = ["app", "settings", "book", "voice", "listener", "pieces", "playback", "timing", "memory",
    "storage", "download", "worker", "text", "page", "media", "device", "error"];
  const DB_NAME = (g.APP_KEY || "br1") + "-logs";
  const KEEP_VISITS = 30;      // past visits kept in the database; the oldest go first
  const MEMORY_MAX = 20000;    // lines kept in memory for the viewer; older ones drop off
  const LINE_MAX = 4000;       // characters per line

  const version = g.APP_VERSION || "unknown version";
  const visit = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), started: Date.now(), last: 0, lines: 0, version };
  const lines = [];            // { t, type, msg }, oldest first
  const watchers = [];         // fn(line): the viewer and the Debug button, later
  let waiting = [];            // database records not yet written: { v: visit id, n: line number, s: text }
  let store = null, state = "opening", writing = false, retried = false;

  const pad = (n, w) => String(n).padStart(w, "0");
  const asDate = (d) => (d instanceof Date ? d : new Date(d));
  const hour12 = (d) => `${d.getHours() % 12 || 12}:${pad(d.getMinutes(), 2)}`;
  const ampm = (d) => (d.getHours() < 12 ? "AM" : "PM");
  const clock = (d) => { d = asDate(d); return `${hour12(d)}:${pad(d.getSeconds(), 2)}.${pad(d.getMilliseconds(), 3)} ${ampm(d)}`; };
  const date = (d) => { d = asDate(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1, 2)}-${pad(d.getDate(), 2)}`; };
  const when = (d) => { d = asDate(d); return `${date(d)} ${hour12(d)} ${ampm(d)}`; };
  const stamp = clock;
  const text = (line) => `${line.t} ${line.type.padEnd(8)} ${line.msg}`;

  // The data argument as text: an error as "Name: message" plus a few stack frames, the rest as JSON.
  function fmt(x) {
    if (x === undefined) return "";
    if (typeof x === "string") return x;
    if (x && typeof x === "object" && typeof x.message === "string" && typeof x.name === "string") {
      const frames = typeof x.stack === "string" ? x.stack.split("\n").filter((l) => l.trim() && !l.includes(x.message)).slice(0, 3) : [];
      return `${x.name}: ${x.message}` + frames.map((f) => "\n    " + f.trim()).join("");
    }
    try { return JSON.stringify(x); } catch (e) { return String(x); }
  }

  function log(type, message, data) {
    if (!TYPES.includes(type)) { message = `unknown log type "${type}": ${message}`; type = "error"; }
    const d = new Date();
    let msg = String(message);
    if (data !== undefined) msg += " " + fmt(data);
    if (msg.length > LINE_MAX) msg = msg.slice(0, LINE_MAX) + " ...";
    const line = { t: stamp(d), type, msg };
    lines.push(line);
    if (lines.length > MEMORY_MAX) lines.shift();
    if (type === "error") console.error(text(line)); else console.log(text(line));
    visit.last = d.getTime();
    if (state === "opening" || state === "kept") waiting.push({ v: visit.id, n: visit.lines, s: text(line) });
    visit.lines++;
    flush();
    for (const fn of watchers) { try { fn(line); } catch (e) { console.error("log watcher failed: " + e); } }
    return line;
  }

  // One write at a time; the next batch is everything that arrived while this one was on its way.
  function flush() {
    if (state !== "kept" || writing || !waiting.length) return;
    writing = true;
    const batch = waiting;
    waiting = [];
    store.write(Object.assign({}, visit), batch).then(
      () => { writing = false; retried = false; flush(); wake(); },
      (e) => { writing = false; fail(e, batch); wake(); });
  }

  // flushed(ms): a promise that settles once every line logged so far is in the database (true), or
  // the log is not being saved / the store gave no answer in ms (false). Never rejects.
  let flushWaiters = [];
  function wake() {
    if (!flushWaiters.length) return;
    const kept = state === "kept";
    if ((kept && (writing || waiting.length)) || state === "opening") return;
    const ws = flushWaiters;
    flushWaiters = [];
    for (const w of ws) { clearTimeout(w.t); w.res(kept); }
  }
  function flushed(ms = 3000) {
    if (state !== "kept" && state !== "opening") return Promise.resolve(false);
    if (state === "kept" && !writing && !waiting.length) return Promise.resolve(true);
    return new Promise((res) => {
      const w = { res, t: 0 };
      w.t = setTimeout(() => { flushWaiters = flushWaiters.filter((x) => x !== w); res(false); }, ms);
      flushWaiters.push(w);
      flush();
    });
  }

  // ---- Self-test steps (the benchmark and every other check the reader runs on itself) -------------
  // step(what, detail) logs "starting: what, detail", marks it in localStorage br1-step (synchronous,
  // so it survives a crash) and FLUSHES the log before it returns: await it before the step runs, and
  // after a crash the stored log's last line says what was being attempted. stepDone(what, result)
  // logs "done: what (result)" and clears the mark. At the next start a mark still there means the
  // last run stopped during that step: logged once, kept in br1-step-stopped (LOG.lastStopped) for
  // Settings → Debug → This device. pagehide marks a step left by a close or reload (not a crash).
  const LS = (() => { try { return typeof localStorage !== "undefined" ? localStorage : null; } catch (e) { return null; } })();
  const STEP_KEY = (g.APP_KEY || "br1") + "-step", STOPPED_KEY = (g.APP_KEY || "br1") + "-step-stopped";
  let stepNow = null;
  const lsGet = (k) => { try { return LS ? JSON.parse(LS.getItem(k)) : null; } catch (e) { return null; } };
  const lsSet = (k, v) => { try { if (LS) { if (v === null) LS.removeItem(k); else LS.setItem(k, JSON.stringify(v)); } } catch (e) {} };
  async function step(what, detail, type = "device") {
    stepNow = { what: detail ? `${what}, ${detail}` : what, at: Date.now(), version, away: "" };
    lsSet(STEP_KEY, stepNow);
    log(type, `starting: ${stepNow.what}`);
    await flushed();
  }
  function stepDone(what, result, type = "device") {
    log(type, `done: ${what}${result ? ` (${result})` : ""}`);
    stepNow = null;
    lsSet(STEP_KEY, null);
  }

  // Out of room: let the old visits go and try once more. Anything else ends the saving for this
  // visit; the log goes on in memory and state() says why.
  function fail(e, batch) {
    if (batch && !retried && e && e.name === "QuotaExceededError" && store && store.prune) {
      retried = true;
      waiting = batch.concat(waiting);
      store.prune(2, visit.id).then(flush, (x) => fail(x));
      return;
    }
    state = "not saved: " + ((e && e.name) || "Error") + ": " + String((e && e.message) || e).slice(0, 200);
    waiting = [];
    try { if (store && store.close) store.close(); } catch (x) {}
    store = null;
    console.error("log " + state);
  }

  // A store is { open(), write(visit, records), visits(), read(id) -> [text], prune(keep, currentId),
  // close() }, each returning a promise. The page uses IndexedDB; the tests attach a fake to watch
  // the batches.
  function attach(s) {
    store = s; state = "opening"; writing = false; retried = false;
    s.open().then(
      () => { state = "kept"; flush(); wake(); if (s.prune) s.prune(KEEP_VISITS, visit.id).catch(() => {}); },
      (e) => { fail(e); wake(); });
  }

  function idbStore() {
    let db = null;
    const tx = (mode, fn) => new Promise((res, rej) => {
      if (!db) return rej(new Error("the log database is closed"));
      let t;
      try { t = db.transaction(["visits", "lines"], mode); } catch (e) { return rej(e); }
      const req = fn(t.objectStore("visits"), t.objectStore("lines"));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onabort = () => rej(t.error || new Error("transaction aborted"));
    });
    return {
      open: () => new Promise((res, rej) => {
        let r;
        try { r = indexedDB.open(DB_NAME, 1); } catch (e) { return rej(e); }
        r.onupgradeneeded = () => {
          r.result.createObjectStore("visits", { keyPath: "id" });
          r.result.createObjectStore("lines", { keyPath: ["v", "n"] });
        };
        r.onerror = () => rej(r.error);
        r.onsuccess = () => {
          db = r.result;
          db.onversionchange = () => { db.close(); db = null; };
          res();
        };
      }),
      write: (v, records) => tx("readwrite", (V, L) => { for (const r of records) L.put(r); V.put(v); }),
      visits: () => tx("readonly", (V) => V.getAll()),
      read: (id) => tx("readonly", (V, L) => L.getAll(IDBKeyRange.bound([id, 0], [id, Infinity]))).then((rs) => rs.map((r) => r.s)),
      prune: (keep, current) => tx("readwrite", (V, L) => {
        const q = V.getAll();
        q.onsuccess = () => {
          for (const s of q.result.filter((x) => x.id !== current).sort((a, b) => b.last - a.last).slice(keep)) {
            V.delete(s.id);
            L.delete(IDBKeyRange.bound([s.id, 0], [s.id, Infinity]));
          }
        };
      }),
      close: () => { if (db) db.close(); db = null; },
    };
  }

  g.LOG = {
    TYPES, visit, lines, clock, when, date, flushed, step, stepDone, STEP_KEY, STOPPED_KEY,
    get stepNow() { return stepNow; },
    get lastStopped() { return lsGet(STOPPED_KEY); },  // { what, at, version, away, noticed } or null
    state: () => state,                               // "opening", "kept" or "not saved: why"
    text: () => lines.map(text).join("\n"),           // this visit, from memory
    watch: (fn) => { watchers.push(fn); },
    attach,
    visits: () => (store ? store.visits().catch(() => []) : Promise.resolve([])),     // stored visits: { id, started, last, lines, version }
    read: (id) => (store ? store.read(id).then((rows) => rows.join("\n")).catch(() => "") : Promise.resolve("")),
    clear: () => (store ? store.prune(0, visit.id) : Promise.resolve()),            // past visits go; this one stays
    // Settings → Storage → Delete all storage: let go of the log database so it can be deleted; the log
    // goes on in memory until the page reloads.
    close: () => { waiting = []; try { if (store && store.close) store.close(); } catch (x) {} store = null; state = "not saved: the stored data was deleted (the page reloads)"; },
  };
  g.log = log;

  if (typeof window !== "undefined") {
    window.addEventListener("error", (e) => log("error", "page error" + (e.lineno ? ` (line ${e.lineno})` : ""), e.error || e.message));
    window.addEventListener("unhandledrejection", (e) => log("error", "unhandled promise", e.reason));
  }
  log("app", `${version}${g.APP_BUILT ? ` (built ${g.APP_BUILT})` : ""} · ${date(new Date())}`);
  // A step mark left by the last visit: that run stopped during it.
  const left = lsGet(STEP_KEY);
  if (left && left.what) {
    lsSet(STEP_KEY, null);
    const rec = Object.assign({}, left, { noticed: Date.now() });
    lsSet(STOPPED_KEY, rec);
    log("device", `the last run stopped during: ${left.what} (started ${left.at ? when(left.at) : "at an unknown time"}${left.version ? ` with ${left.version}` : ""}; ${left.away ? `the page was ${left.away}` : "the page ended without closing normally: a crash, or the system closed it"})`);
  }
  if (typeof window !== "undefined" && window.addEventListener) {
    window.addEventListener("pagehide", () => { if (stepNow && !stepNow.away) { stepNow.away = "closed or reloaded"; lsSet(STEP_KEY, stepNow); } });
  }
  if (typeof indexedDB === "undefined") { state = "not saved: no IndexedDB"; waiting = []; } else attach(idbStore());
})();
</script>
<script>
// settings.js: the settings store. One default per setting in SETTINGS.md (values only, no UI), kept as
// one JSON record in localStorage under the v1 key, holding ONLY the values that differ from the
// defaults. SETTINGS.get(name) gives the stored value or the default; SETTINGS.set(name, value) saves
// one (a log line per change); SETTINGS.update({ name: value, ... }) saves several at once with ONE
// log line listing what changed (the Settings window's Save, settingswin.js). Neither changes anything
// else: the window applies what it saved. A value of the wrong type falls back to the default, so a
// bad record can never break the page (SETTINGS.valid: null only for a null-default setting, numbers
// finite). update() throws when the browser refuses the write, with the record put back.
(function () {
  const g = globalThis;
  const KEY = (g.APP_KEY || "br1") + "-settings";

  const DEFAULTS = {
    // Reading group: Book
    skipWatermarks: true,
    watermarkRules: null,          // null = the built-in lists (step 3 defines them); else the edited lists
    // Reading
    speed: 1,                      // playback speed, 1 = real time
    volume: 1,                     // 0..1 (shown as a percentage)
    readTitle: true,               // say the chapter title first
    continueChapters: true,        // keep reading into the next chapter
    theme: "light",                // "light" or "dark"
    textSize: 100,                 // the book text, % of normal (20 px); 50..250
    uiSize: 100,                   // bars, buttons, menus, windows' content, % of normal (16 px); 50..250 (a floating window keeps its size and place)
    // Text (what the voice is given)
    spelling: [["qi", "chee"], ["-", " "], ["—", " "], ["–", " "], [",", " , "]],   // [word, how to say it]; dashes become a space, a comma gets room
    capsAsWords: true,             // "YOU DID WHAT" said normally; VIP, OK, Roman numerals, "9 AM" kept
    numbersToWords: false,         // 2080 -> "two thousand and eighty"; off by default, the benchmark turns it on for Supertonic (Jon, 2026-10-23)
    joinShort: true,               // a piece of five words or fewer joins its neighbour
    // Cloud (Jon's PC through PC Relay: cloud.js, pcfiles.js, engines/cloud.js)
    useMyPC: false,                // Use my PC for the voice: the chosen voice is made on the PC (engines/cloud.js); Apply
    pcAddress: "",                 // the relay's address; "" = Jon's PC (https://desktop-krq9ti2.tail46434.ts.net)
    // Sound group: Voice
    voice: "kokoro:af_heart",      // "engine:voice"
    runOn: "gpu",                  // "gpu" or "cpu": the card and its speed first (Jon, 2026-10-17); a device without WebGPU fails at Play with the reason (no fallbacks)
    kokoroEngine: "current",       // Kokoro only: "current" = kokoro-js 1.2.1 on Transformers.js 3.5.1 / ONNX Runtime 1.21; "newer" (experimental) = Transformers.js 4.3.1 / ONNX Runtime 1.31 native WebGPU (research/gpu-experiments)
    precision: "fp32",             // Kokoro only; fp32 on every card (fp16 gave broken sound on the Pixel's Adreno: BUGS 28)
    brokenPrecisions: [],          // "kokoro gpu fp16"...: precisions that gave broken sound (NaN, all zero) on this device: information for the Settings window only (greyed with the reason); the reading itself fails with the reason (BUGS 29)
    pace: 1,                       // Kokoro and Piper: the model's own speaking speed
    steps: null,                   // Supertonic only; null = from the benchmark
    copies: null,                  // processor voices; null = from the benchmark
    speaker: 0,                    // Piper's voices with several speakers only (libritts, vctk...); ignored by the rest
    burst: true,                   // make sound in bursts (5 min ahead, then rest until 2 min are left): a smoother word highlight with a card voice
    // Word highlight
    wordTiming: "off",             // "model" (Kokoro), "listener", "estimate", "off"; Off by default (Jon, 2026-10-20: nothing turns it on by itself, the benchmark included)
    // Listener
    listenerOn: false,             // off by default (Jon, 2026-10-20); on only when chosen
    listener: "whisper-base:gpu",  // "whisper-base:gpu" (most accurate), "parakeet:gpu" (fast), "moonshine-tiny:cpu" (phones): listener.js
    listenMode: null,              // "play" = check while it plays (marks only), "before" = check before reading (each chunk waits for its check and re-rolls); null = "before" for Supertonic, else "play"
    reroll: true,                  // Supertonic only: a chunk with a missing or an added word is made again with a new seed (at most 3 takes, only with spare speed)
    // Voice data
    offline: false,
    slim: false,                   // delete the old model's files when switching
    // System group: Background
    backgroundPlay: true,
    keepAlive: true,
    keepAliveIdle: false,          // the tone also while stopped or paused
    holdOnScroll: false,           // experimental: no new chunk until 10 s after the last touch or scroll (never with 30 s or less of sound buffered)
    screenAwake: true,
    // Debug
    debugView: false,              // the Debug view window: the listener's findings, errors and issues as they are found (debugview.js)
    detailedMarks: true,           // ON by default since 2026-10-25 (Jon: switched on once for existing settings, then his choice is kept; no migration needed: the store keeps only values that differ from the defaults). The left-edge marks: false = one short dash per paragraph (green = its sound is ready, blue = being read); true = the diagnostic view (chunk segments, the Play-start line, the listener's issue marks)
    logTypesOff: [],               // unticked log types; everything else shows
  };

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      const v = raw ? JSON.parse(raw) : {};
      return v && typeof v === "object" && !Array.isArray(v) ? v : {};
    } catch (e) { return {}; }
  }
  let stored = load();

  // The kind each null-default setting takes when it is not null (null = automatic / built-in).
  const strings = (a) => Array.isArray(a) && a.every((x) => typeof x === "string");
  const NULL_KINDS = {
    watermarkRules: (v) => !!v && typeof v === "object" && !Array.isArray(v) && Object.values(v).every(strings),
    steps: (v) => typeof v === "number" && Number.isFinite(v),
    copies: (v) => typeof v === "number" && Number.isFinite(v),
    listenMode: (v) => v === "play" || v === "before",
  };
  // A value this setting can hold: null only where the default is null (D7), numbers finite, else the
  // default's kind (an array for an array).
  function valid(name, v) {
    const d = DEFAULTS[name];
    if (v === undefined || !(name in DEFAULTS)) return false;
    if (v === null) return d === null;
    if (d === null) return NULL_KINDS[name] ? NULL_KINDS[name](v) : true;
    if (typeof d === "number") return typeof v === "number" && Number.isFinite(v);
    return Array.isArray(d) ? Array.isArray(v) : typeof v === typeof d;
  }

  function get(name) {
    if (!(name in DEFAULTS)) throw new Error(`no setting named "${name}"`);
    const v = stored[name];
    return valid(name, v) ? v : DEFAULTS[name];
  }

  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const short = (v) => { const s = JSON.stringify(v); return s.length > 60 ? s.slice(0, 57) + "..." : s; };
  // Put one value in the record (a default is left out), without writing or logging.
  function put(name, value) {
    if (!(name in DEFAULTS)) throw new Error(`no setting named "${name}"`);
    if (!valid(name, value)) throw new Error(`setting "${name}" takes ${DEFAULTS[name] === null ? "null or " : ""}a ${Array.isArray(DEFAULTS[name]) ? "list" : DEFAULTS[name] === null ? "value of its kind" : typeof DEFAULTS[name]}, not ${JSON.stringify(value)}`);
    if (same(value, DEFAULTS[name])) delete stored[name]; else stored[name] = value;
  }
  // Gives "" when written, else the reason (logged).
  function write() {
    try { localStorage.setItem(KEY, JSON.stringify(stored)); return ""; }
    catch (e) { if (typeof log === "function") log("error", `settings not saved: ${e.message}`); return e.message || String(e); }
  }

  function set(name, value) {
    const before = get(name);
    put(name, value);
    write();
    if (typeof log === "function" && !same(before, value)) log("settings", `${name}: ${short(before)} -> ${short(value)}`);
  }
  // Several at once (the Settings window's Save): one write, one log line; gives the names that changed.
  // A write the browser refuses (a full localStorage) THROWS with the reason and puts the record back
  // as it was, so nothing says "Saved" for values that would be gone after a reload (D6).
  // opts.quiet: no log line (a live slider while it is dragged; the window logs the drag once at release).
  function update(changes, opts = {}) {
    const changed = [], lines = [], was = JSON.parse(JSON.stringify(stored));
    try {
      for (const [name, value] of Object.entries(changes || {})) {
        const before = get(name);
        put(name, value);
        if (!same(before, value)) { changed.push(name); lines.push(`${name} ${short(before)} -> ${short(value)}`); }
      }
    } catch (e) { stored = was; throw e; }
    if (changed.length) {
      const why = write();
      if (why) { stored = was; throw new Error(`this browser's storage refused the settings (${why})`); }
      if (typeof log === "function" && !opts.quiet) log("settings", `saved: ${lines.join(" · ")}`);
    }
    return changed;
  }

  g.SETTINGS = {
    DEFAULTS, get, set, update, valid, short,
    isDefault: (name) => same(get(name), DEFAULTS[name]),
    all: () => Object.fromEntries(Object.keys(DEFAULTS).map((k) => [k, get(k)])),
    // Every setting back to its default, except brokenPrecisions: device facts, not choices (D12).
    reset: () => {
      const bp = get("brokenPrecisions");
      stored = bp.length ? { brokenPrecisions: bp } : {};
      try { if (bp.length) localStorage.setItem(KEY, JSON.stringify(stored)); else localStorage.removeItem(KEY); } catch (e) {}
    },
  };
})();
</script>
<script>
// chapter.js: the pure text rules of a book, no browser needed (CHAPTER.source is this file as text,
// for book.js's import worker). A CHAPTER FILE is a .txt whose name starts with the chapter number
// ("1478 - Improving Talisman Skills.txt"); line 1 is the title (blank: the file name without the
// number); the rest is paragraphs split by blank lines, kept as they are (Jon's book reads exactly as
// before). Since the library (2026-10-20) a book may also be: a folder of plain text files (one chapter
// per file, in natural name order, the file name as the title) or ONE text file (split at its "Chapter"
// heading lines when it has two or more, else one chapter, or parts by size when asked). Plain
// documents get two fixes, never chapter files: a file with almost no blank lines reads one line per
// paragraph, and hard-wrapped lines (Gutenberg style) are joined when asked (looksWrapped says when).
//   number(name) / isChapter(name) / nameTitle(name) / parse(name, text)   chapter files (as before)
//   isText(name)            .txt, .text, .md
//   natural(a, b)           name order: "2" before "10", case ignored
//   group(paths, root)      which files make which book (top-level folders), each in natural order; root = loose files
//   topFolder(paths)        the deepest folder every path shares
//   softenMd(text)          Markdown marks stripped so a .md file is not read as symbols
//   numbered(names)         every name starts with a number
//   looksWrapped(text)      hard-wrapped lines?
//   paragraphs(text, join)  a plain document's paragraphs
//   split(text, opts)       one file to chapters: { chapters: [{ title, paras, n }], how, numbered }
(function chapterJs() {
  const NUMBER = /^\s*(\d+(?:\.\d+)?)/;      // "12" or "12.5" (an interlude between 12 and 13; "12.txt" is still 12)
  const TEXT_FILE = /\.txt$/i;
  const ANY_TEXT = /\.(txt|text|md)$/i;

  // The chapter number from a file name (with or without its folders), or null.
  function number(name) {
    const m = NUMBER.exec(base(name));
    return m ? Number(m[1]) : null;
  }

  // The file name without its folders.
  function base(name) {
    return String(name || "").split(/[\\/]/).pop();
  }

  // Is this a chapter file by name: a .txt with a leading number?
  function isChapter(name) {
    return TEXT_FILE.test(base(name)) && number(name) !== null;
  }
  const isText = (name) => ANY_TEXT.test(base(name));
  const stem = (name) => base(name).replace(/\.[^.]*$/, "").trim();

  // The file name as a title: no folders, no extension, no leading number and separators.
  function nameTitle(name) {
    return stem(name).replace(/^\s*\d+(?:\.\d+)?\s*[-_.:–—]*\s*/, "").trim();
  }

  const clean = (text) => String(text).replace(/^﻿/, "").replace(/\r\n?/g, "\n");

  function parse(name, text) {
    const n = number(name);
    if (n === null) return null;
    const body = clean(text);
    const nl = body.indexOf("\n");
    const first = (nl < 0 ? body : body.slice(0, nl)).trim();
    const rest = nl < 0 ? "" : body.slice(nl + 1);
    const paras = rest.split(/\n[ \t]*\n/).map((p) => p.replace(/[ \t]+\n/g, "\n").trim()).filter(Boolean);
    return { n, title: first || nameTitle(name) || `Chapter ${n}`, paras };
  }

  // ---- Which files make which book --------------------------------------------------------------
  // One collator for every compare: localeCompare with options makes a new one each call (2,406 paths took
  // 150 ms of the page that way; bigimport's 200 ms rule).
  const collator = typeof Intl !== "undefined" && Intl.Collator ? new Intl.Collator(undefined, { numeric: true, sensitivity: "base" }) : null;
  const natural = (a, b) => (collator ? collator.compare(String(a), String(b)) : String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: "base" }));
  const numbered = (names) => names.length > 0 && names.every((x) => number(x) !== null);

  // paths: relative paths ("Folder/Sub/1.txt" or "1.txt"). A folder every path shares is stripped
  // (a folder pick, a zip with one wrapper folder). Then each top-level sub-folder is one book, and
  // the loose files one more, named `root` (the folder / zip / first file). Each book's paths in
  // natural order. Gives [{ title, paths }] in natural order of title (the root book first).
  function group(paths, root) {
    let list = paths.map((p) => String(p).replace(/\\/g, "/").replace(/^\/+/, ""));
    for (;;) {
      const first = list[0] && list[0].includes("/") ? list[0].slice(0, list[0].indexOf("/") + 1) : "";
      if (!first || !list.every((p) => p.startsWith(first))) break;
      root = first.slice(0, -1) || root;
      list = list.map((p) => p.slice(first.length));
    }
    const books = new Map();
    list.forEach((p, i) => {
      const cut = p.indexOf("/");
      const title = cut < 0 ? root || "Book" : p.slice(0, cut);
      if (!books.has(title)) books.set(title, { title, paths: [], root: cut < 0 });
      books.get(title).paths.push(paths[i]);
    });
    const out = Array.from(books.values());
    for (const b of out) b.paths.sort(natural);
    out.sort((a, b) => (a.root !== b.root ? (a.root ? -1 : 1) : natural(a.title, b.title)));
    return out.map(({ title, paths, root }) => ({ title, paths, root }));     // root: the loose files at the top, not a sub-folder
  }
  // The deepest folder every path shares ("manuscript" for "x/manuscript/art/1.md" + "x/manuscript/war/2.md"), or "".
  function topFolder(paths) {
    const list = paths.map((p) => String(p).replace(/\\/g, "/").replace(/^\/+/, ""));
    let name = "";
    for (;;) {
      const first = list[0] && list[0].includes("/") ? list[0].slice(0, list[0].indexOf("/") + 1) : "";
      if (!first || !list.every((p) => p.startsWith(first))) return name;
      name = first.slice(0, -1);
      for (let i = 0; i < list.length; i++) list[i] = list[i].slice(first.length);
    }
  }

  // ---- Names from folder and file names ------------------------------------------------------------
  // "part1-before-1800" → "Part 1: Before 1800"; "america-world" → "America World"; "_introduction" →
  // "Introduction"; "how-we-know" → "How We Know". Small words stay small after the first ("1900s and Today").
  // A dash with spaces around it is prose and stays ("1478 - Improving Talisman Skills").
  const SMALL = new Set(["a", "an", "and", "as", "at", "but", "by", "for", "in", "of", "on", "or", "the", "to", "vs"]);
  function pretty(name) {
    let s = stem(name).replace(/^[_\s]+/, "").replace(/(^|\S)[-_]+(?=\S)/g, "$1 ").replace(/\s+/g, " ").trim();
    if (!s) return "";
    let lead = "";
    const m = /^(part|chapter|ch|book|section|vol|volume)\s*0*(\d+)\b\s*/i.exec(s);
    if (m) { lead = `${m[1][0].toUpperCase() + m[1].slice(1).toLowerCase()} ${m[2]}`; s = s.slice(m[0].length); if (!s) return lead; lead += ": "; }
    if (/[A-Z]/.test(s)) return lead + s;          // a name someone capitalised ("3 - The Gate") keeps its case
    const words = s.split(" ").map((w, i) => (i > 0 && SMALL.has(w) ? w : w[0].toUpperCase() + w.slice(1)));
    return lead + words.join(" ");
  }

  // ---- Markdown: the outline (read BEFORE softening, which strips the marks) ----------------------
  // Editor's notes (the hb-note comment up to the /hb-note comment) are never read: dropped first, here and in
  // softenMd; an unclosed note runs to the end of the file. The regexes spell the comment opener with
  // {2} so the build's comment-opener check passes.
  const NOTE = /<!-{2}\s*hb-note\s*-{2}>[\s\S]*?(?:<!-{2}\s*\/hb-note\s*-{2}>|$)/g;
  const dropNotes = (t) => t.replace(NOTE, "");
  const attrs = (s) => { const o = {}; const re = /([\w:-]+)="([^"]*)"/g; let m; while ((m = re.exec(s))) o[m[1]] = m[2]; return o; };
  // { hb: the hb-chapter title or "", h1: the first "#" heading or "", heads: [{ l (1-6), t, line }],
  //   eras: [{ id, o (order), label, line (of its "##" heading) }] } from a Markdown file. An era is a
  //   "##" heading right after an hb-time:start comment (its id / order / label), or, when the file has
  //   no hb-time comments at all, every "##" heading (id = label; the caller decides whether that is a grid).
  function outline(text) {
    const lines = dropNotes(clean(text)).split("\n");
    const out = { hb: "", h1: "", heads: [], eras: [] };
    let time = null, anyTime = false, fence = false;
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (/^\s*```/.test(l)) { fence = !fence; continue; }
      if (fence) continue;
      let m = /^\s*<!-{2}\s*hb-chapter\b([^>]*)-{2}>/.exec(l);
      if (m) { const a = attrs(m[1]); if (a.title && !out.hb) out.hb = plain(a.title); continue; }

  const ONES = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven",
    "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
  const TENS = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
  const SCALES = ["", "thousand", "million", "billion", "trillion", "quadrillion", "quintillion"];
  const MONTHS = "January|February|March|April|May|June|July|August|September|October|November|December";
  const UNITS = { km: "kilometer", kg: "kilogram", cm: "centimeter", mm: "millimeter", ms: "millisecond", mph: "miles per hour",
    kph: "kilometers per hour", "km/h": "kilometers per hour", m: "meter", g: "gram", h: "hour", hr: "hour", hrs: "hour",
    min: "minute", sec: "second", ft: "foot", lb: "pound", lbs: "pound" };
  const PLURALS = { foot: "feet" };
  const SCALE_WORDS = { k: "thousand", K: "thousand", m: "million", M: "million", mn: "million", b: "billion", B: "billion", bn: "billion",
    thousand: "thousand", million: "million", billion: "billion", trillion: "trillion" };
  const CURRENCY = { $: ["dollar", "dollars", "cent", "cents"], "€": ["euro", "euros", "cent", "cents"], "£": ["pound", "pounds", "penny", "pence"] };
  // A number as written: plain digits, or thousands groups with commas, with an optional decimal part.
  const N = "(?:\\d{1,3}(?:,\\d{3})+|\\d+)(?:\\.\\d+)?";
  // A spelled number is fenced so that at the end a space goes only where letters would run together.
  const FENCE = String.fromCharCode(1);
  const sp = (w) => FENCE + w + FENCE;

  const under100 = (n) => (n < 20 ? ONES[n] : TENS[Math.floor(n / 10)] + (n % 10 ? "-" + ONES[n % 10] : ""));
  const under1000 = (n) => (n < 100 ? under100(n) : ONES[Math.floor(n / 100)] + " hundred" + (n % 100 ? " and " + under100(n % 100) : ""));
  const digits = (s) => String(s).replace(/\D/g, "").split("").map((d) => ONES[+d]).join(" ");

  // A whole number (any length of digits) -> words. Three-digit groups, "and" before a small last
  // group (two thousand and eighty), commas between long groups.
  function cardinal(s) {
    s = String(s).replace(/\D/g, "").replace(/^0+(?=\d)/, "");
    if (!s) return "";
    if (s.length > 3 * SCALES.length) return digits(s);
    const groups = [];
    for (let i = s.length; i > 0; i -= 3) groups.unshift(Number(s.slice(Math.max(0, i - 3), i)));
    if (groups.every((g) => g === 0)) return "zero";
    const parts = [], values = [];
    groups.forEach((g, k) => {
      if (!g) return;
      const scale = SCALES[groups.length - 1 - k];
      parts.push(under1000(g) + (scale ? " " + scale : ""));
      values.push(g);
    });
    const last = groups[groups.length - 1];
    const tail = parts.length > 1 && last > 0 && last < 100 ? " and " + parts.pop() : "";
    const long = parts.length > 2 || (parts.length === 2 && values[0] >= 100 && values[1] >= 100);
    return parts.join(long ? ", " : " ") + tail;
  }

  const IRREGULAR = { one: "first", two: "second", three: "third", five: "fifth", eight: "eighth", nine: "ninth", twelve: "twelfth" };
  const ordinalWords = (w) => w.replace(/([a-z]+)$/, (x) => IRREGULAR[x] || (x.endsWith("y") ? x.slice(0, -1) + "ieth" : x + "th"));
  const ordinal = (s) => ordinalWords(cardinal(s));
  const plural = (w) => w.replace(/([a-z]+)$/, (x) => (x.endsWith("y") ? x.slice(0, -1) + "ies" : x === "six" ? "sixes" : x + "s"));

  // 12.50 -> twelve point five zero; .5 -> point five.
  function decimal(s) {
    const [i, f] = String(s).replace(/,/g, "").split(".");
    const whole = i ? cardinal(i) : "";
    if (!f) return whole;
    return (whole ? whole + " " : "") + "point " + digits(f);
  }

  // 2025 -> twenty twenty-five; 1905 -> nineteen oh five; 1900 -> nineteen hundred; 2005 -> two thousand and five.
  function year(s) {
    const n = Number(s);
    if (String(s).length !== 4 || n < 1000 || (n >= 2000 && n < 2010)) return cardinal(s);
    const hi = Math.floor(n / 100), lo = n % 100;
    if (!lo) return under100(hi) + " hundred";
    return under100(hi) + " " + (lo < 10 ? "oh " + ONES[lo] : under100(lo));
  }

  // 10:00 -> ten o'clock; 15:00 -> fifteen hundred; 3:05 -> three oh five; 13:27 -> thirteen twenty-seven.
  function clock(h, m) {
    h = Number(h); m = Number(m);
    const hour = cardinal(String(h));
    if (!m) return h >= 1 && h <= 12 ? hour + " o'clock" : hour + " hundred";
    return hour + " " + (m < 10 ? "oh " + ONES[m] : under100(m));
  }

  function duration(h, m, s) {
    const unit = (n, name) => cardinal(String(n)) + " " + name + (Number(n) === 1 ? "" : "s");
    const parts = [];
    if (+h) parts.push(unit(h, "hour"));
    if (+m) parts.push(unit(m, "minute"));
    if (+s) parts.push(unit(s, "second"));
    if (!parts.length) return "zero seconds";
    return parts.length === 1 ? parts[0] : parts.slice(0, -1).join(", ") + " and " + parts[parts.length - 1];
  }

  const NAMED = { "1/2": "one half", "1/3": "one third", "2/3": "two thirds", "1/4": "one quarter", "3/4": "three quarters" };
  function fraction(n, d, asWords) {
    n = Number(n); d = Number(d);
    if (NAMED[n + "/" + d]) return NAMED[n + "/" + d];
    if (asWords && d > 1 && d <= 100) {
      const denom = ordinal(String(d));
      return cardinal(String(n)) + " " + (n === 1 ? denom : plural(denom));
    }
    return cardinal(String(n)) + " of " + cardinal(String(d));
  }

  // Any number as written: 3,129,467 / 2.5 / 007 (a code: digit by digit) / 2080.
  function number(s) {
    s = String(s).replace(/,/g, "");
    if (s.includes(".")) return decimal(s);
    if (/^0\d/.test(s)) return digits(s);
    return cardinal(s);
  }

  function withUnit(amount, unit) {
    const name = UNITS[unit];
    if (/ per /.test(name)) return number(amount) + " " + name;
    return number(amount) + " " + (Number(amount.replace(/,/g, "")) === 1 ? name : PLURALS[name] || name + "s");
  }

  function money(cur, amt, scale) {
    const [one, many, sub1, subMany] = CURRENCY[cur];
    const plain = amt.replace(/,/g, "");
    if (scale) return number(plain) + " " + SCALE_WORDS[scale] + " " + many;
    const [whole, cents] = plain.split(".");
    if (cents && cents.length === 2) {
      const c = Number(cents);
      const main = cardinal(whole) + " " + (Number(whole) === 1 ? one : many);
      return c ? main + " and " + cardinal(cents) + " " + (c === 1 ? sub1 : subMany) : main;
    }
    return number(plain) + " " + (Number(plain) === 1 ? one : many);
  }

  function speak(text) {
    let t = String(text);
    if (!/\d/.test(t)) return t;
    const re = (s, f) => new RegExp(s, f || "g");

    // Money: $5.2M, $3.50, £1, $5 million
    t = t.replace(re(`([$€£])\\s?(${N})\\s?(k|K|mn|bn|m|M|b|B|thousand|million|billion|trillion)?\\b`), (_, cur, amt, scale) => sp(money(cur, amt, scale)));
    t = t.replace(re(`([$€£])\\s?(${N})`), (_, cur, amt) => sp(money(cur, amt)));

    // Dates: January 5, 2025 / January 2025 / March 3rd / the year 1905 / 300 BC
    t = t.replace(re(`\\b(${MONTHS})\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s+(\\d{4}))?\\b`), (_, mon, day, yr) => `${mon} ${ordinal(day)}${yr ? " " + year(yr) : ""}`);
    t = t.replace(re(`\\b(${MONTHS})\\s+(\\d{4})\\b`), (_, mon, yr) => `${mon} ${year(yr)}`);
    t = t.replace(/\b([Yy]ear)\s+(\d{4})\b/g, (_, w, yr) => `${w} ${year(yr)}`);
    t = t.replace(/\b(\d{3,4})\s?(AD|BC|BCE|CE)\b/g, (_, yr, era) => `${year(yr)} ${era.split("").join(" ")}`);

    // Decades: 1990s, '90s, 20s
    t = t.replace(/(^|[^\w.])['’]?(\d{0,2}\d0)['’]?s\b/g, (_, pre, d) => pre + sp(plural(d.length === 4 ? year(d) : cardinal(d))));

    // Durations 04:58:36; clock times 13:27, 10:00; ratios 65:35, 1:2, 1:1:1
    t = t.replace(/\b(\d{1,2}):(\d{2}):(\d{2})\b/g, (_, h, m, s) => sp(duration(h, m, s)));
    t = t.replace(/\b\d+(?::\d+)+\b/g, (m, at, all) => {
      const parts = m.split(":");
      const around = (all.slice(Math.max(0, at - 24), at) + all.slice(at + m.length, at + m.length + 12)).toLowerCase();
      const ratio = /ratio|split|odds|score|proportion/.test(around);
      if (parts.length === 2 && !ratio && /^\d{2}$/.test(parts[1]) && +parts[0] <= 23 && +parts[1] <= 59) return sp(clock(parts[0], parts[1]));
      return sp(parts.map(cardinal).join(" to "));
    });

    // Fractions: 24/7, 1/4th, 2/5ths, 1/2, 3/5 of, 1/1/2020
    t = t.replace(/\b24\/7\b/g, sp("twenty-four seven"));
    t = t.replace(/\b(\d{1,3})\/(\d{1,3})(?:st|nd|rd|th)s?\b/g, (_, n, d) => sp(fraction(n, d, true)));
    t = t.replace(/\b(\d{1,3})\/(\d{1,3})\b(?!\/)(\s+of\b)?/g, (_, n, d, of) => sp(fraction(n, d, !!of) + (of || "")));
    t = t.replace(/\b(\d+)\/(\d+)\/(\d+)\b/g, (_, a, b, c) => sp([a, b, c].map(cardinal).join(" slash ")));

    // Ranges: 20-30, 90-70%, 3–5
    t = t.replace(re(`(^|[^\\w.,-])(${N})\\s?[-–—]\\s?(${N})(\\s?%)?(?![\\w-])`), (_, pre, a, b, pct) => pre + sp(number(a) + " to " + number(b) + (pct ? " percent" : "")));

    // Percent and degrees
    t = t.replace(re(`(${N})\\s?%`), (_, a) => sp(number(a) + " percent"));
    t = t.replace(re(`(${N})\\s?°\\s?([CF])\\b`), (_, a, u) => sp(number(a) + " degrees " + (u === "C" ? "Celsius" : "Fahrenheit")));
    t = t.replace(re(`(${N})\\s?°`), (_, a) => sp(number(a) + (a === "1" ? " degree" : " degrees")));

    // Ordinals: 1st, 22nd, 108th
    t = t.replace(/\b(\d+)(?:st|nd|rd|th)\b/gi, (_, n) => sp(ordinal(n)));

    // Labels: #989823 (a long one digit by digit), No. 5
    t = t.replace(/#\s?(\d+)/g, (_, n) => sp("number " + (n.length >= 5 ? digits(n) : cardinal(n))));
    t = t.replace(/\bNo\.\s?(\d+)\b/g, (_, n) => sp("number " + cardinal(n)));

    // Multipliers and signs: x2, 3x, +5, -10
    t = t.replace(re(`(^|[\\s(])[x×]\\s?(${N})\\b`), (_, pre, n) => pre + sp("times " + number(n)));
    t = t.replace(re(`\\b(${N})[x×](?=[\\s.,!?)]|$)`), (_, n) => sp(number(n) + " times"));
    t = t.replace(re(`(^|[\\s(])\\+(${N})`), (_, pre, n) => pre + sp("plus " + number(n)));
    t = t.replace(re(`(^|[\\s(])[-−](${N})`), (_, pre, n) => pre + sp("minus " + number(n)));

    // Units and scales: 30km, 5 kg, 100m, 2h, 10k, 5M, 2.5bn
    t = t.replace(re(`(${N})\\s?(km\\/h|kph|mph|km|kg|cm|mm|ft|lbs|lb)\\b`), (_, n, u) => sp(withUnit(n, u)));
    t = t.replace(re(`(${N})(ms|hrs|hr|min|sec|m|g|h)\\b`), (_, n, u) => sp(withUnit(n, u)));
    t = t.replace(re(`(${N})(k|K|M|B|bn|mn)\\b`), (_, n, s) => sp(number(n) + " " + SCALE_WORDS[s]));

    // Dotted sequences that are not decimals: 1.2.3
    t = t.replace(/\b\d+(?:\.\d+){2,}\b/g, (m) => sp(m.split(".").map(cardinal).join(" point ")));

    // Everything else: .5, 3,129,467, 2.5, 2080, 007
    t = t.replace(/(^|\s)\.(\d+)\b/g, (_, pre, f) => pre + sp("point " + digits(f)));
    t = t.replace(re(`${N}(?!\\d)`), (m) => sp(number(m)));

    return t.split(FENCE).reduce((out, piece) => out + (/[A-Za-z0-9]$/.test(out) && /^[A-Za-z0-9]/.test(piece) ? " " : "") + piece, "");
  }

  globalThis.NUMBERS = { speak, cardinal, ordinal, year, digits, decimal };
})();

<script>
// text.js: the text sent to the voice, from one piece of a paragraph. Pure functions (Node runs them in
// the tests): TEXT.clean(text, opts) gives { text, skipped } (the speech text and every watermark
// removed, as written, each once); TEXT.speech(text, opts) just the text; TEXT.speakable(text) says
// whether a piece makes any sound (letters or digits); TEXT.options(SETTINGS) builds opts from the
// settings. The stored book is never changed: all of this happens at speaking time. The rules, in
// order: watermarks (word by word, then the lead-in phrases: TEXT.RULES holds the built-in lists, the
// Watermark rules setting may replace them), <Item> brackets, footnote marks [1], underscores,
// scraper glue ("3!I think"), sound effects (~BOOM~ -> "Boom!"), ALL-CAPS words read as ordinary

// spelling replacements, and a full stop when the piece ends without one.
(function () {
  const g = globalThis;
  const BS = String.fromCharCode(92);          // a backslash, built so no escape sequence is in this file
  const GONE = String.fromCharCode(2);         // marks where a watermark word was, until the phrases are done

  //   written and with the punctuation at its ends removed. keep: real words that would match a words
  //   pattern but stay (plain = the whole word, capitals ignored, possessive removed; or /regex/).

  //   * stands for the removed words ("please visit *"); or /regex/ (it cannot refer to the removed words).

    characters: [

      "0300-036F combining marks (o͍ S̈)",

      "1D00-1DBF small capitals and superscript letters (ɴ ᴏ ᵈ)",
      "1E00-1EFF Latin letters with extra marks (ṇ ṙ Ộ)",
      "16A0-16FF Runic (ᛒ)",

      "2100-214F letter-like symbols (ℕ ℓ ℞)",

      "New chapters are published on *", "New novel chapters are published on *", "New novel are published on *", "New * are published on *", "New are published on *",
      "This chapter is updated by *", "This content is updated by *", "This is updated by *",
      "This chapter is * by *", "This content is * by *", "This is * by *", "This chapter is by *", "This content is by *", "This is by *",
      "This chapter is taken from *", "This content is taken from *", "This is taken from *",
      "The source of this content is *", "The * of this content is *", "The of this content is *",
      "Correct content is on *",
      "Follow current novels on *", "current novels on *",
      "Visit * for the best novel reading experience", "Visit * for the best novel reading *", "Visit * for the best novel reading",

  // valid pattern is reported (log type "text") and skipped.

    if (!rules || typeof rules !== "object") { if (!compiledDefault) compiledDefault = compile(RULES); return compiledDefault; }
    if (compiled.has(rules)) return compiled.get(rules);

    const take = (name, fn) => {
      const out = [];

        try { const r = fn(line); if (r) out.push(r); else if (r !== undefined) bad.push(name + ": " + line); } catch (e) { bad.push(name + ": " + line); }

      if (r) return r;
      const m = /^([0-9A-Fa-f]{4,6})(?:-([0-9A-Fa-f]{4,6}))?(?:\s|$)/.exec(line);
      if (!m) return null;

      return new RegExp("[" + String.fromCodePoint(a) + (b > a ? "-" + String.fromCodePoint(b) : "") + "]", "u");
    });

      chars: chars.length ? new RegExp(chars.map((r) => r.source).join("|"), "u") : null,
      words: take("words", (line) => asRegex(line) || new RegExp(escape(line), "i")),
      keepRe: take("keep", (line) => (/^\/.+\/[a-z]*$/.test(line) ? asRegex(line) : undefined)),
      keep: new Set(lines(rules.keep === undefined ? RULES.keep : rules.keep).filter((l) => !/^\/.+\/[a-z]*$/.test(l)).map((l) => l.toLowerCase())),

      bad,

    c = c && c.words ? c : compile(c);

    const bare = bareOf(w);

  // The watermark stage: junk words go (a real word of three or more letters glued in front of one is
  // kept: "spoke.<site>"; two letters would also rescue the "eb." of "eb.n\ovel"), then the phrases
  // that led up to them. Every removal is pushed to `skipped` (once each).
  function skipWatermarks(t, c, skipped) {
    const seen = new Set(skipped);
    const note = (w) => { if (!seen.has(w)) { seen.add(w); skipped.push(w); } };
    const kept = [];
    for (const w of t.split(/\s+/)) {
      if (!w) continue;
      if (!junk(w, c)) { kept.push(w); continue; }
      note(w);
      const glued = /^(~[^~]+~|[\p{L}'’-]{3,}[.?!…]+["'”’]?)(.+)$/u.exec(w);
      if (glued && !junk(glued[1], c)) kept.push(glued[1]);
      kept.push(GONE);
    }
    // A mark with no letters between two removed words (", " in "ραпdα -n૦νe| , c૦m") was part of them.
    for (let i = 1; i < kept.length - 1; i++) if (kept[i - 1] === GONE && kept[i + 1] === GONE && !LETTER.test(kept[i])) kept[i] = GONE;
    t = kept.join(" ");
    for (const re of c.phrases) t = t.replace(re, (m) => { const shown = m.split(GONE).join(" ").replace(/\s+/g, " ").trim(); if (shown) note(shown); return " "; });
    return t.split(GONE).join(" ");
  }

  // ---- Sound effects: ~BOOM~, ~SHUA~SHUA~, or one capitalised word repeated (BOOM BOOM) ------------
  // said as words: "Boom!", "Shua, shua!". A shouted sentence in capitals is not an effect (capsDown).
  function effects(t) {
    const s = t.trim();
    let words = null;
    if (/^~[^~]+~$/.test(s)) words = [s.replace(/~/g, "").trim()];
    else if (/^~[^~\s]+(?:~\s*[^~\s]+)+~?$/.test(s)) words = s.split("~").map((x) => x.trim()).filter(Boolean);
    else if (/^[A-Z]{3,}(?:[ -][A-Z]{3,})*[.!]*$/.test(s)) {
      words = s.replace(/[.!]+$/, "").split(/[ -]/);
      if (new Set(words).size > 1) words = null;
    }
    if (!words || !words.length || !words.some((w) => LETTER.test(w))) return t;
    const out = words.map((w) => (w === w.toUpperCase() ? w.toLowerCase() : w)).join(", ");
    return out.charAt(0).toUpperCase() + out.slice(1) + "!";
  }

  // ---- ALL-CAPS words as ordinary words --------------------------------------------------------
  // "YOU DID WHAT?" goes to the voice in lower case (it stumbles on capitals); a sentence start keeps
  // its capital, "I'LL" keeps its I. Left alone: the abbreviations below, Roman numerals of I V X, and a
  // word right after a number ("9 AM", "300 BC").
  const CAPS_KEEP = new Set(["VIP", "WSA", "OK", "TV", "DNA", "CEO", "USA", "UK"]);
  const ROMAN = /^X{0,3}(?:IX|IV|V?I{0,3})$/;

    return t.replace(/(^|[^A-Za-z0-9])([A-Z][A-Z'’]*[A-Z])(?![A-Za-z0-9])/g, (m, pre, w, at, all) => {
      if (CAPS_KEEP.has(w) || ROMAN.test(w)) return m;
      const before = all.slice(0, at + pre.length);
      if (/\d\s?$/.test(before)) return m;
      let low = w.toLowerCase();
      const b = before.replace(/[\s"'”’)\]~*-]+$/, "");
      if (/^i['’]/.test(low)) low = "I" + low.slice(1);
      else if (!b || /[“‘"(\[]$/.test(b) || /[.!?…:]$/.test(b)) low = low.charAt(0).toUpperCase() + low.slice(1);
      return pre + low;
    });
  }

  // ---- The comma after a speech verb -------------------------------------------------------------
  // "said spreading its fins": the voice swallows "said"; with the comma good punctuation would have it
  // says it. Only speech verbs, only before an -ing action word (not "said nothing", not "continued walking").
  const VERBS = "said|asked|replied|added|muttered|spoke|stated|explained|answered|questioned|agreed|murmured|wondered|whispered|chuckled|laughed|confirmed|shouted|inquired|suggested|admitted|guessed|sighed|exclaimed|responded|remarked|commented|noted|declared|announced|yelled|cried|growled|snapped|grumbled|mumbled|retorted|insisted|warned|reminded|promised|joked|scoffed|sneered|snorted|greeted|reckoned|exhaled|recalled|analyzed|assessed|chirped|urged|pleaded|begged|protested|complained|interjected|interrupted|echoed|repeated|concluded|observed|mused|pondered|stammered|stuttered|hissed|roared|bellowed|screamed|shrieked|groaned|moaned|gasped|giggled|snickered|taunted|teased|mocked|boasted|praised|cursed|scolded|lamented|cheered|advised|cautioned|instructed|ordered|commanded|demanded|requested|proposed|offered|informed|reported|revealed|clarified|elaborated|argued|countered|claimed|asserted|acknowledged|conceded|assured|reassured|swore|vowed";
  const NOT_ACTIONS = "nothing|something|anything|everything|during|being|thing|king|morning|evening|ring|bring|spring|string|sibling|darling|willing|ceiling|wing|sing|sting|swing|cling|fling|sling|wring";
  const SPEECH_COMMA = new RegExp(`\\b(${VERBS})\\s+(?!(?:${NOT_ACTIONS})\\b)([a-z]{3,}ing)\\b`, "g");
  const speechComma = (t) => t.replace(SPEECH_COMMA, "$1, $2");

  // ---- Spelling replacements ------------------------------------------------------------------
  // [from, to] pairs: whole words, capitals ignored, a capital first letter kept ("Qi" -> "Chee"); a
  // mark with no letters or digits ("-", ",") is changed wherever it is.
  const spellings = new WeakMap();
  function spellingRules(list) {
    if (!Array.isArray(list)) return [];
    if (spellings.has(list)) return spellings.get(list);
    const out = [];
    for (const pair of list) {
      const from = Array.isArray(pair) ? String(pair[0] || "").trim() : "";
      if (!from) continue;
      const to = String(pair[1] == null ? "" : pair[1]);
      const body = escape(from).replace(/\s+/g, BS + "s+");
      try {
        if (!LETTER.test(from)) out.push({ re: new RegExp(body, "g"), to, mark: true });
        else out.push({ re: new RegExp("(?<![\\p{L}\\p{N}])" + body + "(?![\\p{L}\\p{N}])", "giu"), to: to.trim() });
      } catch (e) { if (typeof g.log === "function") g.log("text", `spelling replacement not usable: ${from}`); }
    }
    spellings.set(list, out);
    return out;
  }
  // A mark rule leaves digits' own marks alone (D14: with "Read numbers as words" off, "1,000" and
  // "2026-10-19" stay as they are, and so does the minus of "-5"); with it on the digits are words by now.
  const DIGIT = /\d/, WORDCH = /[\p{L}\p{N}]/u;
  const numberMark = (m, at, s) => { const a = s[at - 1] || "", b = s[at + m.length] || ""; return DIGIT.test(b) && (DIGIT.test(a) || (m.trim() === "-" && !WORDCH.test(a))); };
  function replacements(t, list) {
    for (const r of spellingRules(list)) {
      t = t.replace(r.re, (m, ...rest) => {
        if (r.mark) { const s = rest[rest.length - 1], at = rest[rest.length - 2]; return numberMark(m, at, s) ? m : r.to; }
        return r.to && /^\p{Lu}/u.test(m) ? r.to.charAt(0).toUpperCase() + r.to.slice(1) : r.to;
      });
    }
    return t;
  }

  const ENDS = /[.!?…]["'”’)\]]*$/;
  const endStop = (s) => (ENDS.test(s) ? s : s.replace(/[\s,;:—–-]+$/, "") + ".");
  const speakable = (t) => LETTER.test(String(t || ""));

  const DEFAULTS = { skipWatermarks: true, rules: null, spelling: [], capsAsWords: true, numbersToWords: true };
  function options(settings) {
    const s = settings || g.SETTINGS;
    return { skipWatermarks: s.get("skipWatermarks"), rules: s.get("watermarkRules") || null, spelling: s.get("spelling"), capsAsWords: s.get("capsAsWords"), numbersToWords: s.get("numbersToWords") };
  }

  function clean(raw, opts) {
    const o = Object.assign({}, DEFAULTS, opts);
    const skipped = [];
    let t = String(raw == null ? "" : raw).replace(ZERO_WIDTH, "").replace(/&nbsp;/gi, " ");
    if (o.skipWatermarks) t = skipWatermarks(t, compile(o.rules), skipped);
    t = t.replace(/_/g, " ").replace(/\[\d{1,2}\]/g, "")
      .replace(/([a-z0-9][!?])(?=[A-Z])/g, "$1 ")
      .replace(/(^|\s)<\s(?=\d)/g, "$1less than ").replace(/(^|\s)>\s(?=\d)/g, "$1more than ")
      .replace(/[<>]/g, " ");
    t = effects(t);
    if (o.capsAsWords) t = capsDown(t);
    t = speechComma(t);
    if (o.numbersToWords && g.NUMBERS) t = g.NUMBERS.speak(t);
    t = replacements(t.replace(/~/g, ""), o.spelling);
    t = t.replace(/\s+/g, " ").trim();
    if (speakable(t)) t = endStop(t);
    return { text: t, skipped };
  }

  g.TEXT = {
    RULES, compile, junk, effects, capsDown, speechComma, replacements, endStop, speakable, options, clean,
    speech: (raw, opts) => clean(raw, opts).text,
  };
})();
</script>
<script>
// pieces.js: a chapter to the list of pieces to read. PIECES.build({ n, title, text: [paragraphs] },
// opts) gives { pieces, before, skipped }: the pieces, how many there were before joining, and the
// watermarks text.js removed. Each paragraph is a piece; a long one is cut at sentence ends (opts.
// maxChars, 600 by default; the browser-voice step passes 220 for online voices), and never mid-
// sentence at a fixed length: an over-long sentence is cut at a comma, semicolon or dash with no tail
// under 40 characters (BUGS 10). The title is piece 0 when opts.readTitle (as "Chapter N. Title"; it
// never joins). Then Jon's joining rule (opts.joinShort): a piece of five words or fewer joins the
// piece before it, and so on along a run of short pieces; a short piece at the start of a chapter (or
// after a pause piece) joins forward onto the next; joining crosses paragraphs. A piece:
//   { id, chapter, parts: [{ para, from, to, text, speech, words }], text, speech, pause, words, title? }
// id = "chapter:para:from-to" (parts joined by "+"); from-to is the span in the paragraph (-1 = the
// title); text is what is shown, speech what the voice gets (text.js); words counts the shown words
// less any watermarks; pause is true when nothing can be said (a line of "***": half a second of
// silence, never sent to the voice); a paragraph that was only a watermark is dropped.
// PIECES.split(piece) gives a joined piece back as one piece per part.
// PIECES.chunks(speech) cuts a piece's speech into the chunks the voice makes it in (step 5c): whole
// sentences packed up to CHUNK characters, a chunk under CHUNK_MIN merged into its shorter neighbour
// when that stays under CHUNK + CHUNK_MIN / 2; a chunk never breaks a sentence (an over-long one stays
// whole). The piece stays one piece on the page and in the stream; the player makes the chunks in
// parallel and appends each as it is ready.
(function () {
  const SHORT = 5;        // words; a piece of this many or fewer joins its neighbour
  const TAIL = 40;        // characters; a cut inside a sentence leaves no tail shorter than this
  const CHUNK = 120, CHUNK_MIN = 60;   // characters; the sentence chunks the voice gets
  const END = /[.!?…]+["'”’)\]]*(?=\s|$)/g;
  const ABBREV = /(?:^|[^A-Za-z])(?:[A-Z]|Mr|Mrs|Ms|Dr|St|Sr|Jr|No|vs|etc|a\.m|p\.m)$/;
  const CLAUSE = /[,;:]\s|\s?[—–]\s?/g;
  const WORD = /[\p{L}\p{N}]/u;

  const words = (t) => String(t).split(/\s+/).filter((w) => WORD.test(w)).length;

  // A span of t with the whitespace at its ends left out, or null when nothing is left.
  function trim(t, from, to) {
    while (from < to && /\s/.test(t[from])) from++;
    while (to > from && /\s/.test(t[to - 1])) to--;
    return to > from ? { from, to } : null;
  }

  // The sentences of t as spans. An end is . ! ? … (with closing quotes or brackets) before a space or
  // the end of the text, except after an initial or a common abbreviation.
  function sentences(t) {
    const out = [];
    let start = 0, m;
    END.lastIndex = 0;
    while ((m = END.exec(t))) {
      if (ABBREV.test(t.slice(start, m.index))) continue;
      const s = trim(t, start, m.index + m[0].length);
      if (s) out.push(s);
      start = m.index + m[0].length;
    }
    const last = trim(t, start, t.length);
    if (last) out.push(last);
    return out;
  }

  // Pack spans in order into pieces of at most max characters; a span longer than max goes through `over`.
  function pack(t, spans, max, over) {
    const out = [];
    let cur = null;
    for (const s of spans) {
      if (s.to - s.from > max && over) { if (cur) { out.push(cur); cur = null; } out.push(...over(s)); continue; }
      if (cur && s.to - cur.from > max) { out.push(cur); cur = { from: s.from, to: s.to }; }
      else cur = cur ? { from: cur.from, to: s.to } : { from: s.from, to: s.to };
    }
    if (cur) out.push(cur);
    return out;
  }

  // The spans of a text split at a regex (the separator stays with the part before it).
  function splitAt(t, span, re) {
    const out = [];
    let start = span.from, m;
    re.lastIndex = span.from;
    while ((m = re.exec(t)) && m.index < span.to) {
      const s = trim(t, start, Math.min(span.to, m.index + m[0].length));
      if (s) out.push(s);
      start = m.index + m[0].length;
    }
    const last = trim(t, start, span.to);
    if (last) out.push(last);
    return out;
  }

  // An over-long sentence: cut at clause marks, then (a clause still too long) at spaces; a short last
  // piece takes words back from the one before it, which keeps at least four.
  function cutLong(t, span, max) {
    const byWords = (s) => pack(t, splitAt(t, s, /\s+/g), max, null);
    const out = pack(t, splitAt(t, span, CLAUSE), max, byWords);
    while (out.length > 1) {
      const last = out[out.length - 1], prev = out[out.length - 2];
      if (last.to - last.from >= TAIL || words(t.slice(prev.from, prev.to)) <= 4) break;
      const cut = t.lastIndexOf(" ", prev.to - 1);
      if (cut <= prev.from) break;
      out[out.length - 2] = trim(t, prev.from, cut);
      out[out.length - 1] = trim(t, cut, last.to);
    }
    return out;
  }

  // A paragraph as piece spans: whole when it fits in max characters, else whole sentences packed.
  function cut(t, max) {
    t = String(t);
    const whole = trim(t, 0, t.length);
    if (!whole) return [];
    if (whole.to - whole.from <= max) return [whole];
    return pack(t, sentences(t), max, (s) => cutLong(t, s, max));
  }

  function finish(p) {
    p.id = p.chapter + ":" + p.parts.map((x) => `${x.para}:${x.from}-${x.to}`).join("+");
    p.text = p.parts.map((x) => x.text).join(" ");
    p.speech = p.parts.map((x) => x.speech).filter(Boolean).join(" ");
    p.words = p.parts.reduce((n, x) => n + x.words, 0);
    p.pause = !globalThis.TEXT.speakable(p.speech);
    return p;
  }

  function build(ch, opts) {
    const o = Object.assign({ readTitle: true, joinShort: true, maxChars: 600, text: undefined }, opts);
    const TEXT = globalThis.TEXT;
    const paras = ch.text || ch.paras || [];
    const skipped = [], seen = new Set();
    const items = [];
    const make = (para, from, to, shown, title) => {
      const c = TEXT.clean(shown, o.text);
      for (const w of c.skipped) if (!seen.has(w)) { seen.add(w); skipped.push(w); }
      if (!c.text && c.skipped.length && TEXT.speakable(shown)) return null;      // only a watermark: nothing to read
      const spoken = c.skipped.reduce((s, w) => s.split(w).join(" "), shown);     // the words that count: not the watermarks
      const p = { chapter: ch.c != null ? ch.c : ch.n, parts: [{ para, from, to, text: shown, speech: c.text, words: words(spoken) }] };
      if (title) p.title = true;
      return finish(p);
    };
    if (o.readTitle && ch.title && ch.heading !== false) {      // a file name or a part label is not read aloud (library)
      const title = String(ch.title);
      const spoken = /^chapter\s+\d+\b/i.test(title) || ch.n == null ? title : `Chapter ${ch.n}. ${title}`;   // "Chapter N." only when the chapter has a number
      const p = make(-1, 0, title.length, spoken, true);
      if (p) items.push(p);
    }
    paras.forEach((para, i) => {
      for (const s of cut(para, o.maxChars)) {
        const p = make(i, s.from, s.to, String(para).slice(s.from, s.to));
        if (p) items.push(p);
      }
    });
    const pieces = o.joinShort ? join(items) : items;
    return { pieces, before: items.length, skipped };
  }

  // Jon's rule. The title and pause pieces stand alone and end a run.
  function join(items) {
    const out = [];
    for (const p of items) {
      const last = out[out.length - 1];
      if (last && !last.title && !last.pause && !p.title && !p.pause && (p.words <= SHORT || last.words <= SHORT)) {
        last.parts.push(...p.parts);
        finish(last);
      } else out.push(p);
    }
    return out;
  }

  const split = (piece) => piece.parts.map((part) => finish({ chapter: piece.chapter, parts: [part], ...(piece.title ? { title: true } : {}) }));

  // The chunks of a speech text: [{ from, to, text }] in its characters (one chunk when it fits).
  function chunks(speech, max) {
    const t = String(speech || ""), lim = max || CHUNK, min = Math.round(lim / 2);
    const whole = trim(t, 0, t.length);
    if (!whole) return [];
    const out = whole.to - whole.from <= lim ? [whole] : pack(t, sentences(t), lim, null);
    for (let i = 0; i < out.length && out.length > 1; i++) {
      if (out[i].to - out[i].from >= min) continue;
      const prev = out[i - 1], next = out[i + 1];
      const into = prev && (!next || prev.to - prev.from <= next.to - next.from) ? i - 1 : next ? i + 1 : -1;
      if (into < 0) continue;
      const a = Math.min(i, into), b = Math.max(i, into);
      if (out[b].to - out[a].from > lim + min / 2) continue;
      out.splice(a, 2, { from: out[a].from, to: out[b].to });
      i = Math.max(-1, a - 2);
    }
    // A chunk with nothing to say ("…", a lone dash) joins its shorter neighbour whatever the size: a
    // voice must never be sent it (PLAN: a line with nothing to speak is never sent; P14).
    const say = (c) => !globalThis.TEXT || globalThis.TEXT.speakable(t.slice(c.from, c.to));
    for (let i = 0; i < out.length && out.length > 1; i++) {
      if (say(out[i])) continue;
      const prev = out[i - 1], next = out[i + 1];
      const a = prev && (!next || prev.to - prev.from <= next.to - next.from) ? i - 1 : i;
      out.splice(a, 2, { from: out[a].from, to: out[a + 1].to });
      i = a - 1;
    }
    return out.map((s) => ({ from: s.from, to: s.to, text: t.slice(s.from, s.to) }));
  }

  function options(settings) {
    const s = settings || globalThis.SETTINGS;
    return { readTitle: s.get("readTitle"), joinShort: s.get("joinShort"), maxChars: 600, text: globalThis.TEXT.options(s) };
  }

  globalThis.PIECES = { build, split, cut, chunks, sentences, words, options, SHORT, TAIL, CHUNK, CHUNK_MIN };
})();
