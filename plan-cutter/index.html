<!doctype html>
<html lang="en" data-build="built">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<title>Plan Cutter</title>
<script>
  // Theme before first paint, so nothing flashes.
  (function () {
    var t = null;
    try { t = JSON.parse(localStorage.getItem("plancutter.settings") || "{}").theme; } catch (e) {}
    if (t !== "dark" && t !== "light") t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
/* ---- base.css ---- */
/* Plan Cutter: theme tokens, resets, controls */
:root {
  --bg: #efede6; --canvas: #f7f6f1; --panel: #ffffff; --panel-2: #f3f1ea;
  --fg: #1f2329; --muted: #6b7280; --line: #d8d4ca; --line-2: #e8e5dc;
  --accent: #2b6fe6; --accent-fg: #ffffff; --wall: #3a3f47; --room: #8b5cf6; --dim: #555b66;
  --seam: #e5484d; --construction: #a16207; --ruler: #e9e6de; --grid: #000000;
  --selection: #2b6fe6; --hover: #4d8bff; --warn: #d97706; --ok: #16a34a; --danger: #dc2626;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.18), 0 2px 8px rgba(0, 0, 0, 0.08);
  --radius: 10px; --ui: 1;
  color-scheme: light;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, Consolas, Menlo, monospace;
}
:root[data-theme="dark"] {
  --bg: #14161b; --canvas: #1a1d24; --panel: #20242c; --panel-2: #262b34;
  --fg: #e6e8ec; --muted: #98a2b3; --line: #343a46; --line-2: #2a2f3a;
  --accent: #5b9dff; --accent-fg: #0c1220; --wall: #c9d1d9; --room: #a78bfa; --dim: #aab2c0;
  --seam: #ff6b6b; --construction: #d4a72c; --ruler: #20242c; --grid: #ffffff;
  --selection: #5b9dff; --hover: #7fb4ff; --warn: #f59e0b; --ok: #34d399; --danger: #f87171;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 14px/1.4 var(--font); color: var(--fg); background: var(--bg);
  overflow: hidden; -webkit-text-size-adjust: 100%; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  min-height: 34px; line-height: 1.2;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--danger); border-color: var(--danger); }
button.quiet { background: transparent; border-color: transparent; }
button.quiet:hover:not(:disabled) { background: var(--panel-2); border-color: transparent; }
.icon-btn {
  min-width: 36px; min-height: 36px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center;
  font-size: 18px; line-height: 1; background: transparent; border-color: transparent; border-radius: 8px;
}
.icon-btn:hover:not(:disabled) { background: var(--panel-2); border-color: transparent; }
.icon-btn.small { min-width: 28px; min-height: 28px; font-size: 14px; }
.icon-btn.active, .tool-btn.active { background: var(--accent); color: var(--accent-fg); }
input[type="text"], input[type="number"], input[type="search"], select, textarea {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; min-height: 34px; width: 100%;
}
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; vertical-align: -3px; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="color"] { width: 44px; height: 30px; padding: 0 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--muted); background: var(--panel-2); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.spacer { flex: 1; }
.hidden, [hidden] { display: none !important; }
hr { border: 0; border-top: 1px solid var(--line-2); margin: 10px 0; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 14px 0 6px; }
h3:first-child { margin-top: 2px; }
.note { color: var(--muted); font-size: 12.5px; line-height: 1.4; margin: 4px 0 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); font-size: 12px; color: var(--muted); }
.chip.on { background: var(--accent); color: var(--accent-fg); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); vertical-align: middle; }
.status-free { color: #3b8dff; } .status-partial { color: #f0a030; } .status-fixed { color: #35b36a; } .status-conflict { color: #e5484d; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }
.field { margin: 8px 0; }
.field > label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
.field .inline { display: flex; gap: 6px; align-items: center; }
.field .inline input, .field .inline select { flex: 1; min-width: 0; }
.field.check { display: flex; align-items: flex-start; gap: 8px; }
.field.check label { margin: 0; color: var(--fg); font-size: 13.5px; }
.toasts { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); z-index: 900; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; max-width: min(92vw, 560px); }
.toast { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 8px 14px; box-shadow: var(--shadow); pointer-events: auto; font-size: 13.5px; animation: toast-in 0.18s ease-out; }
.toast.warn { border-left-color: var(--warn); } .toast.error { border-left-color: var(--danger); } .toast.ok { border-left-color: var(--ok); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* the ft / in length control */
.len { display: inline-flex; align-items: center; gap: 3px; max-width: 100%; }
.len input { width: 4.2em; min-width: 0; min-height: 30px; padding: 3px 6px; text-align: right; }
.len input.len-in { width: 6.4em; }
.len input.bad { border-color: var(--danger); }
.len-u { color: var(--muted); font-size: 11.5px; margin-right: 4px; }
.st-len { display: inline-flex; align-items: center; gap: 3px; }
.st-len input { width: 3.8em; min-height: 28px; padding: 3px 6px; font-size: 13px; text-align: right; }
.st-len input#st-in { width: 6.2em; }
.d-pts .len input { width: 3.2em; } .d-pts .len input.len-in { width: 5.8em; }
.prop-grid .len input { width: 3.6em; } .prop-grid .len input.len-in { width: 6.4em; }

/* ---- layout.css ---- */
/* The shell: top bar, tool column, stage, side panels, status bar. Narrow screens restack. */
.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); }
.topbar, .toolbar, .side, .status, .tabs, .snapbar, .viewbar, .windows, .ctxmenu, .toasts, .tutorial { zoom: var(--ui); }
.topbar { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--panel); border-bottom: 1px solid var(--line); min-height: 44px; }
.brand { display: flex; align-items: center; gap: 6px; font-weight: 700; letter-spacing: 0.01em; padding-right: 8px; white-space: nowrap; }
.brand-mark { color: var(--accent); font-size: 18px; }
.menubar { display: flex; gap: 2px; }
.menubar > button { background: transparent; border-color: transparent; padding: 6px 10px; min-height: 32px; }
.menubar > button:hover, .menubar > button.open { background: var(--panel-2); border-color: transparent; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.ws-name { color: var(--muted); font-size: 13px; margin-right: 8px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.only-narrow { display: none; }

.screen-layout { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; min-height: 0; min-width: 0; }
.toolbar { display: flex; flex-direction: column; gap: 2px; padding: 6px 4px; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; width: 56px; align-items: center; }
.tool-btn { width: 46px; height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; background: transparent; border-color: transparent; padding: 2px; border-radius: 9px; }
.tool-btn .ico { font-size: 20px; line-height: 1; }
.tool-btn .lbl { font-size: 9px; line-height: 1.1; color: var(--muted); margin-top: 2px; max-width: 44px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool-btn.active .lbl { color: inherit; }
.tool-btn:hover:not(.active) { background: var(--panel-2); border-color: transparent; }
.tool-sep { width: 36px; border-top: 1px solid var(--line-2); margin: 4px 0; }

.stage { position: relative; overflow: hidden; background: var(--canvas); min-width: 0; min-height: 0; }
.canvas { position: absolute; left: 22px; top: 22px; touch-action: none; outline: none; display: block; }
.ruler { position: absolute; left: 22px; top: 0; }
.ruler-left { left: 0; top: 22px; }
.ruler-corner { position: absolute; left: 0; top: 0; width: 22px; height: 22px; background: var(--ruler); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 9px; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2; }
.snapbar { position: absolute; left: 30px; bottom: 44px; display: flex; gap: 4px; flex-wrap: wrap; max-width: calc(100% - 160px); z-index: 3; }
.snapbar button { min-height: 28px; padding: 2px 9px; font-size: 12px; border-radius: 999px; background: var(--panel); opacity: 0.92; }
.snapbar button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.viewbar { position: absolute; right: 10px; bottom: 44px; display: flex; flex-direction: column; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 2px; z-index: 3; }
.tabs { position: absolute; left: 22px; right: 0; bottom: 0; height: 32px; display: flex; align-items: flex-end; gap: 2px; padding: 0 6px; background: linear-gradient(to top, var(--panel) 70%, transparent); overflow-x: auto; z-index: 3; }
.tab { border: 1px solid var(--line); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--panel-2); padding: 4px 12px; min-height: 28px; font-size: 13px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.tab.active { background: var(--panel); color: var(--fg); font-weight: 600; border-color: var(--accent); border-bottom: 2px solid var(--panel); margin-bottom: -1px; }
.tab .sub { font-size: 11px; color: var(--muted); font-weight: 400; }
.tab-add { border-radius: 8px 8px 0 0; min-height: 28px; padding: 2px 10px; }
.float { position: absolute; inset: 0; pointer-events: none; }
.float > * { pointer-events: auto; }

.side { width: var(--side-w, 330px); position: relative; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side-grip { position: absolute; left: -5px; top: 0; bottom: 0; width: 10px; cursor: ew-resize; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.side-grip span { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); opacity: 0.55; }
.side-grip:hover span, .side-grip.dragging span { background: var(--accent); opacity: 1; }
.side-grip:hover, .side-grip.dragging { background: color-mix(in srgb, var(--accent) 18%, transparent); }
@media (max-width: 759px) { .side-grip { display: none; } }
.side-tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; }
.side-tabs button { flex: 1; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: 8px 4px; font-size: 12.5px; color: var(--muted); min-height: 38px; white-space: nowrap; }
.side-tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.side-body { flex: 1; overflow-y: auto; padding: 10px 12px 20px; min-height: 0; }

.status { display: flex; align-items: center; gap: 10px; padding: 3px 10px; background: var(--panel); border-top: 1px solid var(--line); min-height: 34px; font-size: 12.5px; color: var(--muted); }
.st-hint { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status input.st-input { width: 220px; min-height: 28px; padding: 3px 8px; font-size: 13px; }
.status input.st-input:focus { width: 300px; }
.st-pos, .st-solve, .st-save { white-space: nowrap; font-variant-numeric: tabular-nums; }
.st-solve.bad { color: var(--danger); font-weight: 600; } .st-solve.floating { color: var(--warn); }
.st-save.failed { color: var(--danger); }

/* menus */
.menu { position: fixed; z-index: 800; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; min-width: 220px; max-height: 80vh; overflow-y: auto; }
.menu button { display: flex; width: 100%; text-align: left; gap: 10px; align-items: center; background: transparent; border: 0; border-radius: 6px; padding: 7px 10px; min-height: 32px; }
.menu button:hover:not(:disabled) { background: var(--panel-2); }
.menu button .mk { width: 18px; text-align: center; color: var(--muted); }
.menu button .k { margin-left: auto; color: var(--muted); font-size: 11.5px; padding-left: 14px; }
.menu .sep { border-top: 1px solid var(--line-2); margin: 4px 6px; }
.menu .head { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 6px 10px 2px; }
.menu button.sub::after { content: "›"; margin-left: auto; color: var(--muted); }
.ctxmenu { position: fixed; z-index: 850; }
.backdrop { position: fixed; inset: 0; z-index: 790; }

@media (max-width: 759px) {
  .menubar { display: none; }
  .only-narrow { display: inline-flex; }
  .ws-name { display: none; }
  .screen-layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .toolbar { flex-direction: row; width: auto; height: 62px; border-right: 0; border-top: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; padding: 4px 6px; order: 2; justify-content: flex-start; }
  .tool-sep { width: 0; border-top: 0; border-left: 1px solid var(--line-2); height: 36px; margin: 0 4px; }
  .side { position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: auto; height: 58vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; box-shadow: var(--shadow); z-index: 60; transform: translateY(100%); transition: transform 0.2s; }
  .side.open { transform: none; }
  .side-tabs { padding-right: 44px; }
  .side-close { position: absolute; right: 6px; top: 4px; }
  .snapbar { bottom: 36px; max-width: calc(100% - 70px); }
  .viewbar { bottom: 36px; }
  .status .st-input { width: 140px; }
  .status .st-input:focus { width: 180px; }
  .st-pos { display: none; }
}
@media (min-width: 760px) { .side-close { display: none; } }

/* keypad for touch */
.keypad { position: absolute; right: 10px; bottom: 44px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: var(--shadow); z-index: 20; }
.kp-row { display: flex; gap: 4px; margin: 2px 0; }
.kp-row button { min-width: 44px; min-height: 40px; padding: 0 8px; font-size: 15px; }

/* tutorial */
.tutorial { position: fixed; left: 50%; bottom: 52px; transform: translateX(-50%); z-index: 700; zoom: var(--ui); }
.tutorial-box { width: min(92vw, 520px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 10px 14px; }
.tut-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.tut-text { line-height: 1.5; }
.tut-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.tut-highlight { outline: 3px solid var(--warn); outline-offset: 2px; border-radius: 8px; animation: tut-pulse 1.2s infinite; }
@keyframes tut-pulse { 50% { outline-color: transparent; } }

/* the mode switcher: three coloured modes; the top bar's bottom edge takes the current mode's colour */
:root { --mode-layout: #2b6fe6; --mode-measure: #e8890c; --mode-library: #8b5cf6; }
:root[data-theme="dark"] { --mode-layout: #4d8bff; --mode-measure: #f59e0b; --mode-library: #a78bfa; }
#app[data-screen="layout"] { --mode-color: var(--mode-layout); }
#app[data-screen="cutsheet"] { --mode-color: var(--mode-measure); }
#app[data-screen="designer"] { --mode-color: var(--mode-library); }
.topbar { border-bottom: 3px solid var(--mode-color, var(--line)); }
.modes { display: flex; gap: 3px; padding: 3px; margin: 0 8px 0 2px; background: var(--panel-2); border-radius: 11px; flex: none; }
.modes button { display: flex; align-items: center; gap: 7px; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 4px 14px; min-height: 32px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.modes button[data-mode="layout"] { --mc: var(--mode-layout); }
.modes button[data-mode="cutsheet"] { --mc: var(--mode-measure); }
.modes button[data-mode="designer"] { --mc: var(--mode-library); }
.modes .mi { width: 10px; height: 10px; border-radius: 50%; background: var(--mc); flex: none; }
.modes button:hover:not(.on) { color: var(--fg); background: color-mix(in srgb, var(--mc) 16%, transparent); border-color: transparent; }
.modes button.on { background: var(--mc); color: #fff; box-shadow: 0 1px 4px color-mix(in srgb, var(--mc) 45%, transparent); }
.modes button.on .mi { background: #fff; }
.modes .ml-short { display: none; }
@media (max-width: 759px) {
  .brand { display: none; }
  .topbar { gap: 2px; padding: 4px 4px; }
  .modes { margin: 0 4px 0 0; gap: 2px; }
  .modes button { padding: 4px 8px; gap: 5px; font-size: 13px; }
  .top-right .icon-btn { min-width: 32px; padding: 0 4px; }
  .modes button[data-mode="cutsheet"] .ml { display: none; }
  .modes button[data-mode="cutsheet"] .ml-short { display: inline; }
}

/* ---- panels.css ---- */
/* Side panels: properties, pieces, history, layers, constraints */
.prop-title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.prop-title .kind { font-weight: 400; color: var(--muted); font-size: 12px; }
.prop-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; margin: 8px 0; }
.prop-grid label { color: var(--muted); font-size: 12.5px; }
.prop-grid input { min-height: 30px; padding: 4px 8px; }
.lock-row { display: flex; gap: 4px; }
.lock-row button { flex: 1; min-height: 30px; padding: 2px 6px; font-size: 12.5px; }
.lock-row button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.list { display: flex; flex-direction: column; gap: 2px; }
.list-row { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; font-size: 13px; }
.list-row:hover { background: var(--panel-2); }
.list-row.current { background: var(--panel-2); font-weight: 600; }
.list-row .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row .icon-btn.small { opacity: 0.6; }
.list-row:hover .icon-btn.small { opacity: 1; }
.list-row.off { opacity: 0.5; }
.list-row input[type="checkbox"] { flex: none; }
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.btn-row button { padding: 5px 10px; min-height: 30px; font-size: 12.5px; }
table.pieces { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.pieces th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 4px; border-bottom: 1px solid var(--line-2); }
table.pieces td { padding: 5px 4px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
table.pieces tr.sel td { background: var(--panel-2); }
table.pieces tr.waste td { opacity: 0.55; }
table.pieces td.actions { white-space: nowrap; text-align: right; }
table.pieces .name { font-weight: 600; }
table.pieces .sub { display: block; color: var(--muted); font-size: 11px; }
.totals { font-size: 12.5px; color: var(--muted); margin-top: 8px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.totals b { color: var(--fg); font-weight: 600; }
.hist-row { cursor: pointer; }
.hist-row .n { color: var(--muted); font-variant-numeric: tabular-nums; width: 28px; text-align: right; }
.hist-row.future { opacity: 0.45; }
.hist-row .cp { color: var(--accent); font-size: 11px; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.lib-card { border: 1px solid var(--line); border-radius: 8px; padding: 6px; cursor: pointer; background: var(--panel); display: flex; flex-direction: column; gap: 4px; }
.lib-card:hover { border-color: var(--accent); }
.lib-card.sel { outline: 2px solid var(--accent); }
.lib-card svg { width: 100%; height: 52px; display: block; }
.lib-card .nm { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-card .sz { font-size: 11px; color: var(--muted); }
.search { width: 100%; margin-bottom: 8px; }
.constraint-row .type { font-weight: 500; }
.constraint-row.conflict { color: var(--danger); }
.constraint-row.redundant { color: var(--warn); }
.constraint-row.off { text-decoration: line-through; }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--panel-2); color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; padding: 14px 4px; text-align: center; line-height: 1.5; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12.5px; }
.kv span:nth-child(odd) { color: var(--muted); }

.lock-row button.hold-on { background: #f59e0b; border-color: #f59e0b; color: #fff; }

/* the Scene tab */
.scene-row { cursor: pointer; gap: 6px; align-items: flex-start; }
.scene-row > * { margin-top: 2px; }
.scene-row .grow { flex: 1 1 0; min-width: 0; white-space: normal; overflow: visible; line-height: 1.35; }
.scene-row .tag { margin-left: 4px; white-space: nowrap; }
.scene-row .scene-id { font-size: 12.5px; min-width: 2.6em; }
.scene-row .scene-val { white-space: nowrap; font-size: 12.5px; }
.scene-row .scene-dot { font-size: 10px; line-height: 1; }
.scene-row.current { background: color-mix(in srgb, var(--selection) 16%, var(--panel)); }
.scene-conf { color: var(--danger); text-transform: none; letter-spacing: 0; font-weight: 600; }
.tag.tag-bad { background: var(--danger); color: #fff; }
.field .inline input.place-angle { flex: none; width: 3.6em; text-align: right; }

/* a row whose pin / constraint is lit up on the drawing */
.list-row.lit { background: color-mix(in srgb, #ffe14d 22%, var(--panel)); box-shadow: inset 3px 0 0 #ffd000; }
.constraint-row .grow { cursor: pointer; }
.corner-box { border: 1px solid var(--line); border-radius: 9px; padding: 4px 10px 6px; margin: 8px 0; background: var(--panel-2); }
.inline-ang { display: flex; gap: 6px; align-items: center; min-width: 0; }
.inline-ang input { flex: 1; min-width: 0; }
.inline-ang button { flex: none; min-height: 30px; padding: 2px 8px; font-size: 12.5px; white-space: nowrap; }
.inline-ang button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

/* ---- windows.css ---- */
/* Floating windows, dialogs, settings */
.windows { position: fixed; inset: 0; pointer-events: none; z-index: 500; }
.window { position: absolute; pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 280px; min-height: 160px; overflow: hidden; }
.window.moving { opacity: 0.92; }
.win-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2); cursor: move; user-select: none; flex: none; }
.win-title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win-actions { display: flex; gap: 2px; }
.win-body { flex: 1; min-height: 0; overflow: auto; }
.win-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); flex: none; }
.win-edge { position: absolute; z-index: 2; }
.edge-n { top: -3px; left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
.edge-s { bottom: -3px; left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
.edge-e { right: -3px; top: 8px; bottom: 8px; width: 6px; cursor: ew-resize; }
.edge-w { left: -3px; top: 8px; bottom: 8px; width: 6px; cursor: ew-resize; }
.edge-ne { right: -3px; top: -3px; width: 12px; height: 12px; cursor: nesw-resize; }
.edge-sw { left: -3px; bottom: -3px; width: 12px; height: 12px; cursor: nesw-resize; }
.edge-nw { left: -3px; top: -3px; width: 12px; height: 12px; cursor: nwse-resize; }
.edge-se { right: -3px; bottom: -3px; width: 12px; height: 12px; cursor: nwse-resize; }
.window.sheet { inset: 0 !important; width: auto !important; height: auto !important; border-radius: 0; border: 0; }
.window.sheet .win-head { cursor: default; }
.window.sheet .win-edge { display: none; }

/* dialogs (prompt / confirm) */
.dialog { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.dialog p { margin: 0; }

/* settings */
.settings { display: grid; grid-template-columns: 170px 1fr; height: 100%; min-height: 0; }
.settings-nav { border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 8px; gap: 2px; overflow-y: auto; background: var(--panel-2); }
.settings-nav input { margin-bottom: 6px; min-height: 32px; }
.settings-nav button { text-align: left; background: transparent; border-color: transparent; padding: 7px 10px; min-height: 34px; border-radius: 8px; display: flex; align-items: center; gap: 8px; }
.settings-nav button .dot { width: 6px; height: 6px; margin-left: auto; }
.settings-nav button[aria-selected="true"] { background: var(--panel); border-color: var(--line); font-weight: 600; }
.settings-nav button:hover:not([aria-selected="true"]) { background: var(--panel); }
.settings-body { overflow-y: auto; padding: 12px 18px 24px; min-height: 0; }
.settings-body h2 { font-size: 16px; margin: 4px 0 10px; display: flex; align-items: center; gap: 10px; }
.settings-body h2 .spacer { flex: 1; }
.settings-body h2 button { font-size: 12px; min-height: 28px; padding: 3px 10px; }
.setting { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 9px 0; border-bottom: 1px solid var(--line-2); align-items: center; }
.setting .lbl { display: flex; align-items: center; gap: 6px; font-size: 13.5px; }
.setting .lbl .dot { width: 6px; height: 6px; }
.setting .ctl { min-width: 180px; display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.setting .ctl select, .setting .ctl input[type="text"], .setting .ctl input[type="number"] { min-height: 30px; padding: 3px 8px; width: 180px; }
.setting .ctl input[type="range"] { width: 130px; }
.setting .ctl .val { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; }
.setting .note { grid-column: 1 / -1; }
.setting .reset { opacity: 0; transition: opacity 0.1s; }
.setting:hover .reset, .setting.changed .reset { opacity: 1; }
.setting.changed .lbl { font-weight: 600; }
.setting-group { margin-top: 14px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.ws-row { display: flex; align-items: center; gap: 8px; padding: 8px 6px; border-bottom: 1px solid var(--line-2); }
.ws-row .nm { font-weight: 600; }
.ws-row .meta { color: var(--muted); font-size: 12px; display: block; }
.console { font: 12px/1.45 var(--mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-word; user-select: text; }
textarea.script { font: 12.5px/1.4 var(--mono); min-height: 90px; }
@media (max-width: 759px) {
  .settings { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .settings-nav { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); }
  .settings-nav input { width: 100%; }
  .setting { grid-template-columns: 1fr; }
  .setting .ctl { justify-content: flex-start; }
}

/* ---- screens.css ---- */
/* The Object Designer and the Cut Sheet screens */
.screen-designer, .screen-cutsheet { display: grid; grid-template-rows: auto 1fr; min-height: 0; background: var(--bg); }
.screen-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; zoom: var(--ui); }
.screen-head h2 { font-size: 15px; margin: 0 8px 0 0; }
.screen-head .spacer { flex: 1; }
.screen-main { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
.screen-main .pane { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 10px 12px 20px; zoom: var(--ui); }
.screen-main .draw { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--canvas); }
.screen-main .draw canvas { position: absolute; inset: 0; touch-action: none; display: block; }
.d-pts { display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 4px 6px; align-items: center; font-size: 12.5px; }
.d-pts input { min-height: 28px; padding: 3px 6px; }
.d-pts .i { color: var(--muted); text-align: right; }
.cs-list { font-size: 13px; }
.cs-list table { width: 100%; border-collapse: collapse; }
.cs-list th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px; border-bottom: 1px solid var(--line-2); font-size: 12px; }
.cs-list td { padding: 4px; border-bottom: 1px solid var(--line-2); font-variant-numeric: tabular-nums; }
.cs-list td.pt { font-weight: 700; }
.cs-list td.warn { color: var(--warn); }
.cs-print { display: none; }
@media (max-width: 759px) {
  .screen-main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .screen-main .pane { border-left: 0; border-top: 1px solid var(--line); max-height: 42vh; }
}

/* Measure pieces: list | drawing | measurements */
.screen-cutsheet { grid-template-rows: minmax(0, 1fr); }
.ms { display: grid; grid-template-columns: 250px minmax(0, 1fr) 310px; min-height: 0; height: 100%; }
.ms-list { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 8px; zoom: var(--ui); }
.ms-head { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 4px 6px 8px; }
.ms-group { font-size: 11.5px; color: var(--muted); padding: 10px 6px 4px; border-top: 1px solid var(--line-2); margin-top: 4px; }
.ms-item { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; }
.ms-item:hover { background: var(--panel-2); }
.ms-item.on { border-color: var(--mode-measure); background: color-mix(in srgb, var(--mode-measure) 13%, var(--panel)); }
.ms-item.waste { opacity: 0.55; }
.ms-prev { flex: none; width: 64px; height: 44px; color: var(--fg); }
.ms-prev svg { width: 64px; height: 44px; display: block; }
.ms-meta { min-width: 0; display: flex; flex-direction: column; }
.ms-meta .nm { font-weight: 700; }
.ms-meta .sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ms-badge { margin-left: auto; flex: none; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; background: var(--panel-2); color: var(--muted); }
.ms-badge.has { background: var(--mode-measure); color: #fff; }
.ms-draw { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--canvas); }
.ms-draw canvas { position: absolute; inset: 0; touch-action: none; display: block; outline: none; }
.ms-pane { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 10px 12px 20px; zoom: var(--ui); }
.ms-title { font-size: 16px; margin-bottom: 6px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { flex: 1; border: 0; border-radius: 0; min-height: 34px; background: transparent; padding: 4px 6px; font-size: 12.5px; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover:not(.on) { background: var(--panel-2); }
.seg button.on { background: var(--mode-measure); color: #fff; font-weight: 700; }
.ms-row { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 8px; cursor: pointer; }
.ms-row:hover { background: var(--panel-2); }
.ms-row.on { background: color-mix(in srgb, var(--mode-measure) 13%, var(--panel)); }
.ms-num { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--mode-measure); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.ms-val { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ms-type { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms-edit { display: flex; flex-direction: column; gap: 6px; padding: 2px 6px 10px 36px; }
.ms-check { display: flex; align-items: center; gap: 6px; font-size: 13.5px; margin: 6px 0; cursor: pointer; }
@media (max-width: 759px) {
  .ms { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
  .ms-list { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px; }
  .ms-head, .ms-group, .ms-list .btn-row { display: none; }
  .ms-item { flex: none; }
  .ms-meta .sub { display: none; }
  .ms-pane { border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; }
}

/* ---- print.css ---- */
/* Printing: only the cut sheet pages */
@media print {
  body { background: #fff; color: #000; overflow: visible; }
  .app > *:not(.print-only) { display: none !important; }
  .cs-print { display: block; }
  .cs-page { page-break-after: always; padding: 10mm; font: 12pt/1.4 var(--font); color: #000; }
  .cs-page:last-child { page-break-after: auto; }
  .cs-page h1 { font-size: 20pt; margin: 0 0 4pt; }
  .cs-page .meta { color: #333; margin-bottom: 8pt; }
  .cs-page svg { width: 100%; height: auto; max-height: 150mm; }
  .cs-page table { width: 100%; border-collapse: collapse; margin-top: 8pt; }
  .cs-page th, .cs-page td { border: 1px solid #999; padding: 3pt 5pt; text-align: left; font-variant-numeric: tabular-nums; }
  .cs-page th { background: #eee; }
  .cs-page td.pt { font-weight: 700; }
}

<body>
<div id="app" class="app" data-screen="layout">

  <!-- Top: name, menus, undo/redo, settings -->
  <header id="topbar" class="topbar">
    <div class="brand" title="Plan Cutter"><span class="brand-mark">▰</span><span class="brand-name">Plan Cutter</span></div>
    <nav id="modes" class="modes" aria-label="Mode">
      <button type="button" data-mode="layout" class="on" title="Draw the room and place and cut boards"><span class="mi"></span><span class="ml">Layout</span></button>
      <button type="button" data-mode="cutsheet" title="Measure the cut pieces for marking the real board (Enter on a selected piece)"><span class="mi"></span><span class="ml">Measure pieces</span><span class="ml-short">Measure</span></button>
      <button type="button" data-mode="designer" title="The library of boards and furniture (Ctrl+B)"><span class="mi"></span><span class="ml">Library</span></button>
    </nav>
    <nav id="menubar" class="menubar" aria-label="Menus"></nav>
    <div class="top-right">
      <span id="ws-name" class="ws-name" title="Workspace"></span>
      <button type="button" class="icon-btn" data-cmd="undo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
      <button type="button" class="icon-btn" data-cmd="redo" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
      <button type="button" class="icon-btn" data-act="settings" title="Settings" aria-label="Settings">⚙</button>
      <button type="button" class="icon-btn only-narrow" data-act="menu" title="Menu" aria-label="Menu">☰</button>
    </div>
  </header>

  <!-- Layout screen -->
  <main id="layout" class="screen screen-layout">
    <aside id="toolbar" class="toolbar" aria-label="Tools"></aside>

    <section id="stage" class="stage">
      <canvas id="ruler-top" class="ruler ruler-top"></canvas>
      <canvas id="ruler-left" class="ruler ruler-left"></canvas>
      <div id="ruler-corner" class="ruler-corner" title="Display unit"></div>
      <canvas id="canvas" class="canvas" tabindex="0" aria-label="Drawing"></canvas>
      <div id="snapbar" class="snapbar" aria-label="Snapping"></div>
      <div id="viewbar" class="viewbar">
        <button type="button" class="icon-btn" data-cmd="view.zoom" data-args='{"factor":1.25}' title="Zoom in (+)">+</button>
        <button type="button" class="icon-btn" data-cmd="view.zoom" data-args='{"factor":0.8}' title="Zoom out (−)">−</button>
        <button type="button" class="icon-btn" data-cmd="view.fit" title="Fit the drawing (F)">⤢</button>
        <button type="button" class="icon-btn" data-cmd="view.home" title="Home (H)">⌂</button>
      </div>
      <div id="tabs" class="tabs" aria-label="Surfaces"></div>
      <div id="float" class="float"></div>
    </section>

    <aside id="side" class="side">
      <div id="side-tabs" class="side-tabs" role="tablist"></div>
      <div id="side-body" class="side-body"></div>
    </aside>
  </main>

  <footer id="status" class="status">
    <span id="st-hint" class="st-hint"></span>
    <span id="st-len" class="st-len" hidden><input id="st-ft" class="num" type="text" inputmode="numeric" aria-label="feet" autocomplete="off"><span class="len-u">ft</span><input id="st-in" class="num" type="text" inputmode="decimal" aria-label="inches" autocomplete="off"><span class="len-u">in</span></span>
    <input id="st-input" class="st-input" type="text" placeholder="type a length or angle" aria-label="Typed input" autocomplete="off">
    <span id="st-pos" class="st-pos"></span>
    <span id="st-solve" class="st-solve"></span>
    <span id="st-save" class="st-save"></span>
  </footer>

  <!-- Other screens are built by their modules into these -->
  <section id="designer" class="screen screen-designer" hidden></section>
  <section id="cutsheet" class="screen screen-cutsheet" hidden></section>

  <div id="windows" class="windows"></div>
  <div id="ctxmenu" class="ctxmenu" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="tutorial" class="tutorial" hidden></div>
</div>
<script>
// ---- prelude.js ----
// Plan Cutter: the shared namespace, the log, the boot report and small helpers.
// Every other file adds to PC. Plain scripts, no modules: the page runs from file:// anywhere.
(function () {
  "use strict";
  var PC = window.PC || (window.PC = {});
  PC.VERSION = "0.1.0";
  PC.APP = "plancutter";

  // ---- log ---------------------------------------------------------------------------
  // A ring of the last lines, for the Advanced tab and for the verify harness.
  var lines = [];
  PC.log = function (level, msg, data) {
    var line = { t: Date.now(), level: level, msg: String(msg), data: data };
    lines.push(line);
    if (lines.length > 2000) lines.shift();
    if (level === "error") console.error("[PC]", msg, data !== undefined ? data : "");
    else if (level === "warn") console.warn("[PC]", msg, data !== undefined ? data : "");
    if (PC.events) PC.events.emit("log", line);
    return line;
  };
  PC.lines = lines;
  PC.info = function (m, d) { return PC.log("info", m, d); };
  PC.warn = function (m, d) { return PC.log("warn", m, d); };
  PC.error = function (m, d) { return PC.log("error", m, d); };
  if (typeof window.addEventListener === "function") {
    window.addEventListener("error", function (e) {
      PC.log("error", "Uncaught: " + (e.message || e), e.error && e.error.stack ? String(e.error.stack).split("\n").slice(0, 5).join("\n") : undefined);
    });
    window.addEventListener("unhandledrejection", function (e) {
      var r = e && e.reason;
      PC.log("error", "Unhandled failure: " + (r && r.message ? r.message : String(r)), r && r.stack ? String(r.stack).split("\n").slice(0, 5).join("\n") : undefined);
    });
  }

  // ---- events --------------------------------------------------------------------------
  function Emitter() { this.map = {}; }
  Emitter.prototype.on = function (name, fn) {
    (this.map[name] || (this.map[name] = [])).push(fn);
    var self = this;
    return function () { self.off(name, fn); };
  };
  Emitter.prototype.off = function (name, fn) {
    var l = this.map[name]; if (!l) return;
    var i = l.indexOf(fn); if (i >= 0) l.splice(i, 1);
  };
  Emitter.prototype.emit = function (name, a, b) {
    var l = this.map[name]; if (!l) return;
    l = l.slice();
    for (var i = 0; i < l.length; i++) {
      try { l[i](a, b); } catch (e) { PC.log("error", "listener for " + name + " failed: " + (e.message || e), e.stack); }
    }
  };
  PC.Emitter = Emitter;
  PC.events = new Emitter();

  // ---- helpers -------------------------------------------------------------------------
  PC.clamp = function (v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; };
  PC.lerp = function (a, b, t) { return a + (b - a) * t; };
  PC.near = function (a, b, eps) { return Math.abs(a - b) <= (eps === undefined ? 1e-9 : eps); };
  PC.deg = function (rad) { return rad * 180 / Math.PI; };
  PC.rad = function (deg) { return deg * Math.PI / 180; };
  PC.clone = function (v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); };
  PC.assign = function (target) {
    for (var i = 1; i < arguments.length; i++) {
      var s = arguments[i]; if (!s) continue;
      for (var k in s) if (Object.prototype.hasOwnProperty.call(s, k)) target[k] = s[k];
    }
    return target;
  };
  PC.esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  PC.debounce = function (fn, ms) {
    var t = null;
    var d = function () { var a = arguments, self = this; clearTimeout(t); t = setTimeout(function () { t = null; fn.apply(self, a); }, ms); };
    d.flush = function () { if (t) { clearTimeout(t); t = null; fn(); } };
    d.cancel = function () { clearTimeout(t); t = null; };
    return d;
  };
  PC.throttleFrame = function (fn) {
    var pending = false, args = null;
    return function () {

// ---- view.js ----
// The view: an infinite plane. The camera is a world point at the canvas centre and a zoom in
// pixels per inch. Y grows up in the world and down on the screen. Grids and rulers live here.
(function () {
  "use strict";
  var PC = window.PC, U = PC.units, ST = PC.settings;
  var V = PC.view = {};

  V.cam = { x: 48, y: 36, zoom: 4 };   // the active surface's camera (shared by reference)
  V.size = { w: 800, h: 600 };          // canvas size in CSS pixels
  V.MIN_ZOOM = 1e-5;                     // 1 mile = 0.6 px
  V.MAX_ZOOM = 4000;                     // 1/16 inch = 250 px

  V.setCamera = function (cam) { V.cam = cam; V.clampZoom(); };
  V.clampZoom = function () { V.cam.zoom = PC.clamp(V.cam.zoom, V.MIN_ZOOM, V.MAX_ZOOM); };
  V.toScreen = function (p) { return [V.size.w / 2 + (p[0] - V.cam.x) * V.cam.zoom, V.size.h / 2 - (p[1] - V.cam.y) * V.cam.zoom]; };
  V.toWorld = function (s) { return [V.cam.x + (s[0] - V.size.w / 2) / V.cam.zoom, V.cam.y - (s[1] - V.size.h / 2) / V.cam.zoom]; };
  V.pxToWorld = function (px) { return px / V.cam.zoom; };
  V.panBy = function (dxPx, dyPx) { V.cam.x -= dxPx / V.cam.zoom; V.cam.y += dyPx / V.cam.zoom; PC.events.emit("view"); };
  V.zoomAt = function (factor, screenPt) {
    var before = V.toWorld(screenPt);
    V.cam.zoom *= factor; V.clampZoom();
    var after = V.toWorld(screenPt);
    V.cam.x += before[0] - after[0]; V.cam.y += before[1] - after[1];
    PC.events.emit("view");
  };
  V.setZoom = function (zoom, screenPt) { V.zoomAt(zoom / V.cam.zoom, screenPt || [V.size.w / 2, V.size.h / 2]); };
  V.fitBox = function (bb, padPx) {
    if (!bb || !isFinite(bb.minX) || bb.w === undefined) return;
    padPx = padPx === undefined ? 60 : padPx;
    var w = Math.max(bb.w, 1), h = Math.max(bb.h, 1);
    var z = Math.min((V.size.w - 2 * padPx) / w, (V.size.h - 2 * padPx) / h);
    V.cam.zoom = PC.clamp(z, V.MIN_ZOOM, V.MAX_ZOOM);
    V.cam.x = (bb.minX + bb.maxX) / 2; V.cam.y = (bb.minY + bb.maxY) / 2;
    PC.events.emit("view");
  };
  V.home = function (bb) {
    if (bb && isFinite(bb.minX) && (bb.w > 0 || bb.h > 0)) V.fitBox(bb);
    else { V.cam.x = 48; V.cam.y = 36; V.cam.zoom = 4; PC.events.emit("view"); }
  };
  V.visibleWorld = function () {
    var a = V.toWorld([0, V.size.h]), b = V.toWorld([V.size.w, 0]);
    return { minX: a[0], minY: a[1], maxX: b[0], maxY: b[1], w: b[0] - a[0], h: b[1] - a[1] };
  };

  // ---- grids ------------------------------------------------------------------------------------
  // The levels to draw now: each {step (inches), px, alpha, label, major}
  V.gridLevels = function () {
    var ladder = U.gridLadder(ST.units()), minPx = ST.get("gridMinPx"), maxLevels = ST.get("gridLevels");
    var levels = [];
    for (var i = 0; i < ladder.length; i++) {
      var px = ladder[i].step * V.cam.zoom;
      if (px < minPx) continue;
      // fade in over the first doubling above minPx
      var alpha = PC.clamp((px - minPx) / minPx, 0.15, 1);
      levels.push({ step: ladder[i].step, px: px, alpha: alpha, label: ladder[i].label, index: i });
      if (levels.length >= maxLevels) break;
    }
    return levels;
  };
  // The ruler's tick step: the finest level with at least ~60 px between labelled ticks.
  V.rulerStep = function () {
    var ladder = U.gridLadder(ST.units());
    for (var i = 0; i < ladder.length; i++) {
      var px = ladder[i].step * V.cam.zoom;
      if (px >= 44) return { step: ladder[i].step, px: px, minor: i > 0 ? ladder[i - 1].step : ladder[i].step / 4, label: ladder[i].label };
    }
    var last = ladder[ladder.length - 1];
    return { step: last.step, px: last.step * V.cam.zoom, minor: ladder[ladder.length - 2].step, label: last.label };
  };
  V.snapToGrid = function (p) {
    var lv = V.gridLevels();
    if (!lv.length) return p;
    var s = lv[0].step;
    return [Math.round(p[0] / s) * s, Math.round(p[1] / s) * s];
  };

  V.tickLabel = function (inches) {

    if (unit.ftin) {

      return U.format(inches, "infrac", { fraction: ST.get("fraction") });
    }
    if (unit.family === "metric") {
      var mm = inches * 25.4;
      if (Math.abs(mm) >= 1000 && PC.near(mm % 1000, 0, 1e-6)) return (mm / 1000) + " m";
      if (Math.abs(mm) >= 10 && PC.near(mm % 10, 0, 1e-6)) return (mm / 10) + " cm";
      return Math.round(mm * 100) / 100 + " mm";

})();

      if (pick.kind === "line") return { kind: "line", ref: pick.id, p: pick.p };

  var tool = T.register({
    name: "measure", key: "d", label: "Measure", icon: "↔", mode: "distance",
    hint: "Click a point or line, then another. Point–point (aligned; switch to horizontal or vertical in Properties), point–line (perpendicular), line–line (the angle between them, or the gap when parallel). Click one line twice for its length. Then type a value to lock it.",
    cursor: "crosshair", showNodes: true,

// ---- tools/place.js ----
// Place by two distances: the tape-measure tool. Click two known points, type two distances,
// and a node lands where the two arcs meet, on the side nearest the cursor, with both distances
// locked. If a node was selected first, that node is constrained instead of a new one.
(function () {
  "use strict";
  var PC = window.PC, G = PC.geom, M = PC.model, ST = PC.settings, SN = PC.snap, T = PC.tools;
  function app() { return PC.app; }
  var st = null;  // {a, b (refs + points), d1, d2, cursor}

  function pointTarget(info) {
    var sn = info.snap;
    if (sn && (sn.kind === "node" || sn.kind === "corner" || sn.kind === "origin")) return { ref: sn.ref, p: sn.p };
    var pick = SN.pick(info.world, { anyNode: true });
    if (pick && pick.kind === "node") return { ref: pick.id, p: pick.p };
    if (pick && pick.kind === "corner") return { ref: pick.ref, p: pick.p };
    return null;
  }
  var tool = T.register({
    name: "place", key: "t", label: "Two distances", icon: "◬",
    hint: "Click the first known point, then the second. Type the distance from each (\"50\" Enter, \"70\" Enter). The point lands on the side nearest the cursor; Flip swaps sides.",
    cursor: "crosshair", showNodes: true,
    snap: function () { return { only: ["node", "corner"] }; },
    down: function () {},
    move: function (info) { if (st) st.cursor = info.world; var pick = SN.pick(info.world, { anyNode: true }); app().setHover(pick ? pick.id : null); },
    up: function (info) {
      var a = app();
      if (st && st.a && st.b) { st.cursor = info.world; if (st.d1 !== undefined && st.d2 !== undefined) finish(); return; }
      var t = pointTarget(info);
      if (!t) return;
      if (!st) {
        var selNode = a.selection.filter(function (id) { return M.kindOf(a.surface, id) === "node"; })[0];
        st = { a: t, target: selNode || null, cursor: info.world };
        PC.ui.status.hint("Now click the second known point");
      } else if (!st.b) {
        if (t.ref === st.a.ref) return;
        st.b = t;
        PC.ui.status.hint("Type the distance from the first point, then Enter");
        PC.ui.focusInput();
      }
    },
    cancel: function () { st = null; PC.ui.status.hint(); },
    onKey: function (e) { if (e.key === "Escape") { tool.cancel(); return true; } return false; },
    typed: function (text) {
      if (!st || !st.b) return false;
      var v = ST.parse(text); if (v === null || v <= 0) return false;
      if (st.d1 === undefined) { st.d1 = v; PC.ui.status.hint("Now the distance from the second point, then Enter"); PC.ui.focusInput(); return true; }
      st.d2 = v;
      finish();
      return true;
    },
    typedHint: "distance from the clicked point",
    draw: function (ctx, R) {
      if (!st) return;
      var V = PC.view, t = R.theme();
      ctx.strokeStyle = t.accent; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
      [st.a, st.b].forEach(function (pt, i) {
        if (!pt) return;

        var d = i === 0 ? st.d1 : st.d2;
        if (d !== undefined) { ctx.beginPath(); ctx.arc(p[0], p[1], d * V.cam.zoom, 0, Math.PI * 2); ctx.stroke(); }
      });
      ctx.setLineDash([]);

        sol.forEach(function (p, i) { var q = V.toScreen(p); ctx.fillStyle = R.withAlpha(t.accent, i === 0 ? 0.9 : 0.35); ctx.beginPath(); ctx.arc(q[0], q[1], 6, 0, Math.PI * 2); ctx.fill(); });
      }
    },

    a.record("Place by two distances", function () {
      var nid = state.target;

// ---- tools/cut.js ----
// Cut tool and the cut command. Pick a piece, pick the lines and shapes that cross it (they
// highlight and the seams preview in red), press Enter or Cut. Walls that stop inside the piece
// are extended along their line; shape edges are not. The piece becomes A-1, A-2 … and the
// original stays, hidden, as the dotted outline for the Cut Sheet.
(function () {
  "use strict";
  var PC = window.PC, G = PC.geom, M = PC.model, SN = PC.snap, T = PC.tools;
  function app() { return PC.app; }
  var st = null;  // {piece, cutters: [ids]}

  function preview() {
    var a = app();
    if (!st || !st.piece) { a.cutPreview = null; return; }
    var s = a.surface, ws = a.ws, pc = M.piece(s, st.piece);
    if (!pc) { a.cutPreview = null; return; }
    var outline = M.pieceWorld(s, pc, ws), segs = [];
    st.cutters.forEach(function (id) { M.segmentsOf(s, id, ws).forEach(function (sg) { if (G.segmentTouchesPolygon(sg[0], sg[1], outline)) segs.push(sg); }); });
    a.cutPreview = { piece: pc.id, segments: segs };
  }
  var tool = T.register({
    name: "cut", key: "x", label: "Cut", icon: "✂",
    hint: "Click a piece, then click each wall or shape that crosses it (click again to drop one). Enter or the Cut button cuts.",
    cursor: "crosshair",
    snap: function () { return false; },
    down: function () {},
    move: function (info) { var pick = SN.pick(info.world); app().setHover(pick ? pick.id : null); },
    up: function (info) {
      var a = app(), s = a.surface;
      var pick = SN.pick(info.world);
      if (!pick) return;
      if (pick.kind === "piece" && (!st || !st.cutters.length || !st.piece)) { st = { piece: pick.id, cutters: [] }; a.select([pick.id], "set"); PC.ui.status.hint("Now click the walls and shapes that cross it, then Enter"); preview(); return; }
      if (!st) return;
      if (pick.kind === "line" || pick.kind === "shape" || (pick.kind === "piece" && pick.id !== st.piece)) {
        var i = st.cutters.indexOf(pick.id);
        if (i >= 0) st.cutters.splice(i, 1); else st.cutters.push(pick.id);
        a.select([st.piece].concat(st.cutters), "set");
        preview();
      }
    },
    cancel: function () { st = null; app().cutPreview = null; PC.ui.status.hint(); },
    onKey: function (e) {
      if (e.key === "Escape") { tool.cancel(); return true; }
      if (e.key === "Enter") { tool.run(); return true; }
      return false;
    },
    run: function () {
      var a = app();
      if (!st || !st.piece) {
        // from the selection: one piece plus lines/shapes
        var s = a.surface, piece = a.selection.filter(function (id) { return M.kindOf(s, id) === "piece"; })[0];
        var cutters = a.selection.filter(function (id) { var k = M.kindOf(s, id); return k === "line" || k === "shape" || (k === "piece" && id !== piece); });
        if (!piece || !cutters.length) { PC.ui.toast("Select a piece and the walls or shapes that cross it, then Cut.", "warn"); return; }
        st = { piece: piece, cutters: cutters };
      }
      if (!st.cutters.length) { PC.ui.toast("Click the walls or shapes that cross the piece first.", "warn"); return; }
      var res = a.cmd("piece.cut", { id: st.piece, by: st.cutters });

    state: function () { return st; },

  // Why a cut divides nothing: name every loose end of the chosen walls that stops inside the
  // piece (not joined to another chosen wall) and how far it is from the piece's edge.
  PC.cutWhyNot = function (s, pc, outline, cutterIds) {

    var loose = ends.filter(function (e) {
      var shared = ends.some(function (o) { return o !== e && o.node === e.node; });
      var p = M.point(s, e.node);

    faces.forEach(function (f, i) {

      return M.exportCut(ws, s, list);
    }
    if (what === "library") return { format: "plancutter-library", version: 1, pieces: ws.library.map(M.exportPiece) };
    throw new Error("Export what? workspace, surface, piece, cut or library");
  };

  // ---- screens ------------------------------------------------------------------------------------------
  A.showScreen = function (name, id) {
    if (A.screen === "designer" && name !== "designer" && PC.designer.canLeave && !PC.designer.canLeave()) return;
    A.screen = name;
    PC.$$("#modes [data-mode]").forEach(function (b) { b.classList.toggle("on", b.dataset.mode === name); b.setAttribute("aria-pressed", String(b.dataset.mode === name)); });
    PC.$("#app").dataset.screen = name;
    PC.$("#layout").hidden = name !== "layout";
    PC.$("#status").hidden = name !== "layout";
    PC.$("#designer").hidden = name !== "designer";
    PC.$("#cutsheet").hidden = name !== "cutsheet";
    if (name === "designer") PC.designer.show(id);
    else if (name === "cutsheet") PC.cutsheet.show(id);
    else { PC.render.resize(); PC.render.invalidate(); }
    PC.events.emit("screen", name);
  };

  // ---- boot ------------------------------------------------------------------------------------------------
  A.boot = function () {
    PC.ui.applyTheme();
    PC.render.init(PC.$("#canvas"), PC.$("#ruler-top"), PC.$("#ruler-left"));
    PC.input.init(PC.$("#canvas"));
    PC.windows.init();
    PC.ui.init();
    var ro = new ResizeObserver(function () { PC.render.resize(); PC.render.invalidate(); });
    ro.observe(PC.$("#stage"));
    PC.render.resize();
    A.setTool("select");
    PC.events.on("settings", function (ev) {
      if (ev.key === "theme" || ev.key === "*" || ev.key === "uiScale") PC.ui.applyTheme();
      if (ev.key === "rulers" || ev.key === "*") PC.render.resize();
      if (ev.key === "historyLimit") H.LIMIT = ST.get("historyLimit");
      PC.render.invalidate(); PC.ui.refreshSnapbar(); PC.ui.refreshTools(); PC.ui.status.zoom();
      if (A.surface && (ev.key === "units" || ev.key === "*" || ev.key === "fraction")) PC.ui.refreshPanels();
    });
    window.addEventListener("beforeunload", function () { if (A.ws) PC.store.flush(A.ws); });
    document.addEventListener("visibilitychange", function () { if (document.hidden && A.ws) PC.store.flush(A.ws); });
    // open the last workspace, else start a new one
    PC.store.getMeta("lastWorkspace").then(function (id) {
      if (id) return A.openWorkspace(id).catch(function (e) { PC.warn("Last workspace did not open: " + e.message); return A.newWorkspace("My home"); });
      return PC.store.listWorkspaces().then(function (list) { return list.length ? A.openWorkspace(list[0].id) : A.newWorkspace("My home"); });
    }).catch(function (e) {
      PC.error("Storage unavailable: " + e.message);
      PC.ui.toast("This browser will not keep work between visits (" + e.message + "). Export files to save.", "error");
      A.loadWorkspace(M.newWorkspace("My home")); A.home();
    }).then(function () {
      PC.commands.runHash();
      if (!localStorage.getItem("plancutter.seen")) { localStorage.setItem("plancutter.seen", "1"); PC.tutorial.offer(); }
    });
    PC.info("Plan Cutter " + PC.VERSION + " started");
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", A.boot); else A.boot();
})();

</script>
