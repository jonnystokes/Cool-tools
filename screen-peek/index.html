<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen Peek</title>
<style>
  :root { color-scheme: dark; --bg: #111; --bar: #1d1d1d; --card: #222; --line: #444; --text: #eee; --dim: #9a9a9a;
          --go: #2a6; --warn: #d9a400; --bad: #e05555; --off: #777; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px; background: var(--bar); }
  button, select { min-height: 48px; padding: 0 16px; font-size: 1em; border-radius: 10px; border: 1px solid #555; background: #333; color: var(--text); }
  button.on { background: var(--go); border-color: var(--go); }
  #cont { min-width: 11.5em; font-weight: 600; }
  #conn { display: flex; align-items: center; gap: 8px; flex: 1 1 14em; min-width: 0; font-size: 0.92em; }
  #dot { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--off); }
  #dot.live { background: var(--go); } #dot.wait { background: var(--warn); } #dot.bad { background: var(--bad); }
  #conntext { overflow-wrap: anywhere; }
  canvas { display: block; width: 100%; height: auto; background: #000; }
  #stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5em, 1fr)); gap: 6px; padding: 8px; }
  .s { background: var(--card); border-radius: 8px; padding: 6px 8px; }
  .s b { display: block; font-size: 1.05em; font-variant-numeric: tabular-nums; }
  .s span { font-size: 0.78em; color: var(--dim); }
  details { margin: 8px; background: var(--card); border-radius: 10px; padding: 4px 10px 10px; }
  summary { min-height: 44px; display: flex; align-items: center; font-weight: 600; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(12em, 1fr)); gap: 10px; }
  label { display: grid; gap: 4px; font-size: 0.9em; color: var(--dim); min-width: 0; }
  .grid select { width: 100%; min-width: 0; max-width: 100%; text-overflow: ellipsis; }   /* long option text stays inside its column */
  label.chk { display: flex; align-items: center; gap: 10px; min-height: 48px; color: var(--text); }
  label.chk input { width: 26px; height: 26px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
  #log { max-height: 45vh; overflow: auto; margin: 6px 0 0; padding: 8px; background: #000; border-radius: 8px; font: 12px ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  .err { color: #f77; }
  #login { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; background: rgba(0, 0, 0, 0.75); }
  #login.show { display: grid; }
  #login form { display: grid; gap: 10px; width: min(22rem, calc(100vw - 32px)); padding: 18px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  #login h2 { margin: 0; font-size: 1.15em; }
  #login p { margin: 0; color: var(--dim); font-size: 0.9em; }
  #login input { min-height: 48px; padding: 0 12px; font-size: 1em; border-radius: 10px; border: 1px solid #555; background: #333; color: var(--text); }
  #login button { background: var(--go); border-color: var(--go); }
</style>
</head>
<body>
<header>
  <button id="cont">Continuous: off</button>
  <button id="one">Single</button>
  <div id="conn"><span id="dot"></span><span id="conntext">Ready.</span></div>
</header>
<canvas id="pic" width="16" height="9"></canvas>
<div id="stats"></div>
<details id="setbox">
  <summary>Settings</summary>
  <div class="grid">
    <label>Transport<select id="transport">
      <option value="ws">TCP: WebSocket (one socket)</option>
      <option value="stream">TCP: stream (one long response)</option>
      <option value="pipe">TCP: pipelined requests</option>
      <option value="pull">TCP: one request per frame</option>
      <option value="udp-fast" selected>UDP, fastest: lost pieces never resent</option>
      <option value="udp-mid">UDP, middle: resent while fresh</option>
      <option value="udp-rel">UDP, reliable (for comparison)</option>
    </select></label>
    <label>UDP middle: resend window<select id="life">
      <option value="50">50 ms</option><option value="100">100 ms</option><option value="200" selected>200 ms</option><option value="500">500 ms</option>
    </select></label>
    <label>Quality mode<select id="mode">
      <option value="manual" selected>Manual: width + quality below</option><option value="auto">Auto: best picture that holds the latency target</option>
    </select></label>
    <label>Latency target (queue limit; Auto steps down for it)<select id="target">
      <option value="50">50 ms</option><option value="100" selected>100 ms</option><option value="200">200 ms</option><option value="400">400 ms</option>
    </select></label>
    <label>Picture width (manual)<select id="w">
      <option value="640">640 px</option><option value="960">960 px</option><option value="1280">1280 px</option><option value="0" selected>full</option>
    </select></label>
    <label>Quality (manual)<select id="q">
      <option value="40">40</option><option value="60">60</option><option value="75">75</option><option value="85" selected>85</option>
    </select></label>
    <label>Format<select id="fmt"><option value="jpeg" selected>JPEG</option><option value="webp">WebP (smaller, ~10× slower to make)</option></select></label>
    <label>Frame-rate cap<select id="fps">
      <option value="5">5 per s</option><option value="10">10 per s</option><option value="15">15 per s</option>
      <option value="30">30 per s</option><option value="60">60 per s</option><option value="0" selected>no cap</option>
    </select></label>
    <label>Frames in flight at the start (then measured)<select id="win">
      <option value="1">1</option><option value="2">2</option><option value="3" selected>3</option>
    </select></label>
    <label>Full refresh (with partial updates)<select id="refresh">
      <option value="5">every 5 s</option><option value="10">every 10 s</option><option value="30">every 30 s</option>
      <option value="60">every 60 s</option><option value="0" selected>never</option>
    </select></label>
  </div>
  <label class="chk"><input type="checkbox" id="partial" checked> Partial updates: send only the parts that changed</label>
  <label class="chk"><input type="checkbox" id="force"> Send unchanged frames too (for measuring)</label>
  <label class="chk"><input type="checkbox" id="verify"> Verify every frame (CRC32 check, counts mismatches)</label>
  <label class="chk"><input type="checkbox" id="wake" checked> Keep the screen on (Wake Lock): <span id="wakestate">…</span></label>
  <div class="row"><button id="out">Sign out</button></div>
</details>
<details id="logbox" open>
  <summary>Log</summary>
  <div class="row"><button id="copy">Copy log</button><button id="save">Save log</button><button id="clear">Clear</button></div>
  <pre id="log"></pre>
</details>
<div id="login">
  <form id="lf">
    <h2>Screen Peek</h2>
    <p>Enter the password set on the PC (tray icon → Set password). This browser stays signed in.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <button type="submit">Sign in</button>
    <p id="lerr" class="err"></p>
  </form>
</div>
<script>
"use strict";
// Jon's PC (Tailscale Funnel). Opened from the PC itself (or its own address), the page talks to its own server.
const PC = "https://desktop-krq9ti2.tail46434.ts.net";
const own = ["127.0.0.1", "localhost"].includes(location.hostname) || location.hostname.endsWith(".ts.net");
const BASE = (own ? location.origin : PC) + "/";
const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
                set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} } };
const now = () => performance.timeOrigin + performance.now();      // this device's clock, ms
const dec = new TextDecoder();
const VID = Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => b.toString(16).padStart(2, "0")).join("");
let TOKEN = store.get("peek-token");
const h = new URLSearchParams(location.hash.slice(1));               // an old pairing link (#key=...) still works
if (h.get("key")) { TOKEN = h.get("key"); store.set("peek-token", TOKEN); }
if (location.hash) history.replaceState(null, "", location.pathname + location.search);

// ---- Log: events with 12-hour times, plus a stats line every second while Continuous is on ----------
const LOG = [], logEl = $("log");
function clock12(ms, withMs = true) {
  const d = new Date(ms), hr = d.getHours() % 12 || 12, p = (n, w = 2) => String(n).padStart(w, "0");
  return `${hr}:${p(d.getMinutes())}:${p(d.getSeconds())}${withMs ? "." + p(d.getMilliseconds(), 3) : ""} ${d.getHours() < 12 ? "AM" : "PM"}`;
}
function log(msg) {
  const line = `${clock12(now())}  ${msg}`;
  LOG.push(line);
  const nearEnd = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 30;
  logEl.appendChild(document.createTextNode(line + "\n"));
  if (LOG.length > 20000) { LOG.shift(); logEl.removeChild(logEl.firstChild); }
  if (nearEnd) logEl.scrollTop = logEl.scrollHeight;
}
$("copy").onclick = async () => {
  const text = LOG.join("\n");
  try { await navigator.clipboard.writeText(text); log(`log copied (${LOG.length} lines)`); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); log(ok ? `log copied (${LOG.length} lines)` : "copy failed: use Save log");
  }
};
$("save").onclick = () => {
  const a = document.createElement("a"), d = new Date();
  a.href = URL.createObjectURL(new Blob([LOG.join("\n") + "\n"], { type: "text/plain" }));
  a.download = `screen-peek-log-${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}-${clock12(now(), false).replace(/[: ]/g, "")}.txt`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
$("clear").onclick = () => { LOG.length = 0; logEl.textContent = ""; };

// ---- Settings (remembered in this browser) ------------------------------------------------------------
const KEYS = ["transport", "mode", "target", "w", "q", "fmt", "fps", "win", "refresh", "life"], CHECKS = ["partial", "force", "verify"];
const PAGE_ONLY = ["verify"];                                       // used only here: no new data path needed
const S = {};
function readSettings() {
  for (const k of KEYS) S[k] = $(k).value;
  for (const k of CHECKS) S[k] = $(k).checked;
  S.auto = S.mode === "auto";
}
const PC_ = { srv: null, auto: null };                              // the PC's last per-second report of THIS data path, Auto's choice
const FZ = { on: false, n: 0, longest: 0 }, AUTO_LOG = [];          // freezes: the PC sends, nothing gets drawn
try { const saved = JSON.parse(store.get("peek-settings-v3") || "{}");
      for (const k of KEYS) if (saved[k] != null && [...$(k).options].some((o) => o.value === saved[k])) $(k).value = saved[k];
      for (const k of CHECKS) if (saved[k] != null) $(k).checked = !!saved[k];
      if (saved.wake != null) $("wake").checked = !!saved.wake; } catch (e) {}
readSettings();
const qs = () => `w=${S.w}&q=${S.q}&fmt=${S.fmt}&fps=${S.fps}&win=${S.win}&force=${S.force ? 1 : 0}&partial=${S.partial ? 1 : 0}&refresh=${S.refresh}&auto=${S.auto ? 1 : 0}&target=${S.target}`;
const settingsText = () => `${S.transport}, ${S.auto ? "Auto" : (S.w === "0" ? "full" : S.w + " px") + ", q" + S.q}, target ${S.target} ms, ${S.fmt}, cap ${S.fps === "0" ? "none" : S.fps + "/s"}, ` +
  `start window ${S.win}, ${S.partial ? "partial updates (full every " + (S.refresh === "0" ? "never" : S.refresh + " s") + ")" : "full frames"}${S.force ? ", unchanged frames too" : ""}`;
for (const k of [...KEYS, ...CHECKS]) $(k).addEventListener("change", () => {
  readSettings();
  store.set("peek-settings-v3", JSON.stringify({ ...S, wake: $("wake").checked }));
  log(`settings: ${settingsText()}`);
  // Any change that matters to the PC gets a whole new data path: the old one is stopped on both sides first,
  // and the new one starts with a full frame (round 5: a changed setting never rides on an old, possibly stuck path).
  if (!PAGE_ONLY.includes(k) && conn.want) dataStart(`settings changed (${k})`);
});

// ---- Clock sync with the PC (NTP-style, over the control connection) ---------------------------------
// The sample with the smallest error bound wins: half its round trip, plus 0.1 ms per second of age (the two clocks
// drift apart). So one quiet sample keeps beating many that queued behind other traffic (those made the
// "latency -395 ms" after reconnects in Jon's round-5 run), and a new server process starts it over.
const sync = { samples: [], offset: 0, rtt: null, best: null, ok: false };
function addSync(t0, srv, t1) {
  const t = now();
  sync.samples.push({ rtt: t1 - t0, off: srv - (t0 + t1) / 2, at: t1 });
  sync.samples = sync.samples.filter((s) => t - s.at < 600000).slice(-64);
  const err = (s) => s.rtt / 2 + (t - s.at) * 1e-4;
  const best = sync.samples.reduce((a, b) => (err(b) < err(a) ? b : a));
  sync.offset = best.off; sync.rtt = t1 - t0; sync.best = best.rtt; sync.ok = true;
}

// ---- Applying updates: full frames, and partial updates (changed tiles) that must land in order ------
// D.seq = the picture the canvas shows once the queue is drawn. A full frame replaces everything queued;
// a partial update applies when base <= D.seq < seq (it holds every tile changed since its base);
// one that arrives early (pipelined replies can overtake) waits; after 1 s of waiting we ask for a full frame.
const canvas = $("pic"), ctx = canvas.getContext("2d", { alpha: false });
const D = { ep: null, seq: 0, wait: [], waitSince: 0, askedAt: 0 }, Q = [];
let drawing = false;
function show(hdr, blob, ack) {
  W.recv++; T.recv++; W.bytes += hdr.n; W.fullBytes += hdr.kind === "d" ? hdr.fn : hdr.n;
  T.bytes += hdr.n; T.fullBytes += hdr.kind === "d" ? hdr.fn : hdr.n;
  conn.lastData = now();
  const it = { hdr, blob, ack, at: now() };
  if (hdr.ep !== D.ep) { D.ep = hdr.ep; D.seq = 0; for (const w of D.wait.splice(0)) drop(w); }
  if (hdr.kind !== "d") {
    if (D.seq && hdr.seq <= D.seq) return drop(it);
    for (const q of Q.splice(0)) drop(q, true);       // a full frame makes everything still queued unneeded
    D.seq = hdr.seq; Q.push(it);
  } else if (hdr.seq <= D.seq) return drop(it);
  else if (hdr.base <= D.seq) { D.seq = hdr.seq; Q.push(it); }
  else { D.wait.push(it); if (!D.waitSince) D.waitSince = now(); if (!D.seq) needFull(); }   // no base at all: ask at once
  for (let moved = true; moved && D.wait.length; ) {  // early arrivals that can go now
    moved = false;
    for (const w of [...D.wait]) {
      if (w.hdr.seq <= D.seq) { D.wait.splice(D.wait.indexOf(w), 1); drop(w); moved = true; }
      else if (w.hdr.base <= D.seq) { D.wait.splice(D.wait.indexOf(w), 1); D.seq = w.hdr.seq; Q.push(w); moved = true; }
    }
  }
  if (!D.wait.length) D.waitSince = 0;
  paintQueue();
}
function drop(it, counted) { if (counted) { W.dropped++; T.dropped++; } if (it.ack) it.ack(); }
// Optional check of every frame against the CRC32 the PC put in its header. TCP, TLS and DTLS already
// throw damaged packets away, so a mismatch here would be a bug in our own reassembly.
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
const CHK = { ok: 0, bad: 0 };
function verify(hdr, u8) {
  if (!S.verify || hdr.crc == null) return;
  if (crc32(u8) === hdr.crc) CHK.ok++;
  else if (++CHK.bad <= 5) log(`CRC mismatch on update ${hdr.seq} (${hdr.n} bytes)`);
}
function pcReport(m) {                               // the PC's own view of this data path
  if (m.type === "srv") { m.at = now(); PC_.srv = m; }
  else if (m.type === "auto") { PC_.auto = m; AUTO_LOG.push(`${m.w || "full"}/q${m.q}: ${m.why || ""}`); log(`Auto: now ${m.w ? m.w + " px" : "full width"}, quality ${m.q} (step ${m.level}): ${m.why || ""}`); }
}
// UDP: what the data channel delivered (frames put together, dropped when incomplete at the deadline, late pieces).
const U = { chunks: 0, complete: 0, dropped: 0, late: 0, rtt: null, pair: "" };
function needFull(quiet) {                          // updates can't be applied: ask for a full frame now
  if (now() - D.askedAt < 1000 || !conn.live || !conn.live.full) return;
  D.askedAt = now(); T.asked++;
  if (!quiet) log(D.seq ? `asked for a full frame (an update has had no base for ${r0(now() - D.waitSince)} ms)` : "no base picture: asked for a full frame");
  conn.live.full();
}
async function paintQueue() {
  if (drawing) return;
  drawing = true;
  while (Q.length) {
    const it = Q.shift();
    try { await paint(it); } catch (e) { T.bad++; log(`an update did not decode: ${e.name}: ${e.message}`); }
    if (it.ack) it.ack();
  }
  drawing = false;
}
async function paint(it) {
  const h = it.hdr, t0 = now();
  if (!h.n) return drawn(h, it, 0, 0);               // a forced frame with no changed tiles
  const bmp = await createImageBitmap(it.blob);
  const t1 = now();
  if (h.kind !== "d") {
    if (canvas.width !== bmp.width || canvas.height !== bmp.height) { canvas.width = bmp.width; canvas.height = bmp.height; }
    ctx.drawImage(bmp, 0, 0);
  } else {
    for (const [x, y, w, hh, ax, ay] of h.rects) ctx.drawImage(bmp, ax, ay, w, hh, x, y, w, hh);
  }
  bmp.close();
  drawn(h, it, t1 - t0, now() - t1);
}

// ---- Stats: this second (W), since Continuous went on (T) --------------------------------------------
let W, T;
function resetW() { W = { t: now(), recv: 0, drawn: 0, dropped: 0, bytes: 0, fullBytes: 0, iv: [], lat: [], idle: 0, dec: [], drw: [], net: [] }; }
function resetT() { T = { t: now(), recv: 0, drawn: 0, dropped: 0, bad: 0, idle: 0, asked: 0, full: 0, part: 0, first: null, lastDraw: 0, h: null,
                         bytes: 0, fullBytes: 0, ivs: [], lats: [], decs: [], nets: [], paths: 0, firsts: [] };
                    Object.assign(U, { chunks: 0, complete: 0, dropped: 0, late: 0 }); Object.assign(CHK, { ok: 0, bad: 0 }); Object.assign(FZ, { on: false, n: 0, longest: 0 }); }
resetW(); resetT();
function drawn(hdr, it, dec, drw) {
  const t = now();
  W.drawn++; T.drawn++; hdr.kind === "d" ? T.part++ : T.full++;
  if (T.lastDraw) { W.iv.push(t - T.lastDraw); T.ivs.push(t - T.lastDraw); }
  T.lastDraw = t;
  W.dec.push(dec); W.drw.push(drw); T.decs.push(dec);
  if (sync.ok) {
    const lat = t - (hdr.cap - sync.offset), net = it.at - (hdr.cap - sync.offset) - (hdr.r || 0) - (hdr.c || 0) - (hdr.e || 0);
    W.lat.push(lat); W.net.push(net); T.lats.push(lat); T.nets.push(net);
  }
  T.h = hdr;
  if (conn.live && conn.firstOnPath == null) {
    conn.firstOnPath = t - conn.pathAt; T.firsts.push(conn.firstOnPath);
    log(`first frame on data path ${conn.live.gen}: ${r0(conn.firstOnPath)} ms after it started`);
  }
  if (conn.onAt && T.first === null) {
    T.first = t - conn.onAt;
    log(`first frame ${Math.round(T.first)} ms after Continuous on (control connection ${conn.warmAtOn ? "already open: warm" : "new: cold"})`);
  }
}
const med = (a) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); return s[s.length >> 1]; };
const mean = (a) => a.reduce((x, y) => x + y, 0) / (a.length || 1);
const sd = (a) => { const m = mean(a); return Math.sqrt(mean(a.map((x) => (x - m) ** 2))); };
const r0 = (x) => (x == null || !isFinite(x) ? "–" : Math.round(x));
const statsEl = $("stats");
const CELLS = ["fps", "interval", "latency", "ping", "breakdown", "size", "rate", "frames", "pc", "flow", "conn", "first", "check"];
const cell = {};
for (const k of CELLS) { const d = document.createElement("div"); d.className = "s"; d.innerHTML = "<b>–</b><span></span>"; statsEl.appendChild(d); cell[k] = d; }
cell.breakdown.style.gridColumn = cell.size.style.gridColumn = cell.flow.style.gridColumn = "span 2";
function put(k, big, small) { cell[k].firstChild.textContent = big; cell[k].lastChild.textContent = small; }
let lastTick = now();
function tick() {                                   // once a second (browsers slow this down in background tabs)
  const t = now(), gap = t - lastTick; lastTick = t;
  const late = gap > 2000;                           // our own timers were held back (background, freeze)
  const secs = (t - W.t) / 1000, fps = W.drawn / secs, iv = mean(W.iv), jit = sd(W.iv), lat = med(W.lat);
  const kb = W.recv ? W.bytes / W.recv / 1024 : 0, fullKb = W.recv ? W.fullBytes / W.recv / 1024 : 0, mbps = W.bytes * 8 / secs / 1e6;
  const h = T.h, live = conn.live, ps = PC_.srv;
  put("fps", fps.toFixed(1), `per s (${W.recv} in, ${W.dropped} dropped)`);
  put("interval", W.iv.length ? `${r0(iv)} ± ${r0(jit)} ms` : "–", "frame interval ± jitter");
  put("latency", lat == null ? "–" : `${r0(lat)} ms`, sync.ok ? "capture → on screen (est.)" : "waiting for clock sync");
  put("ping", sync.rtt == null ? "–" : `${r0(sync.rtt)} ms`, `control round trip (best ${r0(sync.best)}, clock ±${r0((sync.best || 0) / 2)})`);
  put("breakdown", h ? `${h.g} + ${h.r} + ${h.c} + ${h.e} + ${r0(med(W.net))} + ${(med(W.dec) || 0).toFixed(1)} + ${(med(W.drw) || 0).toFixed(1)} ms` : "–",
      `capture + scale + compare + encode (PC, ${h ? h.be : "?"}) + send + decode + draw (here)`);
  put("size", W.recv ? `${kb.toFixed(1)} KB` : "–", W.recv && fullKb > kb * 1.05 ? `sent per frame; full frame would be ${r0(fullKb)} KB (${r0(100 - 100 * kb / fullKb)}% saved)` :
      (h ? `per frame, ${h.w}×${h.h}${h.kind === "d" ? `, ${h.tiles} of ${h.of} tiles` : ""}` : "per frame"));
  put("rate", `${mbps.toFixed(2)} Mbps`, "data rate");

        if (dead) return;
        if (r.status === 401) return t.fail("the PC refused the sign-in", "auth");
        if (r.status !== 200 && r.status !== 204) return t.fail(httpWhy(r.status), r.status === 410 ? "session" : undefined);
        if (!t.ready) { clearTimeout(startTimer); t.ready = true; onUp(gen, kind === "pipe" ? `${n} requests in flight` : "one request per frame"); }
        conn.lastData = now();
        if (r.status === 204) { W.idle++; T.idle++; continue; }
        const hdr = JSON.parse(r.headers.get("X-Frame"));
        const reader = r.body.getReader(), parts = [];
        let got = 0;
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          parts.push(value); got += value.length; conn.lastData = now(); arm();
        }
        const body = new Uint8Array(got);
        for (let i = 0, off = 0; i < parts.length; off += parts[i].length, i++) body.set(parts[i], off);
        if (dead) return;
        ack = `${hdr.ep}.${hdr.seq}`;
        verify(hdr, body);
        show(hdr, new Blob([body], { type: "image/" + hdr.fmt }), null);
      } catch (e) {
        if (dead) return;
        return t.fail(timedOut ? "stalled: a request got no answer for 8 s" : (t.ready ? `connection lost (${e.name})` : "could not connect: sharing off, or no network"));
      } finally { clearTimeout(timer); acs.delete(ac); }
    }
  }
  for (let i = 0; i < n; i++) loop();
  return t;
}

// UDP: pictures over WebRTC data channels, direct (peer to peer, STUN only: no TURN relay); the control connection
// carries the offer and answer (and the PC's reports). If no direct path exists, it fails and says so: it never falls
// back to TCP by itself.
const CHUNK = 16 * 1024 - 64;                        // must match rtc.py
function udp(gen, mode) {
  const t = { gen, kind: "udp-" + mode, ready: false };
  let dead = false, pc = null, dc = null, openTimer = 0, iceTimer = 0, lastDc = 0, lastAck = 0, wasOpen = false;
  const R = new Map(), done = new Set(), lastId = [null, null];
  const deadline = () => (mode === "fast" ? 250 : mode === "mid" ? +S.life + 150 : 3000);
  // Acks go back over the data channel (direct, like the pictures): the PC's flow control waits for them.
  const ackDc = (o) => { lastAck = now(); if (dc && dc.readyState === "open") { try { dc.send(JSON.stringify(o)); return; } catch (e) {} } ctlSend({ type: "have", gen, seq: o.s, ep: o.e }); };
  let lastStall = 0;
  const sweeper = setInterval(() => { sweep(); stallCheck(); }, 100);
  // If every frame in the PC's window vanished (not one piece arrived), nothing more comes and nothing tells the
  // PC. So after 0.5 s without a picture while the PC was sending, ask for a full frame (the PC then frees its
  // window), and don't leave an update waiting for its base until the once-a-second tick either.
  function stallCheck() {
    if (!t.ready || !conn.want || dead) return;
    const n = now();
    if (D.waitSince && n - D.waitSince > 300) needFull();
    else if (PC_.srv && PC_.srv.fps > 5 && T.lastDraw && n - T.lastDraw > 500 && n - lastStall > 2000 && conn.firstOnPath != null) {
      lastStall = n;
      log(`UDP: nothing drawn for ${r0(n - T.lastDraw)} ms while the PC was sending: asked for a full frame`);
      D.askedAt = 0; needFull(true);
    }
  }
  const cleanup = () => { clearTimeout(openTimer); clearTimeout(iceTimer); clearInterval(sweeper); try { if (pc) pc.close(); } catch (e) {} };
  t.fail = (why, kind) => { if (!dead) onFail(gen, why, kind); };
  t.close = () => { dead = true; t.ready = false; cleanup(); };
  t.full = () => ctlSend({ type: "full", gen });
  t.tick = () => {                                   // once a second: keepalive to the PC, and is the path alive?
    if (!t.ready || dead) return;
    if (now() - lastAck > 900 && dc && dc.readyState === "open") { try { dc.send("ka"); lastAck = now(); } catch (e) {} }
    if (now() - lastDc > 3500) t.fail(`UDP: nothing over the data channel for ${r0((now() - lastDc) / 1000)} s (the PC sends a keepalive every second)`);
  };
  t.killPc = () => { try { pc.close(); } catch (e) {} return "test: closed this page's peer connection (no events fire)"; };
  t.rtc = async (m) => {                             // the PC's messages about this path (control connection)
    if (dead) return;
    if (m.type === "rtc-answer") {
      const kinds = [...new Set((m.sdp.match(/ typ (\w+)/g) || []).map((s) => s.slice(5)))];
      log(`UDP: the PC answered with candidates: ${kinds.join(", ") || "none"}`);
      try { await pc.setRemoteDescription({ type: "answer", sdp: m.sdp }); }
      catch (e) { t.fail(`UDP: the PC's answer did not apply: ${e.message}`); }
    }
    else if (m.type === "rtc-error") t.fail(`UDP: the PC could not set up its side: ${m.error}`);
    else if (m.type === "rtc-down") t.fail(`UDP: the PC dropped the peer (${m.why})`);
  };
  async function start() {
    pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun.cloudflare.com:3478" }] });
    const opts = mode === "fast" ? { ordered: false, maxRetransmits: 0 } : mode === "mid" ? { ordered: false, maxPacketLifeTime: +S.life } : { ordered: true };
    dc = pc.createDataChannel("peek", opts);
    dc.binaryType = "arraybuffer";
    dc.onopen = () => { if (dead) return; clearTimeout(openTimer); t.ready = wasOpen = true; lastDc = now(); onUp(gen, `UDP ${mode} (${JSON.stringify(opts)})`); stats(); };
    dc.onclose = () => t.fail("UDP: the data channel closed");
    dc.onmessage = chunk;
    const kc = pc.createDataChannel("key");          // reliable: full frames (the base picture) must arrive
    kc.binaryType = "arraybuffer";
    kc.onmessage = chunk;
    kc.onclose = () => t.fail("UDP: the keyframe channel closed");
    const kinds = new Set();
    pc.onicecandidate = (e) => { if (e.candidate && e.candidate.type) kinds.add(e.candidate.type); };
    const noPath = "UDP: no direct path (ICE failed). This network needs a TURN relay, which Screen Peek does not have: pick a TCP transport.";
    pc.oniceconnectionstatechange = () => {
      if (dead) return;
      const st = pc.iceConnectionState;
      log(`UDP: ICE ${st}`);
      if (st === "failed") t.fail(wasOpen ? "UDP: ICE failed" : noPath);
      else if (st === "disconnected") {              // a short grace: Wi-Fi hiccups recover by themselves
        clearTimeout(iceTimer);
        iceTimer = setTimeout(() => { if (pc && pc.iceConnectionState === "disconnected") t.fail("UDP: ICE disconnected for 2 s"); }, 2000);
      } else clearTimeout(iceTimer);
    };
    pc.onconnectionstatechange = () => {
      if (dead) return;
      log(`UDP: connection ${pc.connectionState}`);
      if (pc.connectionState === "failed") t.fail(wasOpen ? "UDP: connection failed" : noPath);
    };
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise((ok) => { pc.addEventListener("icegatheringstatechange", () => pc.iceGatheringState === "complete" && ok()); setTimeout(ok, 3000); });
    if (dead) return;
    log(`UDP: offer sent with this device's candidates: ${[...kinds].join(", ") || "none"}`);
    if (!ctlSend({ type: "rtc-offer", ...S, win: +S.win, gen, sdp: pc.localDescription.sdp, udp: mode })) return t.fail("UDP: the control connection is not up to send the offer");
    openTimer = setTimeout(() => t.fail("UDP: no direct path within 15 s (ICE did not connect): pick a TCP transport."), 15000);
  }
  function chunk(ev) {
    if (dead) return;
    lastDc = now();
    if (typeof ev.data === "string") return;         // the PC's keepalive ("ka")
    const dv = new DataView(ev.data), idx = dv.getUint16(2), n = dv.getUint16(4), total = dv.getUint32(12);
    const fid = dv.getUint8(1) * 4294967296 + dv.getUint32(8);   // flag 1 = the keyframe channel's own numbering
    conn.lastData = now(); U.chunks++;
    if (done.has(fid)) { U.late++; return; }
    const lane = dv.getUint8(1), raw = dv.getUint32(8);   // frame ids that never showed up at all = lost frames
    if (lastId[lane] != null && raw > lastId[lane] + 1 && raw - lastId[lane] < 1000) U.dropped += raw - lastId[lane] - 1;
    if (lastId[lane] == null || raw > lastId[lane]) lastId[lane] = raw;
    let f = R.get(fid);
    if (!f) R.set(fid, (f = { n, got: 0, seen: new Uint8Array(n), buf: new Uint8Array(total), t0: now() }));
    if (!f.seen[idx]) { f.seen[idx] = 1; f.got++; f.buf.set(new Uint8Array(ev.data, 16), idx * CHUNK); }
    if (f.got === f.n) { R.delete(fid); finish(fid); U.complete++; frame(f.buf, lane, raw); }
    sweep();
  }
  // A frame still missing pieces at its deadline is lost: drop it and give its credit back to the PC at once.
  // Runs on every piece and every 100 ms (with the PC's window full, no more pieces come to trigger it).
  function sweep() {
    if (dead) return;
    const t0 = now(), dl = deadline();
    // Keyframes travel on the reliable channel and always complete; they get 5 s (a 300 KB frame sharing
    // a busy link takes far longer than the fast channel's 250 ms, and was being thrown away).
    for (const [id, g] of R) if (t0 - g.t0 > (id >= 4294967296 ? 5000 : dl)) {
      R.delete(id); finish(id); U.dropped++;
      ackDc({ t: "a", f: id % 4294967296, l: id >= 4294967296 ? 1 : 0, lost: 1, s: D.seq, e: D.ep });   // its credit comes back now
      if (id >= 4294967296 || !D.seq) { log("keyframe lost, requested again"); D.askedAt = 0; needFull(true); }
    }
  }
  function finish(fid) { done.add(fid); if (done.size > 1024) done.delete(done.values().next().value); }
  function frame(buf, lane, raw) {
    const hl = new DataView(buf.buffer).getUint32(0);
    const hdr = JSON.parse(dec.decode(buf.subarray(4, 4 + hl))), body = buf.subarray(4 + hl);
    verify(hdr, body);
    // Acked once drawn (or dropped as old): s / e = the picture the canvas shows, which partial updates build on.
    show(hdr, new Blob([body], { type: "image/" + hdr.fmt }), () => ackDc({ t: "a", f: raw, l: lane, s: D.seq, e: D.ep }));
  }
  async function stats() {                          // the chosen candidate pair and its round trip, from WebRTC stats
    if (!pc || dead) return;
    try {
      const st = await pc.getStats();
      let pair = null;
      st.forEach((r) => { if (r.type === "transport" && r.selectedCandidatePairId) pair = st.get(r.selectedCandidatePairId); });
      if (!pair) st.forEach((r) => { if (r.type === "candidate-pair" && r.nominated && r.state === "succeeded") pair = r; });
      if (!pair) return;
      const l = st.get(pair.localCandidateId), r = st.get(pair.remoteCandidateId);
      const desc = `${l ? l.candidateType : "?"} ↔ ${r ? r.candidateType : "?"} over ${l ? l.protocol : "?"}` +
                   `${l && r && l.candidateType !== "relay" && r.candidateType !== "relay" ? " (direct)" : " (relayed)"}`;
      if (desc !== U.pair) log(`UDP: path ${desc}`);
      U.pair = desc;
      if (pair.currentRoundTripTime != null) U.rtt = pair.currentRoundTripTime * 1000;
    } catch (e) {}
  }
  t.stats = stats;
  start().catch((e) => t.fail(`UDP setup failed: ${e.message}`));
  return t;
}
for (const m of ["fast", "mid", "rel"]) TRANSPORTS["udp-" + m] = (gen) => udp(gen, m);

// ---- Single picture (any transport, Continuous on or off) ---------------------------------------------
$("one").onclick = async () => {
  if (!TOKEN) return signIn();
  const t0 = now(), ac = new AbortController(), timer = setTimeout(() => ac.abort(), 10000);
  try {
    const r = await fetch(`${BASE}frame?once=1&${qs()}`, { headers: { "X-Key": TOKEN }, cache: "no-store", signal: ac.signal });
    if (r.status === 401) return signIn("Please sign in (new password, or signed out on the PC).");
    if (!r.ok) throw new Error(httpWhy(r.status));
    if (r.status === 204) throw new Error("the PC had no picture within 2 s");
    const hdr = JSON.parse(r.headers.get("X-Frame"));
    show(hdr, await r.blob(), null);
    log(`single picture: ${r0(now() - t0)} ms round trip, ${r0(hdr.n / 1024)} KB, PC grab ${hdr.g} ms + encode ${hdr.e} ms`);
  } catch (e) { log(`single picture failed: ${e.name === "AbortError" ? "no answer within 10 s" : e.message === "Failed to fetch" ? "the PC did not answer (sharing off, or no network)" : e.message}`); }
  finally { clearTimeout(timer); }
};
$("cont").onclick = () => setCont(!conn.want);
$("out").onclick = () => { TOKEN = ""; store.set("peek-token", ""); dataStop("signed out"); ctlDrop(); clearTimeout(C.timer); C.timer = 0; log("signed out in this browser"); signIn(); };

// ---- Sign-in: the password box; Continuous stays as it was ------------------------------------------
function signIn(msg) {
  $("lerr").textContent = msg || "";
  $("login").classList.add("show");
  $("pw").value = ""; setTimeout(() => $("pw").focus(), 50);
}
$("lf").onsubmit = async (e) => {                    // (always handled here: the form never navigates)
  e.preventDefault();
  const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 15000);
  try {
    const r = await fetch(`${BASE}login`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("pw").value }), signal: ac.signal });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { $("lerr").textContent = j.error || httpWhy(r.status); return; }
    TOKEN = j.token; store.set("peek-token", TOKEN);
    $("login").classList.remove("show"); log("signed in");
    C.attempt = 0; C.down = 0; conn.attempt = 0; conn.down = 0;
    ctlOpen("signed in");                            // a fresh control connection with the new token
  } catch (err) { $("lerr").textContent = "The PC did not answer: is sharing switched on in the tray?"; }
  finally { clearTimeout(timer); }
};

// ---- Screen Wake Lock (on by default): asked for whenever the page is shown -------------------------
let wakeLock = null;
const wakeState = (s) => { $("wakestate").textContent = s; };
async function wake(why) {
  store.set("peek-settings-v3", JSON.stringify({ ...S, wake: $("wake").checked }));
  if (!$("wake").checked) { if (wakeLock) { const w = wakeLock; wakeLock = null; await w.release().catch(() => {}); } wakeState("off"); return; }
  if (!("wakeLock" in navigator)) { wakeState("not supported here"); log("wake lock: not supported by this browser"); return; }
  if (document.visibilityState !== "visible") { wakeState("waits until the page is shown"); return; }
  if (wakeLock && !wakeLock.released) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeState("on"); log(`wake lock acquired (${why})`);
    wakeLock.addEventListener("release", () => {
      const hidden = document.visibilityState !== "visible";
      log(`wake lock released (${hidden ? "page hidden: the browser lets go" : "released"})`);
      wakeState(hidden ? "released while hidden; asked again when shown" : "off");
      wakeLock = null;
    });
  } catch (e) {
    wakeState(`refused: ${e.name}`);
    log(`wake lock refused (${why}): ${e.name}: ${e.message}`);
    if (e.name === "NotAllowedError") document.addEventListener("pointerdown", () => wake("after a tap"), { once: true });
  }
}
$("wake").onchange = () => wake("toggle");

// ---- Page lifecycle: never pause; log what the browser does to us ------------------------------------
function cameBack() { conn.lastData = Math.max(conn.lastData, now() - 3000); heartbeat(true); }
document.addEventListener("visibilitychange", () => {
  log(`visibilitychange: ${document.visibilityState}`);
  if (document.visibilityState === "visible") { cameBack(); wake("page shown again"); }
});
window.addEventListener("pagehide", (e) => log(`pagehide (persisted: ${e.persisted})`));
window.addEventListener("pageshow", (e) => log(`pageshow (persisted: ${e.persisted})`));
document.addEventListener("freeze", () => log("freeze: the browser froze this page"));
document.addEventListener("resume", () => { log("resume: the page runs again"); cameBack(); });
window.addEventListener("online", () => { log("online"); if (TOKEN && !C.ready) { C.attempt = 0; ctlOpen("back online"); } });
window.addEventListener("offline", () => log("offline"));

// Automation hooks for the headless tests (test/chrome_page.mjs).
window.PEEK = { S, sync, conn, C, log: LOG, cont: setCont,
  killUdp: () => (conn.live && conn.live.killPc ? conn.live.killPc() : "no UDP connection"),
  muteCtl: () => { C.mute = true; return "test: the control connection's messages are ignored from now on (a stalled connection)"; },
  dropCtl: () => { if (C.ws) { const ws = C.ws; ws.onclose = null; try { ws.close(); } catch (e) {} } return "test: closed the control WebSocket with no event"; },
  set: (k, v) => { const e = $(k); if (e.type === "checkbox") e.checked = !!v; else e.value = String(v); e.dispatchEvent(new Event("change")); return `${k} = ${v}`; },
  state: () => ({ live: conn.live ? conn.live.kind : null, gen: conn.live ? conn.live.gen : null, ready: !!(conn.live && conn.live.ready), want: conn.want,
                  ctl: C.ready, retries: conn.retries, text: $("conntext").textContent, first: T.first, firstOnPath: conn.firstOnPath,
                  drawn: T.drawn, lastDraw: T.lastDraw ? Math.round(now() - T.lastDraw) : null, warm: conn.warmAtOn }),
  summary: () => {                                   // since Continuous went on
    const p = (a, q) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); return Math.round(s[Math.min(s.length - 1, Math.floor(s.length * q))] * 10) / 10; };
    const secs = (now() - T.t) / 1000;
    return { drawn: T.drawn, full: T.full, partial: T.part, dropped: T.dropped, bad: T.bad, idle: T.idle, asked: T.asked,
             fps: Math.round((T.drawn / secs) * 100) / 100, interval: p(T.ivs, 0.5), jitter: Math.round(sd(T.ivs) * 10) / 10,
             lat_p50: p(T.lats, 0.5), lat_p95: p(T.lats, 0.95), net_p50: p(T.nets, 0.5), decode_p50: p(T.decs, 0.5),
             kb: T.recv ? Math.round(T.bytes / T.recv / 102.4) / 10 : null, full_kb: T.recv ? Math.round(T.fullBytes / T.recv / 102.4) / 10 : null,
             mbps: Math.round(T.bytes * 8 / secs / 1e4) / 100, first_ms: T.first == null ? null : Math.round(T.first), warm: conn.warmAtOn,
             ping: sync.best == null ? null : Math.round(sync.best), retries: conn.retries, paths: T.paths, firsts: T.firsts.map(Math.round),
             udp: S.transport.startsWith("udp") ? { ...U, rtt: U.rtt == null ? null : Math.round(U.rtt * 10) / 10 } : undefined,
             crc: S.verify ? { ...CHK } : undefined, pc: PC_.srv, freezes: FZ.n, freeze_longest_ms: Math.round(FZ.longest), auto_steps: AUTO_LOG.slice(-8) }; },
  win: (() => {                                      // stats since the previous call (time series in the soak tests)
    let m = null;
    return () => {
      const c = { t: now(), drawn: T.drawn, bytes: T.bytes, recv: T.recv, li: T.lats.length, full: T.full, part: T.part, dropped: T.dropped, T };
      const p = m && m.T === T ? m : { t: T.t, drawn: 0, bytes: 0, recv: 0, li: 0, full: 0, part: 0, dropped: 0 };
      m = c;
      const secs = (c.t - p.t) / 1000, lats = T.lats.slice(p.li).sort((x, y) => x - y);
      const q = (f) => (lats.length ? Math.round(lats[Math.min(lats.length - 1, Math.floor(lats.length * f))]) : null);
      return { secs: Math.round(secs * 10) / 10, fps: Math.round((c.drawn - p.drawn) / secs * 10) / 10, p50: q(0.5), p95: q(0.95), max: q(1),
               kb: c.recv > p.recv ? Math.round((c.bytes - p.bytes) / (c.recv - p.recv) / 102.4) / 10 : null,
               mbps: Math.round((c.bytes - p.bytes) * 8 / secs / 1e4) / 100, full: c.full - p.full, part: c.part - p.part, dropped: c.dropped - p.dropped,
               freezes: FZ.n, retries: conn.retries, live: conn.live ? conn.live.kind : null, ready: !!(conn.live && conn.live.ready),
               ping: sync.rtt == null ? null : Math.round(sync.rtt), ctl: C.ready,
               udp: S.transport.startsWith("udp") ? { complete: U.complete, dropped: U.dropped, late: U.late, rtt: U.rtt == null ? null : Math.round(U.rtt) } : undefined, pc: PC_.srv };
    };
  })() };

log(`page loaded (${own ? "served by the PC" : "Cool tools"}; talks to ${BASE}); ${settingsText()}`);
wake("page loaded");
if (!TOKEN) signIn();
else ctlOpen("page loaded");                       // the control connection stays open, so Continuous starts warm
</script>
